name = "Email Triage — on demand"
slug = "email-triage-on-demand"
app_id = "inbox"
reasoning_effort = "low"

[[on]]
event_type = "EmailTriageRequested"

[run]
type = "intent"
intent = "When I ask for a triage run from the Inbox app's triage pane (its Triage now button), execute the email triage intent at triggers/email-triage/intents/triage.md for the account named in the request."
