id = "email-triage"
version = "0.8.0"
name = "Email Triage"
description = "Deprecated: now part of Inbox. Install Inbox instead; if you have this installed, update Inbox and its setup will migrate you."
source = "https://github.com/akramsaouri/lucidos-plugins/tree/main/email-triage"
engine = ">=0.47.1"
categories = ["productivity", "communication", "automation"]
icon = "media/icon.svg"

setup = """
Email Triage is deprecated: since Inbox 0.3.0 the Inbox plugin ships the whole triage engine (the intent, the
knowhow, the IMAP helpers and the on-demand trigger) at its own `inbox-triage` paths. This version of Email Triage
still ships its own engine unchanged, so this update stopped nothing. Do NOT create triggers, edit
`artifacts/email-triage/config.json` or connect mailboxes from here.

Check the newest `PluginInstalled` event for `inbox` (and that no later `PluginUninstalled` follows it):

- **Inbox is 0.3.0 or later.** Tell the user: "Inbox now includes triage, so Email Triage can go. Your rules,
  accounts, history and schedules stay." Then hand over to Inbox's setup, which points each per-account cron at
  Inbox's engine before it uninstalls Email Triage: offer to open it (Plugins, then Inbox, then Setup). Don't
  uninstall from here while any cron in `lucidos triggers list` still names an `email-triage` path such as
  `triggers/email-triage/intents/triage.md`, because the uninstall deletes those files. If none does, you may
  offer the uninstall here instead.
- **Inbox is older than 0.3.0, or not installed.** Nothing changed: triage keeps running on this plugin. Offer to
  update (or install) Inbox; its setup moves the user over, and their accounts, rules, run history and schedules
  all carry over.
"""
