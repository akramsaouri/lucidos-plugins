id = "sprakstugan"
version = "0.2.0"
name = "Språkstugan — Swedish Practice"
description = "Daily Swedish practice on two fronts: a card-stream app for written vocabulary, particle verbs and sentence structures with a spaced-repetition strength brain and Swedish speech synthesis, plus a spoken-conversation loop where Lucidos roleplays real-life Swedish situations (Försäkringskassan, a reklamation, a salary chat), corrects every reply in full, and chases you if you skip a day. Content is generated at YOUR level at setup — nothing ships pre-filled — and the word bank refills itself: the app notices when it is running dry and a shipped event trigger writes the next batch. Runs on a schedule you choose: ask Lucidos to set up the morning prep, midday nudge and afternoon chase triggers after install."
source = "https://github.com/akramsaouri/lucidos-plugins/tree/main/sprakstugan"
categories = ["lifestyle", "productivity"]

setup = """
Språkstugan ships deliberately empty: no vocabulary, no learner level, no schedule.
All three are workspace state, and content pitched at someone else's Swedish is worse
than no content. Walk the user through it conversationally — this should feel like a
short interview, not a form.

**Read `knowhow/spoken-swedish-practice.md` and
`apps/sprakstugan/knowhow/calibration.md` first.** Both are plugin-owned and you never
edit them. Everything you write in this setup goes to **artifacts**, which is what keeps
the plugin from showing as *Modified* right after install:

| You write | Never write |
|---|---|
| `artifacts/sprakstugan/learner-profile.md` | anything under `apps/sprakstugan/` |
| `artifacts/sprakstugan/content.json` | anything under `triggers/sprakstugan-bank-topup/` |

### 1. Interview for their level — TWO separate axes

The single most important step. Ask about **written** and **spoken** Swedish separately,
because they diverge, often by two CEFR bands: reading is usually well ahead of speaking.
Don't ask for a CEFR letter — most people don't know theirs. Ask what they can actually do:

- **Written:** can they read a Swedish news article? A contract from their landlord?
  Do they know particle verbs (`ge upp`, `råka ut för`)? Compound nouns? Idioms?
- **Spoken:** can they hold a phone call with a myndighet? Order and handle a complication?
  Do they freeze when someone answers faster than expected? Do they speak daily at work?

Map the answers onto A2 / B1 / B2 / C1 / C2 per axis, tell them what you concluded and why,
and let them correct you. Then **write `artifacts/sprakstugan/learner-profile.md`** with a
two-row table (Written / Spoken), a "Known weak spots" section (empty at first), and one
line on what they need Swedish FOR. That artifact is what every later session, and every
bank top-up, reads.

### 2. Generate the first vocabulary bank

The app reads `artifacts/sprakstugan/content.json`, which does not exist yet — until it
does, the app shows a "no content yet" screen. Generate it now, using the **written** level
and the tier-mapping table in `apps/sprakstugan/knowhow/calibration.md`. The full schema and
the append rules live in `triggers/sprakstugan-bank-topup/knowhow/bank-topup.md` — read it,
it is the same format you'll be adding to forever after.

**Aim for ~120–200 words, ~25 particles, ~20 structures**, centred on their level with a
thin tail one tier above. Bias the categories toward situations in *their* life (work,
myndigheter, a partner's family, a child's förskola). If that's too much for one pass,
write a solid first batch and say the top-up rail will keep extending it — a bank that
exists beats a perfect one that doesn't.

Write it, then tell them to open the app and reload.

### 3. The bank refills itself — nothing to set up

`sprakstugan-bank-topup` auto-registered on install. The app emits
`SprakstuganBankRunningLow` when fresh material runs low (12 or fewer unseen, or 75%
mastered) and that trigger writes the next batch, weighted toward whatever they are still
getting wrong. There's also a **Fyll på nu** button on the banner. Mention this once — it
is the reason the app doesn't go stale — and move on. No cron, no config.

### 4. Offer the three cron triggers — they choose the times

Cron is workspace state, so it's deliberately not shipped. Create them yourself, and let
them pick the hours; the defaults below are a starting point, not a prescription. All
three should be created with `app_id = "sprakstugan"`.

- **Scenario prep** — default `0 0 6 * * *` (06:00 daily). Intent, in their voice:
  prepare today's spoken-Swedish scenario in advance, deliberately picking a category not
  practiced recently, save it plus a couple of alternates, don't notify.
  *Silent — it must never send a notification.*
- **Midday nudge** — default `0 30 11 * * *` (11:30 daily). Intent: nudge them to practice,
  with a tap that opens a fresh chat primed to start today's prepared scenario, keeping the
  scene a surprise, and NOT starting the conversation in the trigger thread.
- **Afternoon chase** — default `0 30 16 * * 1-5` (16:30 weekdays). Intent: check whether
  they practiced today; stay silent if they did, chase them if they didn't.

Ask before creating each one — some people want the app and the conversation but no
notifications at all, and that's a perfectly good configuration. If they decline the
nudge and chase, say plainly that they lose the streak accountability and can add them
later.

Weekdays-only for the chase is deliberate (weekends off). If they want a 7-day habit,
use `0 30 16 * * *` instead.

### 5. Tell them how to start a session

Sessions run in a **normal chat thread**, not in the app: they say "let's talk in Swedish"
or "dags att prata svenska", or tap the nudge notification. The app is for written
vocabulary drilling; the conversation is where speaking gets practiced. People miss this —
say it explicitly.
"""
