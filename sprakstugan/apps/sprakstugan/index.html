<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Språkstugan</title>
<script src="/api/v1/sdk-prefs.js"></script>
<link rel="stylesheet" href="/api/v1/sdk-iframe.css">
<script src="/api/v1/sdk-iframe-audio.js"></script>
<script src="/api/v1/sdk.js"></script>
<style>
  /* Soft tints derived from the shared theme accents. They re-resolve on their
     own when the theme flips, so there is no per-theme block in this app. */
  :root {
    --tint-accent: color-mix(in srgb, var(--accent) 14%, transparent);
    --tint-green:  color-mix(in srgb, var(--accent-green) 15%, transparent);
    --tint-yellow: color-mix(in srgb, var(--accent-yellow) 18%, transparent);
    --tint-red:    color-mix(in srgb, var(--accent-red) 15%, transparent);
  }

  body { min-height: 100vh; overflow-x: hidden; }

  .wrap {
    max-width: 37.5rem;
    margin: 0 auto;
    padding: var(--space-md) var(--space-xl) 2.5rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(0.625rem); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-0.4375rem); } 40%,80% { transform: translateX(0.4375rem); } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(0.875rem); } to { opacity: 1; transform: translateY(0); } }
  .shake { animation: shake 0.4s ease; }
  .pop { animation: pop 0.3s ease; }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .brand { display: flex; align-items: center; gap: var(--space-sm); font-weight: 700; color: var(--accent); font-size: var(--font-size-xl); }
  .brand .dot { font-size: var(--font-size-2xl); }
  .stats { display: flex; gap: var(--space-lg); }
  .stat { text-align: center; line-height: 1.1; }
  .stat-value { font-size: var(--font-size-2xl); font-weight: 700; color: var(--text-primary); }
  .stat-label { font-size: var(--font-size-2xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.025rem; }

  /* Card */
  .card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: var(--space-xl);
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.28s ease;
  }
  .card-key { animation: fadeIn 0.28s ease; }

  .chip-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-lg); }
  .chip {
    display: inline-flex; align-items: center; gap: var(--space-xs);
    padding: var(--space-xs) var(--space-md); border-radius: 99rem;
    font-size: var(--font-size-sm); font-weight: 700; letter-spacing: 0.01875rem;
    background: var(--tint-accent); color: var(--accent);
  }
  .chip.gold { background: var(--tint-yellow); color: var(--accent-yellow); }
  .chip.green { background: var(--tint-green); color: var(--accent-green); }
  /* Grammar drills — filled rather than tinted, so they read as a step up */
  .chip.strong { background: var(--accent); color: var(--text-on-accent); }
  .cat-tag { font-size: var(--font-size-sm); color: var(--text-secondary); font-weight: 600; }

  .prompt-area { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: var(--space-sm) 0 var(--space-lg); }

  .lead { font-size: var(--font-size-md); color: var(--text-secondary); margin-bottom: var(--space-md); }
  .big-sv { font-size: var(--font-size-display); font-weight: 700; color: var(--accent); letter-spacing: -0.03125rem; line-height: 1.15; }
  .big-en { font-size: 1.875rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01875rem; line-height: 1.2; }
  .sentence-en { font-size: 1.4375rem; font-weight: 600; color: var(--text-primary); line-height: 1.35; }
  .sentence-sv { font-size: 1.4375rem; font-weight: 700; color: var(--accent); line-height: 1.35; }
  .fill-prompt { font-size: 1.5rem; font-weight: 600; color: var(--text-primary); line-height: 1.5; }
  .fill-prompt .blank { color: var(--accent); font-weight: 800; border-bottom: 0.1875rem solid var(--accent); padding: 0 1.125rem; }
  .hint-en { font-size: var(--font-size-lg); color: var(--text-secondary); font-style: italic; margin-top: var(--space-md); }
  .sub-hint { font-size: var(--font-size-md); color: var(--text-secondary); margin-top: var(--space-sm); }

  .word-row { display: flex; align-items: center; justify-content: center; gap: var(--space-md); }

  .hear-btn {
    border: none; padding: 0; background: var(--tint-accent); color: var(--accent);
    width: 2.875rem; height: 2.875rem; border-radius: 50%; font-size: 1.25rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: transform 0.1s ease, background var(--duration-fast) ease;
  }
  .hear-btn:hover { background: var(--accent); color: var(--text-on-accent); }
  .hear-btn:focus-visible { outline: 0.125rem solid transparent; box-shadow: var(--focus-ring); }
  .hear-btn:active { transform: scale(0.9); }
  .hear-btn.big { width: 5.25rem; height: 5.25rem; font-size: 2.25rem; }
  .hear-btn.speaking { animation: hearPulse 0.8s ease-in-out infinite; }
  @keyframes hearPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

  /* Answer zone */
  .answer-zone { margin-top: auto; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); }
  .opt {
    padding: var(--space-lg) var(--space-md); border: 0.125rem solid var(--border-color); border-radius: var(--radius-lg);
    background: var(--bg-primary); font-size: var(--font-size-xl); cursor: pointer; transition: all var(--duration-fast);
    font-family: var(--font-ui); color: var(--text-primary); font-weight: 500; text-align: center; line-height: 1.3;
  }
  .opt:hover:not(.correct):not(.wrong):not(.disabled) { border-color: var(--accent); background: var(--bg-hover); }
  .opt:focus-visible { outline: 0.125rem solid transparent; box-shadow: var(--focus-ring); }
  .opt.correct { border-color: var(--accent-green); background: var(--tint-green); color: var(--accent-green); font-weight: 700; }
  .opt.wrong { border-color: var(--accent-red); background: var(--tint-red); color: var(--accent-red); }
  .opt.disabled { pointer-events: none; opacity: 0.55; }

  .enett { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); }
  .enett .opt { font-size: 1.75rem; font-weight: 800; padding: 1.625rem var(--space-md); }

  .input-wrap { margin-bottom: var(--space-md); }
  .tinput {
    width: 100%; padding: var(--space-lg); font-size: 1.1875rem; border: 0.125rem solid var(--border-color);
    border-radius: var(--radius-lg); font-family: var(--font-ui); color: var(--text-primary); text-align: center;
    background: var(--bg-primary); transition: border-color var(--duration-normal); outline: none;
  }
  .tinput:focus { border-color: var(--accent); }
  .tinput.correct { border-color: var(--accent-green); background: var(--tint-green); }
  .tinput.wrong { border-color: var(--accent-red); background: var(--tint-red); }

  /* Shared .action-btn, resized to the full-width CTA this game leans on */
  .action-btn.cta {
    width: 100%;
    padding: var(--space-md) var(--space-lg);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-xl);
    font-weight: 600;
  }

  .grade-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); }

  /* Reveal box */
  .reveal {
    background: var(--bg-tertiary); border-radius: var(--radius-lg); padding: var(--space-lg); margin-bottom: var(--space-md);
    animation: slideUp 0.25s ease; text-align: center;
  }
  .reveal .answer-sv { font-size: 1.375rem; font-weight: 700; color: var(--accent); margin-bottom: var(--space-xs); }
  .reveal .answer-sv.bad { color: var(--accent-red); }
  .reveal .answer-en { font-size: var(--font-size-lg); color: var(--text-secondary); font-style: italic; }
  .reveal .note { font-size: var(--font-size-md); color: var(--text-secondary); margin-top: var(--space-sm); line-height: 1.4; }
  .reveal .yours { font-size: var(--font-size-md); color: var(--text-secondary); margin-top: var(--space-xs); }
  .reveal .yours b { color: var(--accent-red); font-weight: 600; }

  .verdict { font-size: var(--font-size-lg); font-weight: 700; margin-bottom: var(--space-md); text-align: center; }
  .verdict.ok { color: var(--accent-green); }
  .verdict.no { color: var(--accent-red); }

  .skip {
    display: block; margin: var(--space-md) auto 0; background: none; border: none; padding: 0;
    color: var(--text-muted); font-size: var(--font-size-md); cursor: pointer; font-family: var(--font-ui);
    text-decoration: underline;
  }
  .skip:hover { background: none; color: var(--text-primary); }

  /* Feedback toast */
  .feedback {
    position: fixed; bottom: var(--space-xl); left: 50%; transform: translateX(-50%) translateY(6.25rem);
    padding: var(--space-md) var(--space-xl); border-radius: var(--radius-lg); font-weight: 700;
    font-size: var(--font-size-lg); z-index: 100;
    transition: transform var(--duration-slow) ease; box-shadow: var(--shadow-md);
  }
  .feedback.show { transform: translateX(-50%) translateY(0); }
  .feedback.correct { background: var(--accent-green); color: var(--text-on-accent); }
  .feedback.wrong { background: var(--accent-red); color: var(--text-on-accent); }
</style>
</head>
<body>

<div id="feedback" class="feedback"></div>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="dot">🏡</span> Språkstugan</div>
    <div class="stats">
      <div class="stat"><div class="stat-value" id="s-streak">0</div><div class="stat-label">Streak🔥</div></div>
      <div class="stat"><div class="stat-value" id="s-seen">0</div><div class="stat-label">Ord</div></div>
      <div class="stat"><div class="stat-value" id="s-acc">—</div><div class="stat-label">Rätt</div></div>
    </div>
  </div>

  <div id="card" class="card">
    <div class="empty-state">Laddar…</div>
  </div>
</div>

<script>
// ============================================================
//  Språkstugan — endless card stream w/ strength brain
// ============================================================

const PROGRESS_PATH = 'artifacts/sprakstugan/progress.json';
const CONTENT_PATH  = 'artifacts/sprakstugan/content.json';

let CONTENT = null;
let ITEMS = [];          // flat list of all practiceable items
let ITEM_BY_ID = {};
let WORD_ENS = [];       // all english glosses (for distractors)

let prog = {
  version: 2,
  totalSeen: 0,
  totalCorrect: 0,
  streak: 0,
  bestStreak: 0,
  items: {},             // id -> { strength, seen, correct, lastSeen }
  lastPlayed: null,
};

let current = null;      // current card descriptor
let lastItemId = null;
let recentIds = [];      // ring buffer of last few item ids — avoids quick repeats
let phase = 'answer';    // 'answer' | 'reveal'
let locked = false;

// ---------- speech ----------
let _svVoice = null;
function pickSwedishVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  _svVoice = voices.find(v => /^sv(-|_)?/i.test(v.lang)) || voices.find(v => /sv/i.test(v.lang)) || null;
  return _svVoice;
}
if ('speechSynthesis' in window) {
  pickSwedishVoice();
  speechSynthesis.onvoiceschanged = pickSwedishVoice;
}
function speak(text, btn) {
  if (!text || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'sv-SE'; u.rate = 0.92;
  if (_svVoice || pickSwedishVoice()) u.voice = _svVoice;
  if (btn) { btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); }
  speechSynthesis.speak(u);
}

// ---------- helpers ----------
function norm(s) {
  return (s || '').toLowerCase().trim()
    .replace(/[.,!?;:]+$/g, '')
    .replace(/['']/g, "'")
    .replace(/\s+/g, ' ');
}
function shuffle(a) { return a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]); }
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function diffLabel(d) { return {easy:'Lätt', medium:'Medel', hard:'Svår', expert:'Expert', master:'Mästare'}[d] || d; }

// ---------- closeness (near-miss detection) ----------
function foldDia(s) { return norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function lev(a, b) {
  a = norm(a); b = norm(b);
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
    }
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
// "near" = basically right: only diacritics differ, or a 1-2 char typo on a real sentence
function isNearMiss(val, target) {
  const a = norm(val), b = norm(target);
  if (!a || a === b) return false;
  if (foldDia(val) === foldDia(target)) return true;
  return b.length >= 6 && lev(a, b) <= 2;
}
// highlight the words you typed that aren't in the target
function diffYours(yours, target) {
  const tgt = new Set(norm(target).split(' '));
  return norm(yours).split(' ').map(w => tgt.has(w) ? esc(w) : `<b>${esc(w)}</b>`).join(' ');
}

// ============================================================
//  Load + migrate
// ============================================================
const NO_CONTENT = 'NO_CONTENT';

async function loadAll() {
  // content — shipped empty on purpose: the bank is generated for YOUR level at setup
  let rawC = null;
  try { rawC = await lucidos.data.read(CONTENT_PATH); } catch (e) { throw new Error(NO_CONTENT); }
  try { CONTENT = JSON.parse(rawC); } catch (e) { throw new Error(NO_CONTENT); }
  if (!CONTENT || !Array.isArray(CONTENT.words) || !CONTENT.words.length) throw new Error(NO_CONTENT);
  CONTENT.particles = Array.isArray(CONTENT.particles) ? CONTENT.particles : [];
  CONTENT.structures = Array.isArray(CONTENT.structures) ? CONTENT.structures : [];

  ITEMS = [];
  for (const w of CONTENT.words) {
    ITEMS.push({ id: 'w:' + w.sv, kind: 'word', diff: w.diff, cat: w.cat,
      sv: w.sv, en: w.en, ex: w.ex, gender: w.gender || null });
  }
  for (const p of CONTENT.particles) {
    ITEMS.push({ id: p.id, kind: 'particle', diff: p.diff || 'expert', cat: p.cat,
      prompt: p.prompt, answer: p.answer, options: p.options, en: p.en });
  }
  for (const s of CONTENT.structures) {
    ITEMS.push({ id: s.id, kind: 'structure', diff: s.diff || 'expert', cat: s.cat,
      prompt: s.prompt, model: s.model, modelEn: s.modelEn });
  }
  ITEM_BY_ID = {};
  ITEMS.forEach(i => ITEM_BY_ID[i.id] = i);
  WORD_ENS = CONTENT.words.map(w => w.en);

  // progress
  try {
    const rawP = await lucidos.data.read(PROGRESS_PATH);
    const data = JSON.parse(rawP);
    if (data.version === 2 && data.items) {
      prog = Object.assign(prog, data);
      prog.items = data.items || {};
    } else {
      // migrate v1: seed learned words as strength 2
      prog.streak = data.streak || 0;
      prog.bestStreak = data.streak || 0;
      prog.items = {};
      (data.wordsLearned || []).forEach(sv => {
        if (ITEM_BY_ID['w:' + sv]) prog.items['w:' + sv] = { strength: 2, seen: 1, correct: 1, lastSeen: null };
      });
    }
  } catch (e) { /* first run */ }

  refreshStats();
}

async function save() {
  prog.lastPlayed = new Date().toISOString();
  try { await lucidos.data.write(PROGRESS_PATH, JSON.stringify(prog)); }
  catch (e) { console.error('save failed', e); }
}

function refreshStats() {
  const seen = Object.keys(prog.items).length;
  document.getElementById('s-streak').textContent = prog.streak;
  document.getElementById('s-seen').textContent = seen;
  const acc = prog.totalSeen ? Math.round(prog.totalCorrect / prog.totalSeen * 100) + '%' : '—';
  document.getElementById('s-acc').textContent = acc;
}

// ============================================================
//  The brain: pick next item, then choose format
// ============================================================
function diffWeight(d) { return ({easy:1, medium:1.4, hard:2.2, expert:3.6, master:5})[d] || 1.5; }

function itemWeight(item) {
  const rec = prog.items[item.id];
  const strength = rec ? rec.strength : 0;
  const strengthW = (6 - strength);                         // weak favored
  const last = rec && rec.lastSeen ? Date.parse(rec.lastSeen) : 0;
  const hours = last ? (Date.now() - last) / 3.6e6 : 999;
  const overdueW = 1 + Math.min(hours / 24, 3);             // up to 4x after ~3 days
  return strengthW * overdueW * diffWeight(item.diff);
}

function weightedPick(pool, wf) {
  const weights = pool.map(wf);
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

function pickItem() {
  const seenIds = new Set(Object.keys(prog.items));
  const recent = new Set(recentIds);
  const unseen = ITEMS.filter(i => !seenIds.has(i.id));

  // review pool, minus the last few cards so nothing loops back-to-back
  let seen = ITEMS.filter(i => seenIds.has(i.id) && !recent.has(i.id));
  if (seen.length < 4) seen = ITEMS.filter(i => seenIds.has(i.id) && i.id !== lastItemId);

  const weak = Object.values(prog.items).filter(r => r.strength < 2).length;

  // Keep fresh material flowing. Throttle new items only when a LOT are half-learned —
  // never fully lock the drip, or the same handful of hard words recycles forever.
  const introChance = weak >= 14 ? 0.12 : weak >= 8 ? 0.30 : 0.45;
  const introduce = unseen.length > 0 && (seen.length < 12 || Math.random() < introChance);
  if (introduce) return weightedPick(unseen, i => diffWeight(i.diff));

  if (seen.length === 0) return weightedPick(unseen.length ? unseen : ITEMS, i => diffWeight(i.diff));
  return weightedPick(seen, itemWeight);
}

// format escalates with strength (words only); particles/structures are fixed-format
function chooseFormat(item) {
  if (item.kind === 'particle') return 'particle';
  if (item.kind === 'structure') return 'structure';
  const rec = prog.items[item.id];
  const s = rec ? rec.strength : 0;
  const isNoun = !!item.gender;
  const multiWord = item.sv.includes(' ');
  if (s <= 0) return 'recognition';
  if (s === 1) return (isNoun && Math.random() < 0.35) ? 'engender' : 'production';
  if (s === 2) return (isNoun && Math.random() < 0.5) ? 'engender' : 'production';
  // strong → embed in a sentence (skip dictation for multi-word idioms; translate instead)
  if (s === 3) return (Math.random() < 0.5 && !multiWord) ? 'dictation' : 'translate';
  return (Math.random() < 0.6 && !multiWord) ? 'dictation' : 'translate';
}

// ============================================================
//  Grading + advance
// ============================================================
function applyResult(item, correct) {
  const rec = prog.items[item.id] || { strength: 0, seen: 0, correct: 0, lastSeen: null };
  rec.seen++;
  rec.lastSeen = new Date().toISOString();
  if (correct) { rec.strength = Math.min(5, rec.strength + 1); rec.correct++; }
  else { rec.strength = Math.max(0, rec.strength - 1); }
  prog.items[item.id] = rec;

  prog.totalSeen++;
  if (correct) { prog.totalCorrect++; prog.streak++; prog.bestStreak = Math.max(prog.bestStreak, prog.streak); }
  else { prog.streak = 0; }

  refreshStats();
  save();
}

function toast(correct, msg) {
  const el = document.getElementById('feedback');
  el.textContent = msg || (correct ? 'Rätt! ✓' : 'Fel ✗');
  el.className = 'feedback ' + (correct ? 'correct' : 'wrong') + ' show';
  setTimeout(() => el.classList.remove('show'), 1400);
}

function next() {
  locked = false;
  phase = 'answer';
  const item = pickItem();
  lastItemId = item.id;
  recentIds.push(item.id);
  if (recentIds.length > 10) recentIds.shift();
  const fmt = chooseFormat(item);
  current = { item, fmt };
  render();
}

// ============================================================
//  Rendering
// ============================================================
const card = () => document.getElementById('card');

function chipFor(fmt) {
  const map = {
    recognition: ['Känn igen', ''],
    production:  ['Skriv ordet', 'gold'],
    engender:    ['en eller ett?', ''],
    dictation:   ['Diktamen 🔊', 'green'],
    translate:   ['Översätt', ''],
    particle:    ['Fyll i', 'strong'],
    structure:   ['Bygg meningen', 'strong'],
  };
  const [label, cls] = map[fmt] || ['', ''];
  return `<span class="chip ${cls}">${label}</span>`;
}

function render() {
  const { item, fmt } = current;
  const cat = item.cat ? `<span class="cat-tag">${esc(item.cat)} · ${diffLabel(item.diff)}</span>` : '';
  let body = '';
  if (fmt === 'recognition') body = viewRecognition(item);
  else if (fmt === 'production') body = viewProduction(item);
  else if (fmt === 'engender') body = viewEnEtt(item);
  else if (fmt === 'dictation') body = viewDictation(item);
  else if (fmt === 'translate') body = viewTranslate(item);
  else if (fmt === 'particle') body = viewParticle(item);
  else if (fmt === 'structure') body = viewStructure(item);

  card().innerHTML = `<div class="card-key">
    <div class="chip-row">${chipFor(fmt)}${cat}</div>
    ${body}
  </div>`;
  wireUp(fmt, item);
}

// --- recognition: SV shown, pick EN ---
function viewRecognition(item) {
  const distractors = shuffle(WORD_ENS.filter(e => e !== item.en)).slice(0, 3);
  const opts = shuffle([{ t: item.en, ok: true }, ...distractors.map(d => ({ t: d, ok: false }))]);
  return `
    <div class="prompt-area">

// ============================================================
//  Wiring per format
// ============================================================
function wireUp(fmt, item) {
  // hear buttons
  card().querySelectorAll('.hear-btn').forEach(b => {
    b.addEventListener('click', () => speak(b.dataset.say, b));
    if (b.dataset.auto) setTimeout(() => speak(b.dataset.say, b), 350);
  });
  // skip
  const sk = card().querySelector('[data-skip]');
  if (sk) sk.addEventListener('click', () => next());

  if (fmt === 'recognition' || fmt === 'particle') {
    card().querySelectorAll('#opts .opt').forEach(b => {
      b.addEventListener('click', () => onChoice(b, fmt, item));
    });
  } else if (fmt === 'engender') {
    card().querySelectorAll('#opts .opt').forEach(b => {
      b.addEventListener('click', () => onEnEtt(b, item));
    });
  } else if (fmt === 'production' || fmt === 'dictation' || fmt === 'translate' || fmt === 'structure') {
    const inp = card().querySelector('#inp');
    const submit = card().querySelector('#submit');
    inp.focus();
    const go = () => onType(fmt, item);
    submit.addEventListener('click', go);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }
}

// multiple-choice (recognition + particle): auto-grade
function onChoice(btn, fmt, item) {
  if (locked) return; locked = true;
  const opts = card().querySelectorAll('#opts .opt');
  const correct = btn.dataset.ok === '1';
  opts.forEach(o => {
    o.classList.add('disabled');
    if (o.dataset.ok === '1') o.classList.add('correct');
  });
  if (!correct) btn.classList.add('wrong', 'shake');
  else btn.classList.add('pop');
  toast(correct);
  applyResult(item, correct);
  if (fmt === 'recognition') revealWord(item, correct);
  else revealParticle(item, correct);
}

function onEnEtt(btn, item) {
  if (locked) return; locked = true;
  const correct = btn.dataset.g === item.gender;
  card().querySelectorAll('#opts .opt').forEach(o => {
    o.classList.add('disabled');
    if (o.dataset.g === item.gender) o.classList.add('correct');
  });
  if (!correct) btn.classList.add('wrong', 'shake');
  else btn.classList.add('pop');
  toast(correct);
  applyResult(item, correct);
  revealWord(item, correct, `${item.gender} ${item.sv}`);
}

// typed answers
function onType(fmt, item) {
  if (locked) return;
  const inp = card().querySelector('#inp');
  const val = inp.value.trim();
  if (!val && fmt !== 'structure') return;

  if (fmt === 'production') {
    locked = true;
    const correct = norm(val) === norm(item.sv);
    inp.classList.add(correct ? 'correct' : 'wrong');
    inp.disabled = true;
    toast(correct);
    applyResult(item, correct);
    revealWord(item, correct);
    return;
  }

  if (fmt === 'dictation' || fmt === 'translate') {
    const target = item.ex.sv;
    const exact = norm(val) === norm(target);
    inp.disabled = true;
    if (exact) {
      locked = true;
      inp.classList.add('correct');
      toast(true);
      applyResult(item, true);
      revealSentence(item, true, val);
    } else if (isNearMiss(val, target)) {
      // tiny typo / missing diacritic -> count as right, just show what was off
      locked = true;
      inp.classList.add('correct');
      toast(true, 'Nästan! ✓');
      applyResult(item, true);
      revealSentenceNearMiss(item, val);
    } else {
      // genuinely different -> let user self-judge (valid alternative vs real mistake)
      inp.classList.add('wrong');
      revealSentenceSelfGrade(item, val);
    }
    return;
  }

  if (fmt === 'structure') {
    inp.disabled = true;
    revealStructureSelfGrade(item, val);
    return;
  }
}

// ============================================================
//  Reveal panels + advance
// ============================================================
function nextBtn() {
  return `<button class="action-btn cta" id="nextbtn">Nästa →</button>`;
}
function wireNext() {
  const b = card().querySelector('#nextbtn');
  if (b) { b.addEventListener('click', () => next()); b.focus(); }
  document.addEventListener('keydown', enterAdvance);
}
function enterAdvance(e) {
  if (e.key === 'Enter' && phase === 'reveal') { document.removeEventListener('keydown', enterAdvance); next(); }
}

function revealWord(item, correct, overrideSv) {
  phase = 'reveal';
  const zone = card().querySelector('.answer-zone');
  zone.innerHTML = `
    <div class="reveal">
      <div class="answer-sv">${esc(overrideSv || item.sv)} — <span style="color:var(--text-secondary);font-weight:600">${esc(item.en)}</span></div>
      <div style="margin-top:0.5rem"><span class="answer-en">"${esc(item.ex.sv)}"</span></div>
      <div class="answer-en">${esc(item.ex.en)}</div>
      <button class="hear-btn" data-say="${esc(item.ex.sv)}" style="margin-top:0.625rem" aria-label="Hör meningen">🔊</button>
    </div>
    ${nextBtn()}`;
  zone.querySelector('.hear-btn').addEventListener('click', e => speak(item.ex.sv, e.currentTarget));
  wireNext();
}

function revealParticle(item, correct) {
  phase = 'reveal';
  const full = item.prompt.replace('___', item.answer);
  const zone = card().querySelector('.answer-zone');
  zone.innerHTML = `
    <div class="reveal">
      <div class="answer-sv">${esc(full)}</div>
      <div class="answer-en">${esc(item.en)}</div>
      <button class="hear-btn" data-say="${esc(full)}" style="margin-top:0.625rem" aria-label="Hör meningen">🔊</button>
    </div>
    ${nextBtn()}`;
  zone.querySelector('.hear-btn').addEventListener('click', e => speak(full, e.currentTarget));
  wireNext();
}

function revealSentence(item, correct, yours) {
  phase = 'reveal';
  const zone = card().querySelector('.answer-zone');
  zone.innerHTML = `
    <div class="reveal">
      <div class="answer-sv">${esc(item.ex.sv)}</div>
      <div class="answer-en">${esc(item.ex.en)}</div>
      <button class="hear-btn" data-say="${esc(item.ex.sv)}" style="margin-top:0.625rem" aria-label="Hör meningen">🔊</button>
    </div>
    ${nextBtn()}`;
  zone.querySelector('.hear-btn').addEventListener('click', e => speak(item.ex.sv, e.currentTarget));
  wireNext();
}

// dictation/translate near miss (typo/diacritic) -> count as right, single ack
function revealSentenceNearMiss(item, yours) {
  phase = 'reveal';
  const zone = card().querySelector('.answer-zone');
  zone.innerHTML = `
    <div class="verdict ok">Nästan rätt — räknas som rätt ✓</div>
    <div class="reveal">
      <div class="answer-sv">${esc(item.ex.sv)}</div>
      <div class="answer-en">${esc(item.ex.en)}</div>
      <div class="yours">Du skrev: ${diffYours(yours, item.ex.sv)}</div>
      <button class="hear-btn" data-say="${esc(item.ex.sv)}" style="margin-top:0.625rem" aria-label="Hör meningen">🔊</button>
    </div>
    ${nextBtn()}`;
  zone.querySelector('.hear-btn').addEventListener('click', e => speak(item.ex.sv, e.currentTarget));
  wireNext();
}

// dictation/translate non-exact -> self grade
function revealSentenceSelfGrade(item, yours) {
  phase = 'reveal';
  const zone = card().querySelector('.answer-zone');
  zone.innerHTML = `
    <div class="verdict no">Inte exakt — bedöm själv</div>
    <div class="reveal">
      <div class="answer-sv">${esc(item.ex.sv)}</div>
      <div class="answer-en">${esc(item.ex.en)}</div>
      <div class="yours">Du skrev: <b>${esc(yours) || '—'}</b></div>
      <button class="hear-btn" data-say="${esc(item.ex.sv)}" style="margin-top:0.625rem" aria-label="Hör meningen">🔊</button>
    </div>
    <div class="grade-row">
      <button class="action-btn action-btn-danger cta" id="g-miss">✗ Fel</button>
      <button class="action-btn action-btn-confirm cta" id="g-nail">✓ Rätt ändå</button>
    </div>`;
  zone.querySelector('.hear-btn').addEventListener('click', e => speak(item.ex.sv, e.currentTarget));
  zone.querySelector('#g-miss').addEventListener('click', () => { applyResult(item, false); next(); });
  zone.querySelector('#g-nail').addEventListener('click', () => { applyResult(item, true); next(); });
}

function revealStructureSelfGrade(item, yours) {
  phase = 'reveal';
  const zone = card().querySelector('.answer-zone');
  zone.innerHTML = `
    <div class="reveal">
      <div class="answer-sv">${esc(item.model)}</div>
      ${item.modelEn ? `<div class="note">${esc(item.modelEn)}</div>` : ''}
      <div class="yours">Du skrev: <b style="color:var(--text-primary)">${esc(yours) || '—'}</b></div>
      <button class="hear-btn" data-say="${esc(item.model)}" style="margin-top:0.625rem" aria-label="Hör meningen">🔊</button>
    </div>
    <div class="grade-row">
      <button class="action-btn action-btn-danger cta" id="g-miss">✗ Missade</button>
      <button class="action-btn action-btn-confirm cta" id="g-nail">✓ Klarade</button>
    </div>`;
  zone.querySelector('.hear-btn').addEventListener('click', e => speak(item.model, e.currentTarget));
  zone.querySelector('#g-miss').addEventListener('click', () => { applyResult(item, false); next(); });
  zone.querySelector('#g-nail').addEventListener('click', () => { applyResult(item, true); next(); });
}

// ============================================================
//  Init
// ============================================================
(async function init() {
  try { lucidos.ui.applyPreferences(); lucidos.ui.watchPreferences(); } catch (e) {}
  try {
    await loadAll();
    next();
  } catch (e) {
    if (String(e && e.message) === NO_CONTENT) {
      card().innerHTML = `<div class="empty-state" style="text-align:left;line-height:1.6">
        <div style="font-size:1.5rem;text-align:center;margin-bottom:0.75rem">\ud83c\uddf8\ud83c\uddea</div>
        <b>Inget innehåll än — no content yet.</b><br><br>
        Språkstugan ships without a vocabulary bank on purpose: it gets generated
        at <i>your</i> level rather than someone else's. Ask Lucidos in a chat:<br><br>
        <code style="display:block;padding:0.625rem;border-radius:0.375rem;background:var(--bg-secondary, rgba(127,127,127,.12));font-size:0.8125rem">Fill my Språkstugan vocabulary bank</code>
        <br>It reads your learner profile, writes
        <code style="font-size:0.75rem">artifacts/sprakstugan/content.json</code>,
        and this screen starts working.<br><br>
        <button class="action-btn cta" style="max-width:12.5rem;margin:0 auto" onclick="location.reload()">Ladda om</button>
      </div>`;
    } else {
      card().innerHTML = `<div class="empty-state">Kunde inte ladda innehållet.<br><br><button class="action-btn cta" style="max-width:12.5rem;margin:0 auto" onclick="location.reload()">Försök igen</button><br><small style="opacity:.6">${esc(String(e))}</small></div>`;
    }
  }
})();
