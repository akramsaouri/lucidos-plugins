<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatekeepr</title>
<script src="/api/v1/sdk-prefs.js"></script>
<link rel="stylesheet" href="/api/v1/sdk-iframe.css">
<script src="/api/v1/sdk.js"></script>
<style>
  :root { --hairline: color-mix(in srgb, var(--border-color) 70%, transparent); }
  body { margin: 0; }
  [hidden] { display: none !important; }
  .ic { width: var(--icon-size-sm); height: var(--icon-size-sm); flex: none; }
  .action-btn .ic { margin-right: var(--space-xs); vertical-align: -0.125rem; }
  .page { max-width: 36rem; margin: 0 auto; padding: var(--space-lg) var(--space-xl) 4rem; display: grid; gap: var(--space-xl); }
  .muted { color: var(--text-muted); }

  /* ---------- the session: one countdown timer, coloured by state from theme tokens ---------- */
  [data-tone="normal"] { --tone: var(--accent); }
  [data-tone="warning"] { --tone: var(--accent-yellow); }
  [data-tone="danger"] { --tone: var(--accent-red); }
  [data-tone="muted"] { --tone: var(--text-muted); }
  .hero { display: grid; justify-items: center; gap: var(--space-md); text-align: center; padding-top: var(--space-md); }
  .timer { width: 7.5rem; }
  /* The time left is the headline: a status chip above it, and when it expires as its subtitle. */
  .title { display: grid; justify-items: center; gap: var(--space-xs); }
  .left { font-size: var(--font-size-display); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .left.is-word { font-size: calc(var(--font-size-display) * 0.75); }
  .left small { margin-left: 0.25em; font-size: var(--font-size-lg); font-weight: 500; letter-spacing: 0; color: var(--text-muted); }
  .hero[data-tone="danger"] .left { color: var(--accent-red); }
  .subtitle { font-size: var(--font-size-lg); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  /* Refresh with its last-checked time as a caption, so the two read as one control. */
  .refresh-block { display: grid; justify-items: center; gap: var(--space-xs); }
  .refresh-block .note { font-size: var(--font-size-xs); color: var(--text-muted); }
  .action-btn .mini-spinner { --spinner-color: currentColor; }
  .problem { width: 100%; box-sizing: border-box; text-align: left; background: var(--bg-secondary); border-radius: var(--radius-surface); padding: var(--space-lg); display: grid; gap: var(--space-sm); }
  .problem-head { display: flex; align-items: flex-start; gap: var(--space-sm); }
  .problem-head .ic { color: var(--accent-yellow); margin-top: 0.0625rem; }
  .problem-text { font-size: var(--font-size-sm); color: var(--text-primary); overflow-wrap: anywhere; min-width: 0; }
  .problem-hint { font-size: var(--font-size-sm); color: var(--text-secondary); }
  .problem .button-group { justify-content: flex-start; }

  /* ---------- sections ---------- */
  section { display: grid; gap: var(--space-sm); min-width: 0; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-md); padding: 0 var(--space-xs); }
  h2 { margin: 0; font-size: var(--font-size-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
  .panel { background: var(--bg-secondary); border-radius: var(--radius-surface); min-width: 0; }
  .panel-note { font-size: var(--font-size-xs); color: var(--text-muted); padding: 0 var(--space-xs); }

  .facts { margin: 0; padding: var(--space-lg); display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: var(--space-md) var(--space-lg); }
  .facts dt { display: flex; align-items: center; gap: var(--space-xs); font-size: var(--font-size-xs); color: var(--text-muted); }
  .facts dd { margin: 0.125rem 0 0; padding-left: calc(var(--icon-size-sm) + var(--space-xs)); font-size: var(--font-size-md); color: var(--text-primary); overflow-wrap: break-word; }

  .panel .list-row + .list-row, .setting + .setting { border-top: 1px solid var(--hairline); }
  .hist-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: var(--space-xs) var(--space-md); }
  .hist-row .list-row-details { grid-column: 1 / -1; margin: 0; gap: var(--space-xs) var(--space-md); }
  .hist-row .list-row-details > span { display: inline-flex; align-items: center; gap: 0.1875rem; }
  .hist-row .list-row-details .ic { width: 0.75rem; height: 0.75rem; }
  .hist-when { font-size: var(--font-size-md); color: var(--text-primary); font-variant-numeric: tabular-nums; overflow-wrap: break-word; }
  .label { flex: none; }
  .more { display: flex; justify-content: center; padding: var(--space-sm) var(--space-lg) var(--space-md); }
  .empty { padding: var(--space-lg); font-size: var(--font-size-sm); color: var(--text-muted); }

  /* ---------- settings ---------- */
  .setting { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-lg); }
  .setting-icon { display: flex; color: var(--text-muted); }
  .setting-icon .ic { width: var(--icon-size-md); height: var(--icon-size-md); }
  .setting-text { flex: 1 1 auto; min-width: 0; display: grid; gap: 0.125rem; }
  .setting > :last-child:not(.setting-text) { flex: none; }
  .cadence { min-width: 7.5rem; }
  .setting-name { font-size: var(--font-size-md); color: var(--text-primary); }
  .setting-help { font-size: var(--font-size-xs); color: var(--text-secondary); overflow-wrap: anywhere; }
  .setting-help .text-input.mins { width: 4.5rem; padding-block: 0.125rem; margin: 0 var(--space-xs); font-size: var(--font-size-xs); text-align: right; }
  .field { display: grid; gap: var(--space-sm); padding: var(--space-md) var(--space-lg); }
  .field .text-input { width: 100%; box-sizing: border-box; font-family: var(--font-mono); font-size: var(--font-size-sm); }
  .field-label { display: flex; align-items: center; gap: var(--space-md); font-size: var(--font-size-md); color: var(--text-primary); }
  .field-label .setting-icon { flex: none; }
  .warn-line { color: var(--accent-yellow); }
  .setting-name .label { margin-left: var(--space-sm); vertical-align: 0.0625rem; }

  @media (pointer: coarse) {
    .action-btn { position: relative; }
    .action-btn::before { content: ''; position: absolute; inset: -0.375rem -0.25rem; }
  }
</style>
</head>
<body>
<main class="page">
  <div class="hero" id="hero" data-tone="muted">
    <div class="timer" id="timer" role="img"></div>
    <div class="title">
      <div id="chip" hidden></div>
      <div class="left" id="left">–</div>
      <div class="subtitle" id="subtitle" hidden></div>
    </div>
    <div class="problem" id="problem" hidden>
      <div class="problem-head"><span data-icon="alert"></span><div class="problem-text" id="problem-text"></div></div>
      <div class="problem-hint" id="problem-hint"></div>
      <div class="button-group" id="problem-actions"></div>
    </div>
    <div class="refresh-block">
      <button class="action-btn action-btn-secondary" id="refresh">Refresh</button>
      <span class="note" id="checked"></span>
    </div>
  </div>

  <section id="session-section" hidden>
    <div class="section-head"><h2>Session</h2></div>
    <dl class="panel facts" id="facts"></dl>
  </section>

  <section>
    <div class="section-head"><h2>History</h2><span class="panel-note" id="history-count"></span></div>
    <div class="panel" id="history"><div class="empty">Loading…</div></div>
  </section>

  <section>
    <div class="section-head"><h2>Alerts</h2></div>
    <div class="panel" id="alerts"></div>
    <div class="panel-note" id="alerts-note" hidden></div>
  </section>

  <section>
    <div class="section-head"><h2>Background check</h2></div>
    <div class="panel">
      <div class="setting">
        <span class="setting-icon" data-icon="activity"></span>
        <div class="setting-text">
          <div class="setting-name" id="schedule-name">Check in the background</div>
          <div class="setting-help" id="schedule-help">Looking…</div>
        </div>
        <label class="toggle-switch"><input type="checkbox" role="switch" id="schedule-on" aria-label="Check in the background" disabled><span class="toggle-slider"></span></label>
      </div>
      <div class="setting">
        <span class="setting-icon" data-icon="clock"></span>
        <div class="setting-text">
          <div class="setting-name">How often</div>
          <div class="setting-help" id="cadence-help"></div>
        </div>
        <div class="cadence" id="cadence"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="section-head"><h2>Gatekeepr CLI</h2></div>
    <div class="panel">
      <div class="field">
        <label class="field-label" for="binary"><span class="setting-icon" data-icon="terminal"></span>Binary path</label>
        <input class="text-input" id="binary" type="text" placeholder="Found automatically" spellcheck="false" autocapitalize="off" autocomplete="off">
        <div class="setting-help" id="binary-help"></div>
      </div>
    </div>
  </section>
</main>
<script src="timer.js"></script>
<script src="app.js"></script>
</body>
</html>
