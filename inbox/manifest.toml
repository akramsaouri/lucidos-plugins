id = "inbox"
version = "0.2.2"
name = "Inbox"
description = "One calm inbox across every mailbox Email Triage watches, and the home of Email Triage's controls. Needs the Email Triage plugin (0.7.0 or later) installed and configured with at least one account: Inbox reads its accounts, rules and triage results and never triages mail itself. Each account's inbox shows in two zones, never mixed: what survived triage, with the reason it was kept, and what triage hasn't seen yet. Archive, delete and undo in one key or swipe, replies with AI Suggest and Polish, a one-key hand-off to Lucidos, and each account's folders and labels in the sidebar. Gmail accounts read through one engine proxy per mailbox; password IMAP accounts go through the IMAP bridge trigger this plugin ships. OAuth IMAP accounts (Email Triage's imap-peek) aren't readable yet, though their triage controls work. A Triage pane replaces the old Email Triage app: an All accounts strip at the top of the sidebar with every account's health, Pause all and Triage all accounts, and a Triage entry heading each account's folders with its health and next run, pause/resume, Triage now, the rule chain editor with unreachable-rule warnings, suggestions from runs and run history. Also ships an Inbox Home widget: how many threads need you across every account, with per-account counts and the top threads on larger tiles."
source = "https://github.com/akramsaouri/lucidos-plugins/tree/main/inbox"
engine = ">=0.48.0"
categories = ["productivity", "communication"]
icon = "media/icon.svg"

setup = """
**Already running Inbox?** If `artifacts/inbox/settings.json` exists and every Gmail account in
Email Triage's config already has an `accounts["<name>"].proxy` in it, nothing below needs redoing:
tell the user what changed in one line and stop. If only some Gmail accounts lack a proxy (an
earlier setup stopped partway), this is not a fresh install: tell the user which accounts are
already wired and that you're wiring only the rest, run step 2 for those accounts alone, and skip
every other step whose answer is already in the settings. Do the same when the settings file is
missing but a `data/config/apis.json` proxy already passes step 2's check for some accounts: record
those and carry on from there.

- **Updating to 0.2.1:** setup reuses Email Triage's Gmail OAuth for each mailbox instead of asking
  for a Google client ID.
- **Updating to 0.2.0:** the Email Triage control panel moved into Inbox. An **All accounts** strip
  at the top of the sidebar, and a **Triage** entry heading each account's folders, open a pane with
  health and next run, Pause/Resume, Triage now, the rule chain editor, suggestions from runs and run
  history. Email Triage 0.7.0 drops its own app to match, so check the newest `PluginInstalled` event
  for `email-triage`: below 0.7.0, offer to update it too (nothing else changes; its accounts, rules,
  schedules and run history carry over). Pause and Triage now work exactly as they did: pause is
  `"paused": true` in the account's config block, plus a best-effort pause of the account's own cron
  trigger, found by name; Triage now emits the same `EmailTriageRequested` the old app did. Nothing
  else needs redoing. One cleanup worth offering on any update: if `lucidos triggers list` shows a bridge trigger the
user created by hand (it runs `apps/inbox/scripts/imap_bridge.py` and isn't this plugin's
"Inbox — IMAP bridge"), offer to delete it. The bridge never answers the same request twice, but a
second trigger still runs on every request for nothing.

---

Inbox is a mail client on top of Email Triage, and where Email Triage's controls live. It owns no
accounts of its own: it reads Email Triage's config and results, and needs one piece of wiring per account plus two answers from the
user. **Read `knowhow/inbox.md` first.** It has the settings schema, how each account type is read,
and the bridge protocol (`apps/inbox/knowhow/triage.md` covers the triage controls). Keep every key already in `artifacts/inbox/settings.json` when you write it.

1. **Check Email Triage.** It must be installed at 0.7.0 or later (the newest `PluginInstalled`
   event for `email-triage`, or the Plugins panel) with at least one account in
   `artifacts/email-triage/config.json`. If it isn't, stop and offer to install or set it up
   first: Inbox has nothing to show without it. If it is installed but older than 0.7.0, offer to
   update it: from 0.7.0 its controls live here instead of in an app of its own.

2. **Each Gmail account** (`"fetch": "gmail-api"`, or an older block with no `fetch` on a Gmail
   address) is read and changed through an engine proxy in `data/config/apis.json` that carries
   that mailbox's OAuth token: one proxy per mailbox.
   Try these in order, and stop at the first that passes the check:
   - **Reuse a proxy.** Email Triage's own Gmail access often has one already. Check it with
     `lucidos proxy <name> /gmail/v1/users/me/profile`: its `emailAddress` must equal the account's
     `address`. Never record a proxy that fails this check, since Inbox would then archive and reply
     in the wrong mailbox. (The app repeats the check before every list.)
   - **Reuse Email Triage's OAuth.** If the account's block has an `oauth_provider` that is a
     connected OAuth account, add a proxy with base URL `https://www.googleapis.com` authenticating
     with that provider (see `system-knowhow/building-an-auth-handshake`), then run the same check.
     Failing that, try each other connected Google provider whose token reads this `address`. This
     creates no provider and opens no popup.
   - **Connect the mailbox**, only when nothing above matches. Name the provider `g<account slug>`
     (e.g. `gprzone`). Before calling `connect_oauth_account`, tell the user in chat why (no existing
     Google connection reads this address), and that: a popup will ask for a Google OAuth client ID
     and secret; they can paste the same ones as their existing Google connection (Google Cloud
     Console → APIs & Services → Credentials), since one OAuth client serves every mailbox; in the
     browser they must sign in as this mailbox's address, not their default Google account; and if
     the OAuth app is in Testing, that address must be a test user. Then add the proxy as above and
     run the check.

   Record the passing proxy's name as `accounts["<config account name>"].proxy` in
   `artifacts/inbox/settings.json`. If the user dismisses the popup or a connection fails, still
   write the settings for the accounts that worked (keeping existing keys), carry on with the other
   steps, and tell the user which accounts are still unwired and that re-running Inbox's setup picks
   up only those.

3. **Each IMAP account** (`"fetch": "imap"`) goes through the "Inbox — IMAP bridge" trigger this
   plugin registered at install. Confirm it is live and unpaused in `lucidos triggers list`. Check
   that the account's `imap` block names a `credential_env` that exists: list the names with
   `env | cut -d= -f1 | grep '^CRED_'` and never print a value. Replies go out over SMTP with the
   same username and password. The bridge assumes SMTP at `smtp.<domain>` when the IMAP host is
   `imap.<domain>`, and the IMAP host itself otherwise, on port 465. If the provider differs, add
   `smtp_host` (and `smtp_port`; 587 means STARTTLS) to that `imap` block. To prove it works, run
   `lucidos events emit InboxImapSyncRequested --payload '{"summary": "Inbox setup check", "account": "<name>", "request_id": "setup-check-<name>"}'`
   and look for an `InboxImapResult` with `ok: true` for that account. On `ok: false`, its
   `error` says what to fix. (A sync is the only request an agent can make: writes and sends are
   honoured only from the Inbox app, so don't test those from here.)

4. **Accounts Inbox can't read yet** (`"fetch": "imap-peek"`, OAuth IMAP such as Outlook): tell
   the user they show in the sidebar with the reason, and that nothing else is needed.

5. **Ask for the user's display name and reply voice.** The name goes on outgoing mail and into
   the AI prompts. The voice is a sentence or two on how replies should sound. Offer per-account
   overrides (a different From name, voice or signature for a shared mailbox) but don't push them.
   Write `display_name`, `voice` and any overrides to `artifacts/inbox/settings.json`.

6. **AI Suggest, Polish and Summarize** go through one of the engine's built-in model proxies.
   With no `ai` block, Inbox tries `anthropic`, then `vertex`, with a Claude model. If the
   workspace has neither (`lucidos proxy anthropic /models` answers 404 for a provider with no
   credential), set `ai.provider` (`openai`, `openrouter`, `xai` or `local`) and `ai.model` in the
   settings file.

Finally, open the Inbox app. Tell the user that each account's mail is split into "Needs you" (it
survived triage, with the reason it was kept) and "Not triaged yet", and that `?` lists the
keyboard shortcuts. Point out the triage controls: the **Triage** strip at the top of the sidebar for
every account, and a **Triage** entry at the head of each account's folders for its rules, pause and
"Triage now". Then show the reusable "Inbox" widget (`inbox-glance`) in this thread, and offer
to pin it to Home: it counts what needs them across every account.
"""
