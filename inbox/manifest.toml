id = "inbox"
version = "0.3.0"
name = "Inbox"
description = "A smart inbox for all your mailboxes, with triage built in: your rules first, then AI, sort each mailbox on a schedule, and what needs you sits apart from the rest with the reason it was kept. Install Inbox, that's all: setup connects your mailboxes and schedules triage."
source = "https://github.com/akramsaouri/lucidos-plugins/tree/main/inbox"
engine = ">=0.48.0"
categories = ["productivity", "communication", "automation"]
icon = "media/icon.svg"
screenshots = ["media/list.png", "media/reply.png", "media/triage.png"]
setup_revision = 1
setup_reason = "Inbox now includes the triage engine; Email Triage is no longer needed."

setup = """
**Every run starts with "Moving from Email Triage" below**, even when nothing else needs doing: a workspace
that still has the Email Triage plugin installed must be moved off it safely, and the order matters.

**Already running Inbox?** After that step, if `artifacts/email-triage/config.json` has every account the user
wants, each with its cron trigger (step 4), and `artifacts/inbox/settings.json` exists with an
`accounts["<name>"].proxy` for every Gmail account, nothing else needs redoing: tell the user what changed in one
line and stop. If only some of it is there (an earlier setup stopped partway), this is not a fresh install: tell
the user what is already in place and that you're doing only the rest. Skip steps 1-5 for an account already in
`config.json` with its cron, run step 6 only for Gmail accounts with no recorded proxy, and skip every other step
whose answer is already in the settings. Do the same when the settings file is missing but a
`data/config/apis.json` proxy already passes step 6's check for some accounts: record those and carry on from
there. Never ask again for what `config.json` or the settings already answer.

- **Updating to 0.3.0:** Inbox now ships the triage engine that used to be the Email Triage plugin: the triage
  intent (`triggers/email-triage/intents/triage.md`), its knowhow (`knowhow/email-triage.md`), the IMAP helpers
  (`scripts/email-triage/`) and the on-demand trigger behind Triage now, now named "Inbox — triage on demand".
  The `data/` paths are the same, so cron triggers that name them keep working, and runtime state stays in
  `artifacts/email-triage/`, so there is no data to migrate. Email Triage itself is deprecated: "Moving from
  Email Triage" below takes it out without losing a file.
- **Updating to 0.2.1:** setup reuses the account's Gmail OAuth for each mailbox instead of asking for a Google
  client ID.
- **Updating to 0.2.0:** the triage control panel moved into Inbox. An **All accounts** strip at the top of the
  sidebar, and a **Triage** entry heading each account's folders, open a pane with health and next run,
  Pause/Resume, Triage now, the rule chain editor, suggestions from runs and run history. Pause is
  `"paused": true` in the account's config block, plus a best-effort pause of the account's own cron trigger,
  found by name; Triage now emits `EmailTriageRequested`. One cleanup worth offering on any update: if
  `lucidos triggers list` shows a bridge trigger the user created by hand (it runs
  `apps/inbox/scripts/imap_bridge.py` and isn't this plugin's "Inbox — IMAP bridge"), offer to delete it. The
  bridge never answers the same request twice, but a second trigger still runs on every request for nothing.

---

Inbox is a mail client with triage built in. Accounts, rules and schedules are workspace state, not plugin
files: `artifacts/email-triage/config.json` holds the accounts and their rule chains, one cron trigger per
account runs triage, and `artifacts/inbox/settings.json` holds Inbox's wiring and your name and voice. Walk the
user through it conversationally. **Read `knowhow/email-triage.md` and `knowhow/inbox.md` first.** The first has
the `config.json` schema, the rule-chain semantics, the notified-ledger dedup and the shared-account fetch state;
the second has the settings schema, how each account type is read, and the bridge protocol
(`apps/inbox/knowhow/triage.md` covers the triage controls). Keep every key already in either file when you write
it.

Two rules hold throughout:

- **Never read a message with `read_email`, in setup or in triage: it marks the message read.** Triage reads over
  the Gmail API or an IMAP peek, set by each account's `fetch` (step 1).
- **Never create an on-demand trigger.** "Inbox — triage on demand" ships with this plugin and was registered at
  install. It answers `EmailTriageRequested`, which Triage now emits, and runs the same intent the cron triggers
  run.

## Moving from Email Triage

Until Inbox 0.3.0 the engine was the separate Email Triage plugin. Both plugins now ship the same files at the
same paths, and the plugin engine works by path: an install overwrites what is there, an uninstall deletes every
file the plugin recorded (even one another plugin also records), and an update deletes only the files its new
version dropped, never a path another installed plugin still records. So **uninstalling Email Triage 0.7.x while
Inbox 0.3.0 is installed deletes the triage engine out from under Inbox.** Updating Email Triage to 0.8.0 first,
a deprecated version that ships none of those files, hands them to Inbox; after that its uninstall removes only
its own note. Accounts, rules, run history and cron triggers survive every step: they are workspace state.

Check the newest `PluginInstalled` event for `email-triage`, and whether a `PluginUninstalled` follows it:

- **Never installed, or uninstalled already:** go to "Check the engine resolves" below.
- **Installed at 0.8.0 or later:** offer to uninstall it (the Plugins panel, or `plugins(action="uninstall",
  id="email-triage")`). It deletes only `knowhow/email-triage-deprecated.md`. Then check the engine resolves.
- **Installed below 0.8.0:** do NOT uninstall it yet. In this order:
  1. Tell the user why in one or two lines: Email Triage is now part of Inbox, and it has to be updated before
     it's removed, or removing it deletes files Inbox needs.
  2. Update Email Triage to 0.8.0 (the Plugins panel, or `plugins(action="update", id="email-triage")`). Its
     update drops the engine files from its own record but leaves them on disk, because Inbox records them too.
     It also removes Email Triage's own on-demand trigger, "Email Triage — on demand". Until then two triggers
     answer `EmailTriageRequested`, so a Triage now press starts two runs of the same account at once:
     ask the user not to press it until this step is done. Don't delete either trigger by hand. The update starts Email
     Triage's own short setup thread, which only offers the same uninstall.
  3. Uninstall Email Triage. It now deletes only its deprecated note.
  4. Check the engine resolves.

Never pause, edit or delete the per-account cron triggers during the move: the triage intent stays at
`triggers/email-triage/intents/triage.md` throughout, so they never need it. A panel along the way may warn
about triggers that use removed files; the check below says whether anything is actually missing.

**Check the engine resolves.**

- These exist in `data/`: `knowhow/email-triage.md`, `triggers/email-triage/intents/triage.md`,
  `scripts/email-triage/imap_helper.py`, `scripts/email-triage/snapshot_imap.py`.
- In `lucidos triggers list`, every per-account cron trigger names `triggers/email-triage/intents/triage.md` (or
  `knowhow/email-triage.md`), and no file it names is missing. One that still runs
  `apps/email-triage/scripts/snapshot_imap.py` (the path before Email Triage 0.7.0) should be updated to
  `scripts/email-triage/snapshot_imap.py`: offer it.
- Exactly one trigger answers `EmailTriageRequested`: "Inbox — triage on demand". A leftover "Email Triage — on
  demand" means Email Triage is still installed below 0.8.0: finish the steps above.
- `artifacts/email-triage/config.json` is untouched. Don't rewrite it as part of the move.

**If an engine file is missing**, Email Triage below 0.8.0 was uninstalled after Inbox 0.3.0 landed. Restore
each missing path from the workspace history: find the uninstall commit with
`git -C data log --format='%H %s' --grep='Uninstall plugin: email-triage' -1`, then
`git -C data checkout <that commit>^ -- <path>` for each missing path. That parent holds exactly what Inbox 0.3.0
shipped. Then run the check again.

When the check passes, tell the user in one line that triage now runs from Inbox alone, and that their accounts,
rules and schedules carried over. Then go on with "Already running Inbox?" at the top.

## Triage, per account

Per account the user wants triaged:

1. **Connect the mailbox** if it isn't already. Most providers need OAuth now: look up the provider's IMAP/SMTP
   hosts, then `configure_email`. Check the already-configured accounts first, and the accounts already in
   `config.json`; don't redo one that's connected.

   Set the account's fetch path: a Gmail account gets `"fetch": "gmail-api"` and its `"oauth_provider"`; an
   Outlook/Exchange, Fastmail or self-hosted account gets `"fetch": "imap-peek"` with `"imap_host"` (and
   `"oauth_provider"` when it uses OAuth), which snapshots the inbox with `BODY.PEEK[]`.

   **A mailbox with no API and no OAuth** (only an IMAP host and a password) gets `"fetch": "imap"`. Connect it
   in three steps:
   1. `configure_email` with the provider's IMAP/SMTP hosts and the password. That stores the password as a
      credential, injected as a `CRED_<NAME>` env var.
   2. In the account's block in `artifacts/email-triage/config.json`, set `"fetch": "imap"` and add
      `"imap": {"host", "port", "ssl", "username"}` (username defaults to the address).
   3. Set `"credential_env"` in that block to the credential's env var *name*: list the names, never the values,
      with `env | cut -d= -f1 | grep '^CRED_'`.

   Check it with `python data/scripts/email-triage/imap_helper.py list --account "<name>"`, which is read-only.
   The "IMAP Accounts" section of `knowhow/email-triage.md` has the full schema and commands.

2. **Build a starting rule chain.** Don't ask them to write rules: ask what they want gone (`delete`), what they
   want silenced but kept (`read`), and what should always escalate (`notify` / `flag`), then turn the answers
   into rules. A first chain of 2-5 rules is plenty; the rule editor in Inbox's Triage pane is where they'll grow
   it.

3. **Ask what happens to mail the AI judges as needing nothing**: the account's `no_action_clear`, `read` (mark
   read, keep), `delete` (Trash), or `keep`. Recommend `read` for a shared or work mailbox where deleting could
   bury someone else's mail, `delete` for a personal one that gets a lot of noise.

4. **Ask for a schedule and create the cron trigger.** Cron is workspace state, so it is deliberately not
   shipped: you create it. First check `lucidos triggers list` for one that already runs triage for this
   account, and reuse it rather than adding another. A good default is hourly during waking hours plus one
   early-morning run; offer that, let them adjust. Each account gets its OWN trigger, named
   `Email Triage — <Account>` (Inbox's pause finds it by that name), running the intent at
   `triggers/email-triage/intents/triage.md` for that account.

   **Pin the trigger's `reasoning_effort` to `low`.** The rule chain is first-match-wins and already written
   down, so the only judgement left is a three-way classification against a rubric. The one exception is an
   account whose `no_action_clear` is `delete`: use `medium` there, because a wrong call trashes mail rather than
   merely marking it read.

5. **Write the account into `artifacts/email-triage/config.json`**, keeping every other account and key. Inbox
   reads that file, so the account shows up with its Triage entry as soon as it lands.

## Inbox, per account

6. **Each Gmail account** (`"fetch": "gmail-api"`, or an older block with no `fetch` on a Gmail address) is read
   and changed through an engine proxy in `data/config/apis.json` that carries that mailbox's OAuth token: one
   proxy per mailbox. Try these in order, and stop at the first that passes the check:
   - **Reuse a proxy.** Triage's own Gmail access often has one already. Check it with
     `lucidos proxy <name> /gmail/v1/users/me/profile`: its `emailAddress` must equal the account's `address`.
     Never record a proxy that fails this check, since Inbox would then archive and reply in the wrong mailbox.
     (The app repeats the check before every list.)
   - **Reuse the account's OAuth.** If the account's block has an `oauth_provider` that is a connected OAuth
     account, add a proxy with base URL `https://www.googleapis.com` authenticating with that provider (see
     `system-knowhow/building-an-auth-handshake`), then run the same check. Failing that, try each other
     connected Google provider whose token reads this `address`. This creates no provider and opens no popup.
   - **Connect the mailbox**, only when nothing above matches. Name the provider `g<account slug>` (e.g.
     `gprzone`). Before calling `connect_oauth_account`, tell the user in chat why (no existing Google
     connection reads this address), and that: a popup will ask for a Google OAuth client ID and secret; they
     can paste the same ones as their existing Google connection (Google Cloud Console → APIs & Services →
     Credentials), since one OAuth client serves every mailbox; in the browser they must sign in as this
     mailbox's address, not their default Google account; and if the OAuth app is in Testing, that address must
     be a test user. Then add the proxy as above and run the check.

   Record the passing proxy's name as `accounts["<config account name>"].proxy` in
   `artifacts/inbox/settings.json`. If the user dismisses the popup or a connection fails, still write the
   settings for the accounts that worked (keeping existing keys), carry on with the other steps, and tell the
   user which accounts are still unwired and that re-running Inbox's setup picks up only those.

7. **Each IMAP account** (`"fetch": "imap"`) goes through the "Inbox — IMAP bridge" trigger this plugin
   registered at install. Confirm it is live and unpaused in `lucidos triggers list`. Check that the account's
   `imap` block names a `credential_env` that exists: list the names with `env | cut -d= -f1 | grep '^CRED_'` and
   never print a value. Replies go out over SMTP with the same username and password. The bridge assumes SMTP at
   `smtp.<domain>` when the IMAP host is `imap.<domain>`, and the IMAP host itself otherwise, on port 465. If the
   provider differs, add `smtp_host` (and `smtp_port`; 587 means STARTTLS) to that `imap` block. To prove it
   works, run
   `lucidos events emit InboxImapSyncRequested --payload '{"summary": "Inbox setup check", "account": "<name>", "request_id": "setup-check-<name>"}'`
   and look for an `InboxImapResult` with `ok: true` for that account. On `ok: false`, its `error` says what to
   fix. (A sync is the only request an agent can make: writes and sends are honoured only from the Inbox app, so
   don't test those from here.)

8. **Accounts Inbox can't read yet** (`"fetch": "imap-peek"`, OAuth IMAP such as Outlook): tell the user they
   are triaged as usual and show in the sidebar with the reason, and that nothing else is needed.

## Once for the workspace

9. **Ask for the user's display name and reply voice.** The name goes on outgoing mail and into the AI prompts.
   The voice is a sentence or two on how replies should sound. Offer per-account overrides (a different From
   name, voice or signature for a shared mailbox) but don't push them. Write `display_name`, `voice` and any
   overrides to `artifacts/inbox/settings.json`.

10. **AI Suggest, Polish and Summarize** go through one of the engine's built-in model proxies. With no `ai`
    block, Inbox tries `anthropic`, then `vertex`, with a Claude model. If the workspace has neither
    (`lucidos proxy anthropic /models` answers 404 for a provider with no credential), set `ai.provider`
    (`openai`, `openrouter`, `xai` or `local`) and `ai.model` in the settings file.

Finally, open the Inbox app. Tell the user that the first triage run is silent unless something actually needs
them (that's the design, not a failure), and that each account's mail is split into "Needs you" (it survived
triage, with the reason it was kept) and "Not triaged yet", and that `?` lists the keyboard shortcuts. Point out
the triage controls: the **Triage** strip at the top of the sidebar for every account, and a **Triage** entry at
the head of each account's folders for its rules, pause and "Triage now". Then show the reusable "Inbox" widget
(`inbox-glance`) in this thread, and offer to pin it to Home: it counts what needs them across every account.
"""
