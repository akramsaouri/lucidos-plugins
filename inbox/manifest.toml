id = "inbox"
version = "1.2.0"
name = "Inbox"
description = "A smart inbox for all your mailboxes, with triage built in: your rules first, then AI, sort each mailbox on a schedule, and what needs you sits apart from the rest with the reason it was kept. A retro re-checks what triage cleared and brings back what you'd want. Install Inbox, that's all: setup connects your mailboxes and schedules triage."
source = "https://github.com/akramsaouri/lucidos-plugins/tree/main/inbox"
engine = ">=0.48.0"
categories = ["productivity", "communication", "automation"]
icon = "media/icon.svg"
screenshots = ["media/list.png", "media/all-inboxes.png", "media/reply.png", "media/triage.png"]
setup_revision = 4
setup_reason = "Inbox 1.2.0 names each IMAP account's credential where the engine finds it, so the IMAP bridge can log in, and checks for triggers made before Inbox that would fire twice."

setup = """
**Every run starts with "Check the engine resolves" below**, even when nothing else needs doing.

**Already running Inbox?** After that check, if `artifacts/email-triage/config.json` has every account the user
wants, each with its cron trigger (step 4), and `artifacts/inbox/settings.json` exists with an
`accounts["<name>"].proxy` for every Gmail account, nothing else needs redoing: tell the user what changed in one
line and stop. If only some of it is there (an earlier setup stopped partway), this is not a fresh install: tell
the user what is already in place and that you're doing only the rest. Skip steps 1-5 for an account already in
`config.json` with its cron, run step 6 only for Gmail accounts with no recorded proxy, and skip every other step
whose answer is already in the settings. **One exception: when the settings have no `retro` key, ask step 11 (the
triage retro) before you stop**, even when everything else is in place. **And on every run, do "Credentials for
IMAP accounts", "Triggers that would fire twice" and "Settings from an older Inbox" below before you stop**:
each checks what is there and changes nothing when it is already right. Do the same when the settings file is missing but a
`data/config/apis.json` proxy already passes step 6's check for some accounts: record those and carry on from
there. Never ask again for what `config.json` or the settings already answer.

- **Updating to 1.2.0:** The engine hands a script a credential only when a file names it, and the IMAP
  bridge and triage helpers read each account's password by a name from `config.json`, so on current engines
  they could not log in. Run "Credentials for IMAP accounts", which writes the names where the engine finds
  them. Then run "Triggers that would fire twice" and "Settings from an older Inbox". Nothing else changed in
  setup.
- **Updating to 1.1.0:** Inbox adds the triage retro, which goes back over the mail triage archived or trashed,
  restores what the user would want to see and suggests rule changes. After the engine check, ask step 11 if the
  settings have no `retro` key, and do nothing else that is already in place. From this release triage logs every
  mail it clears to `artifacts/inbox/retro/`, so the first retro reviews only mail cleared since the update.
- **Updating to 1.0.0:** Inbox stands alone. The old Email Triage plugin is gone from this marketplace, and
  Inbox no longer detects it, migrates from it or stands down for its triggers. Anyone still on Email Triage, or
  on an Inbox older than 1.0.0 that was moving off it, should uninstall Email Triage and Inbox, install Inbox
  fresh and run this setup. Accounts, rules and run history live in workspace files that uninstalling leaves in
  place, so setup finds them and only checks the engine and each schedule. New cron triggers are named
  `Inbox triage — <Account>`; an existing `Email Triage — <Account>` cron keeps working and needs no rename.

---

Inbox is a mail client with triage built in. Accounts, rules and schedules are workspace state, not plugin
files: `artifacts/email-triage/config.json` holds the accounts and their rule chains, one cron trigger per
account runs triage, and `artifacts/inbox/settings.json` holds Inbox's wiring and your name and voice. Walk the
user through it conversationally. **Read `knowhow/inbox-triage.md` and `knowhow/inbox.md` first.** The first has
the `config.json` schema, the rule-chain semantics, the notified-ledger dedup and the shared-account fetch state;
the second has the settings schema, how each account type is read, and the bridge protocol
(`apps/inbox/knowhow/triage.md` covers the triage controls). Keep every key already in either file when you write
it.

Two rules hold throughout:

- **Never read a message with `read_email`, in setup or in triage: it marks the message read.** Triage reads over
  the Gmail API or an IMAP peek, set by each account's `fetch` (step 1).
- **Never create an on-demand trigger.** "Inbox — triage on demand" ships with this plugin and was registered at
  install. It answers `EmailTriageRequested`, which Triage now emits, and runs the same intent the cron triggers
  run.

## Check the engine resolves

- These exist in `data/`: `knowhow/inbox-triage.md`, `triggers/inbox-triage/intents/triage.md`,
  `scripts/inbox-triage/imap_helper.py`, `scripts/inbox-triage/snapshot_imap.py`, and for the retro
  `knowhow/inbox-triage-retro.md`, `triggers/inbox-triage/intents/retro.md`, `scripts/inbox-triage/retro_tick.py`.
- In `lucidos triggers list`, no per-account cron names a file that is missing. If one does, update it with
  `triggers(action="update")` to run `triggers/inbox-triage/intents/triage.md` (and `knowhow/inbox-triage.md`,
  `scripts/inbox-triage/` for any knowhow or script it names), keeping the rest of its text, its schedule, name
  and settings. Never recreate, pause or delete one.
- Exactly one unpaused trigger answers `EmailTriageRequested`, and exactly one answers
  `InboxTriageRetroRequested`. Inbox ships "Inbox — triage on demand" and "Inbox — triage retro" for them. When
  a trigger the user made before Inbox answers one too, "Triggers that would fire twice" settles which runs.
- `artifacts/email-triage/config.json` is untouched. Don't rewrite it as part of this check.

**If an Inbox engine file is missing** (deleted by hand, say), restore it from the workspace history:
`git -C data log --format=%H --diff-filter=D -1 -- <path>` finds the commit that deleted it, and
`git -C data checkout <that commit>^ -- <path>` brings it back. Then run the check again. The Inbox app shows a
"Triage engine missing" banner until it passes.

When the check passes, go on with "Already running Inbox?" at the top.

## Triage, per account

Per account the user wants triaged:

1. **Connect the mailbox** if it isn't already. Most providers need OAuth now: look up the provider's IMAP/SMTP
   hosts, then `configure_email`. Check the already-configured accounts first, and the accounts already in
   `config.json`; don't redo one that's connected.

   Set the account's fetch path: a Gmail account gets `"fetch": "gmail-api"` and its `"oauth_provider"`; an
   Outlook/Exchange, Fastmail or self-hosted account gets `"fetch": "imap-peek"` with `"imap_host"` (and
   `"oauth_provider"` when it uses OAuth), which snapshots the inbox with `BODY.PEEK[]`.

   **A mailbox with no API and no OAuth** (only an IMAP host and a password) gets `"fetch": "imap"`. Connect it
   in three steps:
   1. `configure_email` with the provider's IMAP/SMTP hosts and the password. That stores the password as a
      credential, injected as a `CRED_<NAME>` env var.
   2. In the account's block in `artifacts/email-triage/config.json`, set `"fetch": "imap"` and add
      `"imap": {"host", "port", "ssl", "username"}` (username defaults to the address).
   3. Set `"credential_env"` in that block to the credential's env var *name*: list the names, never the values,
      with `lucidos credentials list`.
   4. Add that name to the credential files ("Credentials for IMAP accounts" below), or the helper can't log in.

   Check it with `python data/scripts/inbox-triage/imap_helper.py list --account "<name>"`, which is read-only.
   The "IMAP Accounts" section of `knowhow/inbox-triage.md` has the full schema and commands.

2. **Build a starting rule chain.** Don't ask them to write rules: ask what they want gone (`delete`), what they
   want silenced but kept (`read`), and what should always escalate (`notify` / `flag`), then turn the answers
   into rules. A first chain of 2-5 rules is plenty; the rule editor in Inbox's Triage pane is where they'll grow
   it.

3. **Ask what happens to mail the AI judges as needing nothing**: the account's `no_action_clear`, `read` (mark
   read, keep), `archive` (out of the inbox and read, never trashed), `delete` (Trash), or `keep`. Recommend
   `read` or `archive` for a shared or work mailbox where deleting could bury someone else's mail, `delete` for a
   personal one that gets a lot of noise.

4. **Ask for a schedule and create the cron trigger.** Cron is workspace state, so it is deliberately not
   shipped: you create it. First check `lucidos triggers list` for one that already runs triage for this
   account, and reuse it rather than adding another. A good default is hourly during waking hours plus one
   early-morning run; offer that, let them adjust. Each account gets its OWN trigger, named
   `Inbox triage — <Account>` (Inbox's pause finds it by that name), running the intent at
   `triggers/inbox-triage/intents/triage.md` for that account.

   **Pin the trigger's `reasoning_effort` to `low`.** The rule chain is first-match-wins and already written
   down, so the only judgement left is a three-way classification against a rubric. The one exception is an
   account whose `no_action_clear` is `delete`: use `medium` there, because a wrong call trashes mail rather than
   merely marking it read.

5. **Write the account into `artifacts/email-triage/config.json`**, keeping every other account and key. Inbox
   reads that file, so the account shows up with its Triage entry as soon as it lands.

## Inbox, per account

6. **Each Gmail account** (`"fetch": "gmail-api"`, or an older block with no `fetch` on a Gmail address) is read
   and changed through an engine proxy in `data/config/apis.json` that carries that mailbox's OAuth token: one
   proxy per mailbox. Try these in order, and stop at the first that passes the check:
   - **Reuse a proxy.** Triage's own Gmail access often has one already. Check it with
     `lucidos proxy <name> /gmail/v1/users/me/profile`: its `emailAddress` must equal the account's `address`.
     Never record a proxy that fails this check, since Inbox would then archive and reply in the wrong mailbox.
     (The app repeats the check before every list.)
   - **Reuse the account's OAuth.** If the account's block has an `oauth_provider` that is a connected OAuth
     account, add a proxy with base URL `https://www.googleapis.com` authenticating with that provider (see
     `system-knowhow/building-an-auth-handshake`), then run the same check. Failing that, try each other
     connected Google provider whose token reads this `address`. This creates no provider and opens no popup.
   - **Connect the mailbox**, only when nothing above matches. Name the provider `g<account slug>` (e.g.
     `gprzone`). Before calling `connect_oauth_account`, tell the user in chat why (no existing Google
     connection reads this address), and that: a popup will ask for a Google OAuth client ID and secret; they
     can paste the same ones as their existing Google connection (Google Cloud Console → APIs & Services →
     Credentials), since one OAuth client serves every mailbox; in the browser they must sign in as this
     mailbox's address, not their default Google account; and if the OAuth app is in Testing, that address must
     be a test user. Then add the proxy as above and run the check.

   Record the passing proxy's name as `accounts["<config account name>"].proxy` in
   `artifacts/inbox/settings.json`. If the user dismisses the popup or a connection fails, still write the
   settings for the accounts that worked (keeping existing keys), carry on with the other steps, and tell the
   user which accounts are still unwired and that re-running Inbox's setup picks up only those.

7. **Each IMAP account** (`"fetch": "imap"`) goes through the "Inbox — IMAP bridge" trigger this plugin
   registered at install. Confirm it is live and unpaused in `lucidos triggers list`. Check that the account's
   `imap` block names a `credential_env` that exists: list the names with `lucidos credentials list`, which
   never prints a value, and that "Credentials for IMAP accounts" below lists it. Replies go out over SMTP with the same username and password. The bridge assumes SMTP at
   `smtp.<domain>` when the IMAP host is `imap.<domain>`, and the IMAP host itself otherwise, on port 465. If the
   provider differs, add `smtp_host` (and `smtp_port`; 587 means STARTTLS) to that `imap` block. To prove it
   works, run
   `lucidos events emit InboxImapSyncRequested --payload '{"summary": "Inbox setup check", "account": "<name>", "request_id": "setup-check-<name>"}'`
   and look for an `InboxImapResult` with `ok: true` for that account. On `ok: false`, its `error` says what to
   fix. (A sync is the only request an agent can make: writes and sends are honoured only from the Inbox app, so
   don't test those from here.)

8. **Accounts Inbox can't read yet** (`"fetch": "imap-peek"`, OAuth IMAP such as Outlook): tell the user they
   are triaged as usual and show in the sidebar with the reason. Their triage needs only "Credentials for IMAP
   accounts" below.

## Credentials for IMAP accounts

The engine hands a script a credential only when the script, or a `.py` file beside it, names it. The IMAP
bridge and the triage helpers read each account's password by the name in its `config.json` block, which no
shipped file can know, so two workspace files name them. Inbox doesn't ship them, so updates leave them alone.

Collect the names from `artifacts/email-triage/config.json`: every `"fetch": "imap"` account's
`imap.credential_env`, and for every `"fetch": "imap-peek"` account `OAUTH_<PROVIDER>_ACCESS_TOKEN` (its
`oauth_provider`, upper-cased, with `-` as `_`) or, with no `oauth_provider`, the `CRED_<NAME>` its password is
stored under. Check each against `lucidos credentials list`, and tell the user about any that doesn't exist.

Then make each of these files hold exactly one line, `# lucidos-credentials: ` and the names, space-separated
and sorted:

- `data/apps/inbox/scripts/imap_credentials.py`, beside the IMAP bridge (only `"fetch": "imap"` names)
- `data/scripts/inbox-triage/imap_credentials.py`, beside the triage helpers (every name above)

Write a file only when its line differs, and never with a credential's value. With no IMAP or imap-peek
accounts, write neither. When an `"imap"` account exists, prove the bridge can log in: emit the sync in step 7
and look for `ok: true`.

## Triggers that would fire twice

Inbox registered "Inbox — triage on demand", "Inbox — IMAP bridge" and "Inbox — triage retro" at install. A
workspace that ran triage, an IMAP bridge or a retro before Inbox may have its own trigger for the same job,
and then both fire. In `lucidos triggers list`, look for a trigger that is not one of those three and:

- **answers `EmailTriageRequested`**: one Triage now would run two triage passes on the same mailbox. Ask
  which to keep. Recommend theirs when it runs triage knowhow of their own (rule actions or integrations
  `knowhow/inbox-triage.md` doesn't have), since their crons run the same; then pause "Inbox — triage on
  demand". Otherwise recommend Inbox's, and delete theirs once they confirm.
- **runs `apps/inbox/scripts/imap_bridge.py`, or answers `InboxImapSyncRequested` or
  `InboxImapActionRequested`**: two bridges. The bridge answers each request once, so nothing is sent twice,
  but every sync runs twice. Offer to delete theirs: Inbox's runs the same script, with the device-only guard
  on writes.
- **runs a triage retro on a schedule** (a cron whose intent goes back over mail triage archived or trashed):
  with Inbox's retro on too, two retros run. Ask which to keep. Keeping theirs means writing
  `"retro": {"enabled": false}` to the settings and skipping step 11's question. Keeping Inbox's means
  deleting theirs and offering the schedule nearest to it in step 11.

Change nothing without the user's answer, and never touch a per-account cron here: step 4 already reuses
those. Tell the user in one line when nothing collides.

## Settings from an older Inbox

An Inbox built by hand before this plugin may have left `artifacts/inbox/settings.json` with a top-level
`voices` map (short account keys, each with `voice`, `signature`, `from_name`) or an `ai_model`. Inbox reads
neither. Move each `voices.<key>` into `accounts["<config account name>"]`, matching the key to the account
whose name, slug or address it plainly means and asking the user about any you can't match, and `ai_model`
into `ai.model`. Keep every other key, and drop the old ones only once they're moved.

## Once for the workspace

9. **Ask for the user's display name and reply voice.** The name goes on outgoing mail and into the AI prompts.
   The voice is a sentence or two on how replies should sound. Offer per-account overrides (a different From
   name, voice or signature for a shared mailbox) but don't push them. Write `display_name`, `voice` and any
   overrides to `artifacts/inbox/settings.json`.

10. **AI Suggest, Polish and Summarize** go through one of the engine's built-in model proxies. With no `ai`
    block, Inbox tries `anthropic`, then `vertex`, with a Claude model. If the workspace has neither
    (`lucidos proxy anthropic /models` answers 404 for a provider with no credential), set `ai.provider`
    (`openai`, `openrouter`, `xai` or `local`) and `ai.model` in the settings file.

11. **Ask whether to turn on the triage retro, and how often.** Explain it in a sentence: on a schedule, it goes
    back over the mail triage archived or trashed on every account, brings back anything they'd want to see, and
    suggests rule changes in its own thread, without ever changing their rules. Offer the schedules: twice a week,
    Wednesday and Sunday evenings (the default, recommend it), once a week on Sunday evening, or every evening.
    Write the answer to `artifacts/inbox/settings.json` as `"retro": {"enabled": true|false, "schedule":
    "twice-weekly"|"weekly"|"daily"}`, keeping every other key. Write `"enabled": false` when they say no, so
    setup doesn't ask again. `knowhow/inbox-triage-retro.md` has the details.

    When it is on, make sure the schedule check exists. A plugin can't ship a cron, so it is a workspace trigger:
    first look in `lucidos triggers list` for a cron trigger running `scripts/inbox-triage/retro_tick.py` and
    reuse it. Otherwise create one named `Inbox — triage retro schedule`, schedule `0 0 20 * * *` in the user's
    timezone, with a script run: `{"type": "script", "path": "scripts/inbox-triage/retro_tick.py"}`. It runs every
    evening with no AI, reads the setting, and asks for a retro only when one is due, so turning the retro off or
    changing its schedule needs no trigger edit. When the retro is off, leave an existing check alone: it does
    nothing while the setting is off. **Never create a trigger that answers `InboxTriageRetroRequested`**: "Inbox —
    triage retro" ships with this plugin.

Finally, open the Inbox app. Tell the user that the first triage run is silent unless something actually needs
them (that's the design, not a failure), and that each account's mail is split into "Needs you" (it survived
triage, with the reason it was kept) and "Not triaged yet", and that `?` lists the keyboard shortcuts. Point out
the triage controls: the **Triage** strip at the top of the sidebar for every account, and a **Triage** entry at
the head of each account's folders for its rules, pause and "Triage now". The strip's **Retro** section switches
the retro on or off and changes how often it runs. Then show the reusable "Inbox" widget
(`inbox-glance`) in this thread, and offer to pin it to Home: it counts what needs them across every account.
"""
