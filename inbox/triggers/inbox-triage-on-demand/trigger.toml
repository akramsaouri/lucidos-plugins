# The one on-demand triage trigger. Email Triage shipped it as `email-triage-on-demand` until 0.7.x; the slug is
# new so the two plugins never record the same trigger.toml while a workspace moves from one to the other.
name = "Inbox — triage on demand"
slug = "inbox-triage-on-demand"
app_id = "inbox"
reasoning_effort = "low"

[[on]]
event_type = "EmailTriageRequested"

[run]
type = "intent"
intent = "When I ask for a triage run from the Inbox app's triage pane (its Triage now button), execute the email triage intent at triggers/email-triage/intents/triage.md for the account named in the request."
