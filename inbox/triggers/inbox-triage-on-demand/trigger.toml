# The one on-demand triage trigger: it answers Triage now in the Inbox app's triage pane.
name = "Inbox — triage on demand"
slug = "inbox-triage-on-demand"
app_id = "inbox"
reasoning_effort = "low"

[[on]]
event_type = "EmailTriageRequested"

[run]
type = "intent"
intent = "When I ask for a triage run from the Inbox app's triage pane (its Triage now button), triage the account named in the request, once: execute the email triage intent at triggers/inbox-triage/intents/triage.md for that account."
