name: plugin checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version bump and build output
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/check_plugins.py "$BASE_SHA" "$HEAD_SHA"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Without jsdom the inbox pane test skips itself instead of running.
      - name: Install JS test dependencies
        run: npm ci --prefix tests/inbox/triage --no-audit --no-fund
      # Each suite runs from its own directory: suites share module names (support, test_glance).
      - name: Unit tests
        run: |
          status=0
          for dir in tests/*/; do
            echo "::group::$dir"
            (cd "$dir" && python -m unittest discover -p 'test_*.py' -v) || status=1
            echo "::endgroup::"
          done
          exit $status
