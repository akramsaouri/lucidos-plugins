# After a resolver force-pushes, any other checkout of that branch points at commits that no longer exist.
# This checks for one and tells Pulls whether a reset is lossless.
name = "Check stranded worktree after rebase"
slug = "check-stranded-worktree-after-rebase"
app_id = "review-cockpit"

[[on]]
event_type = "PrConflictResolutionFinished"

[run]
type = "script"
path = "triggers/resolve-pr-conflicts/scripts/check_worktree.py"
