 *                      Reviews timeline where a reviewer's response belongs.
 *
 * #715 was posted the first way: 900 words on the PR, and both GitHub and
 * this app still read it as unanswered. `event: COMMENT` — never APPROVE or
 * REQUEST_CHANGES. Those are verdicts, and a batch of findings is not a verdict;
 * picking one is my call on the PR itself. */
async function composeComment() {
  const e = PRS.find(x => x.key === view.key);
  if (!e) return;
  const st = prState(e.key);
  const pr = e.current.pr;

  /* Severity order, source before test — the same order the page showed them in,
   * so the comment reads in the order I picked them rather than in map order. */
  const pool = [...allFindings(e.current), ...sortBySeverity(e.current.refuted || [])];
  const picks = pool
    .filter(f => st.findings[idKey(f)]?.picked)
    .map(f => ({ ...f, note: st.findings[idKey(f)].note || '' }));

  if (!picks.length) {
    lucidos.ui.toast('Nothing picked yet', 'warning');
    return;
  }

  const body = composeBody(e, picks);

  const go = await lucidos.ui.confirm({
    title: `One review, ${picks.length} finding${picks.length > 1 ? 's' : ''}`,
    message: body.length > 1200 ? body.slice(0, 1200) + '\n\n… (truncated in this preview)' : body,
    okLabel: 'Copy & open the review box',
    cancelLabel: 'Hand it to a thread',
  });

  if (go) {
    const ok = await copyOrShow(body, 'The review');
    if (ok) {
      lucidos.ui.toast('Copied — paste it in the review box and Submit as Comment',
        'success', { key: 'compose' });
    }
    /* The FILES tab, not the PR root. That's where GitHub's "Review changes"
     * box lives, and landing on the Conversation tab is precisely how a review
     * turns into a plain comment by accident — the mistake this whole change
     * exists to stop. */
    if (pr.url) {
      await openExternally(`${pr.url}/files`,
        `${wsMeta(workspaceOf(pr)).label} PR`);
    }
  } else {
    /* The other exit. A thread CAN post — it has `gh` and the right config dir —
     * but it should do it after I've read the body in the compose box, which is
     * exactly what startThread gives me: prefilled, never auto-sent. */
    await lucidos.ui.startThread({
      prompt: [
        `Post this as ONE submitted review on ${pr.repo_slug}#${pr.number} — one review, not one comment per finding.`,
        `Read it back to me first if anything in it looks wrong for something I'm posting under my own name.`,
        ``,
        `IT MUST BE A SUBMITTED REVIEW, NOT A CONVERSATION COMMENT. \`gh pr comment\` and`,
        `\`issues/${pr.number}/comments\` post to the Conversation tab, which leaves me in`,
        `requested_reviewers with GitHub still reading "review required" — that already`,
        `happens easily. Use the reviews endpoint, anchored to the head SHA:`,
        ``,
        '```bash',
        `gh api repos/<org>/<repo>/pulls/${pr.number}/reviews -X POST \\`,
        `  -f commit_id=${pr.head_sha || pr.sha7} -f event=COMMENT -F body=@<file>`,
        '```',
        ``,
        `\`event=COMMENT\` — never APPROVE or REQUEST_CHANGES. Those are verdicts and`,
        `they are mine to give on the PR, not yours to infer from a batch of findings.`,
        `Write the body to a temp file and pass it with -F body=@ rather than -f: it`,
        `contains backticks, newlines and <details> blocks that a shell arg will mangle.`,
        ``,
        `---`,
        ``,
        prContextBlock(pr),
        ``,
        `The review body, verbatim:`,
        ``,
        body,
      ].join('\n'),
    });
  }

  await lucidos.events.emit('ReviewCommentComposed', {
    summary: `${view.key} — composed one review from ${picks.length} findings`,
    pr: view.key, sha7: pr.sha7, count: picks.length,
    route: go ? 'clipboard' : 'thread',
    /* What the batch is aimed at. Older events carry no `target` and were all
     * plain Conversation comments — which is why #715 read as unanswered
     * for two hours. Recording it makes the two eras distinguishable. */
    target: 'review',
    locations: picks.map(locKey),
  });
}

/* ---------- boot ---------- */

(async function boot() {
  lucidos.ui.applyPreferences();
  lucidos.ui.watchPreferences();
  /* Registered ONCE, before the first render, and never again — it's a
   * window-level capture listener that must beat the SDK's own, not a
   * per-render rewire. Calling it from wire() would stack a duplicate handler
   * on every state change. */
  wireGitHubLinks();
  wireMoreMenus();
  /* Started now so it runs alongside the loads; awaited (briefly) below. */
  const bandsRead = restoreBands();
  const wsRead = primeWsStore();
  /* A fold toggled less than BANDS_WRITE_DELAY_MS before a reload or an app
   * switch would otherwise be lost with the pending timer. */
  window.addEventListener('pagehide', () => { if (bandsTimer) flushBands(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && bandsTimer) flushBands();
  });

  /* Armed before the reads, disarmed after them. A boot that beats the delay
   * never paints anything. */
  BOOTING = true;
  /* The skeleton is decorative, so the live region is the only thing that says
   * "loading" to a screen reader. It is replaced by the real count the moment
   * the board paints. */
  const liveEl = document.getElementById('live');
  if (liveEl) liveEl.textContent = 'Loading your pull requests';
  const skelTimer = setTimeout(() => {
    if (!BOOTING) return;
    skeletonShownAt = Date.now();
    render();
  }, SKELETON_DELAY_MS);

  await loadConfig();
  view.ws = DEFAULT_WS;
  await loadListeners();
  await loadTriage();
  await loadAll();
  await loadMine();
  await loadBriefs();
  await loadShipped();
  await loadAvatars();
  await loadQueue();
  await loadResolving();
  await loadAddressing();
  await loadStranded();
  await loadPrepping();
  await loadSkillEvents();
  await loadSkillIndex();
  clearTimeout(skelTimer);
  /* Shown, so hold it out for the floor before swapping. Never shown, so swap
   * immediately — there is nothing on screen to strobe. */
  if (skeletonShownAt) {
    const left = SKELETON_FLOOR_MS - (Date.now() - skeletonShownAt);
    if (left > 0) await new Promise(r => setTimeout(r, left));
  }
  BOOTING = false;
  /* The stored folds must be in COLLAPSED before openLeadingBand runs, or the
   * leading band it opens would be closed again by a late restore. If the reads
   * are still pending after the cap, the defaults paint; when the folds land they
   * only enable saving (see bandsSettled), and a late tab pick is never applied
   * (see restoreWs). */
  await Promise.race([
    Promise.all([bandsRead, wsRead]),
    new Promise(r => setTimeout(r, UI_READ_WAIT_MS)),
  ]);
  bandsSettled = true;
  /* After the loads and before the first paint: restoreWs asks whether the
   * remembered tab is currently showable, and that answer depends on the data. */
  restoreWs();
  /* Same ordering argument, and it must come AFTER restoreWs: which band leads
   * is a per-tab question, so it can only be asked once the tab is settled. */
  {
    const b = boardBands(view.ws);
    if (!b.mineTurn.length && !b.reviewsTurn.length) openLeadingBand(b);
  }
  render();
  lucidos.sse.connect();
  lucidos.sse.on('ReviewFindingsProduced', async () => {
    await loadAll();
    /* Findings are the terminal state of a prep, so this is what releases the
     * lock — without it a card would say "reviewing" beside the findings the
     * review just produced. */
    await loadPrepping();
    render();
    lucidos.ui.toast('New findings arrived', 'info');
  });
  /* The rail accepted a queueing — from the hourly detector or from the Prep
   * button. Replaces the optimistic lock with the real one, which matters when
   * the head moved between the card's render and the click: the script queues
   * the CURRENT head, so the key it locks is not always the one the button used. */
  lucidos.sse.on('ReviewPrepRequested', async () => {
    await loadPrepping();
    render();
  });
  /* The rail REFUSED a queueing. This is the counterpart to the event above and
   * exists because the optimistic lock set on click is a guess: without a
   * refusal signal the card sits at "reviewing · started 0m ago" forever while
   * nothing runs, which is precisely how the Re-prep button looked broken on
   * 2026-08-19. Drop the lock, then say which guard caught it — a refused click
   * the user is not told about is indistinguishable from a dead button. */
  lucidos.sse.on('ReviewPrepRefused', async (e) => {
    const p = e?.payload || {};
    const k = prepKey(p.repo, p.pr, (p.sha || '').slice(0, 7));
    PREPPING.delete(k);
    await loadPrepping();
    render();
    lucidos.ui.toast(p.detail || 'The rail did not queue this review', 'warning',
      { key: 'prep', durationMs: 8000 });
  });
  /* Membership of the review lane changed — a request arrived, was revoked, or a
   * PR merged. Silent: it fires on the same hourly cadence as the status sweep. */
  lucidos.sse.on('ReviewQueueSnapshotted', async () => {
    await loadQueue();
    render();
  });
  /* The my-PRs sweep overwrites one artifact, so this event carries no data —
   * it only says "the snapshot moved, re-read it". Silent when it arrives on its
   * own (it fires hourly; a toast every hour for "nothing changed" is training to
   * ignore), but LOUD when the user pressed Refresh — a manual action with no
   * acknowledgement reads as a broken button. This event is also the only
   * completion signal the refresh has, so it's what clears the spinner. */
  lucidos.sse.on('MyPrStatusSnapshotted', async () => {
    await loadConfig();
    await loadMine();
    /* Written by the same sweep, in the same run, so it is fresh exactly when
     * my-prs is — no separate event, and no chance of the two disagreeing
     * about which run they came from. */
    await loadShipped();
    /* The refresh trigger runs both sweeps; the queue's own event may land
     * first or second, so re-read it here too rather than racing them. */
    await loadQueue();
    const wasManual = refreshing;
    if (wasManual) {
      clearTimeout(refreshTimer);
      /* The frame won the race, so the artifact poll has nothing left to watch
       * for. Leaving it running would re-read three files every 3s forever. */
      clearInterval(refreshPoll);
      refreshing = false;
    }
    render();
    /* No success toast. The refreshed rows ARE the result, and they're already
     * on screen the instant this render lands — a banner announcing that the
     * thing in front of you just updated is noise pointing at itself. The
     * failure toasts below stay: those say something the table cannot, because
     * unchanged-and-stale looks exactly like unchanged-and-correct. */
  });
  /* A brief can land while the app is open — the detector polls every hour and
   * a teammate merges during the evening. Without this the lane would only fill on
   * reload, which for a "so you know" surface is the same as not telling you. */
  lucidos.sse.on('PrBriefProduced', async () => {
    await loadBriefs();
    render();
  });
  /* The resolver's own lifecycle. Started swaps the optimistic "starting…" for a
   * real thread link; Finished releases the lock and pulls fresh status, because
   * the whole point is that the PR is no longer conflicted — and until mine.py
   * re-reads GitHub the card would keep claiming it is. */
  lucidos.sse.on('PrConflictResolutionStarted', async () => {
    await loadResolving();
    render();
  });
  lucidos.sse.on('PrConflictResolutionFinished', async (data) => {
    await loadResolving();
    render();
    lucidos.ui.toast(data?.summary || 'Conflict resolver finished', 'success',
      { key: 'resolve' });
    /* Re-read status rather than assuming success: the agent may have stopped at
     * a product decision and pushed nothing, in which case the card must stay red. */
    try {
      await lucidos.events.emit('PrStatusRefreshRequested', {
        summary: 'Re-read PR status after a conflict resolver finished',
        source: 'review-cockpit',
      });
    } catch (err) { /* the hourly sweep will catch up */ }
  });
  /* The comment resolver's lifecycle, mirroring the conflict one above. The
   * difference is in the Finished handler: a conflict resolver either fixed the
   * PR or didn't, but this one has a third outcome — it read everything and left
   * replies for me. So the toast reports the outcome rather than announcing
   * success, and the status re-read still happens either way, because only the
   * next sweep can tell whether the threads actually closed. */
  lucidos.sse.on('PrCommentResolutionStarted', async () => {
    await loadAddressing();
    render();
  });
  lucidos.sse.on('PrCommentResolutionFinished', async (data) => {
    await loadAddressing();
    render();
    lucidos.ui.toast(data?.summary || 'Comment resolver finished',
      data?.outcome === 'failed' ? 'warning' : 'success', { key: 'address' });
    try {
      await lucidos.events.emit('PrStatusRefreshRequested', {
        summary: 'Re-read PR status after a comment resolver finished',
        source: 'review-cockpit',
      });
    } catch (err) { /* the hourly sweep will catch up */ }
  });
  /* The re-request rail, which runs a second or two after the Finished above.
   *
   * It toasts only on the two outcomes that change what I have to do: someone
   * was asked, or the ask failed and he has to press the arrows himself. The
   * third outcome — nobody needed asking — is written to the card and nothing
   * else, because a toast for "no action required" on top of the resolver's own
   * toast is two notifications for one event. */
  lucidos.sse.on('PrReviewRerequested', async (data) => {
    await loadAddressing();
    render();
    if (data?.ok === false) {
      lucidos.ui.toast(data?.summary || 'Failed to re-request review',
        'warning', { key: 'reask' });
    } else if (data?.reviewers?.length) {
      lucidos.ui.toast(data?.summary || 'Re-requested review', 'success',
        { key: 'reask' });
    }
    /* The re-request changes the PR's own state — mine.py's `rerequest` lane
     * exists precisely for reviewers who were never re-asked, and that is no
     * longer true of this PR. Without this the card keeps the yellow strand
     * until the next sweep. */
    try {
      await lucidos.events.emit('PrStatusRefreshRequested', {
        summary: 'Re-read PR status after reviewers were re-asked',
        source: 'review-cockpit',
      });
    } catch (err) { /* the hourly sweep will catch up */ }
  });
  /* The Ask rail's only lifecycle event: the coding agent is up. The tab that
   * asked navigates straight into it — a question you just typed should land you
   * in the answer, not in a toast you have to go looking for. Every OTHER open
   * tab matches no `client_ref` and stays put, which is the whole reason the id
   * is minted at click time rather than derived from the PR. */
  lucidos.sse.on('ReviewQuestionThreadStarted', async (data) => {
    const mine = ASKING && data?.client_ref && data.client_ref === ASKING.ref;
    if (!mine) return;
    ASKING = null;
    render();
    if (!data.thread_id && data.sc_worktree) {
      lucidos.ui.toast(`Agent started in an external worktree (${data.sc_worktree})`,
        'success', { key: 'ask' });
      return;
    }
    if (!data.thread_id) {
      /* Spawned, but the CLI's link didn't parse — the session is real and
       * running, so this is a navigation failure, not a spawn failure. Say
       * exactly that rather than implying nothing happened. */
      lucidos.ui.toast('The agent started, but I couldn\'t link the thread — it\'s in your thread list',
        'warning', { key: 'ask' });
      return;
    }
    lucidos.ui.dismissToast('ask');
    await lucidos.ui.navigate('thread', { id: data.thread_id });
  });
  /* The stranded-worktree verdict arrives a beat after Finished — the checker is
   * its own trigger, and it fetches before it can answer. Silent: the card grows
   * the verdict in place, and a toast about a directory the user may not have
   * open is noise on top of the resolver's own toast. */
  lucidos.sse.on('PrWorktreeStrandVerified', async () => {
    await loadStranded();
    render();
  });

  /* ---- the pr-* skill rails ----
   *
   * A payload can reach a handler as the payload itself or wrapped in one, so
   * every handler reads `data.payload || data`. */
  const skillPayload = data => data?.payload || data || {};

  /* A pr-* pass finished for some head. Re-list the files (a board row may
   * now have a way to its panels) and, when it is the head on screen, re-read
   * them — this is the only event that says they exist — letting the `missing`
   * list turn absent panels into a quiet "not produced". Silent: the panels
   * appearing is the news. */
  lucidos.sse.on('PrPrepSkillsProduced', async (data) => {
    const p = skillPayload(data);
    await loadSkillEvents();
    await loadSkillIndex();
    const h = currentSkillHead();
    if (h && `${p.repo_slug}-${p.pr}-${String(p.sha || p.head_sha || '').slice(0, 7)}` === h.base) {
      await loadSkillDocs(h);
    }
    render();
  });

  /* A grade came back — or failed, with `error` and no file. Either way the
   * wait on that depth ends: the section re-reads its graded file and
   * re-draws alone, and the tab that sent the answers hears which it was. */
  lucidos.sse.on('PrCheckGraded', async (data) => {
    const p = skillPayload(data);
    await loadSkillEvents();
    const h = currentSkillHead();
    const depths = p.depth === 'quiz' || p.depth === 'teachback' ? [p.depth] : ['quiz', 'teachback'];
    if (h && headKey(h.repo, h.number, h.sha7) === headKey(p.repo, p.pr, p.sha)) {
      const P = skillPaths(h);
      for (const d of depths) {
        SKILL_DOCS.set(P[d], await readSkillDoc(P[d], d, h.sha7));
        patchSkillSection(sectionFor(d));
      }
    }
    for (const d of depths) {
      const k = `${headKey(p.repo, p.pr, p.sha)}:${d}`;
      if (!CHECK_ASKED.delete(k)) continue;
      const what = d === 'quiz' ? 'Quiz' : 'Teach-back';
      if (p.error) {
        lucidos.ui.toast(`${what} not graded — ${String(p.error).slice(0, 140)}`, 'warning',
          { key: 'check', durationMs: 8000 });
      } else {
        lucidos.ui.toast(`${what} graded${p.stale ? ' (stale — the PR moved)' : ''} on ${shortRepo(p.repo)}#${p.pr}`,
          'info', { key: 'check' });
      }
    }
  });

  /* Asks from this tab or another device: the section learns about them from
   * the log, so a second device shows "grading" too instead of an open form. */
  lucidos.sse.on('PrCheckAnswersSubmitted', async (data) => {
    await loadSkillEvents();
    const p = skillPayload(data);
    if (p.depth === 'quiz' || p.depth === 'teachback') patchSkillSection(sectionFor(p.depth));
  });
  lucidos.sse.on('PrDrillRequested', async () => {
    await loadSkillEvents();
    patchSkillSection('pp-drill');
  });

  /* The drill's thread is up — or it failed, with `thread_id: null` and an
   * `error`. The tab that asked opens the thread straight away, the way Ask
   * does; every other tab only updates its section. "Asked by this tab" is
   * matched on the echoed client_ref when the rail sends one, else on the PR
   * and head, else — for a payload naming neither — on this tab having an ask
   * in flight at all. */
  lucidos.sse.on('PrDrillStarted', async (data) => {
    const p = skillPayload(data);
    const ask = DRILL_ASK;
    const mine = !!ask && (
      (p.client_ref && p.client_ref === ask.ref)
      || (!p.client_ref && p.repo && String(p.pr) === ask.pr
          && bareRepo(p.repo).toLowerCase() === ask.repo && (!p.sha || String(p.sha).startsWith(ask.sha7)))
      || (!p.client_ref && !p.repo && Date.now() - ask.t < DRILL_TTL_MIN * 60000));
    if (mine) {
      DRILL_ASK = null;
      DRILL_SEEN.set(ask.key, { at: new Date().toISOString(), thread_id: p.thread_id || null,
        error: p.thread_id ? null : String(p.error || 'the rail started no thread') });
    }
    await loadSkillEvents();
    patchSkillSection('pp-drill');
    if (!mine) return;
    if (p.thread_id) {
      lucidos.ui.dismissToast('drill');
      await lucidos.ui.navigate('thread', { id: p.thread_id });
    } else {
      lucidos.ui.toast(`The drill didn't start — ${String(p.error || 'no thread came back').slice(0, 140)}`,
        'warning', { key: 'drill', durationMs: 8000 });
    }
  });

  /* A merge became cards in the store, so a recall hit on screen may now have
   * files to name. Emitted with zero cards too, which re-reads for nothing. */
  lucidos.sse.on('PrRecallCardsCreated', async () => {
    const h = currentSkillHead();
    const lanes = h && skillRead(h, 'lanes')?.doc;
    if (!lanes) { RECALL_CARDS = null; return; }
    await loadRecallCards();
    render();
  });

  /* The diagram's colours follow the theme by themselves (CSS variables), but
   * its layout was measured in a font: a font or UI-scale change, both set on
   * <html>'s style, lays it out again, and so does a web font finishing its
   * load. drawDiagram skips a box whose width and font did not move, so a
   * colour-only change costs nothing. */
  new MutationObserver(hydrateDiagrams)
    .observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
  document.fonts?.addEventListener('loadingdone', () => {
    root.querySelectorAll('[data-diagram][data-drawn]').forEach(el => delete el.dataset.drawn);
    hydrateDiagrams();
  });

  /* The grade and drill waits tick in place; see tickSkillPanels. */
  setInterval(tickSkillPanels, 30000);

  /* A running review is the one thing on this board that changes with no event
   * to announce it: nothing is emitted between the request and the findings ~40
   * minutes later, so without a clock the elapsed time freezes at whatever it
   * said when the page last painted — and a frozen counter is exactly what makes
   * a running job look like a stuck one. Once a minute, and only while something
   * is actually in flight on the page that shows it: no timer runs on an idle
   * board.
   *
   * It also re-reads the event log every fifth tick, which is the safety net for
   * a missed SSE frame — a findings event that never reached this tab would
   * otherwise leave the card claiming a review is running for the full 3-hour
   * TTL. */
  let ticks = 0;
  setInterval(async () => {
    if (!PREPPING.size || view.page !== 'today') return;
    if (++ticks % 5 === 0) await loadPrepping();
    render();
  }, 60000);

  /* THE TIMER ABOVE COVERS ONE CARD; THIS COVERS THE BOARD. Every load on this
   * page is event-driven, which quietly assumes the SSE stream is still live —
   * and it is not, across a laptop sleep, a network switch, or a tab left open
   * overnight. Nothing announces a lapsed stream: `sse.on` keeps its listeners,
   * no error is thrown, the frames just stop, and the board goes on displaying
   * a reading from whenever the last one arrived. That is what made Refresh warn
   * about an unreachable GitHub on 2026-09-09 while its own artifact on disk was
   * two minutes old.
   *
   * So re-read on resume, which is when the gap is both most likely and cheapest
   * to close: three artifact reads, no GitHub call, no trigger fire. Silent by
   * design — the rows changing IS the notification, and a toast on every tab
   * focus would be unbearable. `visibilitychange` catches the tab coming back,
   * `pageshow` the bfcache restore that fires no visibility change at all. */
  let resumeAt = 0;
  const onResume = async () => {
    if (document.hidden || BOOTING) return;
    /* A focus storm (click into the frame, alt-tab, a modal closing) is one
     * resume, not five. */
    if (Date.now() - resumeAt < 30000) return;
    resumeAt = Date.now();
    try {
      await loadMine();
      await loadShipped();
      await loadQueue();
      await loadPrepping();
      await loadSkillEvents();
      await loadSkillIndex();
      /* The skill files carry no event of their own besides the pass's, so a
       * PR page re-reads them on resume like it does on open. */
      skillVisit = null;
      render();
    } catch (e) {
      /* Offline or mid-write. The next resume tries again, and the freshness
       * stamp in the header is already telling the truth about how old this is. */
    }
  };
  document.addEventListener('visibilitychange', onResume);
  window.addEventListener('pageshow', onResume);
})();
    </script>
  </body>
</html>
