    open ? railNoticeHtml(label) + rows.map(rowHtml).join('') : ''}`;
}

/* A rail that could not be reached is attributed where the rows would have
 * been, not only in a banner at the top of the page — the sub-group that is
 * short is the one that has to say so. */
function railNoticeHtml(label) {
  if (label !== 'Reviews') return '';
  const rails = QUEUE?.rails_failed || [];
  if (!rails.length) return '';
  const mine = rails.filter(r => view.ws === 'all' || r === view.ws || r.includes(view.ws));
  if (!mine.length) return '';
  /* The workspace's own label, not the raw rail id — the panel above already
   * names it that way, and one outage described two ways reads as two. */
  const named = mine.map(r => (WORKSPACES.find(w => w.id === r || w.org === r) || {}).label || r);
  return `<p class="row-notice">Couldn't read the ${esc(named.join(' and '))} review
    ${named.length === 1 ? 'rail' : 'rails'} on the last sweep — anything queued there is
    missing from this list.</p>`;
}

/* The header of every collapsible band — the board's and the findings page's —
 * so the two pages cannot drift apart.
 *
 * The toggle sits INSIDE the heading, not the other way round. A heading
 * nested in a button is not reliably exposed as a heading, which would take
 * the band out of a screen reader's heading list — the one navigation aid a
 * banded page most depends on. Chevron, title, then the count: on a collapsed
 * band the count is the only fact about the contents, so it sits right beside
 * the name it counts. */
function bandHeadHtml({ band, id, title, count, why, open, level = 2 }) {
  return `<div class="band-head">
      <h${level} class="band-h" id="band-${id}-h">
        <button type="button" class="band-toggle" data-band="${band}"
          aria-expanded="${open}" aria-controls="band-${id}-body">
          ${CHEV}<span class="band-title">${esc(title)}</span>${count}
        </button>
      </h${level}>
      ${why ? `<span class="band-why">${esc(why)}</span>` : ''}
    </div>`;
}

/* ---------- a collapsible band ----------
 *
 * Zero rows renders NOTHING — not a header, not a count, not an empty state. A
 * band header over an absence is an orphan the eye and a screen reader both
 * have to walk past. */
function bandHtml(key, rows, trusted) {
  if (!rows.length) return '';
  const m = BAND_META[key];
  const open = !COLLAPSED.has(key) || !!QUERY;
  return `<section class="band band-${key}" aria-labelledby="band-${key}-h">
    ${bandHeadHtml({ band: key, id: key, title: m.title,
      count: bandCountHtml(rows.length, trusted), why: m.why, open })}
    <div class="band-body" id="band-${key}-body"${open ? '' : ' hidden'}>
      <div class="rows">${rows.map(rowHtml).join('')}</div>
    </div>
  </section>`;
}

function briefBandHtml(rows) {
  if (!rows.length) return '';
  const key = 'briefs';
  const open = !COLLAPSED.has(key) || !!QUERY;
  return `<section class="band band-briefs" aria-labelledby="band-briefs-h">
    ${bandHeadHtml({ band: key, id: key, title: BAND_META.briefs.title,
      count: `<span class="band-n ctr">${rows.length}</span>`, why: briefBandWhy(view.ws), open })}
    <div class="band-body" id="band-briefs-body"${open ? '' : ' hidden'}>
      <div class="rows">${rows.map(briefRowHtml).join('')}</div>
    </div>
  </section>`;
}

/* The rail means something different per tab, because the gate does. Without a
 * review rail every teammate's merge qualifies — there is no review culture to
 * subtract. With one, this is specifically the leftovers: the merges the prep
 * rail never saw. */
function briefBandWhy(wsId) {
  if (wsMeta(wsId).rail) return 'Merged without your review in the last 7 days';
  return 'Merged in the last 7 days — no decision needed';
}

/* ---------- shipped by me, as a row ----------
 *
 * Same two-line anatomy as everything else, and no drawer: a brief row opens
 * because it holds prose you have not read, and this one holds nothing you do
 * not already know. Its signal slot carries `Merged` where a live row carries
 * its signals: the one word that says this row is finished, not waiting.
 *
 * THE ONE FACT WORTH SURFACING is whether anyone else looked before it landed.
 * Where the lane is on that is often nobody, by agreement, so it is stated plainly
 * rather than warned about — this is a record, not a lint. */
function shippedRowHtml(p) {
  const at = Date.parse(p.merged_at || '') || 0;
  const who = p.reviewed_by || [];
  const sub = [
    `<span class="sub-repo">${esc(p.repo)}</span>`,
    `<span class="sub-diff"><span class="add">+${esc(p.additions || 0)}</span>
      <span class="del">−${esc(p.deletions || 0)}</span></span>`,
    who.length
      ? `<span class="sub-who">reviewed by <span class="who-one">${
        avatarHtml(who[0])}${esc(who[0])}</span>${
        who.length > 1 ? esc(` +${who.length - 1}`) : ''}</span>`
      : `<span class="sub-who">no review</span>`,
    ageHtml(at, 'merged'),
  ];
  return `<div class="row" data-row="ship:${esc(p.repo)}#${esc(p.number)}">
    <div class="row-line">
      ${rowIconHtml('muted', 'merge')}
      <div class="row-head">
        <a class="row-title" href="${esc(p.url)}" target="${LINK_TARGET}"
          rel="noopener"${openAttrs(p)}>
          <span class="row-name">${esc(p.title)}</span>
          <span class="row-num">#${esc(p.number)}</span>
        </a>
      </div>
      <span class="row-sig"><span class="badge badge-quiet">Merged</span></span>
    </div>
    <div class="row-sub">${sub.join(SUB_DOT)}</div>
  </div>`;
}

function shippedBandHtml(rows) {
  if (!rows.length) return '';
  const key = 'shipped';
  const open = !COLLAPSED.has(key) || !!QUERY;
  /* The subtitle counts the unreviewed ones rather than repeating the row
   * count the header already carries. Where the lane is on, that number is
   * often the whole band — and saying so plainly is the
   * point: it is the same fact `Shipped without me` opens with, from the other
   * side. */
  const solo = rows.filter(p => !(p.reviewed_by || []).length).length;
  const why = solo === rows.length
    ? `Merged in the last 7 days — none reviewed by anyone else`
    : solo
      ? `Merged in the last 7 days — ${solo} with no review`
      : `Merged in the last 7 days — all reviewed`;
  return `<section class="band band-shipped" aria-labelledby="band-shipped-h">
    ${bandHeadHtml({ band: key, id: key, title: BAND_META.shipped.title,
      count: `<span class="band-n ctr">${rows.length}</span>`, why, open })}
    <div class="band-body" id="band-shipped-body"${open ? '' : ' hidden'}>
      <div class="rows">${rows.map(shippedRowHtml).join('')}</div>
    </div>
  </section>`;
}

/* A count we could not compute is HIDDEN behind an em dash with a tooltip
 * naming the reason. Never `0`, never `N/A`, never blank: a zero we invented
 * reads exactly like a zero we measured, and the whole failure this fixes is a
 * board that looks calm and is wrong. */
function bandCountHtml(n, trusted) {
  if (!trusted) {
    return `<span class="band-n ctr band-n-unknown"
      title="A source failed on the last sweep, so this count would be short. See the notice above.">—</span>`;
  }
  /* Zero renders nothing rather than `0`. Only `Your turn` can reach this at
   * zero (the other bands don't render at all), and it already states its own
   * emptiness in a sentence underneath — a `0` beside it is the same fact in a
   * form that still draws the eye as if it were a quantity. */
  return n ? `<span class="band-n ctr">${n}</span>` : '';
}

/* ---------- one row, everywhere ----------
 *
 *   [◌] Title of the pull request #852 (Answer comments)   Review required ✓ 💬 3
 *       acme-corp/storefront · waiting on ◉ sam-lee · updated 3d ago · ⎇ fix/branch
 *
 * A GitHub PR-list row. TWO ANATOMIES BECAME ONE: `.card` and `.thin-row`
 * disagreed about field order and about where status sat, so you could not scan
 * one column down the page. Everything here is in a fixed slot: the icon leads,
 * the title is the only fluid element, the signals to its right are always in
 * the same order, and the meta line is always repo · who · age · branch.
 *
 * ONE REASON LABEL. The coloured chip after the title says why the PR is on
 * you, and where an action exists it IS the control — `Fix conflicts` is a
 * button that rebases, `Review` opens the findings. A label naming a thing and
 * a button doing it two inches apart would be the same fact twice. Conflicts
 * fold into that label rather than being badged again beside it.
 *
 * SIGNALS ARE FACTS, NOT REASONS. Review state, CI and the open-thread count
 * sit right-aligned in fixed slots, the way GitHub's list carries CI and the
 * comment count — present whether or not they are why the row is here. The CI
 * and comment slots hold their width even when empty, so the icons line up
 * down a box. Prep is the review rows' signal, in the same place.
 *
 * The `.row` itself is `tabindex="-1"`: it takes focus programmatically when its
 * drawer opens, deliberately OUT of the tab order so Tab still walks the real
 * controls inside it. The title is the disclosure button, so a pointer user
 * opens the row by clicking the thing they were already reading. */
/* `row.id` is a readable key (`mine:acme-corp/storefront#860`) and stays that way
 * in `data-row`, because that is what the click handlers look rows up by. The
 * DOM id it points `aria-controls` at is slugged:
 * `#` and `/` are legal in an HTML5 id but they are a minefield in every
 * selector that touches one. */
function domId(prefix, key) { return `${prefix}-${String(key).replace(/[^\w-]+/g, '_')}`; }

/* The row's state icon: `git-pull-request` by default, `git-pull-request-draft`
 * on a draft, `git-merge` on a row that has already merged — tinted by the
 * row's tone. `aria-hidden`: the badge beside it says the state in words, and a
 * screen reader on a board of pull requests does not need to be told sixty
 * times that a pull request is a pull request. */
function rowIconHtml(tone, kind = 'pr') {
  return `<span class="row-ic tone-${tone}" aria-hidden="true">${oi(kind)}</span>`;
}

function rowHtml(row) {
  const open = OPEN_ROWS.has(row.id);
  const did = domId('d', row.id);
  /* Both slots are emitted only when they hold something. An empty wrapper
   * would still claim a line in the phone layout; with neither, a waiting row
   * is exactly its title and its meta line. */
  const reason = actionHtml(row);
  const sig = rowSignalsHtml(row);
  return `<div class="row${open ? ' open' : ''}" data-row="${esc(row.id)}" tabindex="-1">
    <div class="row-line">
      ${/* A draft is nobody's move yet, so its icon recedes a step further
          than the row's tone. */
        row.draft ? rowIconHtml('muted', 'draft')
          /* Merged from here: the merged icon until the next sweep drops the row. */
          : row.live?.merge === 'merged' ? rowIconHtml('muted', 'merge')
            : rowIconHtml(rowTone(row))}
      <div class="row-head">
        <button type="button" class="row-title" data-expand="${esc(row.id)}"
          aria-expanded="${open}" aria-controls="${did}">${appTagHtml(row.repo, workspaceOf(row))}
          <span class="row-name">${esc(row.title)}</span>
          <span class="row-num">#${esc(row.number)}</span>
        </button>
        ${reason ? `<span class="row-reason">${reason}</span>` : ''}
      </div>
      ${sig ? `<span class="row-sig">${sig}</span>` : ''}
    </div>
    <div class="row-sub">${rowSubHtml(row)}</div>
    ${open ? `<div class="row-drawer" id="${did}">${drawerHtml(row)}</div>`
      : `<div id="${did}" hidden></div>`}
  </div>`;
}

/* The right-hand signals. A review row's one signal is its prep; one of mine
 * carries review state, a conflict the label does not already name, CI and
 * the open-thread count. */
function rowSignalsHtml(row) {
  if (row.kind !== 'mine') {
    return row.prep ? `<span class="row-prep">${prepChipHtml(row.prep)}</span>` : '';
  }
  const p = row.pr;
  const conflicting = p.mergeable === 'CONFLICTING' || p.state === 'conflict';
  return [
    /* A draft, or a rebase already running, keeps its conflict visible here:
     * the label is saying something else. */
    conflicting && row.action !== 'conflicts'
      ? `<span class="lbl lbl-red">${oi('alert')}Conflicts</span>` : '',
    reviewSignalHtml(row.review),
    ciSignalHtml(p),
    threadsSignalHtml(p),
  ].join('');
}

const REVIEW_ICON = { approved: 'check', changes: 'fileDiff', required: 'dot' };

/* The review decision as an icon in its tone and a plain word — the reviewers
 * sidebar's vocabulary. Nothing when reviewLabelOf() says nothing (a stale
 * approval). */
function reviewSignalHtml(r) {
  if (!r) return '';
  return `<span class="sig sig-review"><span class="sig-ic tone-${esc(r.tone)}">${
    oi(REVIEW_ICON[r.key] || 'dot')}</span>${esc(r.label)}</span>`;
}

/* CI as GitHub's list draws it: one icon, no word — a red cross, a dot while
 * it runs, a green check once it passed. Read off `p.ci` itself for the check,
 * because ciOf() folds "passed" and "no checks" into one `ok` on purpose and
 * this slot must tell them apart: no checks draws an empty slot, never a tick
 * nobody earned. The word rides along for a screen reader and the tooltip. */
function ciSignalHtml(p) {
  const st = ciOf(p);
  const s = st !== 'ok' ? { ic: st === 'failed' ? 'x' : 'dot', ...CI_META[st] }
    : /SUCCESS|PASS/.test(String(p?.ci || '').toUpperCase())
      ? { ic: 'check', label: 'CI passed', tone: 'green' } : null;
  if (!s) return '<span class="sig sig-ci" aria-hidden="true"></span>';
  return `<span class="sig sig-ci" data-tooltip="${esc(s.label)}"><span class="sig-ic tone-${s.tone}">${
    oi(s.ic)}</span><span class="sr-only">${esc(s.label)}</span></span>`;
}

/* Unresolved review threads, counted the way mineAction() counts them so the
 * number and the `Answer comments` label can never disagree. */
function threadsSignalHtml(p) {
  const n = p.unresolved_threads || p.threads?.length || 0;
  if (!n) return '<span class="sig sig-cmt" aria-hidden="true"></span>';
  const say = `${n} unresolved review thread${n === 1 ? '' : 's'}`;
  return `<span class="sig sig-cmt" data-tooltip="${esc(say)}">${oi('comment')}<span
    aria-hidden="true">${esc(n)}</span><span class="sr-only">${esc(say)}</span></span>`;
}

/* The head branch, in code type with the branch octicon. One line at most:
 * it is the longest thing on the meta line and the least read, so it ends the
 * line and ellipsises; the full name is its tooltip. */
function branchHtml(ref) {
  return `<span class="sub-branch" title="${esc(ref)}">${oi('branch')}<code>${esc(ref)}</code></span>`;
}

/* Brief flags as GitHub labels after the title, each in its own tone. */
function flagLabelsHtml(flags) {
  return (flags || []).map(f => BRIEF_FLAGS[f]).filter(Boolean)
    .map(f => `<span class="lbl lbl-${esc(f.tone)}">${esc(f.label)}</span>`).join('');
}

/* The icon repeats the badge's tone in a fixed left column, which is what makes
 * a band scannable without reading a word. It carries no information the text
 * beside it does not, so it is `aria-hidden` — a screen reader announcing it
 * would say the state twice. Colour is never the only channel: position, the
 * icon's shape, and the badge's own words are the other three. */
function rowTone(row) {
  if (row.live) return 'live';
  const a = row.action && NEXT_ACTIONS[row.action];
  if (a) return a.tone;
  return row.turn === 'mine' ? 'accent' : 'quiet';
}

/* The label IS the button wherever an action exists. Where none does, the slot
 * carries the row's resting state when that state is worth a word, and is
 * otherwise empty (see restingBadgeHtml) — never more than one badge. */
/* The octicon a reason label leads with, per next action — a second channel
 * beside the colour, and the shape you learn to spot down a box. Decoration:
 * oi() marks it `aria-hidden`, and the label's words carry the meaning. */
const ACTION_ICON = {
  conflicts: 'alert', ci: 'x', comments: 'comment', review: 'eye', rereview: 'eye',
  merge: 'merge', mergeunreviewed: 'merge', rerequest: 'sync', findreviewer: 'personAdd', nudge: 'bell',
};

function labelBody(action, label) {
  const ic = ACTION_ICON[action];
  return `${ic ? oi(ic) : ''}${esc(label)}`;
}

function actionHtml(row) {
  if (row.live) {
    /* Merged is done, not running: a quiet word, no pulsing dot. */
    return row.live.merge === 'merged' ? `<span class="badge badge-quiet">${esc(row.live.label)}</span>`
      : `<span class="badge badge-live">${esc(row.live.label)}</span>`;
  }
  const a = row.action && NEXT_ACTIONS[row.action];
  if (!a) return restingBadgeHtml(row);
  /* Merge is the one solid button on the page, in the shared confirm green. */
  const cls = `badge badge-${a.tone}${row.action === 'merge' ? ' action-btn-confirm' : ''}`;
  const p = row.pr;

  if (row.action === 'conflicts') {
    /* A fork's head cannot be rebased from here — the label stays, the button
     * does not. A control that can never fire is worse than no control. */
    if (row.kind === 'mine' && canResolve(p) && !p.cross_repo) {
      const merge = conflictStyle(p) === 'merge';
      return `<button type="button" class="${cls}" data-resolve="${esc(resolveKey(p))}"
        title="${merge
          ? `Spawn a coding agent that merges ${esc(p.base_ref)} into ${esc(p.head_ref)}, resolves the conflicts, verifies, and pushes.`
          : `Spawn a coding agent that rebases ${esc(p.head_ref)} onto ${esc(p.base_ref)}, resolves the conflicts, verifies, and force-pushes with lease.`}">${labelBody(row.action, a.label)}</button>`;
    }
    return `<span class="${cls}">${labelBody(row.action, a.label)}</span>`;
  }

  if (row.action === 'comments') {
    /* Reading them is the action; the agent that answers them lives one row
     * down in the drawer, where its cost is spelled out. */
    return `<button type="button" class="${cls}"
      data-comments="${esc(`${p.repo}#${p.number}`)}"
      title="Read every open thread in full, then answer — or hand them to an agent from the row.">${labelBody(row.action, a.label)}</button>`;
  }

  if (row.action === 'review' || row.action === 'rereview') {
    if (row.entry) {
      return `<button type="button" class="${cls}" data-open="findings"
        data-key="${esc(row.entry.key)}"
        title="Open the prepped findings for this head">${labelBody(row.action, a.label)}</button>`;
    }
    return ghBadge(row, cls, a.label, 'files', 'Read the diff on GitHub — the rail has not prepped this head');
  }

  if (row.action === 'ci') {
    return ghBadge(row, cls, a.label, 'checks', 'Open the failing checks on GitHub');
  }
  if (row.action === 'merge') {
    /* A workspace with `inAppMerge` merges from the row itself — a <button>,
     * since it opens nothing (see requestMerge). Every other workspace keeps
     * the link to the PR on GitHub. */
    if (wsMeta(workspaceOf(p)).inAppMerge) {
      return `<button type="button" class="${cls}" data-merge="${esc(resolveKey(p))}"
        title="Squash-merge into ${esc(p.base_ref || 'main')} from here. Checks GitHub first.">${labelBody(row.action, a.label)}</button>`;
    }
    return ghBadge(row, cls, a.label, '', 'Green and mergeable — merge it on GitHub');
  }
  if (row.action === 'rerequest') {
    const who = (p.stale_reviewers || []).map(s => s.login).join(', ');
    return ghBadge(row, cls, a.label, '',
      `${who || 'A reviewer'} reviewed an earlier head and was never re-asked — GitHub does not re-request on a push`);
  }
  if (row.action === 'mergeunreviewed') {
    /* Same merge path as an approved PR, but an outlined caution badge rather
     * than the solid green: nobody signed off, and the button should look it. */
    if (wsMeta(workspaceOf(p)).inAppMerge) {
      return `<button type="button" class="${cls}" data-merge="${esc(resolveKey(p))}"
        title="Nobody was asked to review. Squash-merge into ${esc(p.base_ref || 'main')} without review — checks GitHub first.">${labelBody(row.action, a.label)}</button>`;
    }
    return ghBadge(row, cls, a.label, '', 'Nobody was asked to review — merge it on GitHub without review');
  }
  if (row.action === 'findreviewer') {
    return ghBadge(row, cls, a.label, '',
      'Open, and not one person has been asked — this is not moving until you name someone');
  }
  if (row.action === 'nudge') {
    const days = Math.round(ageDaysOf(p));
    return ghBadge(row, cls, a.label, '',
      `No activity for ${days} days — open it and ask`);
  }
  return `<span class="${cls}">${labelBody(row.action, a.label)}</span>`;
}

/* Every badge that resolves to "go and do it on GitHub" goes through here, so
 * they all route through the native opener the same way the card links do. */
function ghBadge(row, cls, label, suffix, tip) {
  if (!row.url) return `<span class="${cls}">${labelBody(row.action, label)}</span>`;
  const href = suffix ? `${row.url}/${suffix}` : row.url;
  return `<a class="${cls}" href="${esc(href)}" target="${LINK_TARGET}" rel="noopener"
    ${openAttrs(row.pr)} title="${esc(tip)}">${labelBody(row.action, label)}</a>`;
}

/* No action to take is sometimes still worth a word, and only these earn one:
 * a draft of mine, and on someone else's PR the request or verdict that is
 * mine — Unassigned, Approved, Changes requested, Answered — which that row's
 * meta line does not carry. Everything else leaves the slot EMPTY. When nothing
 * is wrong and nobody needs me, the band title ("Waiting on others") and the
 * meta line ("waiting on sam-lee") already say where the PR stands; and the
 * review state of one of MY PRs (Approved, Changes requested, Review required)
 * is already a signal on the right, in its tone (see reviewSignalHtml). A label
 * here would only repeat either. Where a label does show, it says its state in
 * words, never by colour alone. */
function restingBadgeHtml(row) {
  if (row.draft) return `<span class="badge badge-quiet">Draft</span>`;
  if (row.kind === 'review') {
    const s = row.q.my_review;
    if (row.q.assigned === false) return `<span class="badge badge-quiet">Unassigned</span>`;
    if (s?.kind === 'review' && s.state === 'approved') {
      return `<span class="badge badge-green">Approved</span>`;
    }
    if (s?.state === 'changes_requested') {
      /* Same tone rule as reviewLabelOf(): yellow, because red belongs to the
       * blocking next actions. Two paths render this same string, so they have
       * to agree or the board changes colour depending on whose PR it is. */
      return `<span class="badge badge-yellow badge-changes">Changes requested</span>`;
    }
    if (s) return `<span class="badge badge-quiet">Answered</span>`;
    return '';
  }
  return '';
}

/* Prep is muted and in its own slot, so it never competes with the reason
 * label. Findings read as GitHub's checklist icon and a Counter. `Prepping`
 * is the one state that names something happening rather than a fact on disk,
 * so it gets the live dot the rest do not. */
function prepChipHtml(p) {
  const body = p.key === 'ready'
    ? `${oi('checklist')}Issues<span class="ctr">${esc(p.n)}</span>` : esc(p.label);
  return `<span class="prep prep-${esc(p.key)}${p.live ? ' prep-live-dot' : ''}"${
    p.say ? ` title="${esc(p.say)}"` : ''}>${body}</span>`;
}

/* How long ago, on the meta line after a verb: "updated 3h ago". Past a week
 * it crosses over to an absolute date, because "43d" is a number you have to
 * do arithmetic on. Tabular figures, or it jitters as it ticks. */
function ageHtml(ms, verb) {
  if (!ms) return `<span class="sub-age" title="No timestamp on this row">${esc(verb)} —</span>`;
  const min = Math.max(0, Math.round((Date.now() - ms) / 60000));
  const h = Math.round(min / 60);
  const d = Math.round(h / 24);
  const token = min < 60 ? `${min}m ago`
    : h < 24 ? `${h}h ago`
      : d <= 7 ? `${d}d ago`
        : new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' });
  return `<span class="sub-age">${esc(verb)} <time datetime="${esc(new Date(ms).toISOString())}"
    title="${esc(new Date(ms).toLocaleString())}">${esc(token)}</time></span>`;
}

/* Line two carries provenance without a chip: `owner/repo` is what lets the
 * `All` view span three orgs with no per-row org badge. Then the facts that are
 * true of this row and nothing else — diff size, who holds it, when it last
 * moved, and the branch. CI and review state are signals now (see
 * rowSignalsHtml), so this line stays plain muted text.
 *
 * AVATARS, since 2026-09-08. This used to say avatars were impossible because a
 * guessed GitHub path "would be a fabricated endpoint that 404s on a private
 * org". That was wrong: `github.com/<login>.png` is a real unauthenticated
 * endpoint that 302s to the avatar CDN, and it addresses the USER, so the org
 * being private never came into it. The face is cached into the workspace by
 * mine.py and rendered same-origin — see avatarHtml(). It sits BESIDE the name,
 * never instead of it: this board is one author on nearly every row, so the
 * face is a constant and the text is what actually distinguishes the rows. */
function rowSubHtml(row) {
  /* `owner/repo` is provenance for the ALL view, where three orgs interleave and
   * the row has no other way to say where it came from. On a single-workspace
   * tab the header has already named the org, so printing the identical
   * `acme-corp/storefront` on all six rows adds a column of noise to the one line
   * that also carries the diff and who is holding it. */
  const bits = [];
  if (view.ws === 'all' && !isAppTagged(workspaceOf(row))) bits.push(`<span class="sub-repo">${esc(row.repo)}</span>`);
  if (row.diff) {
    bits.push(`<span class="sub-diff"><span class="add">+${esc(row.diff.add)}</span>
      <span class="del">−${esc(row.diff.del)}</span></span>`);
  }
  if (row.who?.length) {
    const shown = whoFacesHtml(row.who.slice(0, 3));
    const more = row.who.length > 3 ? ` +${row.who.length - 3}` : '';
    bits.push(`<span class="sub-who">${esc(row.whoLabel)} ${shown}${esc(more)}</span>`);
  }
  bits.push(ageHtml(row.at, 'updated'));
  /* Last, because it is the longest and least read: it ellipsises rather than
   * pushing the rest onto a second line. Review rows carry no branch. */
  if (row.kind === 'mine' && row.pr.head_ref) bits.push(branchHtml(row.pr.head_ref));
  return bits.join(SUB_DOT);
}

/* ---------- the drawer ----------
 *
 * The row is the scan surface; this is where the work happens. Every action the
 * eight-lane board carried still lives here, unchanged and in the same code:
 * rebase / merge-in, the comment agent, the thread list, prep and re-prep,
 * Findings, and the way out to GitHub. On a queue card Re-prep now lives in the
 * ⋯ menu that ends the strip (queueMenuHtml), not in the row; on a card of mine
 * the panels do (mineMenuHtml). Both menus also carry `Discuss this PR…`. */
function drawerHtml(row) {
  if (row.kind === 'mine') {
    const p = row.pr;
    return `<div class="drawer-meta">
        <span class="drawer-reason">${esc(p.reason || '')}</span>
        <span><code>${esc(p.sha7)}</code></span>
        <span><code>${esc(p.head_ref || '')}</code> → <code>${esc(p.base_ref || '')}</code></span>
        ${p.approvals?.length ? `<span>✓ ${esc(p.approvals.join(', '))}</span>` : ''}
      </div>
      ${threadsHtml(p)}
      ${resolveRowHtml(p, mineMenuHtml(row))}`;
  }
  const src = { id: row.id, q: row.q, entry: row.entry, prep: row.prepState, action: row.action };
  const run = row.entry?.current?.run;
  const pr = row.entry ? progress(row.entry) : null;
  /* The folded split is the headline; the record's own counts stay one hover
   * away, because "28 confirmed" is still true, just not the size of the work. */
  const c = run?.counts;
  const record = c ? `As recorded: ${c.total} findings, ${c.confirmed || 0} confirmed, ${c.refuted || 0} refuted` : '';
  return `<div class="drawer-meta">
      ${row.said || ''}
      <span><code>${esc(row.q.sha7)}</code></span>
      ${run
    ? `<span${record ? ` title="${esc(record)}"` : ''}>${esc(tallyText(tallyFor(row.entry.current)))}</span>`
    : `<span class="muted">No findings — the rail hasn't reviewed this head</span>`}
      ${pr?.picked ? `<span>${esc(pr.picked)} of ${esc(pr.total)} picked</span>` : ''}
    </div>
    <div class="card-act">${prepBitsHtml(src)}${viewBtnsHtml(src)}${row.entry ? '' : skillsBtnHtml(row)}${
    openPrHtml({ ...row.q, repo: row.q.repo_name || row.q.repo })}${queueMenuHtml(src)}</div>`;
}

/* ---------- shipped without me, as a row ----------
 *
 * Same two-line anatomy as everything else — the whole point of one row shape is
 * that the reading rail does not get to be a fourth thing. `Read brief` is its
 * next action and expands the brief in place: the brief IS the content, and
 * bouncing to GitHub to read a diff is exactly what it exists to save. It is a
 * grey text link wired to the same toggle as the title, and it stays out of the
 * tab order so the keyboard meets that toggle once, on the title. */
function briefMatchesQuery(b) {
  if (!QUERY) return true;
  const q = QUERY.toLowerCase();
  return `${b.title} ${b.repo} #${b.pr} ${b.author || ''}`.toLowerCase().includes(q);
}

/* Brief body. Since 2026-09-27 the writer emits a structured brief — `tldr`
 * (one line), `changes` (2-4 fragments), `open` (what's not done yet) — because
 * the paragraph form was a PR body rewritten, not a brief. Older entries carry
 * only the `brief` paragraph and fall back to it. See knowhow/merge-briefs.md. */
function briefBodyHtml(b) {
  const changes = Array.isArray(b.changes) ? b.changes.filter(Boolean) : [];
  const open = Array.isArray(b.open) ? b.open.filter(Boolean) : [];
  if (!b.tldr && !changes.length) return `<p class="brief-text">${esc(b.brief || '')}</p>`;
  return `<div class="brief-body">
    ${b.tldr ? `<p class="brief-tldr">${esc(b.tldr)}</p>` : ''}
    ${changes.length ? `<ul class="brief-list">${changes.map(c =>
      `<li><span class="brief-mark" aria-hidden="true">✓</span>${esc(c)}</li>`).join('')}</ul>` : ''}
    ${open.length ? `<div class="brief-open-h">Still open</div>
      <ul class="brief-list brief-open">${open.map(c =>
      `<li><span class="brief-mark" aria-hidden="true">☐</span>${esc(c)}</li>`).join('')}</ul>` : ''}
  </div>`;
}

function briefRowHtml(b) {
  const k = `${b.repo}#${b.pr}`;
  const bid = domId('b', k);
  const open = OPEN_BRIEFS.has(k);
  const at = Date.parse(b.merged_at || '') || 0;
  /* The flags (billing, schema, breaking…) are what GitHub would hang on the PR
   * as labels, so they sit after the title as labels, each in its own tone. */
  const flags = flagLabelsHtml(b.flags);
  const sub = [
    isAppTagged(railOfBrief(b)) ? '' : `<span class="sub-repo">${esc(b.repo)}</span>`,
    `<span class="sub-diff"><span class="add">+${esc(b.additions || 0)}</span>
      <span class="del">−${esc(b.deletions || 0)}</span></span>`,
    b.author ? `<span class="sub-who">by <span class="who-one">${avatarHtml(b.author)}${
      esc(b.author)}</span></span>` : '',
    ageHtml(at, 'merged'),
  ].filter(Boolean);
  return `<div class="row${open ? ' open' : ''}" data-row="brief:${esc(k)}" tabindex="-1">
    <div class="row-line">
      ${rowIconHtml('muted', 'merge')}
      <div class="row-head">
        <button type="button" class="row-title" data-brief="${esc(k)}"
          aria-expanded="${open}" aria-controls="${bid}">${appTagHtml(b.repo, railOfBrief(b))}
          <span class="row-name">${esc(b.title)}</span>
          <span class="row-num">#${esc(b.pr)}</span>
        </button>
        ${flags ? `<span class="row-reason">${flags}</span>` : ''}
      </div>
      <span class="row-sig"><button type="button" class="linkish" data-brief="${esc(k)}"
        aria-expanded="${open}" aria-controls="${bid}" tabindex="-1">Read brief</button></span>
    </div>
    <div class="row-sub">${sub.join(SUB_DOT)}</div>
    ${open ? `<div class="row-drawer" id="${bid}">
      ${briefBodyHtml(b)}
      <div class="card-act">
        <a class="btn-inline btn-open" href="${esc(b.url)}" target="${LINK_TARGET}"
           rel="noopener"${openAttrs(b)}>Open on GitHub ↗</a>
      </div>
    </div>` : `<div id="${bid}" hidden></div>`}
  </div>`;
}

/* ---------- partial failure ----------
 *
 * Both artifacts have always carried the field and the UI ignored it, which is
 * this app's worst failure: an identity that fails silently produces a board
 * that looks calm and is wrong.
 *
 * NAME THE MISSING PRECONDITION. Not "failed to load" — which identity, what it
 * covers, and the action that fixes it. A lapsed identity gets a reconnect
 * prompt, never a short list.
 *
 * CAP AT FIVE. Past five outage messages the page reads broken rather than
 * degraded, so the rest collapse into one line. */
function sourceFailures() {
  const out = [];
  /* No config means no tabs, no sweeps and no rails: the one notice that matters.
   * Everything below would only restate it. */
  if (!CONFIG) {
    out.push({
      kind: 'sweep',
      head: CONFIG_ERROR === 'missing' ? "Pulls isn't set up yet" : "Pulls can't read its config",
      body: CONFIG_ERROR === 'missing'
        ? 'There is no artifacts/review-cockpit/config.json, so Pulls knows no GitHub login and '
          + 'watches no repos. Run the Pulls plugin setup to write it.'
        : `artifacts/review-cockpit/config.json is unusable: ${CONFIG_ERROR}. Fix it, or run `
          + 'the Pulls plugin setup again.',
    });
    return out;
  }
  if (!MINE) {
    out.push({
      kind: 'sweep',
      head: 'Your own PRs have never been checked',
      body: 'The status sweep has not run, so conflicts, unanswered comments and red CI '
        + 'on your PRs cannot appear here. This is an empty pipeline, not an empty board.',
    });
  } else {
    for (const who of MINE.identities_failed || []) out.push(identityFailure(who));
  }
  if (!QUEUE) {
    out.push({
      kind: 'sweep',
      head: "Couldn't read the review queue",
      body: 'Nothing has checked what is awaiting your review, so the Reviews group cannot '
        + 'tell "nobody asked" from "the sweep never ran".',
    });
  } else {
    /* A failed rail earns a panel of its own, not only the inline notice inside
     * the Reviews group — on a tab where that group has no rows the notice has
     * nowhere to render, and the outage would show up as nothing but an em dash. */
    for (const rail of QUEUE.rails_failed || []) {
      const w = WORKSPACES.find(x => x.id === rail || x.org === rail);
      out.push({
        kind: 'rail',
        head: `Couldn't reach the ${w ? w.label : rail} review rail`,
        body: 'The last sweep could not read what is queued for your review there. '
          + 'Anything waiting is missing from the Reviews group and from every count.',
      });
    }
  }
  /* A shipped query that failed while the open-PR one succeeded. Its own panel
   * because the rail is written by a SECOND query on the same sweep: without
   * this, "we couldn't ask" and "you shipped nothing this week" render
   * identically, and the second is the more comfortable lie. Reported only once
   * the artifact exists — a workspace whose sweep predates this rail has no
   * outage, it just has no file yet.
   *
   * SCOPED WITH THE LANE. Shipped by me shows only on groups that turn it on
   * (`shipped_lane`), so this panel does too: on any other tab there is no lane
   * to be short, and a "couldn't read what you shipped" notice would name an
   * outage in something that tab never shows. */
  const shipScope = view.ws === 'all' || SHIPPED_WS.has(view.ws);
  /* `identities_failed` holds IDENTITY names (the login), not workspace ids, so
   * it is matched against `who` rather than looked up as a tab. Only an identity
   * behind a group with the lane can produce an outage here. */
  for (const who of (shipScope ? SHIPPED?.identities_failed || [] : [])) {
    const ws = WORKSPACES.find(w => w.shippedLane && w.who === who
      && (view.ws === 'all' || w.id === view.ws));
    if (!ws) continue;
    out.push({
      kind: 'sweep',
      head: `Couldn't read what you shipped on ${ws.label}`,
      body: 'The last sweep could not list your merged PRs, so the Shipped by me '
        + 'rail is short or empty. Nothing else on the board is affected.',
    });
  }
  return out;
}

function identityFailure(who) {
  const w = WORKSPACES.find(x => x.who === who || x.id === who || x.org === who);
  return {
    kind: 'identity',
    who,
    head: `GitHub authorization for ${who} has lapsed`,
    body: w
      ? `${w.label} PRs are read as ${who}. Until it is reconnected they are missing from `
        + 'every band and every count on this page.'
      : 'PRs read under this identity are missing from every band and every count on this page.',
    cta: { label: `Reconnect ${who}`, who, dir: w?.ghConfigDir || null },
  };
}

/* One notice per failure, above the board, because a lapsed identity
 * affects the whole page — there is no row to attach it to when the rows are the
 * thing that went missing. Where the failure IS attributable to a region, the
 * region says so too (see railNoticeHtml). */
function degradedHtml(fails) {
  if (!fails.length) return '';
  const shown = fails.slice(0, 5);
  const rest = fails.length - shown.length;
  return shown.map(f => `<div class="degraded" role="group" aria-label="${esc(f.head)}">
      <span class="degraded-mark">${oi('alert')}</span>
      <div class="degraded-text">
        <strong>${esc(f.head)}</strong>
        <span>${esc(f.body)}</span>
      </div>
      ${f.cta ? `<button type="button" class="action-btn action-btn-secondary"
        data-reconnect="${esc(f.cta.who)}">${esc(f.cta.label)}</button>` : ''}
    </div>`).join('')
    + (rest ? `<p class="degraded-more">${rest} more source${rest === 1 ? '' : 's'
    } couldn't be read.</p>` : '');
}

/* ---------- freshness: three tiers, one slot ----------
 *
 * fresh     `Updated 3m ago`, muted. Provenance, not news.
 * stale     `Stale · last updated 14:02`, in the caution colour. The Refresh
 *           button is right beside it, so the tier does not grow a second one.
 * failed    it stops being a staleness label at all — the degraded panel above
 *           owns that story, and this says only that the reading is untrusted.
 *
 * WHICH CLOCK. The button runs both sweeps, so the honest reading is the OLDER
 * of the two: the board is only as fresh as its stalest half. */
function freshnessHtml() {
  /* NOT a fourth tier for "checking". The button one line above already has a
   * spinner and the word `Checking…`, and two indicators that touch are one
   * indicator plus noise. The slot keeps showing the reading that is still on
   * screen, which is the more useful fact while a re-read is in flight: how old
   * the numbers you are looking at actually are. */
  const ages = [mineAgeMin(), queueAgeMin()].filter(a => a != null);
  if (!ages.length) return `<span class="fresh fresh-bad">Never refreshed</span>`;

  const age = Math.max(...ages);
  const at = [MINE?.generated_at, QUEUE?.generated_at].filter(Boolean).sort()[0];
  const clock = at
    ? new Date(at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : '';
  if (MINE?.identities_failed?.length || QUEUE?.rails_failed?.length) {
    return `<span class="fresh fresh-bad"
      title="Some sources failed on the last sweep — see the notice above.">
      Last sweep was incomplete${clock ? ` · ${esc(clock)}` : ''}</span>`;
  }
  if (age > 180) {
    return `<span class="fresh fresh-warn"
      title="Oldest of the two sweeps this button runs — your PR status and the review queue.">
      Stale${clock ? ` · last updated ${esc(clock)}` : ''}</span>`;
  }
  return `<span class="fresh"
    title="Oldest of the two sweeps this button runs — your PR status and the review queue.">
    Updated ${esc(fmtAge(age))} ago</span>`;
}

/* ---------- the first load ----------
 *
 * TWO GATES, and they solve opposite problems.
 *
 * A DELAY, so a fast read never flashes. Every artifact is a local file and the
 * usual boot is well under the threshold, so the normal morning shows no
 * skeleton at all — it goes straight from nothing to the board, which is the
 * calmest possible loading state and the one Polaris and Geist both ask for
 * under a second.
 *
 * A FLOOR, so once it IS shown it cannot strobe. Without it a load that crosses
 * the delay by 40ms paints a skeleton and destroys it inside two frames, which
 * reads as a glitch rather than as progress.
 *
 * Only the FIRST paint can reach this. A refresh of data already on screen must
 * never skeleton-wipe and never blank — it keeps the stale values at full
 * opacity and swaps only what changed, which is why `BOOTING` is set once and
 * cleared once. */
const SKELETON_DELAY_MS = 500;
const SKELETON_FLOOR_MS = 500;
let BOOTING = false;
let skeletonShownAt = 0;

/* Rows sized to the real thing, and over-provisioned rather than under: it is
 * less jarring when elements shrink than when they suddenly expand. Five rows,
 * because the band that matters is the one at the top and five is more than a
 * quiet morning holds.
 *
 * Decorative throughout — `aria-hidden`, nothing focusable, no text. The live
 * region says "loading" for anyone who needs it said. */
function bootHtml() {
  const bars = [88, 64, 76, 58, 70];
  return `<header class="head"><h1>Pulls</h1></header>
    <div class="board" aria-busy="true">
      <section class="band band-turn">
        <div class="band-head"><h2 class="band-h"><span class="chev chev-none" aria-hidden="true"></span><span
          class="band-title">Your turn</span></h2></div>
        <div class="rows" aria-hidden="true">${bars.map(w => `
          <div class="skel-row">
            <span class="skel-bar skel-ic"></span>
            <span><span class="skel-bar" style="width:${w}%"></span><span class="skel-bar skel-sub"></span></span>
            <span class="skel-bar"></span>
          </div>`).join('')}
        </div>
      </section>
    </div>`;
}

/* The live region lives OUTSIDE `#root` and is written to rather than
 * re-rendered, because render() replaces the whole subtree and a status element
 * that is destroyed and rebuilt is not reliably announced. */
function announceBoard() {
  const el = document.getElementById('live');
  if (!el) return;
  const b = boardBands(view.ws);
  const n = b.mineTurn.filter(matchesQuery).length + b.reviewsTurn.filter(matchesQuery).length;
  const trusted = !sourceFailures().length;
  const txt = `${n} pull request${n === 1 ? '' : 's'} need${n === 1 ? 's' : ''} you`
    + (QUERY ? ` matching “${QUERY}”` : '')
    + (trusted ? '' : ' — some sources could not be read, so this count is incomplete');
  if (el.textContent !== txt) el.textContent = txt;
}






function fmtAge(min) {
  if (min == null) return '';
  if (min < 60) return `${min}m`;
  const h = Math.round(min / 60);
  return h < 48 ? `${h}h` : `${Math.round(h / 24)}d`;
}


/* An empty page: a sentence that states what is (or isn't) there, and the
 * factual detail under it, in a plain box. No mark, no medallion — the words
 * carry it.
 *
 * The diagnostic absences (never swept, rail unreachable, no rail) are not
 * empty pages at all: they are notices (see degradedHtml). A broken pipeline
 * dressed up as a clear day is the one failure mode this whole app exists to
 * avoid. */

/* Rotates by DAY, not per render. A line that changes while you're looking at it
 * reads as a bug; a line that never changes stops being read at all. */
function rota(lines) {
  const d = new Date();
  const day = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  return lines[day % lines.length];
}

/* `sub` is HTML — every caller escapes its own interpolations. */
function emptyLaneHtml(head, sub, quiet) {
  return `<div class="empty-lane${quiet ? ' em-quiet' : ''}">
    <span class="em-head">${head}</span>
    <span class="em-sub">${sub}</span>
  </div>`;
}




/* ---------- the comments themselves ----------
 *
 * The card has always been able to say "1 unresolved comment thread". That
 * sentence is enough to know the PR is blocked and useless for deciding what to
 * do about it — a typo nit and a "this whole approach is wrong" produce the
 * identical line, so every one of them costs a trip to GitHub to find out which
 * you're looking at.
 *
 * COLLAPSED BY DEFAULT, and the summary line is the thing worth reading at a
 * glance: who asked, and where. Expanded, it's the first comment of each thread
 * verbatim. Not the whole conversation — the artifact truncates bodies anyway,
 * and a card is not a place to re-read a design debate. It's enough to tell a
 * nit from a rearchitecture, which is the decision being made here. */
function threadsHtml(p) {
  const ts = p.threads || [];
  if (!ts.length) return '';
  const k = `${p.repo}#${p.number}`;
  const open = OPEN_THREADS.has(k);
  const who = [...new Set(ts.map(t => t.author))].join(', ');
  return `<div class="thr">
    <button type="button" class="thr-head" data-threads="${esc(k)}"
      aria-expanded="${open}">
      ${CHEV}
      <span class="thr-n">${ts.length}</span>
      <span>comment${ts.length === 1 ? '' : 's'} from ${esc(who)}</span>
    </button>
    ${open ? `<div class="thr-body">${ts.map(t => `
      <div class="thr-row">
        <span class="thr-loc">${t.path ? esc(t.path) : 'on the PR'}${
          t.line ? `:${esc(t.line)}` : ''}</span>
        <span class="thr-who">${esc(t.author)}${
          t.comments?.length > 1 ? ` +${t.comments.length - 1}` : ''}</span>
        <span class="thr-text">${esc(firstBody(t))}</span>
      </div>`).join('')}
      <div class="thr-row">
        <button type="button" class="btn-inline" data-comments="${esc(k)}"
          title="Open the ${ts.length} thread${ts.length === 1 ? '' : 's'} in full — every reply, nothing clipped, without leaving the app.">
          Read ${ts.length === 1 ? 'it' : 'them'} in full →
        </button>
      </div>
    </div>` : ''}
  </div>`;
}

/* One line, not a paragraph. A reviewer's first sentence carries the ask; the
 * rest is usually justification, and a card that renders 600 characters of it
 * pushes every other PR off the screen. The agent gets the full text — it
 * re-fetches from GitHub rather than reading this. */
function firstBody(t) {
  const b = (t.comments?.[0]?.body || '').replace(/\s+/g, ' ').trim();
  return b.length > 180 ? `${b.slice(0, 180)}…` : b;
}

/* ---------- reading the comments, before answering them ----------
 *
 * THE GAP THIS FILLS. The card could say "4 comments from sam-lee" and,
 * expanded, one clipped line each. The next control was `Address 4 comments`,
 * which spends a coding agent and pushes commits. So the only way to find out
 * what you were about to agree to was GitHub — and that is a trip out of the
 * app, in the middle of the one decision the app exists to support. Nothing in
 * between: a glance, then a commit.
 *
 * IT COSTS NOTHING TO BUILD, because the data has been here all along. mine.py
 * carries the whole conversation per thread (up to 10 comments, 1200 chars each,
 * from all three of GitHub's comment surfaces) precisely so the agent prompt can
 * be built without a re-fetch. `threadsHtml` was throwing ~95% of it away at
 * render time. This is the same artifact, unclipped.
 *
 * A PAGE, NOT AN EXPANDED CARD. The clipping on the card is not a bug to be
 * fixed in place: three threads of full prose is a screen and a half, and the
 * lanes would stop being scannable for the sake of one PR. A page inherits the
 * crumb bar — you get back to where you were.
 *
 * READ-ONLY, like everything else here except the two agent buttons. There is no
 * reply box: replying on a PR is me typing under my own name, which this app
 * has never automated (see requestAddress, and the composer on the findings
 * page). The way to answer is `Open on GitHub`, in the fixed right-edge spot.
 * `Discuss` beside it starts a read-only agent to talk the threads through with
 * first (see discussTarget) — inline, because this page has no ⋯. */
function commentsHtml() {
  const p = (MINE?.prs || []).find(x => `${x.repo}#${x.number}` === view.cmtKey);
  /* The sweep re-runs while you read. A merged PR, or one whose threads were all
   * resolved from GitHub in the meantime, drops out of the artifact entirely —
   * so the page has to survive its subject disappearing under it. */
  if (!p || !p.threads?.length) {
    return crumbsHtml([{ label: 'Pulls', go: 'today' }, { label: 'Comments' }])
      + emptyLaneHtml('Nothing waiting here any more.',
        'The last sweep found no unresolved comments on this PR — resolved, or the PR is gone.');
  }

  const ts = p.threads;
  const who = [...new Set(ts.map(t => t.author))].join(', ');
  const n = ts.length;

  return `${crumbsHtml([
      { label: 'Pulls', go: 'today' },
      { label: `${shortRepo(p.repo)}#${p.number} comments` },
    ])}
    <div class="detail-head">
      <div class="detail-eyebrow">
        <span class="detail-num">${esc(shortRepo(p.repo))}#${esc(p.number)}</span>
      </div>
      <h2>${esc(p.title || '(untitled)')}</h2>
      <div class="row-sub detail-sub">
        <code>${esc(p.sha7)}</code>
        <span class="sub-dot">·</span><span>on ${esc(p.base_ref || 'main')}</span>
        <span class="sub-dot">·</span><span>${n} unresolved thread${n === 1 ? '' : 's'} from ${esc(who)}</span>
        ${mineAgeMin() != null
          ? `<span class="sub-dot">·</span><span>${esc(fmtAge(mineAgeMin()))} since the sweep read this</span>` : ''}
      </div>
    </div>

    <div class="cmt-list">${ts.map(cmtHtml).join('')}</div>

    <div class="card-act cmt-bar">${addressBitsHtml(p)}${discussBtnHtml(`mine:${p.repo}#${p.number}`)}${openPrHtml(p)}</div>`;
}

/* One thread. `kind` is stated rather than inferred from the presence of a path,
 * because the three surfaces are genuinely different objects with different
 * weight — an inline note on line 22, a Conversation-tab aside, and the
 * CHANGES_REQUESTED summary that names the blockers. mine.py had to read all
 * three to stop losing reviews (#1618, #1610); collapsing them back into one
 * undifferentiated list here would throw that distinction away at the last step. */
const CMT_KIND = {
  review:      { label: 'inline', where: t => `${t.path}${t.line ? `:${t.line}` : ''}` },
  issue:       { label: 'conversation', where: () => 'on the PR' },
  review_body: { label: 'review summary', where: () => 'the whole review' },
};

function cmtHtml(t) {
  const meta = CMT_KIND[t.kind] || CMT_KIND.issue;
  return `<div class="cmt">
    <div class="cmt-top">
      <span class="cmt-loc">${esc(meta.where(t))}</span>
      <span class="cmt-kind k-${esc(t.kind || 'issue')}">${esc(meta.label)}</span>
      ${t.created_at ? `<span>${esc(fmtAge(Math.round(
        (Date.now() - new Date(t.created_at).getTime()) / 60000)))} ago</span>` : ''}
      ${t.url ? `<a class="linkish cmt-gh" href="${esc(t.url)}" target="${LINK_TARGET}"
        rel="noopener">reply on GitHub ↗</a>` : ''}
    </div>
    ${(t.comments || []).map(c => `<div class="cmt-msg">
      <div class="cmt-who">${esc(c.author || 'unknown')}</div>
      <p class="cmt-body">${esc(c.body || '')}</p>
      ${trimmedHtml(c.body)}
    </div>`).join('')}
  </div>`;
}

/* mine.py caps each body at 1200 characters to keep an artifact that every
 * render re-reads from carrying a design debate. That cap is invisible in the
 * text — it cuts mid-sentence and looks like the reviewer trailed off — so a
 * body sitting exactly on it gets told on. Better a page that admits it is
 * showing you 1200 of 3000 characters than one that quietly isn't. */
function trimmedHtml(body) {
  if ((body || '').length < 1200) return '';
  return `<div class="cmt-trim">Clipped at 1200 characters by the sweep —
    read the rest on GitHub. The agent re-fetches the full text before it works.</div>`;
}

/* The bottom-right "Open on GitHub" action.
 *
 * WHY IT IS STILL AN <a href>. On the host it goes through the Open PR
 * interceptor like every other GitHub link in the app (see wireGitHubLinks),
 * and that mechanism deliberately keeps real anchors so ⌘-click, middle-click,
 * and right-click → copy link keep working. On a phone the anchor is doing the
 * actual work — the browser follows it inside the tap's own gesture, which is
 * the only thing iOS will hand to the installed GitHub app. A <button> would
 * throw away both for a visual that CSS gives us anyway.
 *
 * Right-aligned via margin-left:auto in the strip, so it sits opposite whatever
 * the left side holds — the Rebase button on a conflicted card, nothing on the
 * rest. One fixed place to look, regardless of what else the card offers. On a
 * card with a ⋯ menu (moreMenuHtml) the menu comes after it, as the last
 * control. */
function openPrHtml(p) {
  if (!p.url) return '';
  return `<a class="btn-inline btn-open" href="${esc(p.url)}" target="${LINK_TARGET}"
    rel="noopener"${openAttrs(p)}
    title="Open ${esc(shortRepo(p.repo))}#${esc(p.number)} on GitHub">Open on GitHub ↗</a>`;
}

/* The action strip under a card. It ALWAYS renders now, because it carries the
 * "Open on GitHub" action that used to be the whole card's click behaviour — a
 * card without a strip would be a card with no way out to GitHub at all.
 *
 * The left side is the conflict story, and the difference between its states is
 * what makes the Rebase control trustworthy:
 *
 *   in flight  -> a link into the agent's own thread, so the work is watchable
 *                 rather than a spinner you have to believe
 *   offerable  -> the button, labelled with the actual branch pair
 *   not offerable -> nothing at all. A disabled button that never explains itself
 *                 is worse than no button; the fork case gets one line of why. */
function resolveRowHtml(p, menu = '') {
  return `<div class="card-act">${resolveBitsHtml(p)}${addressBitsHtml(p, { menu: !!menu })}${openPrHtml(p)}${menu}</div>`;
}

/* `Address N comments` as a ⋯ menu item (2026-10-20), the same move Re-prep made
 * on the queue card: it spends an agent, so it no longer sits inline at the
 * weight of the read route beside it. Same `data-address` attribute, so the
 * click handler and requestAddress's confirm are untouched. Null whenever the
 * inline strip would not have offered the button (agent live, outcome on
 * screen, not addressable). */
function addressMenuItem(p) {
  const key = resolveKey(p);
  if (ADDRESSING.get(key) || ADDRESSED.get(key) || !canAddress(p)) return null;
  const n = p.threads.length;
  return {
    attrs: `data-address="${esc(key)}"`,
    title: esc(`Spawn a coding agent that reads the ${n} open thread${n === 1 ? '' : 's'}, makes the mechanical fixes, verifies, and pushes. It never replies on the PR — questions come back as drafts.`),
    label: esc(`Address ${n} comment${n === 1 ? '' : 's'}…`),
  };
}

/* The comment half of the strip. It renders alongside the conflict half rather
 * than instead of it: a PR can be conflicted AND have questions on it, and the
 * old either/or shape would hide whichever one classify() didn't pick.
 *
 * FOUR STATES, and the fourth is the one that justifies the whole outcome map.
 * `replies_only` means the agent read everything, changed nothing, and wrote
 * replies — a successful run that leaves the card exactly as blocked as before.
 * Rendering that as "done" would be a lie; rendering it as nothing would lose
 * the work. So it says what happened and points at the thread holding the
 * drafts. */
/* A rail's Started event may carry `sc_worktree` (an agent running outside
 * Lucidos) instead of a Lucidos thread. There is nothing to deep-link to from
 * here; name the worktree so it can be found. */
function scWhere(sc) {
  if (!sc) return '<span class="muted">starting…</span>';
  return `<span class="muted">running in an external worktree — <code>${esc(sc)}</code></span>`;
}

function addressBitsHtml(p, { menu = false } = {}) {
  const key = resolveKey(p);
  const live = ADDRESSING.get(key);
  if (live) {
    const where = live.thread_id
      ? `<span class="linkish" data-thread="${esc(live.thread_id)}">open the session</span>`
      : scWhere(live.sc);
    return `<span class="muted">agent started ${esc(fmtAge(Math.round(
        (Date.now() - new Date(live.at).getTime()) / 60000)))} ago</span>
      ${where}
      ${live.held_by ? `<span class="also">${esc(p.head_ref)} is also open in a local
        worktree — <code>git pull --ff-only</code> after the push</span>` : ''}`;
  }

  const done = ADDRESSED.get(key);
  if (done) return addressedHtml(done);

  if (!canAddress(p)) return '';
  const n = p.threads.length;
  /* The read route sits BESIDE the spend, not only inside the expanded list.
   * This strip is where the eye lands on a card with comments waiting, and an
   * Address button whose only neighbour is a sentence about what the agent does
   * is a spend with no cheaper option in view. On the comments page itself the
   * link is redundant — you are already reading them — so it drops out.
   *
   * LABELLED AS A PLACE, NOT AN ACTION (2026-10-19), the same change the queue
   * card's `Review` got. It said `Read it first`, which is an instruction, beside
   * a button that spends an agent; it only navigates, so it names the page it
   * opens and ends in a chevron like `Findings & checks` (viewBtnsHtml). The count
   * rides after the label, the way the findings count does. */
  const read = view.page === 'comments' ? '' :
    `<button type="button" class="btn-inline btn-go" data-comments="${esc(`${p.repo}#${p.number}`)}"
      title="Open the ${n} thread${n === 1 ? '' : 's'} in full — every reply, nothing clipped, before you hand ${n === 1 ? 'it' : 'them'} to an agent.">
      ${ICON_ASK}<span>Comments</span><span class="btn-n">${n}</span>${CHEV}</button>`;
  /* On a card with a ⋯ menu the spend lives there (addressMenuItem); the strip
   * keeps only the read route. */
  if (menu && read) return read;
  return `<button type="button" class="btn-inline" data-address="${esc(key)}"
      title="Spawn a coding agent that reads the ${n} open thread${n === 1 ? '' : 's'}, makes the mechanical fixes, verifies, and pushes. It never replies on the PR — questions come back as drafts.">
      Address ${n} comment${n === 1 ? '' : 's'}
    </button>
    ${read}
    <span class="muted card-hint">agent fixes what's mechanical, drafts replies for the rest</span>`;
}

/* What the agent left behind, after it's gone. Keyed on the head it ran against,
 * so a later push clears it — the outcome describes a SHA, not a PR. */
function addressedHtml(d) {
  const thread = d.thread_id
    ? ` <span class="linkish" data-thread="${esc(d.thread_id)}">open the session</span>` : '';
  if (d.rail === 'address-review') return addressReviewHtml(d);
  const replies = d.needs_reply
    ? `<span class="strand warn">${d.needs_reply} of ${d.threads ?? '?'} need${
        d.needs_reply === 1 ? 's' : ''} a reply from you — the agent drafted ${
        d.needs_reply === 1 ? 'it' : 'them'} rather than answering for you.${thread}</span>`
    : '';

  if (d.outcome === 'replies_only') {
    return `<span class="strand warn">Nothing here was a code change — the agent drafted
      ${d.needs_reply || 'the'} repl${d.needs_reply === 1 ? 'y' : 'ies'} and pushed nothing.${thread}</span>`;
  }
  if (d.outcome === 'failed') {
    return `<span class="strand warn">The agent could not finish${
      d.summary ? ` — ${esc(String(d.summary).slice(0, 160))}` : ''}.${thread}</span>`;
  }
  /* `addressed`. The push happened; the next status sweep is what actually
   * clears the card, so this says what landed rather than claiming the PR is
   * unblocked. */
  return `<span class="strand ok">Pushed ${d.changed ?? ''} fix${d.changed === 1 ? '' : 'es'}${
    d.new_sha7 ? ` as <code>${esc(d.new_sha7)}</code>` : ''}${
    d.verified ? `, verified with <code>${esc(String(d.verified).slice(0, 60))}</code>` : ''}.${thread}</span>
    ${reaskedHtml(d)}
    ${replies}`;
}

/* An automatic /address-review round (a rail that does not ship with Pulls). Unlike the button rail, the
 * skill posts its own replies, so the only thing left for me is the hand-offs:
 * questions the code can't settle (screenshots, product calls, P1s it would
 * have declined). Those lead. */
function addressReviewHtml(d) {
  const round = d.round ? `Round ${d.round}/3` : '/address-review';
  const items = Array.isArray(d.hand_off_items) ? d.hand_off_items : [];
  const hand = d.hand_offs
    ? `<span class="strand warn">${d.hand_offs} left for you — the code can't answer
        ${d.hand_offs === 1 ? 'it' : 'them'}${items.length
          ? `: ${items.slice(0, 3).map(s => esc(String(s).slice(0, 120))).join(' · ')}` : ''}.</span>` : '';
  if (d.outcome === 'capped') {
    return `<span class="strand warn">3 review rounds reached — labelled review-cap,
      the agent stopped. This one needs your eyes.</span>${hand}`;
  }
  if (d.outcome === 'failed') {
    return `<span class="strand warn">${round} could not finish${
      d.summary ? ` — ${esc(String(d.summary).slice(0, 160))}` : ''}.</span>${hand}`;
  }
  if (d.outcome === 'addressed') {
    return `<span class="strand ok">${round}: pushed ${d.changed ?? ''} fix${d.changed === 1 ? '' : 'es'}${
      d.new_sha7 ? ` as <code>${esc(d.new_sha7)}</code>` : ''} and replied on the threads.</span>
      ${reaskedHtml(d)}${hand}`;
  }
  return `<span class="strand ok">${round}: ${esc(String(d.summary || 'answered, no code change').slice(0, 160))}</span>${hand}`;
}

/* Did anyone get told about that push?
 *
 * This renders in all three of its states on purpose, including the boring one.
 * The whole reason the re-request rail exists is that "nobody was asked" is
 * INVISIBLE on GitHub — the avatar stays in the Reviewers box and the PR reads
 * as in-review — so a card that stays quiet about it reproduces the exact
 * failure one layer up. Silence here would mean "asked", "nobody needed
 * asking", and "the POST failed and your PR is now dead in the water" all look
 * the same.
 *
 * Keyed on the head the agent was ASKED about, not the one it produced, so it
 * lines up with the outcome strand above it. */
function reaskedHtml(d) {
  const r = REASKED.get(`${d.repo}#${d.pr}@${d.sha7}`);
  if (!r) return '';

  if (r.ok === false) {
    return `<span class="strand warn">Nobody was re-asked${
      r.reason ? ` — ${esc(String(r.reason).slice(0, 120))}` : ''}. GitHub does not
      re-request on a push, so this PR reads as "in review" with nobody looking at it.</span>`;
  }
  if (!r.reviewers?.length) {
    /* A real answer, not a shrug: it says WHY there was nobody, because the two
     * reasons mean opposite things. */
    return `<span class="strand muted">No re-request needed — ${esc(
      String(r.reason || 'nobody had a review to refresh').slice(0, 120))}.</span>`;
  }
  const teams = r.teams?.length
    ? ` <span class="also">${esc(r.teams.join(', '))} ${r.teams.length === 1 ? 'is a team' : 'are teams'
      } — re-ask ${r.teams.length === 1 ? 'it' : 'them'} on GitHub</span>`
    : '';
  return `<span class="strand ok">Re-asked ${esc(r.reviewers.join(', '))} to review${
    r.new_sha7 ? ` <code>${esc(r.new_sha7)}</code>` : ''}.</span>${teams}`;
}

function resolveBitsHtml(p) {
  if (p.state !== 'conflict') return '';

  const live = RESOLVING.get(resolveKey(p));
  if (live) {
    const where = live.thread_id
      ? `<span class="linkish" data-thread="${esc(live.thread_id)}">open the session</span>`
      : scWhere(live.sc);
    /* No REBASING pill here any more — the card's own status pill says it now
     * (see mineCardHtml). Two pills reading `rebasing` four lines apart is the
     * same fact twice; the strip's job is the detail behind it. */
    return `<span class="muted">agent started ${esc(fmtAge(Math.round(
        (Date.now() - new Date(live.at).getTime()) / 60000)))} ago</span>
      ${where}
      ${live.held_by ? `<span class="also">${esc(p.head_ref)} is also open in a local
        worktree — ${conflictStyle(p) === 'merge'
          ? 'it will just be behind after the push (<code>git pull --ff-only</code>)'
          : 'it will need resetting after the push'}</span>` : ''}`;
  }

  /* The push happened and something checked the stranded worktree. */
  const strand = STRANDED.get(strandKey(p));
  if (strand) return strandHtml(strand);

  if (p.cross_repo) {
    return `<span class="muted">head is on a fork
      (${esc(p.head_repo || 'unknown')}) — the rebase has to come from its author</span>`;
  }
  if (!canResolve(p)) return '';

  /* A real <button> now that the card is no longer an <a> — a nested button was
   * invalid HTML, which is the only reason this was ever a <span role=button>
   * with hand-rolled keyboard activation. */
  const merge = conflictStyle(p) === 'merge';
  const label = merge
    ? `Merge ${esc(p.base_ref)} in`
    : `Rebase onto ${esc(p.base_ref)}`;
  const how = merge
    ? 'agent merges, verifies, pushes — no history rewritten'
    : 'agent rebases, verifies, force-pushes with lease';
  const tip = merge
    ? `Spawn a coding agent that merges ${esc(p.base_ref)} into ${esc(p.head_ref)}, resolves the conflicts, verifies, and pushes. This repo forbids force-pushing, so nothing is rewritten.`
    : `Spawn a coding agent that rebases ${esc(p.head_ref)} onto ${esc(p.base_ref)}, resolves the conflicts, verifies, and force-pushes with lease.`;
  return `<button type="button" class="btn-inline" data-resolve="${esc(resolveKey(p))}"
      title="${tip}">
      ${label}
    </button>
    <span class="muted card-hint">${how}</span>`;
}

function shortRepo(r) { return String(r || '').split('/').pop(); }

/* The repo name without its org. Findings spell the same repo two ways
 * (`storefront` in some artifacts, `acme-corp/storefront` in
 * others), so anything that joins on a repo name strips the org first. */
function bareRepo(repo) { return String(repo || '').split('/').pop(); }

/* App tag — groups with `app_tagged` in the config. Such an owner is a portfolio
 * of separate apps, so the repo IS the app and is the first thing to sort by; it
 * leads the title as a tag. Other workspaces are one product each, where a tag
 * would repeat the same word on every row. Where the tag shows, the muted
 * `owner/repo` on line two is dropped — same fact, said once. */
function isAppTagged(ws) { return !!wsMeta(ws).appTagged; }
function appTagHtml(repo, ws) {
  return isAppTagged(ws) ? `<span class="app-tag">${esc(shortRepo(repo))}</span>` : '';
}

/* ---------- shipped without me ----------
 *
 * The one lane on this board that is NOT a queue. Every other lane says
 * "something wants a decision from you"; this one says "this already happened,
 * here's what it was". So it renders last, carries no count in the tab badge,
 * and its rows expand in place rather than linking away — the brief IS the
 * content, and bouncing to GitHub to read a diff is the exact thing it exists to
 * save.
 *
 * WHY IT'S NOT A REVIEW LANE. Where people don't gate each other's merges, a
 * review lane would be permanently empty and quietly wrong about the
 * relationship. The briefs come from a merge-brief rail that does NOT ship with
 * the Pulls plugin: with no briefs.json the band simply doesn't render.
 *
 * The flags are a glance-level vocabulary, not a verdict — `release` and
 * `billing` are what make a store submission look different from a copy tweak in
 * a list of one-liners. */
const BRIEF_FLAGS = {
  release:    { label: 'release',  tone: 'accent' },
  billing:    { label: 'billing',  tone: 'yellow' },
  schema:     { label: 'schema',   tone: 'yellow' },
  breaking:   { label: 'breaking', tone: 'red'    },
  dependency: { label: 'dep',      tone: 'muted'  },
  config:     { label: 'config',   tone: 'muted'  },
};

/* Which workspace tab a brief belongs to.
 *
 * `rail` is written by the brief detector and is authoritative; without it the
 * shared classifier places the brief by its repo. */
function railOfBrief(b) {
  if (b.rail) return b.rail;
  return workspaceOf(b);
}

/* The lane shows the last 7 days only.
 *
 * briefs.json is an append-only log that never prunes, so without a window this
 * lane grows forever and turns into an archive — which is the wrong shape for a
 * board whose other lanes are all "what's true right now". A brief has a short
 * useful life: it answers "what landed while I wasn't looking", and after a week
 * that answer is either already absorbed or no longer worth the scroll. The file
 * keeps everything; the board keeps the week.
 *
 * An undated brief (no merged_at — the detector always writes one, so this means
 * a malformed row) stays visible rather than being silently swallowed by a date
 * filter it can't satisfy. */
const BRIEF_WINDOW_DAYS = 7;

function briefsFor(wsId) {
  const cutoff = Date.now() - BRIEF_WINDOW_DAYS * 86400000;
  return BRIEFS
    .filter(b => wsId === 'all' || railOfBrief(b) === wsId)
    .filter(b => !b.merged_at || new Date(b.merged_at).getTime() >= cutoff)
    .sort((a, b) => new Date(b.merged_at || 0) - new Date(a.merged_at || 0));
}

/* ---------- shipped BY me ----------
 *
 * OPT-IN PER GROUP (`shipped_lane` in the config). It answers "what did I land
 * this week" for an owner where nothing else on the board records my own merges,
 * typically one with no review culture. mine.py asks GitHub only for those
 * owners, so other rows never arrive — this filter is the second gate, and it is
 * not redundant: shipped.json is a file that survives on disk, so an artifact
 * written before a config change can still hold other merges until the next
 * sweep overwrites it.
 *
 * The mirror of the briefs rail, and the answer to a question the board could
 * not previously answer at all: what did *I* land this week. Every other band
 * is about work in flight; these two are about work that is over — one for
 * merges someone else made, one for mine.
 *
 * NO BRIEF, DELIBERATELY. `Shipped without me` carries a written paragraph
 * because I never read those PRs, so the brief substitutes for the reading. I
 * wrote these. A generated summary of my own code handed back to me is pure
 * noise, so this rail costs no LLM
 * and states only facts: what landed, where, how big, and who looked.
 *
 * WHY THE WINDOW IS ASKED OF THE API AND RE-CHECKED HERE. mine.py bounds the
 * query to 7 days, but the artifact is a file that can sit on disk through a
 * failed sweep — so a row can outlive its window between runs. Filtering again
 * costs nothing and keeps "last 7 days" true even when the sweep is stale. */
/* The tabs whose group turns the lane on. */
const SHIPPED_WS = { has: id => !!WORKSPACES.find(w => w.id === id)?.shippedLane };

function shippedFor(wsId) {
  /* `all` still shows it, because All is the union of the tabs. A tab whose
   * group has no lane gets nothing — not an empty band, no band at all
   * (shippedBandHtml returns ''). */
  if (wsId !== 'all' && !SHIPPED_WS.has(wsId)) return [];
  const cutoff = Date.now() - BRIEF_WINDOW_DAYS * 86400000;
  /* A PR MUST NOT APPEAR TWICE ON ONE BOARD. The two artifacts come from two
   * queries in the same sweep, so a PR that merges between them is open in one
   * and merged in the other — it then renders as a live row AND as a shipped
   * row, which reads as two different pull requests with one number. The window
   * is seconds and this still happened on the first render I looked at (a stale
   * my-prs beside a fresh shipped), which is the same shape a failed my-prs
   * write would produce for an hour.
   *
   * The LIVE row wins, because it is the one that can still want something from
   * me, and a wrongly-live row is self-correcting: the next sweep drops it and
   * the merge shows up here. */
  const open = new Set((MINE?.prs || []).map(p => `${p.repo}#${p.number}`));
  return (SHIPPED?.shipped || [])
    .filter(p => !open.has(`${p.repo}#${p.number}`))
    /* Classified with the same workspaceOf() every other row uses, rather than
     * a per-rail field: these come from the same GitHub query as my open PRs
     * and carry the identical `repo` spelling, so the shared classifier is
     * exactly right here. A brief needs `rail` only because its detector runs
     * per-org.
     *
     * This is a test against the lane's groups even on the `all` tab, which is
     * what makes a pre-scoping artifact safe to read. */
    .filter(p => SHIPPED_WS.has(workspaceOf(p)))
    .filter(p => !p.merged_at || new Date(p.merged_at).getTime() >= cutoff)
    .sort((a, b) => new Date(b.merged_at || 0) - new Date(a.merged_at || 0));
}

function shippedMatchesQuery(p) {
  if (!QUERY) return true;
  const q = QUERY.toLowerCase();
  return `${p.title} ${p.repo} #${p.number} ${(p.reviewed_by || []).join(' ')}`
    .toLowerCase().includes(q);
}



/* No triage-state pill. `untriaged` was the honest reading of an empty ledger on
 * every card, and its denominator was the whole artifact while the Report tab
 * shows only the reported slice — so clearing everything visible on #1612 still
 * read `in progress` (15 of 56). Decisions made show as a plain count in meta. */
/* Why this PR is in the review lane at all.
 *
 * The lane is titled "On me to review", which asserts a request exists. That
 * assertion was false on one rail until 2026-08-11: it queued every open PR
 * that wasn't mine, so #715 got a 40-min multi-agent review nobody had asked for
 * and the card gave no hint that it was self-appointed. Both rails now gate on a
 * real request and carry `requested_via`; the card prints it.
 *
 * Three states, deliberately distinct — an unknown must never render as an
 * assurance:
 *   asked        -> quiet chip naming the signal (reviewer / team / mention)
 *   not asked    -> loud chip; the review ran on the rail's own initiative
 *   no field     -> nothing. Pre-gate artifact, provenance genuinely unknown. */
function reqHtml(pr) {
  const v = pr.requested_via;
  if (!v) return '';
  const unrequested = /^unrequested/.test(v);
  /* A pool row's `requested_via` reads "team request (X) — nobody named". That is
   * neither an ask nor a self-appointment, so it gets the muted treatment rather
   * than borrowing either signal's colour. */
  const pool = pr.assigned === false;
  const cls = pool ? ' req-pool' : (unrequested ? ' req-none' : '');
  return `<span class="req${cls}">${esc(v)}</span>`;
}

/* What I said, on a row I've already answered. Two things the card must not
 * conflate:
 *
 *   review   a submitted Approve / Request-changes / Comment. GitHub knows about
 *            it: it clears the review request, and it carries the commit it was
 *            written against.
 *   comment  a Conversation-tab comment. GitHub does NOT count it as a review —
 *            I stay in `requested_reviewers` and the PR still reads
 *            "review required" on GitHub's own UI. It has no commit anchor
 *            either, so its currency is inferred from time (see queue.py's
 *            my_say), which is why the pill says "commented" and not "reviewed".
 *
 * Printing "reviewed" for the second case would be the board asserting something
 * GitHub disagrees with — and the whole reason this lane exists is that the app's
 * own composer produces exactly that case. */
function saidHtml(q) {
  const s = q.my_review;
  if (!s) return '';
  const comment = s.kind === 'comment';
  const label = comment ? 'commented'
    : s.state === 'approved' ? 'approved'
      : s.state === 'changes_requested' ? 'changes requested' : 'reviewed';
  const when = s.at
    ? fmtAge(Math.round((Date.now() - new Date(s.at).getTime()) / 60000)) : '';
  const anchor = comment
    /* No commit on a Conversation comment, so say what IS known: it came after
     * this head landed. Printing q.sha7 here would invent an anchor. */
    ? 'on the current head'
    : (s.sha7 ? `on <code>${esc(s.sha7)}</code>` : '');
  const note = comment
    ? '<span class="said-note">not a submitted review — the request is still open on GitHub</span>'
    : '';
  return `<span class="said">${esc(label)}${when ? ` ${esc(when)} ago` : ''}${
    anchor ? ` ${anchor}` : ''}</span>${note}`;
}


/* The prep half of a review-lane card's strip — the counterpart to Rebase and
 * Address on my own cards, and the only expensive control in the app.
 *
 * FOUR STATES, and the last one is new (2026-08-19):
 *
 *   in flight -> what is happening and since when. No thread link: unlike the two
 *                writing rails, the review runs as a trigger thread nobody needs
 *                to watch, and its output is the findings button that appears
 *                right here when it lands.
 *   pending   -> `Prep for review`. Nothing on disk at any head.
 *   stale     -> `Re-prep at this head`. Findings exist, bound to an older head.
 *   prepped   -> `Re-prep`, quietly. This used to render nothing, on the argument
 *                that the Findings button IS the state and a second label would
 *                say the same fact twice. True about the LABEL and wrong about the
 *                CONTROL: a run can be right about the head and wrong about
 *                everything else — a corrupted tree (#763 reviewed `main`
 *                from minute six), a base that resolved to a stale local branch
 *                (#762's ~300-file diff), a toolchain that never ran. Every one of
 *                those produces a complete, current, wrong artifact, and redoing
 *                it was the whole reason the re-prep existed. While the artifact
 *                picker preferred the biggest run, a bad prep read as `stale` and
 *                showed a button by accident; fixing that would have removed the
 *                only way to ask for one.
 *
 * The label carries the distinction, so pressing it is never a guess about what
 * you get, and the confirm says outright that a redo overwrites.
 *
 * WHERE EACH STATE LIVES (2026-10-19). Only two are in the action row: the
 * in-flight line, and `Prep for review` on a card with nothing on disk — the
 * primary action when there is nothing else to do. `Re-prep` and `Re-prep at
 * this head` moved to a ⋯ menu that ends the strip (queueMenuHtml). Redoing a
 * run is rare and costs ~40 minutes and a few million tokens, and as a button
 * it sat beside the navigation button at the same weight, on every card that
 * had findings. It is still one deliberate click away, with the same tooltip
 * and the same confirm. `stale` is the exception that has to be noticed — the
 * new head has no findings — so its ⋯ carries a dot. */
function prepBitsHtml(row) {
  const { q, prep } = row;
  const repo = q.repo_name || q.repo;
  const live = PREPPING.get(prepKey(repo, q.number, q.sha7));

  /* The in-flight sentence. It carries three things the chip above can't: how
   * long it has been going against how long it takes, that the run is read-only,
   * and — on a redo — that the findings still on the card are the ones being
   * thrown away. Written as a progress line rather than a static label, because
   * the complaint it answers (2026-08-19) was that a card with a review actually
   * running looked identical to one sitting idle. */
  if (live) {
    const { mins, phrase } = prepElapsed(live.at);
    const eta = mins < 40
      ? 'findings usually land ~40 min in'
      : 'past the usual ~40 min — still running';
    return `<span class="prep-live">
      <span class="spin"></span>
      <strong>${prep === 'prepped' ? 'Re-reviewing' : 'Reviewing'} <code>${esc(q.sha7)}</code></strong>
      <span>${esc(phrase)} · ${esc(eta)}</span>
      <span class="prep-live-note">read-only — it never comments or pushes${
        prep === 'prepped' ? ', and it replaces the findings on this card when it lands' : ''}</span>
