      @media (hover: hover) {
        .crumbs > button.crumb:first-child:hover { background: var(--bg-hover); border-color: var(--text-muted); }
      }
      .crumb:hover { color: var(--text-primary); }
      .crumb:focus-visible { outline: 0.125rem solid transparent; box-shadow: var(--focus-ring); }
      .crumb-here { color: var(--text-secondary); cursor: default; overflow-wrap: anywhere; }
      .crumb-sep { font-size: var(--font-size-sm); color: var(--text-muted); }
      .crumb-right { margin-left: auto; display: flex; align-items: center; flex-wrap: wrap;
                     gap: var(--space-sm); }
      .crumb-note { font-size: var(--font-size-xs); color: var(--accent-yellow); }

      /* The PR title IS the heading here, under a small eyebrow naming the PR,
         with the board's own line-two meta under it. */
      .detail-head { margin-bottom: var(--space-lg); }
      .detail-eyebrow { display: flex; align-items: center; flex-wrap: wrap; min-width: 0;
                        gap: var(--space-sm); margin-bottom: var(--space-xs); }
      .detail-num { font-size: var(--font-size-xs); font-weight: 600; color: var(--text-muted);
                    font-variant-numeric: tabular-nums; }
      .detail-eyebrow .go-gh { margin-left: auto; font-size: var(--font-size-xs); }
      .detail-head h2 { margin: 0; font-size: var(--font-size-2xl); font-weight: 600;
                        line-height: 1.35; overflow-wrap: anywhere; }
      .detail-sub { margin-top: var(--space-xs); }

      /* The comments page: one box per thread, a header row on the secondary
         surface, hairlines between replies. Bodies at body size with prose
         leading, because this is a person's argument you are about to answer. */
      .cmt-list { display: flex; flex-direction: column; gap: var(--space-lg); }
      .cmt { border: 1px solid var(--border-color); border-radius: var(--radius-lg); overflow: hidden; }
      .cmt-top { display: flex; flex-wrap: wrap; align-items: baseline;
                 gap: var(--space-xs) var(--space-md); padding: var(--space-sm) var(--space-lg);
                 background: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
                 font-size: var(--font-size-xs); color: var(--text-muted); }
      .cmt-loc { font-family: var(--font-mono); color: var(--text-primary); overflow-wrap: anywhere; }
      .cmt-kind { font-weight: 600; color: var(--text-secondary); }
      .cmt-kind.k-review_body { color: var(--accent-yellow); }
      .cmt-gh { margin-left: auto; white-space: nowrap; }
      .cmt-msg { padding: var(--space-md) var(--space-lg); }
      .cmt-msg + .cmt-msg { border-top: 1px solid var(--border-color); }
      .cmt-who { margin-bottom: var(--space-xs); font-size: var(--font-size-xs); font-weight: 600;
                 color: var(--text-secondary); }
      .cmt-body { margin: 0; font-size: var(--font-size-md); line-height: 1.6; color: var(--text-primary);
                  white-space: pre-wrap; overflow-wrap: anywhere; }
      .cmt-trim { margin-top: var(--space-sm); font-size: var(--font-size-xs); color: var(--accent-yellow); }
      .cmt-bar { margin-top: var(--space-xl); }

      /* Empty pages and empty lanes: a sentence and a line under it, in a
         plain box. `em-quiet` drops the box where the page already frames it. */
      .empty-lane { display: flex; flex-direction: column; gap: var(--space-xs);
                    margin-top: var(--space-md); padding: var(--space-xl) var(--space-lg);
                    border: 1px solid var(--border-color); border-radius: var(--radius-lg); }
      .empty-lane.em-quiet { border: 0; padding: var(--space-md) 0; }
      .em-head { font-size: var(--font-size-md); font-weight: 500; color: var(--text-secondary); }
      .em-sub { max-width: 44ch; font-size: var(--font-size-sm); line-height: 1.6; color: var(--text-muted); }

      /* The first load. Row-shaped and over-provisioned rather than under.
         Decorative and still — nothing focusable, nothing announced; the
         blocks themselves say "loading". */
      .skel-row { display: grid; grid-template-columns: 1rem minmax(0, 1fr) 4.5rem;
                  column-gap: var(--space-md); align-items: center;
                  padding: var(--space-md) var(--space-lg); }
      .skel-bar { display: block; height: 0.75rem; border-radius: var(--radius-sm);
                  background: var(--bg-tertiary); }
      .skel-ic { height: 1rem; align-self: start; }
      .skel-sub { margin-top: var(--space-sm); height: 0.625rem; width: 40%; }

      /* ---- 10. motion ---------------------------------------------------
         Colour and background only, at --duration-fast (150ms), and none of
         it for a reader who asked for less motion. Keyed on the frame's
         `data-motion`, not the prefers-reduced-motion query: the query reads
         only the OS and ignores the Reduce / Full choice made in Lucidos.
         The live dot's pulse is the one loop; the spinner is the one
         exception to "none" — it slows rather than stopping, because it is
         the only thing saying "working". */
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      /* The ⋯ popover's open: a short fade and a 2px settle, and nothing at all
         under Reduce. `data-still` marks a menu a re-render rebuilt while it was
         open — it must not replay the entrance on every background tick. */
      @keyframes menu-in { from { opacity: 0; transform: translateY(-0.125rem); } }
      :root:not([data-motion="reduce"]) .menu:not([hidden], [data-still]) {
        animation: menu-in var(--duration-fast) ease-out; }
      :root:not([data-motion="reduce"]) :is(.row, :is(a, button).badge, .btn-inline, .pick, .linkish,
          .crumb, .thr-head, .dupes-head, .foot-head, .band-title, .band-head, .ws-tab, .ws-tab-in,
          .lrow, .srow) {
        transition: background-color var(--duration-fast), border-color var(--duration-fast),
                    color var(--duration-fast); }
      :root:not([data-motion="reduce"]) :is(.badge-live, .prep-live-dot)::before {
        animation: pulse 1.6s ease-in-out infinite; }
      :root[data-motion="reduce"] .spin { animation-duration: 2.5s; }
      :root[data-motion="reduce"] :is(.action-btn, .ws-tab, .ws-tab-in, input) { transition: none; }

      /* ---- 11. phones (≤ 36rem) -----------------------------------------
         One column all the way down; nothing fixed-width; nothing in the
         top-right corner. A PR-page row's action drops under the title,
         left-aligned (the board's row has its own diagram below):

             [◌]  Title of the finding, wrapping
                  onto a second line
                  file.ts:42 · correctness
                  [Action]                                  */
      @media (max-width: 36rem) {
        .wrap { --pad-y: var(--space-lg); --pad-x: var(--space-lg); }
        .row { grid-template-columns: 1rem minmax(0, 1fr) auto;
               grid-template-areas: "ic title age" "ic sub sub" ". act act";
               padding: var(--space-md); }
        .row-acc { justify-self: start; flex-wrap: wrap; margin-top: var(--space-sm); }
        .row-drawer { margin: var(--space-md) calc(-1 * var(--space-md)) calc(-1 * var(--space-md));
                      padding: var(--space-md) var(--space-md) var(--space-md)
                               calc(var(--space-md) + 1rem + var(--space-md)); }
        .subhead, .row-notice { padding-left: var(--space-md); padding-right: var(--space-md); }
        .skel-row { padding: var(--space-md); }
        .band-why { flex-basis: 100%; margin-left: 0; }
        /* The board: signals drop under the meta line, left-aligned with the
           title, and the empty CI / thread slots stop holding width — there
           is no column to line up with on one. The drawer takes the row's
           full width.

               [◌]  Title of the pull request,
                    wrapping #852  (Answer comments)
                    repo · waiting on ◉ sam-lee · updated 3d ago
                    Review required  ✓  💬 3                     */
        :is(.board, .prpage) .band-head { padding: var(--space-sm) var(--space-md); }
        :is(.board, .prpage) .band-why { margin-left: 0; }
        :is(.board, .prpage) :is(.band-clear, .subhead) { padding-left: var(--space-md); padding-right: var(--space-md); }
        .board .row { grid-template-columns: 1rem minmax(0, 1fr);
                      grid-template-areas: "ic head" "ic sub" ". sig";
                      padding: var(--space-md); }
        .board .row-sig { justify-self: start; flex-wrap: wrap; gap: var(--space-xs) var(--space-md);
                          margin-top: var(--space-sm); }
        .board .row-sig .sig:empty { display: none; }
        .board .sub-branch { max-width: 100%; }
        .board .row > .row-drawer { grid-column: 1 / -1; padding: var(--space-md); }
        /* The identity line keeps who-you-are and drops the gate explanation,
           which wrapped it to three lines. `Wire up a rail` is an action and
           stays. */
        .ws-gate { display: none; }
        /* TABS: all of them on one line, no sideways scroll. Each takes its
           content width plus a share of what is left; a name that still does
           not fit ellipsises rather than pushing `All` to a second line. */
        .ws-nav { gap: 0; }
        .ws-tab { flex: 1 1 auto; justify-content: center; }
        .ws-tab-in { padding-left: var(--space-xs); padding-right: var(--space-xs); gap: var(--space-xs); }
        .seg-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        /* Search takes the row; freshness and Refresh share the next one,
           Refresh at the right end where the thumb is. */
        .search { flex-basis: 100%; max-width: none; }
        .toolbar-end { flex: 1 1 100%; justify-content: space-between; margin-left: 0; }
        .degraded { padding: var(--space-md); }
        .degraded .action-btn { flex: 1 1 100%; }
        .cmt-top, .cmt-msg { padding-left: var(--space-md); padding-right: var(--space-md); }
        .cmt-gh { margin-left: 0; flex: 1 1 100%; }
        /* Count on its own line, the buttons sharing the next. */
        .runbar .grow { flex: 1 1 100%; }
        .crumb-right { margin-left: 0; flex: 1 1 100%; }
        .detail-eyebrow .go-gh { margin-left: 0; }
        /* The PR header: a smaller title, and "open on GitHub" on a line of
           its own at the left, under the thumb rather than the host's chrome. */
        .pr-title { font-size: var(--font-size-xl); }
        .pr-meta .go-gh { flex-basis: 100%; margin-left: 0; }
        .pr-meta .sub-branch { max-width: 100%; }
        .srow, .chk, .story-finding, .story-diagram, .recall-alert, .lrow, .lane-reasons,
        .prpage .foot-head, .prpage .foot-body > .markdown-content {
          padding-left: var(--space-md); padding-right: var(--space-md); }
        /* A lane row's file:line ref drops to its own line, left-aligned. */
        .lrow-head > :is(.lrow-lead, .lrow-text) { flex-basis: 100%; }
        .lrow-head > code.ref { margin-left: 0; }
        .story-cap, .story-fig-h { padding-left: var(--space-md); padding-right: var(--space-md); }
        .shots { grid-template-columns: minmax(0, 1fr); }
        .story-steps { display: grid; gap: var(--space-sm); list-style: none; counter-reset: step;
                       margin: 0; padding: var(--space-md); font-size: var(--font-size-sm); }
        .story-steps li { counter-increment: step; display: grid;
                          grid-template-columns: 1.5rem minmax(0, 1fr); gap: 0.125rem var(--space-sm);
                          overflow-wrap: anywhere; line-height: 1.45; }
        .story-steps li::before { content: counter(step); grid-row: span 2; font-weight: 600;
                                  color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .story-steps .step-who { font-size: var(--font-size-xs); color: var(--text-muted); }
        .story-steps .step-who b { color: var(--text-secondary); font-weight: 600; }
        .story-steps .step-reply .step-text { color: var(--text-secondary); }
        .story-steps .step-removed .step-text { text-decoration: line-through; color: var(--text-muted); }
        .step-tag { display: inline-block; margin-left: 0.25rem; padding: 0 0.375rem; border-radius: 999px;
                    font-size: var(--font-size-xs); border: 1px solid var(--border-color); color: var(--text-muted); }
        .step-tag-new { color: var(--accent-green); border-color: var(--accent-green); }
        .step-tag-changed { color: var(--accent-yellow); border-color: var(--accent-yellow); }
        .step-tag-removed { color: var(--accent-red); border-color: var(--accent-red); }
        .story-fig-toggle { display: flex; align-items: center; justify-content: center; gap: var(--space-sm);
                            width: calc(100% - 2 * var(--space-md)); min-height: 2.75rem;
                            margin: 0 var(--space-md) var(--space-md); }
        .story-fig[data-steps="1"]:not([data-fig-open="1"]) .story-diagram,
        .story-fig[data-steps="1"]:not([data-fig-open="1"]) .story-cap { display: none; }
        .story-fig[data-steps="1"] .story-cap-phone { display: block; }
      }
      @media (max-width: 23.75rem) {
        .wrap { --pad-x: var(--space-md); }
      }

      /* ---- 12. touch ----------------------------------------------------
         HIT AREAS: every small control's target is at least 2.75rem square
         without looking any bigger — a transparent ::after centred on the
         control, grown only along the axes where it is short (to 2.875rem,
         so rounding never lands it a pixel under the floor). The shared
         .action-btn and the badges are also drawn a little taller. */
      @media (pointer: coarse) {
        .action-btn, :is(a, button).badge, .btn-inline { min-height: 2rem; }
        /* Read brief holds the action slot like a button does, so it takes a
           button's height there — its target then stays clear of the next
           row's title. */
        .row-acc .linkish, .row-sig .linkish { display: inline-flex; align-items: center; min-height: 2rem; }
        .action-btn { padding-left: var(--space-md); padding-right: var(--space-md); }
        .pick { width: 1.25rem; height: 1.25rem; }
        /* A menu row is its own full-width target; no ::after growth needed. */
        .menu-item { min-height: 2.75rem; display: flex; align-items: center; }
        :is(.action-btn, .btn-inline, .badge, .linkish, .row-title, .band-toggle, .crumb,
            .thr-head, .dupes-head, .foot-head, .pick, .ws-tab) { position: relative; }
        /* Every selector in the list is ONE class, on purpose: `:is()` takes
           the specificity of its heaviest argument, and a two-class entry here
           would outrank the single-class overrides that follow.

           `z-index: 1` lifts every target over plain content, so the meta line
           under a title never eats the lower half of the title's target; where
           two targets overlap, the later control in the markup wins. */
        :is(.action-btn, .btn-inline, .badge, .linkish, .row-title, .band-toggle, .crumb,
            .thr-head, .dupes-head, .foot-head, .pick, .ws-tab)::after {
          content: ''; position: absolute; z-index: 1;
          top: min(0rem, calc(50% - 1.4375rem)); bottom: min(0rem, calc(50% - 1.4375rem));
          left: min(0rem, calc(50% - 1.4375rem)); right: min(0rem, calc(50% - 1.4375rem)); }
        /* A resting badge is a <span>, a state and not a control; a hit area
           on it would only steal taps from whatever it overlaps. */
        span.badge::after { display: none; }
        /* The control the whole board can hide behind: full width, so the
           target is the whole header line rather than the little caret. */
        .band-h { flex: 1 1 100%; }
        .band-toggle { width: 100%; min-height: 2.75rem; }
        .sect-toggle { min-height: 2.75rem; }
        .foot-head, .dupes-head { min-height: 2.75rem; }
        /* iOS zooms the whole page into any field whose text is smaller than
           its default body size when it takes focus, and never zooms back out.
           --font-size-xl is 1rem, which is that size at 100% scale and up. */
        .search input { font-size: var(--font-size-xl); min-height: 2.75rem; }
        .chk textarea { font-size: var(--font-size-xl); }
      }
    </style>
  </head>
  <body>
    <!-- Always in the DOM and never re-rendered. render() replaces the whole of
         `#root`, and a role="status" element that is destroyed and rebuilt is not
         reliably announced — so the board writes its count in here instead. -->
    <p id="live" class="sr-only" role="status" aria-live="polite"></p>
    <div class="wrap" id="root"></div>
    <script>
/* Pulls — every PR that's on me, split by WORKSPACE first.
 *
 * Reads:  artifacts/review-cockpit/my-prs.json       (my-prs/v1, written by mine.py — my own PRs)
 *         artifacts/review-cockpit/findings/*.json   (findings/v2, written by the prep rail — others' PRs)
 *         artifacts/review-cockpit/{lanes,story,check}/<slug>-<pr>-<sha7>*.json
 *                                                    (pr-skills/*, the pr-* skill panels on a PR's page)
 *         artifacts/pr-recall/cards.json             (pr-recall/cards/v1, to name a recall hit's files)
 * Writes: artifacts/review-cockpit/triage.json       (the only mutable state this app owns)
 *
 * The folder id stays `review-cockpit` deliberately: renaming it would orphan every
 * artifact path above plus the `review-cockpit/findings/v2` schema string that two
 * scripts and three knowhow files write against. The id is never shown on screen.
 *
 * PICK KEY — two keys, two jobs. Getting this wrong loses picks silently.
 *
 *   IDENTITY  = finding.id      (which finding is this?)
 *   CARRY-OVER = file:line      (has a pick at this spot survived a push?)
 *
 * Keying identity on location was wrong and measurably destructive: one location
 * routinely carries several distinct findings. On #1612's REPORTED slice — the 15
 * you actually read — SEVEN sit on `grafana/…-effectiveness.json:108`, each a
 * different defect (raw $var interpolation, pause-time flight end, DurationUpdated
 * ignored, unclamped post-window…). Under a location key, picking one would drag all
 * seven into the comment. #715 is worse: 19 of 24 findings share 4 locations.
 * `category` does not rescue it — it is null in every artifact on disk.
 *
 * So picks are stored under the finding's stable `id` and carry a `loc`. A new head
 * means new ids; a stored pick whose `loc` matches an unpicked finding is SURFACED
 * as a carry-over question, never silently inherited. Content hashing stays
 * rejected: two reviewers on the same SHA (#1610) produced 0/8 vs 15 overlap on
 * every content signature tried, so a hash yields no carry-over at all.
 */

const FINDINGS_GLOB = 'artifacts/review-cockpit/findings/*.json';
const TRIAGE_PATH = 'artifacts/review-cockpit/triage.json';
const MINE_PATH = 'artifacts/review-cockpit/my-prs.json';
const CONFIG_PATH = 'artifacts/review-cockpit/config.json';
const QUEUE_PATH = 'artifacts/review-cockpit/review-queue.json';
const BRIEFS_PATH = 'artifacts/review-cockpit/briefs.json';
const SHIPPED_PATH = 'artifacts/review-cockpit/shipped.json';
const AVATARS_PATH = 'artifacts/review-cockpit/avatars/index.json';

let PRS = [];      // one entry per artifact file
let MINE = null;   // my-prs/v1 snapshot, or null when the sweep has never run
let QUEUE = null;  // review-queue/v1 snapshot, or null when it has never run
let BRIEFS = [];   // merge-briefs/v1 — merges by someone else, newest first
let SHIPPED = null; // shipped/v1 window — MY merges, or null when never swept
let AVATARS = {};  // login (lowercased) -> cached avatar path; {} = show names only
let TRIAGE = { version: 4, prs: {} };
let OPEN = new Set(); // locKeys whose detail panel is expanded (survives re-render)
let OPEN_LOC = new Set(); // locKeys whose FOLDED SIBLINGS are expanded (see clusterByLoc)
let OPEN_BRIEFS = new Set(); // `repo#pr` of expanded briefs (same reason)
let OPEN_THREADS = new Set(); // `repo#pr` of expanded comment-thread lists

/* Manual-refresh state. `refreshing` gates the button (spamming it would queue
 * N identical sweeps); `refreshTimer` is the give-up clock, because the only
 * completion signal is an SSE event that may never arrive — the trigger could be
 * queued behind other work, or gh could be down. A spinner with no timeout is a
 * lie the moment either happens. */
let refreshing = false;
let refreshTimer = null;
const REFRESH_TIMEOUT_MS = 120000;
/* THE SPINNER'S REAL COMPLETION SIGNAL. The SSE event clears it first when it
 * arrives, but it is not the thing to depend on: a tab whose stream has lapsed
 * gets no frame at all, and the spinner then runs the full REFRESH_TIMEOUT_MS
 * above with the finished answer already sitting on disk. Two minutes of
 * "Checking…" over work that took twenty seconds. So while a refresh is in
 * flight the app also watches the artifact directly — three reads every few
 * seconds against the same-origin engine, no GitHub call, and it stops the
 * moment either signal wins. */
let refreshPoll = null;
const REFRESH_POLL_MS = 3000;
/* Tolerance when comparing the click's wall clock against a timestamp the sweep
 * script wrote. Both clocks are this machine, so this is not skew — it only
 * covers the sub-second interleave where a scheduled sweep lands in the same
 * instant as the click, which is a fresh reading either way. */
const CLOCK_SLACK_MS = 2000;

/* In-flight conflict resolvers, keyed `${repo}#${pr}@${sha7}`.
 *
 * WHY KEYED ON THE SHA and not the PR: a resolver rebases one specific head. If
 * someone pushes while it runs, the old run is about code that no longer exists
 * and the button must come back — a PR-keyed lock would stay stuck on a head
 * nobody is working on anymore.
 *
 * WHY IT SURVIVES A RELOAD: the source of truth is the
 * PrConflictResolutionStarted/Finished event pair, replayed on load. An in-memory
 * flag would let a page refresh spawn a second agent onto the same branch — two
 * force-pushes racing each other, which is the one failure this must not have. */
let RESOLVING = new Map();
/* `DEFAULT_WS` is the FALLBACK, not the landing tab: it applies on a device that
 * has never picked one, or when the remembered pick can no longer be shown. It is
 * the config's `default_tab`, else the first group; `all` is the cross-workspace
 * audit view, reached deliberately, because landing there starts every morning
 * with every owner interleaved. A tab the user chose beats either — see
 * restoreWs. loadConfig() sets it. */
let DEFAULT_WS = 'all';
let view = {
  page: 'today', key: null, showTests: true, ws: DEFAULT_WS,
  /* The board row id (`rev:…` / `mine:…`) the panels-only page is about. */
  skillKey: null,
  /* The PR whose review comments the `comments` page is showing, as
   * `repo#number` — the same key `.thr` toggles on. NOT keyed on the head SHA
   * like the resolve/address locks are: those describe a RUN against one commit,
   * while this is just "which PR am I reading". A push mid-read should re-render
   * the page with the new comments, not strand it on a dead key. */
  cmtKey: null,
  /* The secondary sections at the foot of the findings page. Closed by
   * default — their headers carry the count, so the number is readable without
   * opening one, and the page still ENDS on the findings themselves. */
  showRefuted: false, showNotes: false,
};

/* ---------- remembering the selected workspace ----------
 *
 * `lucidos.storage.local`, not `lucidos.data.write` and not `localStorage`:
 *  - A data write makes a git commit, and one commit per tab click would bury the
 *    workspace's real history under UI noise.
 *  - The app runs in an opaque-origin iframe where `localStorage` throws, so the
 *    first version of this forgot the pick on every reload. `lucidos.storage.local`
 *    is the SDK's stand-in: same calls, kept in the shell's browser storage.
 *  - Which tab I'm looking at is legitimately per-device — the phone and the laptop
 *    are allowed to disagree — and that is exactly what it scopes to.
 *
 * Its values reach the frame asynchronously: a read before `lucidos.storage.ready`
 * resolves sees nothing (and the SDK warns), so restoreWs reads only after it.
 * A write before then is safe; the SDK keeps it over the snapshot.
 *
 * The accessors stay wrapped: `setItem` throws on a full quota, and an unguarded
 * throw in the click handler would break tab SWITCHING, not merely its memory. */
const WS_KEY = 'review-cockpit:ws';

let wsStoreReady = false;

/* Kicked off at boot and NOT awaited there. Boot waits on it only briefly, after
 * the loads (see UI_READ_WAIT_MS). Never rejects: a store the host would not hand
 * over just leaves wsStoreReady false, and the app runs on the default tab. */
async function primeWsStore() {
  try {
    await lucidos.storage.ready;
    wsStoreReady = true;
  } catch (e) { /* run stateless */ }
}

function rememberWs(id) {
  try { lucidos.storage.local.setItem(WS_KEY, id); } catch (e) { /* run stateless */ }
}

/* Validated against the tabs that actually render right now, not just against
 * WORKSPACES. `other` is the case that bites: its tab exists only when the
 * classifier missed something, so restoring it on a clean day would select a tab
 * that isn't in the DOM — every lane empty, nothing highlighted, and no obvious
 * way back. Anything unshowable falls through to DEFAULT_WS.
 *
 * Called once, just before the first paint. If the store was not ready by then
 * this does nothing, and is never called again: switching tabs under a user who
 * is already reading the board would be worse than the default. The next click
 * saves what is on screen. */
function restoreWs() {
  if (!wsStoreReady) return;
  let id = null;
  try { id = lucidos.storage.local.getItem(WS_KEY); } catch (e) { return; }
  if (id && wsTabIds().includes(id)) view.ws = id;
}

/* ---------- storage ---------- */

async function loadTriage() {
  try {
    TRIAGE = JSON.parse(await lucidos.data.read(TRIAGE_PATH));
  } catch (e) {
    TRIAGE = { version: 4, prs: {} };
  }
  if (!TRIAGE.prs) TRIAGE.prs = {};
  migrateTriage();
}

/* v2 keyed decisions on `file:line`; v3 keys on finding id and stores `loc`.
 * A v2 entry is ambiguous by construction — one location may have held seven
 * findings — so it is NOT re-attached to a finding. It is demoted to a
 * carry-over record (loc kept, id gone), which surfaces as a question on any
 * finding at that spot. That is the only honest migration: the app cannot know
 * which of the seven the decision meant.
 *
 * v4 drops the accept/comment/dismiss verdict for a single bit — is this finding
 * going into a comment? An `accepted` and a `comment` both meant "this is real
 * and I'm doing something about it", so both become a pick. A `dismissed` has no
 * v4 equivalent at all: the model no longer records the ones you didn't keep, so
 * the entry is DELETED rather than kept as a `picked: false` tombstone. Storing
 * "not picked" would recreate dismissal under a quieter name — and an unpicked
 * finding is already the default state of every finding on the page.
 *
 * Nothing was migrated in practice: no triage.json existed on disk and the event
 * store held zero ReviewFindingTriaged when this landed (2026-08-11). The code is
 * here for a workspace that has one, not because this one did. */
function migrateTriage() {
  if (TRIAGE.version < 3) {
    for (const st of Object.values(TRIAGE.prs)) {
      const next = {};
      for (const [k, d] of Object.entries(st.findings || {})) {
        if (!k.includes(':')) { next[k] = d; continue; }     // already an id
        next[`v2:${k}`] = { ...d, loc: d.loc || k, migrated_from_v2: true };
      }
      st.findings = next;
    }
    TRIAGE.version = 3;
  }
  if (TRIAGE.version < 4) {
    for (const st of Object.values(TRIAGE.prs)) {
      const next = {};
      for (const [k, d] of Object.entries(st.findings || {})) {
        if (!d || typeof d !== 'object') continue;
        if (d.picked) { next[k] = d; continue; }             // already v4
        if (d.decision === 'dismissed') continue;            // no v4 equivalent
        if (d.decision === 'accepted' || d.decision === 'comment') {
          const { decision, ...rest } = d;
          next[k] = { ...rest, picked: true, migrated_from_v3: decision };
        }
      }
      st.findings = next;
    }
    TRIAGE.version = 4;
  }
}

async function saveTriage() {
  await lucidos.data.write(TRIAGE_PATH, JSON.stringify(TRIAGE, null, 2));
}

function prKey(pr) { return `${pr.repo_slug}-${pr.number}`; }
function locKey(f) { return `${f.file}:${f.line}`; }
/* Identity. Falls back to location only for a pre-id artifact. */
/* The Ask / Discuss click currently in flight, or null — `{ ref, at, anchor,
 * src }`, `src` naming the PR (see discussTarget). Deliberately in-memory and NOT
 * replayed from events like RESOLVING/ADDRESSING: those lock a button for 90
 * minutes because a second click would put two agents on one branch. A question
 * is read-only and asking twice is legitimate, so the only lock is a short one —
 * that PR's Discuss controls read `Starting…` until the thread lands or
 * ASK_PATIENCE_MS runs out, so a double tap can't spawn two. Mostly it exists so
 * the tab that asked can open the thread when it lands, and a reload that
 * forgets it costs a notification, not a duplicate agent. */
let ASKING = null;

function idKey(f) { return f.id || `loc:${locKey(f)}`; }

function prState(key) {
  if (!TRIAGE.prs[key]) TRIAGE.prs[key] = { findings: {} };
  const s = TRIAGE.prs[key];
  if (!s.findings) s.findings = {};
  return s;
}

function decisionFor(key, f) {
  return prState(key).findings[idKey(f)] || null;
}

/* Carry-over: a pick recorded at an EARLIER head, at this finding's location, on a
 * finding that no longer exists. The author pushed and the reviewer re-ran, so the
 * ids are new — but the spot you already picked is being raised again. Surface the
 * old pick as a question; never apply it.
 *
 * This is deliberately NOT auto-selection. Silently re-picking would put a finding
 * into a comment batch that you never read at this head — and the whole batch is
 * something you post to GitHub under your own name. */
function carryOverFor(key, f) {
  const st = prState(key);
  if (st.findings[idKey(f)]) return null;             // already decided at this head
  const sha = currentSha(key);
  const liveIds = new Set(liveIdsFor(key));
  for (const [id, d] of Object.entries(st.findings)) {
    if (d.loc === locKey(f) && d.sha7 !== sha && !liveIds.has(id)) return d;
  }
  return null;
}

function liveIdsFor(key) {
  const e = PRS.find(x => x.key === key);
  return e ? e.current.findings.map(idKey) : [];
}

/* ---------- load ---------- */

async function loadAll() {
  const paths = await lucidos.data.list(FINDINGS_GLOB);
  const docs = [];
  for (const p of paths) {
    try {
      const d = JSON.parse(await lucidos.data.read(p));
      if (d.schema !== 'review-cockpit/findings/v2') continue;
      d._path = p;
      docs.push(d);
    } catch (e) { /* skip unreadable artifact */ }
  }
  /* RECENCY DECIDES, NOT SIZE — and reading that backwards is what made the
   * Re-prep button do nothing (2026-08-19).
   *
   * Both collapses used to pick the artifact with the MOST findings. The comment
   * on the second one said "keep only the newest head", which is what it had to
   * mean, but the code never looked at a clock. #754 is the case: 50
   * findings at `a0ecdff` (17 Aug) against 32 at `2aec691` (19 Aug, the live
   * head), so the two-day-old artifact won, `current.pr.sha7` disagreed with the
   * queue's head, and the card read `stale`. The button it grew then emitted a
   * prep for a head that already had findings, which the on-demand script
   * correctly refuses — a control that looks alive and cannot ever fire. #763 had
   * the same shape (49 at `4cd3feb` vs 48 at `a3b91dd`).
   *
   * Count is also a bad proxy for quality in the one place it looked like one: a
   * corrupted tree INFLATES findings (knowhow/review-prep-rail.md, cost envelope —
   * #763's tree-corrupted run returned 68 against the clean re-prep's 49), so
   * "richest" actively prefers the broken run. It survives only as a tiebreak for
   * legacy artifacts with no parseable timestamp. */
  const runAt = d => Date.parse(d.run?.generated_at || '') || 0;
  const newer = (a, b) => runAt(a) !== runAt(b)
    ? runAt(a) > runAt(b)
    : a.findings.length > b.findings.length;

  // Collapse multiple runs of the same PR head: keep the newest run.
  const byHead = new Map();
  for (const d of docs) {
    const k = `${d.pr.repo_slug}-${d.pr.number}-${d.pr.sha7}`;
    const prev = byHead.get(k);
    if (!prev || newer(d, prev)) byHead.set(k, d);
  }
  // Then keep only the newest head per PR; older heads become history.
  const byPr = new Map();
  for (const d of byHead.values()) {
    const k = `${d.pr.repo_slug}-${d.pr.number}`;
    const prev = byPr.get(k);
    if (!prev) { byPr.set(k, { current: d, older: [] }); continue; }
    const [cur, old] = newer(d, prev.current) ? [d, prev.current] : [prev.current, d];
    byPr.set(k, { current: cur, older: prev.older.concat([old]) });
  }
  PRS = [...byPr.entries()].map(([key, v]) => ({ key, ...v }));
  PRS.sort((a, b) => b.current.pr.number - a.current.pr.number);
}

/* The review queue is the same kind of live reading as my-prs: overwritten each
 * sweep, wrong the moment someone revokes a request or merges. Same clock, same
 * absence-is-a-state discipline. */
async function loadQueue() {
  try {
    const d = JSON.parse(await lucidos.data.read(QUEUE_PATH));
    QUEUE = d.schema === 'review-cockpit/review-queue/v1' ? d : null;
  } catch (e) {
    QUEUE = null;   // never swept, or unreadable — the UI says so explicitly
  }
}

/* Join findings ONTO the live queue.
 *
 * The lane used to BE the findings glob, which made an artifact the reason a card
 * existed. That is backwards: a findings file is a fact about a SHA and never
 * expires, so merged PRs, revoked requests, and my own PRs reviewed as experiment
 * subjects (#1610) all stayed on the board forever, while a PR someone asked me
 * to review an hour ago was invisible because the rail hadn't finished.
 *
 * Now the QUEUE decides membership and findings are an attribute. Three states,
 * and they must stay distinguishable — "no findings yet" is a schedule fact, not
 * an empty review:
 *
 *   prepped     findings exist for the current head
 *   stale prep  findings exist, but for an older head — the PR moved under them
 *   pending     no findings for this PR at all; the rail hasn't run yet
 *
 * `answered` selects the OTHER side of the queue: rows where I've already had my
 * say on this head. They used to be filtered out and never rendered anywhere, so
 * the moment I commented a PR left the board entirely — see the "Answered,
 * waiting on them" lane for why a silent disappearance is the wrong ending.
 */
function reviewQueue(wsId, assigned = true, answered = false) {
  if (!QUEUE) return [];
  const inWs = p => wsId === 'all' || workspaceOf(p) === wsId;
  /* `assigned !== false` treats a legacy row (written before the field existed)
   * as assigned — the pre-2026-08-11 queue only ever held rows it believed were
   * mine, so that's the honest reading of an absent field. */
  const isAssigned = q => q.assigned !== false;
  return QUEUE.prs
    .filter(q => !!q.reviewed_current === answered)
    .filter(q => isAssigned(q) === assigned)
    .filter(inWs).map(q => {
    const entry = PRS.find(e => {
      const p = e.current.pr;
      return String(p.number) === String(q.number)
        && workspaceOf(p) === workspaceOf(q)
        && shortRepo(p.repo || '') === shortRepo(q.repo_name || q.repo || '');
    }) || null;
    const sha7 = entry?.current?.pr?.sha7;
    return {
      q,
      entry,
      prep: !entry ? 'pending' : (sha7 === q.sha7 ? 'prepped' : 'stale'),
    };
  });
}

/* An approval is a VERDICT. A comment is a turn in a conversation. Both land as
 * `reviewed_current: true`, which is why they shared one lane — but the lane's
 * sentence can only be true of one of them.
 *
 * "Waiting on them" describes a PR I answered WITHOUT signing off: the author
 * owes the next move, and until they make it nothing progresses. On an approved
 * PR nobody owes me anything and nothing is pending between us — the gate is
 * open from my side and what it waits on is a merge, or another reviewer, or CI.
 * Filing three approvals under "waiting on them" reads as three loose ends when
 * they are the opposite.
 *
 * ONLY A SUBMITTED REVIEW CAN APPROVE, so `kind` is checked alongside `state`. A
 * Conversation-tab comment carries no verdict at all (see saidHtml) and must
 * never be promoted into a lane that claims a sign-off GitHub does not have. */
function isApproval(row) {
  const s = row.q.my_review;
  return !!s && s.kind === 'review' && s.state === 'approved';
}

/* The my-PRs snapshot is a LIVE READING, not a log — mine.py overwrites it each
 * sweep. So the only honest way to render it is with its own clock: a value from
 * 09:00 yesterday is not "your PR status", it's a guess. Absence and staleness are
 * therefore first-class states here, not error paths. */
async function loadMine() {
  try {
    const d = JSON.parse(await lucidos.data.read(MINE_PATH));
    MINE = d.schema === 'review-cockpit/my-prs/v1' ? d : null;
  } catch (e) {
    MINE = null;   // never swept, or unreadable — the UI says so explicitly
  }
}

/* Briefs are a LOG, not a snapshot — the opposite of my-prs.json above. Each
 * entry describes a merge that happened at a fixed point in time and never
 * changes afterwards, so there's no "checked N ago" clock and no stale state:
 * an old brief isn't out of date, it's history. The only failure mode is the
 * file not existing yet, which reads as an empty lane. */
async function loadBriefs() {
  try {
    const d = JSON.parse(await lucidos.data.read(BRIEFS_PATH));
    const known = d.schema === 'merge-briefs/v1';
    BRIEFS = known ? (d.briefs || []) : [];
  } catch (e) {
    BRIEFS = [];   // never briefed, or unreadable
  }
}

/* Shipped BY me — the mirror of the briefs rail above, and a different shape
 * from both of its neighbours. my-prs.json is a snapshot of what is open and is
 * wrong the moment someone pushes; briefs.json is an append-only log the
 * detector adds to one PR at a time. This is a WINDOW: mine.py re-asks GitHub
 * for the last 7 days of my merges on every sweep and overwrites the file, so
 * rows leave it by aging out rather than by being pruned.
 *
 * A missing file is the honest empty state — the sweep predates this rail, or
 * has never run. `identities_failed` is carried separately by the artifact and
 * read by sourceFailures(), so an unreachable identity does not read as a
 * quiet week. */
async function loadShipped() {
  try {
    const d = JSON.parse(await lucidos.data.read(SHIPPED_PATH));
    SHIPPED = d.schema === 'review-cockpit/shipped/v1' ? d : null;
  } catch (e) {
    SHIPPED = null;   // never swept, or unreadable
  }
}

/* Avatars are CACHED BYTES, not a live fetch — mine.py downloads each face into
 * the workspace and writes this index. So the board renders them same-origin via
 * `lucidos.data.url()`, which is what makes them work with the network down, and
 * with no CSP question about reaching githubusercontent from inside the iframe.
 *
 * The extension is sniffed, never assumed: `github.com/<login>.png` serves JPEG
 * bytes despite the URL, so the index maps a login to a real path rather than
 * letting the app compose one. Missing index, missing login and a file that
 * 404s are all the same non-event — the row falls back to the name in text,
 * which is what it showed before avatars existed. */
async function loadAvatars() {
  try {
    const d = JSON.parse(await lucidos.data.read(AVATARS_PATH));
    AVATARS = d.schema === 'review-cockpit/avatars/v1' ? (d.avatars || {}) : {};
  } catch (e) {
    AVATARS = {};   // never cached, or unreadable — rows just show names
  }
}

/* A face beside the name, never instead of it.
 *
 * The avatar is DECORATION on a label that already reads correctly in text —
 * `aria-hidden`, empty alt, and the login stays in the DOM beside it. That is
 * deliberate: this board is one person 39 times out of 39 today, so a face is a
 * constant and a constant identifies nothing. It earns its width only on a row
 * that mixes people, and it must not cost anything on the rows that don't.
 *
 * `loading="lazy"` because a long Shipped rail is dozens of rows deep; `onerror`
 * removes the element entirely rather than leaving a broken-image glyph, so a
 * cache miss degrades to exactly the text-only row this replaced. */
function avatarHtml(login) {
  const src = AVATARS[String(login || '').toLowerCase()];
  if (!src) return '';
  return `<img class="who-face" src="${esc(lucidos.data.url(src))}" alt=""
    aria-hidden="true" loading="lazy" decoding="async"
    onerror="this.remove()">`;
}

/* A run of logins, each wearing its own face. Capped at three the way the text
 * always was, and the `+N` stays text — three faces and a number is a count you
 * can read, six faces and a number is a crowd. */
function whoFacesHtml(names) {
  return names.map(n =>
    `<span class="who-one">${avatarHtml(n)}${esc(n)}</span>`).join(', ');
}

function mineAgeMin() {
  if (!MINE?.generated_at) return null;
  return Math.round((Date.now() - new Date(MINE.generated_at).getTime()) / 60000);
}

function queueAgeMin() {
  if (!QUEUE?.generated_at) return null;
  return Math.round((Date.now() - new Date(QUEUE.generated_at).getTime()) / 60000);
}

/* ---------- conflict resolution ----------
 *
 * Reading a conflict is what this app already did well; doing something about it
 * meant leaving. This closes that loop from the card that reported it.
 *
 * SAME CONSTRAINT AS EVERY OTHER NATIVE ACTION HERE: an iframe can't run `git`.
 * The click emits `PrConflictResolutionRequested`, the `Resolve PR conflicts on
 * demand` trigger validates it and spawns a Claude Code session against the
 * registered repo. The app never decides how to resolve anything — it decides
 * which PR, and gets out of the way.
 *
 * WHY IT'S A SEPARATE BUTTON, NOT PART OF THE REFRESH: refresh is read-only and
 * cheap. This writes to a branch and force-pushes. Two very different blast radii
 * do not belong behind one control — hence the confirm, which names the branch
 * and the push so nobody discovers the force-push afterwards. */
async function loadResolving() {
  /* Replay the started/finished pair rather than trusting a local flag. A resolver
   * that finished, crashed, or was started from another device all resolve
   * correctly here — and the STARTED event is emitted by the trigger, so the state
   * reflects an agent that actually spawned, not a click that may have failed. */
  const key = e => `${e.payload?.repo}#${e.payload?.pr}@${e.payload?.sha7}`;
  try {
    const [started, finished] = await Promise.all([
      lucidos.events.query({ event_type: 'PrConflictResolutionStarted', limit: 100 }),
      lucidos.events.query({ event_type: 'PrConflictResolutionFinished', limit: 100 }),
    ]);
    const done = new Set(finished.map(key));
    const live = new Map();
    for (const e of started) {
      const k = key(e);
      if (done.has(k) || live.has(k)) continue;
      /* Same 90-minute ceiling the trigger dedups on. A session killed by an engine
       * restart emits no Finished, and without a TTL its PR would never offer the
       * button again. */
      const age = (Date.now() - new Date(e.created).getTime()) / 60000;
      if (age > 90) continue;
      live.set(k, { thread_id: e.payload?.thread_id, at: e.created,
                    sc: e.payload?.sc_worktree || null,
                    held_by: e.payload?.sc_worktree ? null : (e.payload?.branch_held_by || null) });
    }
    RESOLVING = live;
  } catch (err) {
    RESOLVING = new Map();
  }
}

function resolveKey(p) { return `${p.repo}#${p.number}@${p.sha7}`; }

/* ---------- addressing review comments ----------
 *
 * The sibling of the conflict resolver, and deliberately built on the same
 * bones: same lock shape, same TTL, same started/finished replay, same
 * emit -> trigger -> agent chain. What differs is what the agent may do.
 *
 * A rebase is one mechanical operation with a clear done state. A review comment
 * is a message from a person, and a sizeable share of them aren't change
 * requests at all — they're questions, or they encode a product decision. So the
 * agent sorts before it acts, pushes commits only for the mechanical ones, and
 * DRAFTS replies for the rest. It never writes to the PR conversation: that is
 * me typing under my own name, which this app has never automated (the
 * composer on the findings page works the same way).
 *
 * The push is plain — no force, no lease — because addressing comments ADDS
 * commits. A non-fast-forward rejection is then the correct outcome rather than
 * something to work around, and no worktree can be stranded, which is why this
 * has no counterpart to the stranded-worktree checker. */
let ADDRESSING = new Map();
/* Newest PrCommentResolutionFinished per PR head, so a card can report the
 * outcome after the agent is gone — especially the case the lock cannot express:
 * the agent ran, changed nothing, and left replies for me to send. */
let ADDRESSED = new Map();
/* What the re-request rail did after that push.
 *
 * GitHub does not re-request a reviewer when you push, so every successful run
 * of the addressing rail used to MANUFACTURE the stale-reviewer hole the board
 * paints yellow: new commits answering the reviewer, and the reviewer never told. A script on
 * the Finished event now re-asks whoever was waiting, and this is where the card
 * reports it — keyed on the same head, so it sits directly under the outcome it
 * belongs to.
 *
 * It is rendered even when nobody needed asking. "Nothing to re-ask" and "the
 * re-request silently didn't happen" look identical on a card that says nothing,
 * and this rail exists precisely because that invisibility is expensive. */
let REASKED = new Map();

async function loadAddressing() {
  const key = e => `${e.payload?.repo}#${e.payload?.pr}@${e.payload?.sha7}`;
  try {
    const [started, finished, reasked] = await Promise.all([
      lucidos.events.query({ event_type: 'PrCommentResolutionStarted', limit: 100 }),
      lucidos.events.query({ event_type: 'PrCommentResolutionFinished', limit: 100 }),
      lucidos.events.query({ event_type: 'PrReviewRerequested', limit: 100 }),
    ]);
    const asked = new Map();
    for (const e of reasked) {
      const k = key(e);
      if (!asked.has(k)) asked.set(k, { ...e.payload, at: e.created });
    }
    REASKED = asked;
    const done = new Map();
    /* Newest-first, so the first sighting of a key is the current outcome. */
    for (const e of finished) {
      const k = key(e);
      if (!done.has(k)) done.set(k, { ...e.payload, at: e.created });
    }
    const live = new Map();
    for (const e of started) {
      const k = key(e);
      if (done.has(k) || live.has(k)) continue;
      const age = (Date.now() - new Date(e.created).getTime()) / 60000;
      if (age > 90) continue;
      live.set(k, { thread_id: e.payload?.thread_id, at: e.created,
                    threads: e.payload?.threads,
                    sc: e.payload?.sc_worktree || null,
                    held_by: e.payload?.sc_worktree ? null : (e.payload?.branch_held_by || null) });
    }
    ADDRESSING = live;
    ADDRESSED = done;
  } catch (err) {
    ADDRESSING = new Map();
    ADDRESSED = new Map();
    REASKED = new Map();
  }
}

/* ---------- prepping a PR on demand ----------
 *
 * The review lane marks a PR the rail hasn't reached as `not prepped yet`. That
 * chip is a SCHEDULE fact, not a verdict: the detector polls hourly, waits 10
 * minutes for a fresh head to settle, and the review itself takes ~40 minutes. So
 * a PR opened twenty minutes ago correctly reads pending — and there was no way
 * to say "do this one now, I'm about to read it".
 *
 * WHY IT EMITS A DIFFERENT EVENT THAN THE RAIL USES. The app does NOT emit
 * `ReviewPrepRequested` itself, even though that is the event the reviewer
 * subscribes to. Two reasons, both in the trigger script's header:
 * the payload needs the rail's `gh_config_dir` (a second copy of the two-identity
 * table in JS is exactly the drift that 404s), and the queue artifact's head SHA
 * is up to an hour old, so the script re-reads the CURRENT head before queueing.
 * `ReviewPrepManualRequested` is the click; `ReviewPrepRequested` is what the
 * script emits once it has checked the facts.
 *
 * THIS IS THE EXPENSIVE BUTTON, and the only one in the app that is. Refresh is
 * two API calls; this is ~40 minutes and millions of tokens. Hence the confirm,
 * which says so in those words — the Refresh button's whole design note is that
 * it must never be able to launch this by accident, and a one-click version of
 * this would reintroduce that risk from the other side.
 *
 * The lock is keyed on `${repo}#${pr}@${sha7}` like the two writing rails, and
 * replayed from the event log rather than held in memory: a page reload must not
 * be able to queue a second 40-minute review of the same head. */
let PREPPING = new Map();

function prepKey(repo, number, sha7) { return `${repo}#${number}@${sha7}`; }

/* In-flight = a request with no findings yet, younger than the rail's own
 * stale-retry window. Past that the detector treats the run as dead and re-emits
 * anyway, so holding the button disabled would be claiming a review is running
 * when nothing is. Same 3 hours as STALE_HOURS in detect.py. */
const PREP_TTL_MIN = 180;

/* How long a running prep has been going, phrased once and used by both the chip
 * and the strip so they can never disagree. `0m in` is the first thing you see
 * after clicking and it reads like a stalled counter, so the first minute says
 * what actually happened instead. */
function prepElapsed(at) {
  const mins = Math.round((Date.now() - new Date(at).getTime()) / 60000);
  return { mins, phrase: mins < 1 ? 'just started' : `${fmtAge(mins)} in` };
}

async function loadPrepping() {
  const key = e => prepKey(e.payload?.repo, e.payload?.pr, e.payload?.sha);
  try {
    const [requested, produced, refused] = await Promise.all([
      lucidos.events.query({ event_type: 'ReviewPrepRequested', limit: 100 }),
      lucidos.events.query({ event_type: 'ReviewFindingsProduced', limit: 100 }),
      lucidos.events.query({ event_type: 'ReviewPrepRefused', limit: 100 }),
    ]);
    /* Findings are the terminal state, and they're keyed by (repo, pr, sha) in
     * both events — the same join the detector does off the event log. Using the
     * findings ARTIFACTS instead would miss the window between the emit and the
     * app's next re-read.
     *
     * TIME MATTERS, and leaving it out broke the re-prep case completely
     * (2026-08-19). This was a bare Set: any key with findings at that head was
     * terminal FOREVER, so a re-prep — whose entire purpose is that findings
     * already exist at this head and are wrong — matched `done` the instant it
     * was requested and never showed as running at all. #763 was re-prepped
     * at 21:09 with a review genuinely in flight, and the card said `Re-prep`
     * beside findings from 13:14 as though nothing had been asked for.
     *
     * So the terminal test is the same one the refusal below uses: findings only
     * end a request they are NEWER than. */
    const doneAt = new Map();
    for (const e of produced) {
      const k = key(e);
      const t = new Date(e.created).getTime();
      if (!(doneAt.get(k) >= t)) doneAt.set(k, t);
    }
    /* A refusal is the OTHER terminal state, and it belongs in this replay for
     * the same reason the SSE handler drops the lock live: a reload must not
     * resurrect a "reviewing" chip for a click the rail turned down. Only a
     * refusal NEWER than the request counts — a click refused at 18:33 says
     * nothing about the one that succeeded at 18:59. */
    const refusedAt = new Map();
    for (const e of refused) {
      const k = key(e);
      const t = new Date(e.created).getTime();
      if (!(refusedAt.get(k) >= t)) refusedAt.set(k, t);
    }
    const live = new Map();
    for (const e of requested) {
      const k = key(e);
      if (live.has(k)) continue;
      const at = new Date(e.created).getTime();
      if (doneAt.get(k) > at) continue;
      if (refusedAt.get(k) > at) continue;
      const age = (Date.now() - at) / 60000;
      if (age > PREP_TTL_MIN) continue;
      live.set(k, { at: e.created, manual: !!e.payload?.manual });
    }
    PREPPING = live;
  } catch (err) {
    PREPPING = new Map();
  }
}

/* Which repos can be prepped — the same config groups detect.py turns into rails,
 * the same way RESOLVABLE mirrors REPOS in the conflict resolver, and for the same
 * reason: the app must not offer a button the trigger will refuse. A PR outside this list
 * still renders, just without the button. */
let PREPPABLE = new Set();   // filled by loadConfig()

/* ---------- stranded worktrees ----------
 *
 * A resolver rebases detached and force-pushes, so it never touches the human's
 * own checkout of that branch — which is exactly why that checkout is left
 * pointing at commits that no longer exist. Git cannot warn about it: a stranded
 * worktree and a worktree with genuine local work produce the identical
 * "diverged, N and M different commits" message.
 *
 * The card used to render a flat "reset it after the push" line. That put the
 * whole job on the reader — find the worktree, decide whether the divergence is
 * the rebase or real work, reconstruct the command — and it said the same thing
 * whether a reset was lossless or would have destroyed something.
 *
 * check_worktree.py answers that question with `git cherry` (patch-id, so a
 * rebased commit is recognised despite its new SHA) and emits the verdict. This
 * renders it. The reset itself stays the human's keystroke: the app offers a
 * command to copy, never runs one. */
let STRANDED = new Map();

function strandKey(p) { return `${p.repo}#${p.number}@${p.sha7}`; }

async function loadStranded() {
  try {
    const rows = await lucidos.events.query(
      { event_type: 'PrWorktreeStrandVerified', limit: 100 });
    const m = new Map();
    /* Newest wins. The query is newest-first, so the first sighting of a key is
     * the current verdict — a worktree the human has since reset re-verifies as
     * `synced` and the script emits nothing, so a stale `safe` would otherwise
     * linger. Hence the age ceiling below. */
    for (const e of rows) {
      const p = e.payload || {};
      const k = `${p.repo}#${p.pr}@${p.sha7}`;
      if (m.has(k)) continue;
      /* 7 days. Past that the worktree has almost certainly been reaped or
       * dealt with, and an unverifiable claim about the state of a directory is
       * worse than silence. */
      if ((Date.now() - new Date(e.created).getTime()) / 86400000 > 7) continue;
      m.set(k, { ...p, at: e.created });
    }
    STRANDED = m;
  } catch (err) {
    STRANDED = new Map();
  }
}

function strandHtml(s) {
  const name = esc(s.name || 'a local worktree');
  /* `resolved` = commits whose patch id changed because the rebase resolved a
   * conflict in them, matched back by subject. Naming them is deliberate: the
   * match is by subject, which is not a proof, so the human sees what they are
   * being asked to trust rather than a bare "safe". */
  const note = s.resolved?.length
    ? `<span class="strand-note">${s.resolved.length === 1 ? 'One commit was'
        : `${s.resolved.length} commits were`} rewritten while resolving —
        ${s.resolved.map(c => `<code>${esc(c.sha7)}</code>`).join(', ')}
        ${s.resolved.length === 1 ? 'is' : 'are'} upstream under a new SHA.</span>`
    : '';

  if (s.verdict === 'safe') {
    return `<span class="strand ok">
      <strong>${name}</strong> is behind by ${s.behind} — every local commit is
      upstream, so a reset loses nothing.${note}
      <button type="button" class="btn-inline" data-strand-copy="${esc(s.command)}"
        title="Copy the reset command">Copy reset command</button>
    </span>`;
  }
  if (s.verdict === 'unique') {
    return `<span class="strand warn">
      <strong>${name}</strong> has ${s.unique.length} commit${s.unique.length === 1 ? '' : 's'}
      that ${s.unique.length === 1 ? 'is' : 'are'} <em>not</em> upstream —
      do not reset it:
      ${s.unique.map(c => `<code>${esc(c.sha7)}</code> ${esc(c.subject)}`).join('; ')}
    </span>`;
  }
  if (s.verdict === 'dirty') {
    return `<span class="strand warn">
      <strong>${name}</strong> has ${s.dirty} uncommitted change${s.dirty === 1 ? '' : 's'} —
      deal with those before resetting it.
    </span>`;
  }
  return `<span class="strand warn">Could not check <strong>${name}</strong>${
    s.detail ? ` — ${esc(s.detail)}` : ''}.</span>`;
}

/* Which repos the resolver can act on, and HOW it is allowed to integrate — the
 * listed repos of the config, the same table REPOS in the trigger script reads, so
 * the app never offers a button the trigger will refuse. A PR outside this map
 * still shows as conflicted, just without the button.
 *
 * WHY THE STYLE IS CONFIGURED AND NOT DERIVED: a repo's own tracked
 * `.claude/settings.json` can deny `Bash(git push --force*)`, which prefix-matches
 * `--force-with-lease` as well — so on such a repo a rebase can be performed and
 * then never published. They merge instead and publish with a
 * plain fast-forward push. Nothing about the repo's merge style predicts this, so it
 * cannot be inferred; it is a per-repo fact. The confirm dialog and the button
 * subtitle read from it, because a dialog promising a force-push on a repo that
 * forbids one is how a click becomes a wasted 20-minute agent run. */
let RESOLVABLE = new Map();   // repo -> 'rebase' | 'merge', filled by loadConfig()

function conflictStyle(p) { return RESOLVABLE.get(p.repo) || 'rebase'; }

/* A fork head is excluded, not hidden: there are no push rights on someone else's
 * branch, so the resolution has to go through them. Offering the button would
 * produce an agent that does the work and then can't publish it. */
function canResolve(p) {
  return p.state === 'conflict' && !p.cross_repo && !!p.head_ref && !!p.base_ref
    && RESOLVABLE.has(p.repo) && listens('PrConflictResolutionRequested');
}

async function requestResolve(p) {
  const merge = conflictStyle(p) === 'merge';
  const ok = await lucidos.ui.confirm({
    title: merge
      ? `Merge ${p.base_ref} into ${shortRepo(p.repo)}#${p.number}?`
      : `Rebase ${shortRepo(p.repo)}#${p.number}?`,
    message: merge
      ? `A coding agent will merge ${p.base_ref} into ${p.head_ref}, resolve the `
        + `conflicts, build and test, then push the branch.\n\n`
        + `It stops and reports instead of guessing when a hunk is a product decision. `
        + `The push is a plain fast-forward — no history is rewritten, so nothing you `
        + `have checked out locally can be stranded.`
      : `A coding agent will rebase ${p.head_ref} onto ${p.base_ref}, resolve the `
        + `conflicts, build and test, then force-push the branch.\n\n`
        + `It stops and reports instead of guessing when a hunk is a product decision, `
        + `and the push is force-with-lease pinned to ${p.sha7}, so it cannot overwrite `
        + `anyone else's work.`,
    okLabel: 'Start the agent',
  });
  if (!ok) return;

  try {
    await lucidos.events.emit('PrConflictResolutionRequested', {
      summary: `Resolve conflicts on ${p.repo}#${p.number} (${p.head_ref} -> ${p.base_ref})`,
      repo: p.repo, pr: p.number, url: p.url, sha7: p.sha7,
      head_ref: p.head_ref, base_ref: p.base_ref,
      head_repo: p.head_repo, cross_repo: !!p.cross_repo,
    });
    /* Optimistic, and labelled as such: the card flips to "starting…" now, and the
     * real PrConflictResolutionStarted replaces it with a thread link a second or
     * two later. Without this the click looks dead for the whole
     * emit -> SSE -> scheduler -> spawn round trip. */
    RESOLVING.set(resolveKey(p), { thread_id: null, at: new Date().toISOString(),
                                   pending: true });
    render();
    lucidos.ui.toast('Starting the resolver…', 'info', { key: 'resolve', durationMs: 4000 });
  } catch (err) {
    lucidos.ui.toast('Failed to reach the resolver', 'error', { key: 'resolve' });
  }
}

/* Same repo gate as the rebase button. The Address comments rail does NOT ship
 * with the Pulls plugin, so the button shows only when some installed, unpaused
 * trigger answers PrCommentResolutionRequested — never a button nothing hears. A fork head is excluded for the same reason: commits with nowhere
 * to push are worse than no button.
 *
 * NOT gated on `state === 'comments'`. classify() reports only the most-blocking
 * state, so a conflicted PR with three questions on it reads `conflict` — and
 * those questions would be unreachable from the card that knows about them.
 * `threads.length` is the honest condition: are there comments waiting, yes or
 * no, regardless of what else is wrong. */
function canAddress(p) {
  return (p.threads?.length || 0) > 0 && !p.cross_repo && !!p.head_ref && !!p.base_ref
    && RESOLVABLE.has(p.repo) && !!LISTENED && LISTENED.has('PrCommentResolutionRequested');
}

async function requestAddress(p) {
  const n = p.threads.length;
  const who = [...new Set(p.threads.map(t => t.author))].join(', ');
  const ok = await lucidos.ui.confirm({
    title: `Address ${n} comment${n === 1 ? '' : 's'} on ${shortRepo(p.repo)}#${p.number}?`,
    message: `A coding agent reads the ${n} open thread${n === 1 ? '' : 's'} from ${who}, `
      + `makes the mechanical fixes, verifies, and pushes to ${p.head_ref}.\n\n`
      + `It does not reply on the threads or resolve them. Anything that's a question `
      + `or a product decision comes back as a drafted reply for you to send.\n\n`
      + `If it pushes, ${who} get${who.includes(',') ? '' : 's'} re-asked to review — `
      + `GitHub doesn't do that on a push, so otherwise the PR reads as "in review" `
      + `with nobody looking at it.`,
    okLabel: 'Start the agent',
  });
  if (!ok) return;

  try {
    await lucidos.events.emit('PrCommentResolutionRequested', {
      summary: `Address ${n} review comment${n === 1 ? '' : 's'} on ${p.repo}#${p.number}`,
      repo: p.repo, pr: p.number, url: p.url, sha7: p.sha7,
      head_ref: p.head_ref, base_ref: p.base_ref,
      head_repo: p.head_repo, cross_repo: !!p.cross_repo,
      threads: n,
    });
    /* Optimistic, same as the rebase button: the real Started event replaces
     * this with a thread link a second or two later. */
    ADDRESSING.set(resolveKey(p), { thread_id: null, at: new Date().toISOString(),
                                    threads: n, pending: true });
    render();
    lucidos.ui.toast('Starting the agent…', 'info', { key: 'address', durationMs: 4000 });
  } catch (err) {
    lucidos.ui.toast('Failed to reach the comment resolver', 'error', { key: 'address' });
  }
}

/* ---------- merging from the row ----------
 *
 * THE ONE WRITE THAT GOES STRAIGHT TO GITHUB. Every other write in Pulls —
 * rebase, answer comments, prep, ask — is an event that a trigger turns into an
 * agent, because each needs git, a worktree and minutes. A merge needs none of
 * that: it is ONE HTTP call, and its answer is worth having back under the
 * finger that asked. So a workspace that names a proxy in `inAppMerge` calls
 * it directly with `lucidos.proxy` (the token stays in the engine) and reports
 * the outcome in place. Every other workspace keeps the link to GitHub.
 *
 * THIS APP CAN BE THE ONLY GATE. On a private repo on GitHub's free plan,
 * branch protection and rulesets are unavailable (both endpoints answer
 * "Upgrade to GitHub Pro"), so GitHub will merge any conflict-free PR, red CI
 * and all. What stands between a tap and main is the pre-flight below, read
 * live at the tap rather than trusted from the hourly sweep:
 *   the PR    open, not a draft, still at the head the row was drawn from,
 *             mergeable and `clean` (`unstable` goes on to the check read,
 *             so the refusal can name the check)
 *   checks    every check run on that head completed as success, neutral or
 *             skipped. Check runs, NOT the combined status: nothing posts
 *             commit statuses on this repo, so that endpoint reads "pending"
 *             with zero statuses forever.
 *   reviews   GitHub's own rule: each reviewer's latest APPROVED,
 *             CHANGES_REQUESTED or DISMISSED review is their verdict, COMMENTED
 *             changes nothing, and my own reviews don't count. It needs one
 *             approval ON this head and no changes requested.
 * Then a confirm built from that fresh data, then the merge — pinned to the
 * head SHA the pre-flight read, so a push in between is a 409 and not a merge
 * of commits nobody checked. The repo allows squash only and deletes the head
 * branch itself, so the app deletes nothing.
 *
 * THREE QUIRKS the code exists for:
 *   · GitHub answers 403 "Request forbidden by administrative rules" to a
 *     request with no User-Agent. Every call sets one; a browser that will not
 *     override its own sends that instead, which also passes.
 *   · PUT …/merge on an ALREADY-merged PR answers 200 {merged: true} with the
 *     original merge SHA, even for a stale `sha`. That response cannot tell "I
 *     merged it" from "it was already merged", so the pre-flight stops on a
 *     merged PR before any PUT is sent.
 *   · A PUT that rejects (timeout, abort, network) may still have merged: the
 *     request can land after its answer is lost. So a rejection is never
 *     reported as "not merged" until a fresh GET says the PR is still open.
 *
 * Keyed like RESOLVING (`repo#pr@sha7`), so a push mid-flow lands on a new key
 * and the button comes back. In memory only: unlike the agent rails nothing
 * here outlives the tap — the merge is done or refused before a reload could
 * matter. Phases: checking → merging → merged. */
let MERGING = new Map();

const GH_HEADERS = {
  Accept: 'application/vnd.github+json',
  'X-GitHub-Api-Version': '2022-11-28',
  'User-Agent': 'lucidos-pulls',
};
/* `mergeable: null` means GitHub is still computing it: wait this long, read
 * once more, then give up rather than poll. */
const MERGE_RECHECK_MS = 2000;
const CHECK_OK = new Set(['success', 'neutral', 'skipped']);
const MERGE_STATE_WHY = {
  dirty: base => `it has conflicts with ${base} now`,
  blocked: () => 'GitHub is blocking the merge',
  behind: base => `it's behind ${base}; update the branch first`,
  unstable: () => "a check on it isn't passing",
  unknown: () => "GitHub couldn't tell whether it merges cleanly; try again in a moment",
};

/* A refusal: the words for the toast, how loud, and whether the board's
 * reading is now out of date. */
class MergeStop extends Error {
  constructor(message, { tone = 'warning', refresh = false, merged = false } = {}) {
    super(message);
    this.tone = tone;
    this.refresh = refresh;
    /* Already merged: not a refusal to undo but a state to show. */
    this.merged = merged;
  }
}

async function ghCall(ws, path, init = {}) {
  const res = await lucidos.proxy(ws.inAppMerge.proxy).fetch(path, {
    ...init, headers: { ...GH_HEADERS, ...(init.headers || {}) },
  });
  let body = null;
  try { body = await res.json(); } catch (e) { /* empty or non-JSON body */ }
  return { status: res.status, body };
}

function ghSaid(res) {
  return String(res.body?.message || `HTTP ${res.status}`).replace(/\.\s*$/, '');
}

async function ghRead(ws, path) {
  const res = await ghCall(ws, path);
  if (res.status < 200 || res.status >= 300) {
    throw new MergeStop(`Not merged — couldn't read the PR from GitHub: ${ghSaid(res)}.`, { tone: 'error' });
  }
  return res.body;
}

function nameList(xs) {
  return xs.length <= 2 ? xs.join(' and ') : `${xs[0]} and ${xs.length - 1} more`;
}

/* Everything the confirm states, read fresh. Throws a MergeStop on the first
 * thing that is not true. */
async function mergePreflight(p, ws) {
  const base = `/repos/${p.repo}`;
  const readPr = () => ghRead(ws, `${base}/pulls/${p.number}`);
  const vet = pr => {
    if (pr.merged) throw new MergeStop('Already merged', { tone: 'info', refresh: true, merged: true });
    if (pr.state !== 'open') throw new MergeStop(`Not merged — #${p.number} is closed.`, { refresh: true });
    if (pr.draft) throw new MergeStop(`Not merged — #${p.number} is a draft.`, { refresh: true });
    if (!String(pr.head?.sha || '').startsWith(p.sha7)) {
      throw new MergeStop(`Not merged — new commits landed on #${p.number} since the board was last updated; refreshing.`,
        { refresh: true });
    }
  };

  let pr = await readPr();
  vet(pr);
  if (pr.mergeable === null) {
    await new Promise(r => setTimeout(r, MERGE_RECHECK_MS));
    pr = await readPr();
    vet(pr);
    if (pr.mergeable === null) throw new MergeStop('GitHub is still checking this PR — try again in a moment');
  }
  const into = pr.base?.ref || p.base_ref || 'main';
  /* `unstable` is what GitHub reports while a check is still running as well
   * as after one fails, so it goes on to the check-run read below, which says
   * which check and which of the two. If every run passes and GitHub still
   * says `unstable`, the cause is something the runs don't show (a commit
   * status), and it is refused right after that read. */
  const unstable = pr.mergeable === true && pr.mergeable_state === 'unstable';
  if (!unstable && (pr.mergeable !== true || pr.mergeable_state !== 'clean')) {
    const why = MERGE_STATE_WHY[pr.mergeable_state]?.(into)
      || `GitHub reports it as "${pr.mergeable_state}", not clean`;
    throw new MergeStop(`Not merged — ${why}.`);
  }
  const sha = pr.head.sha;

  const ck = await ghRead(ws, `${base}/commits/${sha}/check-runs?per_page=100`);
  const runs = ck.check_runs || [];
  /* No run at all is not a pass: the one CI job may simply not have
   * registered yet, and with no protection behind this, "nothing failed"
   * would merge untested code. */
  if (!runs.length) throw new MergeStop('Not merged — no checks have reported on this commit yet.');
  if ((ck.total_count || 0) > runs.length) {
    throw new MergeStop('Not merged — this commit has more checks than one read returns; check them on GitHub.');
  }
  const failed = runs.filter(r => r.status === 'completed' && !CHECK_OK.has(r.conclusion)).map(r => r.name);
  if (failed.length) throw new MergeStop(`Not merged — ${nameList(failed)} failed.`);
  const running = runs.filter(r => r.status !== 'completed').map(r => r.name);
  if (running.length) {
    throw new MergeStop(`Not merged — ${nameList(running)} ${running.length === 1 ? 'is' : 'are'} still running.`);
  }
  if (unstable) throw new MergeStop(`Not merged — ${MERGE_STATE_WHY.unstable()}.`);

  const reviews = await ghRead(ws, `${base}/pulls/${p.number}/reviews?per_page=100`);
  const me = String(ws.who || '').toLowerCase();
  const verdict = new Map();
  for (const r of [...(reviews || [])].sort((a, b) => Date.parse(a.submitted_at || 0) - Date.parse(b.submitted_at || 0))) {
    const who = r.user?.login;
    if (!who || who.toLowerCase() === me || isMe(who)) continue;
    if (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED' || r.state === 'DISMISSED') verdict.set(who, r);
  }
  const verdicts = [...verdict.entries()];
  const changes = verdicts.filter(([, r]) => r.state === 'CHANGES_REQUESTED').map(([w]) => w);
  if (changes.length) throw new MergeStop(`Not merged — ${nameList(changes)} requested changes.`);
  const approved = verdicts.filter(([, r]) => r.state === 'APPROVED');
  const onHead = approved.filter(([, r]) => r.commit_id === sha).map(([w]) => w);
  /* No reviewer requested and no verdict from anyone: an unreviewed PR on a repo
   * that doesn't require review (GitHub's `clean` state above already proved
   * branch protection isn't blocking it). Anyone requested, or any approval on
   * an older commit, still means someone's say is outstanding. */
  const requested = [
    ...(pr.requested_reviewers || []).map(u => u.login),
    ...(pr.requested_teams || []).map(t => t.slug || t.name),
  ].filter(Boolean);
  const unreviewed = !verdicts.length && !requested.length;
  if (!onHead.length && !unreviewed && requested.length && !approved.length) {
    throw new MergeStop(`Not merged — waiting on ${nameList(requested)} to review.`);
  }
  if (!onHead.length && !unreviewed) {
    throw new MergeStop(approved.length
      ? `Not merged — ${nameList(approved.map(([w]) => w))} approved an earlier commit, not ${sha.slice(0, 7)}.`
      : 'Not merged — nobody has approved it yet.');
  }

  const checks = runs.length === 1
    ? `${runs[0].name} ${runs[0].conclusion === 'success' ? 'passed' : runs[0].conclusion}`
    : `${runs.length} checks passed`;
  return { pr, sha, into, approvers: onHead, unreviewed, checks };
}

/* The board's reading is out of date: ask the sweep again, the same event the
 * resolver-finished path emits (not the Refresh button's spinner flow). */
async function requestStatusRefresh(summary) {
  try {
    await lucidos.events.emit('PrStatusRefreshRequested', { summary, source: 'review-cockpit' });
  } catch (err) { /* the hourly sweep will catch up */ }
}

async function requestMerge(p) {
  const ws = wsMeta(workspaceOf(p));
  const key = resolveKey(p);
  /* The second tap of a double tap lands here, while the first is in flight. */
  if (!ws.inAppMerge || MERGING.has(key)) return;
  const phase = ph => {
    if (ph) MERGING.set(key, { phase: ph, at: Date.now() }); else MERGING.delete(key);
    render();
  };
  /* Every refusal gives the Merge button back. */
  const refuse = (message, tone = 'warning', refresh = false) => {
    phase(null);
    lucidos.ui.toast(message, tone, { key: 'merge' });
    if (refresh) requestStatusRefresh(`Re-read PR status after a merge of ${p.repo}#${p.number} was refused`);
  };
  const merged = async (pr, sha, mergeSha) => {
    phase('merged');
    lucidos.ui.toast(`Merged #${p.number}`, 'success', { key: 'merge' });
    try {
      await lucidos.events.emit('PrMergedFromPulls', {
        summary: `Squash-merged ${p.repo}#${p.number} into ${pr.base?.ref || 'main'} from Pulls`,
        repo: p.repo, pr: p.number, title: pr.title, head_sha: sha, merge_sha: mergeSha || null,
      });
    } catch (err) { /* the merge happened; the record is what failed */ }
    requestStatusRefresh(`Re-read PR status after ${p.repo}#${p.number} was merged from Pulls`);
  };

  phase('checking');
  let pre;
  try {
    pre = await mergePreflight(p, ws);
  } catch (err) {
    /* Merged elsewhere since the sweep (on GitHub, or by the night gate). The
     * row shows what is now true instead of offering Merge again. This app
     * merged nothing, so there is no PrMergedFromPulls. */
    if (err instanceof MergeStop && err.merged) {
      phase('merged');
      lucidos.ui.toast(err.message, err.tone, { key: 'merge' });
      requestStatusRefresh(`Re-read PR status: ${p.repo}#${p.number} was already merged`);
      return;
    }
    /* Nothing has been written yet, so "not merged" is true whatever failed. */
    if (err instanceof MergeStop) return refuse(err.message, err.tone, err.refresh);
    return refuse("Couldn't reach GitHub — not merged", 'error');
  }
  const { pr, sha, into, approvers, unreviewed, checks } = pre;

  const ok = await lucidos.ui.confirm({
    title: unreviewed && !approvers.length
      ? `Merge #${p.number} into ${into} without review?`
      : `Merge #${p.number} into ${into}?`,
    message: `${pr.title}\n\nSquash-merges ${sha.slice(0, 7)} into ${into} as one commit. `
      + (approvers.length
        ? `Approved by ${approvers.join(', ')} on this commit · ${checks}.`
        : `No reviewers — merging without review · ${checks}.`),
    okLabel: 'Merge',
  });
  if (!ok) return phase(null);

  phase('merging');
  let res;
  try {
    res = await ghCall(ws, `/repos/${p.repo}/pulls/${p.number}/merge`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      /* The title matches the squash commits already on main; no
       * commit_message, so the repo's default body applies. */
      body: JSON.stringify({ merge_method: 'squash', sha, commit_title: `${pr.title} (#${p.number})` }),
    });
  } catch (err) {
    /* The answer was lost, not necessarily the merge. Ask GitHub. */
    let after = null;
    try { after = (await ghCall(ws, `/repos/${p.repo}/pulls/${p.number}`)).body; } catch (e) { after = null; }
    if (after?.merged) return merged(pr, sha, after.merge_commit_sha);
    /* Still open. The sweep is asked again anyway, in case the lost PUT lands
     * after this read. */
    if (after?.state === 'open') return refuse("Couldn't reach GitHub — not merged", 'error', true);
    return refuse("Couldn't reach GitHub to confirm the merge — refreshing to find out", 'error', true);
  }
  if (res.status === 200 && res.body?.merged) return merged(pr, sha, res.body.sha);
  if (res.status === 409) {
    return refuse('Not merged — the branch moved between the check and the merge; refreshing.', 'warning', true);
  }
  return refuse(`Not merged — GitHub said: ${ghSaid(res)}.`, 'error');
}

/* Ask the rail to review one PR now, ahead of its own schedule.
 *
 * The confirm names the cost in the two units that matter — wall clock and what
 * comes back — because this is the one control in the app that spends ~40 minutes
 * and millions of tokens on a click. Nothing else here costs more than a few API
 * calls, so nobody arrives at this button primed to expect that.
 *
 * IT STARTS NOW; THERE IS NO QUEUE. The wording used to say "Queue the review",
 * which described a wait that does not exist — the emit fires an event trigger,
 * the script re-reads the head and emits `ReviewPrepRequested`, and both rails
 * pick it up in the same second. The only thing that can hold it is the thread
 * queue's ordinary admission control, the same as every other spawn. Saying
 * "queue" made the ~40 minutes read as queueing latency, so a button that had in
 * fact started reads as one that deferred.
 *
 * `force` is what makes a REDO real. The script exits 0 when findings already
 * exist at this head — the right default for a double-click, and the exact reason
 * a re-prep on a correctly-prepped head would otherwise do nothing at all. A
 * button labelled Re-prep means the artifact on disk is the thing being rejected,
 * so it says so in the payload rather than being silently absorbed by the guard.
 *
 * The optimistic lock is keyed on the head the CARD was rendered with, while the
 * script queues whatever head GitHub reports at click time. When those differ the
 * lock is briefly on the wrong key — until the real ReviewPrepRequested lands a
 * second later and loadPrepping() re-keys it. Wrong for one second beats a button
 * that looks dead for the whole emit -> trigger -> gh round trip. */
async function requestPrep(q, prep) {
  /* TWO SPELLINGS OF THE SAME REPO, and they are not interchangeable here.
   * The EMIT carries the org-qualified name, because the script resolves it
