      </div>${v1 ? '' : shotsHtml(c)}
    </div>`;
  /* A scenario a capture tool would shoot: the area, then its screen and its
   * setup on labelled lines. */
  const scenarioHtml = c => `<div class="lrow">
      <p class="lrow-lead">${esc(c.surface)}</p>${c.where || c.state ? `<dl class="lrow-kv">${
        c.where ? `<div><dt>Screen</dt><dd>${esc(c.where)}</dd></div>` : ''}${
        c.state ? `<div><dt>Setup</dt><dd>${esc(c.state)}</dd></div>` : ''}</dl>` : ''}
    </div>`;
  const body = [
    changes.length ? `${laneGroupHtml('fileDiff', 'Changes', total)}${changes.map(changeHtml).join('')}${
      more > 0 ? `<p class="lrow lrow-more">+${esc(more)} more</p>` : ''}`
      : '<p class="lrow lrow-quiet">No user-visible change.</p>',
    capture.length ? `${laneGroupHtml('eye', 'Shots not taken', capture.length)}<p class="lrow lrow-more">The states a
      screenshot should have been taken in.</p>${capture.map(scenarioHtml).join('')}` : '',
  ].filter(Boolean).join('');
  return laneBoxHtml({ band: 'pbehaviour', cls: 'band-behaviour', title: 'Behaviour',
    tone: total && fired ? 'accent' : 'muted',
    count: total, say: plural(total, 'user-visible change'), state: firedWord(fired), open,
    why: `What a user would notice — from pr-behaviour at ${h.sha7}`,
    body: `${laneWhyHtml(h, 'behaviour')}${body}` });
}

/* Is a change one a screenshot should show? The change can say so (`ui`);
 * otherwise its evidence's file does: a component, a screen, a stylesheet. */
const UI_EVIDENCE = /\.(?:tsx|jsx|vue|svelte|css|scss|html|storyboard|xib)(?::|$)|(?:^|\/)(?:components|screens|views|pages|ui)\//i;
function isUiChange(c) {
  return typeof c.ui === 'boolean' ? c.ui : UI_EVIDENCE.test(String(c.evidence || ''));
}

/* A v2 change's screenshots, before then after: side by side where there is
 * room, stacked on a phone. Each is an <img> through `lucidos.data.url` — an
 * SVG mockup too, never inlined, so nothing in it runs or fetches — and a tap
 * opens it larger (openShot). No shots: the reason in a muted line, or, on a
 * UI change that gave none, a yellow line saying a screenshot is missing. */
function shotsHtml(c) {
  const shots = (Array.isArray(c.shots) ? c.shots : []).filter(s => s && s.path)
    .sort((a, b) => (a.side === 'before' ? 0 : 1) - (b.side === 'before' ? 0 : 1));
  if (!shots.length) {
    if (c.no_shot_reason) return `<p class="shot-none">${esc(c.no_shot_reason)}</p>`;
    return isUiChange(c) ? `<p class="shot-none shot-none-warn">${oi('alert')}<span>No screenshot</span></p>` : '';
  }
  return `<div class="shots">${shots.map(s => {
    const src = lucidos.data.url(String(s.path).replace(/^\/+/, ''));
    const side = s.side === 'before' ? 'Before' : 'After';
    const tag = s.kind === 'mockup' ? 'Mockup' : 'Sim';
    const alt = `${side}: ${s.caption || c.surface}`;
    return `<figure class="shot">
        <button type="button" class="shot-open" data-shot="${esc(src)}" data-shot-cap="${esc(`${side} · ${s.caption || c.surface}`)}"
          aria-label="Open larger — ${esc(alt)}"><img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" decoding="async"
          onerror="this.parentNode.classList.add('shot-missing')"><span class="lbl shot-tag">${tag}</span></button>
        <figcaption><span class="shot-side">${side}</span>${s.caption ? ` ${esc(s.caption)}` : ''}${
          s.state ? `<span class="shot-state">${esc(s.state)}</span>` : ''}</figcaption>
      </figure>`;
  }).join('')}</div>`;
}

/* The larger view: one <dialog>, outside `root` so a render never rebuilds
 * it under an open view. Escape, the close button and a tap outside the
 * image close it. */
function openShot(src, cap) {
  let dlg = document.getElementById('shot-view');
  if (!dlg) {
    dlg = document.createElement('dialog');
    dlg.id = 'shot-view';
    dlg.className = 'shot-view';
    dlg.innerHTML = `<button type="button" class="btn shot-close">Close</button><img alt=""><p class="shot-view-cap"></p>`;
    dlg.addEventListener('click', e => {
      if (e.target === dlg || e.target.closest('.shot-close')) dlg.close();
    });
    document.body.appendChild(dlg);
  }
  const img = dlg.querySelector('img');
  img.src = src;
  img.alt = cap;
  dlg.querySelector('.shot-view-cap').textContent = cap;
  dlg.showModal();
}

document.addEventListener('click', e => {
  const b = e.target.closest?.('[data-shot]');
  if (b) openShot(b.dataset.shot, b.dataset.shotCap);
});

/* No render cache: Pele draws synchronously in a millisecond or two, and
 * hydrateDiagrams runs in the same task as the render that built the box, so
 * the placeholder below is never painted once the library is loaded. */
let diagramSeq = 0;

function diagramHtml(path, i, g, flow, what) {
  const kind = g.kind || (/^\s*stateDiagram/.test(g.mermaid) ? 'state'
    : /^\s*(flowchart|graph)\b/.test(g.mermaid) ? 'flowchart' : 'sequence');
  const label = `${kind === 'state' ? 'State' : kind === 'flowchart' ? 'Flowchart' : 'Sequence'} diagram of ${what}${flow ? `: ${flow.entry}` : ''}`;
  return `<div class="story-diagram" data-diagram="${esc(path)}" data-diagram-i="${i}"
    role="region" aria-label="${esc(label)}" tabindex="0"><span class="story-wait"><span
    class="spin"></span>Drawing the diagram…</span></div>`;
}

/* A diagram that will not draw still has something to read: its source. */
function diagramBodyHtml(res, src) {
  if (res.svg) return res.svg;
  return `<p class="story-fail">${esc(res.error)} — here is its source.</p><pre class="story-src">${esc(src)}</pre>`;
}

/* The single-file build, fetched the first time a diagram is on screen and
 * never on a page without one. Through `lucidos.data.url`, which carries the
 * frame's pass to its own files and the WIP-preview thread id. It counts as
 * loaded once the page's fonts are in too: Pele measures each label to size
 * its box, and a label measured in a fallback font overflows the real one. */
let PELE = null;      // the library, once loaded
let PELE_LOAD = null; // its load, while one is in flight
function loadPele() {
  if (PELE_LOAD) return PELE_LOAD;
  PELE_LOAD = new Promise((resolve, reject) => {
    if (window.pele) { resolve(window.pele); return; }
    const s = document.createElement('script');
    s.src = lucidos.data.url(PELE_PATH);
    s.async = true;
    s.onload = () => (window.pele ? resolve(window.pele) : reject(new Error('no pele global')));
    s.onerror = () => { s.remove(); reject(new Error('load failed')); };
    document.head.appendChild(s);
  }).then(async lib => {
    await document.fonts?.ready;
    PELE = lib;
    return lib;
  }).catch(err => { PELE_LOAD = null; throw err; });
  return PELE_LOAD;
}

/* Pele drops a tag-shaped run in a label, text and all, and does not throw:
 * `returns Promise<User>` draws as "returns Promise" and `ran-<sha> marker`
 * as "ran- marker", so the source fallback never shows. pr-story writes plain
 * text, so every closed `<word…>` / `</word…>` that is not one of the few
 * formatting tags Mermaid allows becomes Mermaid's own entity pair,
 * `#lt;…#gt;`, which Pele draws as the characters (`&lt;` would not do: `;`
 * ends a statement in a sequence diagram). Arrows (`<<->>`, `<-->`) and a
 * state's `<<choice>>` never match: neither has a letter or `/` right after a
 * lone `<`. Repeated until it settles, so `Map<K, Set<V>>` escapes the outer
 * pair once the inner one is gone. */
const DIAGRAM_TAGS = /^<(?:br\s*\/?|\/?(?:b|i|em|strong))>$/i;
function escapeLabelTags(src) {
  for (let prev; prev !== src;) {
    prev = src;
    src = src.replace(/(?<!<)<\/?[A-Za-z][^<>\n]*>/g, t => DIAGRAM_TAGS.test(t) ? t : `#lt;${t.slice(1, -1)}#gt;`);
  }
  return src;
}

/* One box, drawn for its width. What is drawn is only the layout, which
 * depends on the width and on the font the labels are measured in; the
 * colours are CSS variables (see .story-diagram) and are not part of it.
 * `data-drawn` records the width and font of the drawing in the box, so a
 * call that changes neither does nothing. A box with no width is left alone:
 * the phone keeps the diagram hidden behind "Show as a diagram", and the
 * resize observer draws it when it opens. */
function drawDiagram(el) {
  const src = diagramSrc(el);
  if (!src || !PELE) return;
  const cs = getComputedStyle(el);
  const width = Math.floor(el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
  if (!(width > 0)) return;
  const fontFamily = cs.getPropertyValue('--pele-font').trim() || cs.fontFamily;
  const fontFamilyMono = cs.getPropertyValue('--pele-font-mono').trim() || 'monospace';
  const fontSize = parseFloat(cs.fontSize) || 12;
  const drawn = `${width}|${fontSize}|${fontFamily}|${fontFamilyMono}`;
  if (el.dataset.drawn === drawn) return;
  /* `responsive: false` keeps the natural size where the layout still needs
   * more than `maxWidth`: the box scrolls, the diagram never shrinks. A story
   * diagram has no use for links or images, and an image would fetch
   * whatever URL the diagram names. `wrap` folds a long message onto lines
   * instead of pushing the actors apart, and the actors are drawn once, at
   * the top, as they were under Mermaid. */
  const text = escapeLabelTags(src);
  const draw = opts => PELE.render(text, {
    ...opts, responsive: false, fontFamily, fontFamilyMono, fontSize,
    idPrefix: `pulls-dg-${++diagramSeq}`, links: false, images: false,
    config: { sequence: { wrap: true, mirrorActors: false } },
  });
  try {
    const out = draw({ maxWidth: width });
    el.innerHTML = out.svg;
    if (out.type === 'sequence' && labelsCollide(el)) el.innerHTML = draw({}).svg;
  } catch (err) {
    el.innerHTML = diagramBodyHtml({
      error: `The diagram didn't parse (${String(err?.message || err).split('\n')[0].slice(0, 120)})` }, src);
  }
  el.dataset.drawn = drawn;
}

/* When a sequence diagram is wider than `maxWidth`, Pele falls back to a
 * compact layout that does not reserve the height of a wrapped self-message
 * label, so the label runs into the next message: a third of pr-story's
 * sequence diagrams at a desktop pane's width, half at a phone's, and none at
 * natural width. So a compact drawing whose labels touch is drawn again at
 * natural width, which scrolls sideways but reads. */
function labelsCollide(el) {
  const boxes = [...el.querySelectorAll('svg text')].map(t => t.getBoundingClientRect()).filter(r => r.width);
  return boxes.some((a, i) => boxes.slice(i + 1).some(b =>
    a.left < b.right - 1 && b.left < a.right - 1 && a.top < b.bottom - 1 && b.top < a.bottom - 1));
}

/* The phone's toggle. Opening it draws the box at once, before the scroll,
 * so the scroll lands on the drawn diagram and not on the placeholder. */
document.addEventListener('click', e => {
  const b = e.target.closest?.('[data-story-fig]');
  if (!b) return;
  const fig = b.closest('.story-fig');
  const key = fig.dataset.figKey;
  const isOpen = !STORY_FIG_OPEN.has(key);
  if (isOpen) STORY_FIG_OPEN.add(key); else STORY_FIG_OPEN.delete(key);
  if (isOpen) fig.dataset.figOpen = '1'; else delete fig.dataset.figOpen;
  b.setAttribute('aria-expanded', String(isOpen));
  b.textContent = isOpen ? 'Hide the diagram' : 'Show as a diagram';
  const cap = fig.querySelector('.story-cap-phone');
  if (cap) cap.hidden = !isOpen;
  const box = fig.querySelector('.story-diagram');
  if (isOpen && box) { drawDiagram(box); box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
});

/* A box whose width changes (the pane resized, the phone turned, the toggle
 * opened it) is laid out again for the new width. */
const DIAGRAM_RESIZE = new ResizeObserver(entries => {
  for (const { target } of entries) if (target.isConnected) drawDiagram(target);
});

/* After every render: draw what is on screen, in place — never through
 * render(), which would rebuild the page around it. The first diagram waits
 * for the library; one that cannot load shows its source, and the next render
 * tries the load again. */
function hydrateDiagrams() {
  DIAGRAM_RESIZE.disconnect();
  const boxes = root.querySelectorAll('[data-diagram]');
  if (!boxes.length) return;
  if (!PELE) {
    loadPele().then(hydrateDiagrams, () => root.querySelectorAll('[data-diagram]:not([data-drawn])').forEach(el => {
      const src = diagramSrc(el);
      if (src) el.innerHTML = diagramBodyHtml({ error: "Couldn't load the diagram renderer" }, src);
    }));
    return;
  }
  boxes.forEach(el => { drawDiagram(el); DIAGRAM_RESIZE.observe(el); });
}

/* ---- check yourself ---- */

function checkBandHtml(h, read) {
  if (read?.error) return skillNoteHtml('check', read, h);
  if (!read?.doc) return '';
  const open = !COLLAPSED.has('pcheck');
  const fired = laneFired(h, 'check');
  const n = quizQuestions(h).length;
  /* The header says only what cannot go stale under it: Quiz, Teach-back and
   * Drill re-render on their own as grades land (patchSkillSection), and a
   * header that said "Grading" would keep saying it. Each depth states its
   * own progress in its section. */
  return laneBoxHtml({ band: 'pcheck', cls: 'band-check', title: 'Check', tone: fired ? 'accent' : 'muted',
    count: n, say: plural(n, 'quiz question'), state: firedWord(fired), open,
    why: `Graded against the code at ${h.sha7} — optional, it gates nothing`,
    body: `${laneWhyHtml(h, 'check')}${quizHtml(h)}${teachHtml(h)}${drillHtml(h)}` });
}

function draftKey(h, depth, id) { return depth === 'quiz' ? `${h.base}:quiz:${id}` : `${h.base}:teachback`; }
function draftOr(key, fallback) { return DRAFTS.has(key) ? DRAFTS.get(key) : (fallback || ''); }

function quizQuestions(h) {
  const quiz = SKILL_DOCS.get(skillPaths(h).check)?.doc;
  return (quiz?.questions || []).filter(q => q && q.id && q.question);
}

function sincePhrase(at, verb = 'sent') {
  const m = minsSince(at);
  return m < 1 ? `${verb} just now` : `${verb} ${fmtAge(m)} ago`;
}

function waitHtml(what, at, verb, after) {
  return `<p class="chk-live"><span class="spin"></span><strong>${esc(what)}</strong>
    <span data-since="${esc(at)}" data-since-verb="${esc(verb)}">${esc(sincePhrase(at, verb))}</span>${
    after ? `<span class="chk-live-note">${esc(after)}</span>` : ''}</p>`;
}

function noticeHtml(text) {
  return `<p class="chk-notice">${oi('alert')}<span>${esc(text)}</span></p>`;
}

/* Why the form is back, when it came back for a reason. Silence here would
 * make "the grader failed" look exactly like "you never sent it". */
function checkNoticeHtml(st, what) {
  if (st.state === 'lapsed') {
    return noticeHtml(`No grade came back for the ${what} ${sincePhrase(st.run.at)} — the grader may not have run. Send again?`);
  }
  if (st.state === 'failed') return noticeHtml(`The grader couldn't grade the ${what}: ${st.run.error}`);
  if (st.state === 'nofile') return noticeHtml(`The grader reported a grade, but no graded file is on disk for this head.`);
  if (st.state === 'badfile') return noticeHtml(`The graded file ${st.read.error}.`);
  return '';
}

function staleHtml(g) {
  const was = String(g.pr?.head_sha || '').slice(0, 7);
  const now = String(g.current_head || '').slice(0, 7);
  return noticeHtml(now && was && now !== was
    ? `Stale: the PR moved ${was} → ${now} since the quiz; graded against ${was}.`
    : 'Stale: the PR moved since the quiz; graded against the quiz\'s head.');
}

const GRADE_WORD = {
  correct: { word: 'Correct', tone: 'green' },
  partial: { word: 'Partial', tone: 'yellow' },
  wrong:   { word: 'Wrong',   tone: 'red' },
  missing: { word: 'Missing', tone: 'yellow' },
  holds:   { word: 'Holds',   tone: 'green' },
};

function gradeLineHtml(verdict, text, evidence) {
  const v = GRADE_WORD[verdict] || { word: verdict || 'Ungraded', tone: 'muted' };
  return `<p class="q-grade"><span class="q-verdict tone-${v.tone}">${esc(v.word)}</span>${
    text ? ` — ${esc(text)}` : ''}${evidence ? ` <code class="q-ev">${esc(evidence)}</code>` : ''}</p>`;
}

function quizHtml(h) {
  const qs = quizQuestions(h);
  const st = checkState(h, 'quiz');
  const k = checkKey(h, 'quiz');
  const sent = id => (st.run?.answers || []).find(a => a && a.id === id)?.answer || '';
  const head = `<div class="chk-head"><span class="chk-title">Quiz</span>
    <span class="chk-note">${esc(`${qs.length} consequence question${qs.length === 1 ? '' : 's'} · the code at ${h.sha7} is the answer key`)}</span></div>`;

  if (st.state === 'pending') {
    return `<div class="chk" id="pp-quiz" data-deadline="${Date.parse(st.run.at) + CHECK_TTL_MIN * 60000}">${head}
      <ol class="quiz">${qs.map(q => `<li class="q"><p class="q-text">${esc(q.question)}</p>
        <p class="q-said">${sent(q.id) ? esc(sent(q.id)) : '(blank)'}</p></li>`).join('')}</ol>
      ${waitHtml('Grading your answers', st.run.at, 'sent', 'The grade lands here, per question.')}
    </div>`;
  }

  if (st.state === 'graded') {
    const g = st.graded;
    const byId = new Map((g.grades || []).filter(x => x && x.id).map(x => [x.id, x]));
    const tally = ['correct', 'partial', 'wrong']
      .map(v => [v, [...byId.values()].filter(x => x.verdict === v).length])
      .filter(([, n]) => n).map(([v, n]) => `${n} ${v}`).join(' · ');
    return `<div class="chk" id="pp-quiz">${head}
      ${g.stale || st.run?.stale ? staleHtml(g) : ''}
      <ol class="quiz">${qs.map(q => {
        const x = byId.get(q.id);
        const said = sent(q.id);
        return `<li class="q"><p class="q-text">${esc(q.question)}</p>
          ${said ? `<p class="q-said">You said: ${esc(said)}</p>` : ''}
          ${x ? gradeLineHtml(x.verdict, x.correction, x.evidence) : '<p class="q-grade muted">Not graded.</p>'}</li>`;
      }).join('')}</ol>
      <div class="chk-act">
        <button type="button" class="btn-inline" data-check-redo="${esc(k)}">Answer again</button>
        ${tally ? `<span class="chk-note">${esc(tally)}</span>` : ''}
      </div>
    </div>`;
  }

  /* open, lapsed, failed, nofile, badfile: the form, prefilled with what was
   * last sent when there is something to resend. */
  const vals = qs.map(q => draftOr(draftKey(h, 'quiz', q.id), sent(q.id)));
  const ready = qs.length > 0 && vals.every(v => v.trim());
  return `<div class="chk" id="pp-quiz">${head}${checkNoticeHtml(st, 'answers')}
    <ol class="quiz">${qs.map((q, i) => {
      const id = domId('qa', `${h.base}-${q.id}`);
      return `<li class="q"><label class="q-text" for="${id}">${esc(q.question)}</label>
        <textarea id="${id}" rows="2" data-draft="${esc(draftKey(h, 'quiz', q.id))}"
          placeholder="What does the code do now?">${esc(vals[i])}</textarea></li>`;
    }).join('')}</ol>
    <div class="chk-act">
      <button type="button" class="action-btn action-btn-secondary" data-check-submit="quiz"${ready ? '' : ' disabled'}>Submit answers</button>
      <span class="chk-note" data-check-hint>${esc(ready ? 'Graded one line per question' : `Answer all ${qs.length} — "not sure" counts`)}</span>
    </div>
  </div>`;
}

function teachHtml(h) {
  const st = checkState(h, 'teachback');
  const k = checkKey(h, 'teachback');
  const head = `<div class="chk-head"><span class="chk-title">Teach-back</span>
    <span class="chk-note">Explain the PR in your own words; every claim is checked against the diff</span></div>`;

  if (st.state === 'pending') {
    return `<div class="chk" id="pp-teach" data-deadline="${Date.parse(st.run.at) + CHECK_TTL_MIN * 60000}">${head}
      <p class="q-said clamp">${esc(st.run.explanation || '')}</p>
      ${waitHtml('Checking your explanation', st.run.at, 'sent', 'Corrections land here — what is wrong, then what is missing.')}
    </div>`;
  }

  if (st.state === 'graded') {
    const g = st.graded;
    const cs = (g.corrections || []).filter(c => c && (c.text || c.claim));
    const list = cs.length
      ? `<ul class="tb-list">${cs.map(c => `<li>${gradeLineHtml(c.kind,
          c.kind === 'wrong' && c.claim ? `“${c.claim}” — ${c.text || ''}` : c.text, c.evidence)}</li>`).join('')}</ul>`
      : gradeLineHtml('holds', 'nothing wrong, nothing load-bearing missing.');
    return `<div class="chk" id="pp-teach">${head}
      ${g.stale || st.run?.stale ? staleHtml(g) : ''}
      ${st.run?.explanation ? `<p class="q-said clamp">You said: ${esc(st.run.explanation)}</p>` : ''}
      ${list}
      <div class="chk-act"><button type="button" class="btn-inline" data-check-redo="${esc(k)}">Explain again</button></div>
    </div>`;
  }

  const val = draftOr(draftKey(h, 'teachback'), st.run?.explanation);
  const id = domId('tb', h.base);
  return `<div class="chk" id="pp-teach">${head}${checkNoticeHtml(st, 'explanation')}
    <label class="sr-only" for="${id}">Your explanation of the PR</label>
    <textarea id="${id}" class="tb" rows="4" data-draft="${esc(draftKey(h, 'teachback'))}"
      placeholder="What does this PR change, and how?">${esc(val)}</textarea>
    <div class="chk-act">
      <button type="button" class="action-btn action-btn-secondary" data-check-submit="teachback"${val.trim() ? '' : ' disabled'}>Get corrections</button>
    </div>
  </div>`;
}

function drillHtml(h) {
  const st = drillState(h);
  const head = `<div class="chk-head"><span class="chk-title">Drill</span>
    <span class="chk-note">A thread asks up to 5 questions, each built on your last answer</span></div>`;
  const ask = label => `<button type="button" class="action-btn action-btn-secondary" data-drill>${esc(label)}</button>`;
  if (st.state === 'pending') {
    return `<div class="chk" id="pp-drill" data-deadline="${Date.parse(st.s.at) + DRILL_TTL_MIN * 60000}">${head}
      ${waitHtml('Starting the drill', st.s.at, 'asked', 'The thread opens here when it is up.')}</div>`;
  }
  if (st.state === 'started') {
    return `<div class="chk" id="pp-drill"><div class="chk-row">${head}${ask('Drill again')}</div>
      <p class="q-grade">Drill ${esc(sincePhrase(st.s.at, 'started'))} —
        <button type="button" class="linkish" data-open-thread="${esc(st.s.thread_id)}">open the thread</button></p></div>`;
  }
  const why = st.state === 'failed' ? noticeHtml(`The drill didn't start: ${st.s.error || 'no thread came back'}`)
    : st.state === 'lapsed' ? noticeHtml(`No drill started for the request ${sincePhrase(st.s.at, 'asked')} — the trigger may not have run.`)
      : '';
  return `<div class="chk" id="pp-drill"><div class="chk-row">${head}${
    ask(st.state === 'idle' ? 'Drill' : 'Drill again')}</div>${why}</div>`;
}

/* The three sections re-render on their own, so a grade landing for the quiz
 * never rebuilds the teach-back box someone is typing in — on a phone that
 * would drop the keyboard mid-sentence. */
const SKILL_SECTIONS = { 'pp-quiz': quizHtml, 'pp-teach': teachHtml, 'pp-drill': drillHtml };

function patchSkillSection(id) {
  const el = id && document.getElementById(id);
  const fn = SKILL_SECTIONS[id];
  const h = currentSkillHead();
  if (!el || !fn || !h) return false;
  const tpl = document.createElement('template');
  tpl.innerHTML = fn(h).trim();
  const node = tpl.content.firstElementChild;
  if (!node) return false;
  const keep = captureFocus();
  el.replaceWith(node);
  wireSkillPanels(node);
  restoreFocus(keep);
  return true;
}

/* Keep the Quiz / Teach-back field above the phone keyboard. The app is an
 * iframe, so the keyboard usually does NOT resize our own visualViewport — the
 * host's does. So: listen for resize when it does fire, and also re-centre on
 * timers after focus, once the keyboard has finished animating in. Centring
 * (not 'nearest') leaves the Submit button and hint visible under the field.
 * `scrollIntoView` walks up into the host's scroller too (same origin).
 * One document-level listener: survives every innerHTML re-render. */
(function keepCheckFieldVisible() {
  let active = null, timers = [];
  const centre = () => {
    if (!active || document.activeElement !== active) return;
    try { active.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    catch (e) { active.scrollIntoView(); }
  };
  document.addEventListener('focusin', (ev) => {
    const el = ev.target;
    if (!(el instanceof HTMLTextAreaElement) || !el.closest('.chk')) return;
    active = el;
    timers.forEach(clearTimeout);
    timers = [120, 350, 700].map(ms => setTimeout(centre, ms));
  });
  document.addEventListener('focusout', () => { active = null; });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => setTimeout(centre, 60));
})();

function sectionFor(depth) { return depth === 'teachback' ? 'pp-teach' : 'pp-quiz'; }

/* Typing updates the draft and the button in place; nothing re-renders. */
function syncCheckSubmit(sec) {
  if (!sec) return;
  const fields = [...sec.querySelectorAll('textarea[data-draft]')];
  const ready = fields.length > 0 && fields.every(f => f.value.trim());
  const btn = sec.querySelector('[data-check-submit]');
  if (btn) btn.disabled = !ready;
  const hint = sec.querySelector('[data-check-hint]');
  if (hint) hint.textContent = ready ? 'Graded one line per question' : `Answer all ${fields.length} — "not sure" counts`;
}

function wireSkillPanels(scope) {
  scope.querySelectorAll('textarea[data-draft]').forEach(el => el.addEventListener('input', () => {
    DRAFTS.set(el.dataset.draft, el.value);
    syncCheckSubmit(el.closest('.chk'));
  }));
  scope.querySelectorAll('[data-check-submit]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    submitCheck(el.dataset.checkSubmit);
  }));
  scope.querySelectorAll('[data-check-redo]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    CHECK_REDO.add(el.dataset.checkRedo);
    const id = el.closest('.chk')?.id;
    if (!patchSkillSection(id)) render();
    document.getElementById(id)?.querySelector('textarea')?.focus();
  }));
  scope.querySelectorAll('[data-drill]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    requestDrill();
  }));
  scope.querySelectorAll('[data-open-thread]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    lucidos.ui.navigate('thread', { id: el.dataset.openThread });
  }));
  scope.querySelectorAll('[data-skills]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    view = { ...view, page: 'skills', skillKey: el.dataset.skills };
    render();
  }));
  /* The Recall alert's "Why" jumps to the full list in Remember, opening the
   * section first: sections start closed, and a jump to a folded heading
   * would land on nothing. */
  scope.querySelectorAll('[data-jump]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const target = el.dataset.jump;
    const sect = /^sect-(.+)$/.exec(target);
    if (sect && !sectOpen(sect[1])) {
      COLLAPSED.add(sectKey(sect[1]));
      rememberBands();
      render();
    }
    document.getElementById(target)?.scrollIntoView({ block: 'start' });
  }));
}

/* ---- actions ---- */

/* Send answers (or an explanation) to the grade rail. The quiz's own pin
 * names the head, because that is what the grader grades against — and the
 * graded file comes back under the same sha7 even if the PR has moved since. */
async function submitCheck(depth) {
  const h = currentSkillHead();
  if (!h) return;
  const quiz = SKILL_DOCS.get(skillPaths(h).check)?.doc;
  if (!quiz) return;
  const k = checkKey(h, depth);
  const st = checkState(h, depth);
  if (st.state === 'pending' || CHECK_SENDING.has(k)) return;

  const repo = String(quiz.pr?.repo || h.repo);
  const sha = String(quiz.pr?.head_sha || h.sha);
  const payload = { repo, pr: h.number, sha, depth };
  if (depth === 'quiz') {
    const sent = id => (st.run?.answers || []).find(a => a && a.id === id)?.answer || '';
    const answers = quizQuestions(h).map(q => ({
      id: q.id, question: q.question, answer: draftOr(draftKey(h, 'quiz', q.id), sent(q.id)).trim(),
    }));
    if (!answers.length || answers.some(a => !a.answer)) return;
    payload.answers = answers;
  } else {
    const explanation = draftOr(draftKey(h, 'teachback'), st.run?.explanation).trim();
    if (!explanation) return;
    payload.explanation = explanation;
  }

  CHECK_SENDING.add(k);
  try {
    await lucidos.events.emit('PrCheckAnswersSubmitted', {
      summary: depth === 'quiz'
        ? `Grade my quiz answers on ${repo}#${h.number} @ ${h.sha7}`
        : `Correct my teach-back of ${repo}#${h.number} @ ${h.sha7}`,
      ...payload,
    });
    CHECKING.set(k, { at: new Date().toISOString(), answers: payload.answers || null,
                      explanation: payload.explanation || '', done: false, optimistic: true });
    CHECK_ASKED.add(k);
    CHECK_REDO.delete(k);
    if (!patchSkillSection(sectionFor(depth))) render();
    /* "Sent", not "grading": the emit reached the event store, and until
     * PrCheckGraded comes back nothing here knows whether a grader took it. */
    lucidos.ui.toast(depth === 'quiz' ? 'Sent your answers to the grader…' : 'Sent your explanation to the grader…',
      'info', { key: 'check', durationMs: 4000 });
  } catch (err) {
    lucidos.ui.toast("Couldn't reach the grader — nothing was sent", 'error', { key: 'check' });
  } finally {
    CHECK_SENDING.delete(k);
  }
}

/* Ask for a drill. The thread it starts is chat, so this tab opens it the
 * moment PrDrillStarted names it, the way Ask opens its agent. */
async function requestDrill() {
  const h = currentSkillHead();
  if (!h) return;
  const k = headKey(h.repo, h.number, h.sha7);
  if (drillState(h).state === 'pending') return;
  const quiz = SKILL_DOCS.get(skillPaths(h).check)?.doc;
  const repo = String(quiz?.pr?.repo || h.repo);
  const sha = String(quiz?.pr?.head_sha || h.sha);
  const ref = `${h.base}:${Date.now()}:${Math.random().toString(36).slice(2, 8)}`;
  try {
    await lucidos.events.emit('PrDrillRequested', {
      summary: `Drill on ${repo}#${h.number} @ ${h.sha7}`,
      repo, pr: h.number, sha, client_ref: ref,
    });
    DRILLS.set(k, { at: new Date().toISOString(), done: false, optimistic: true });
    DRILL_SEEN.delete(k);
    DRILL_ASK = { key: k, ref, t: Date.now(), repo: bareRepo(repo).toLowerCase(),
                     pr: String(h.number), sha7: h.sha7 };
    if (!patchSkillSection('pp-drill')) render();
    lucidos.ui.toast('Asked for a drill…', 'info', { key: 'drill', spinning: true });
  } catch (err) {
    lucidos.ui.toast("Couldn't reach the drill rail — nothing was asked", 'error', { key: 'drill' });
  }
}

/* The waits' clocks, without re-rendering the page: elapsed text in place,
 * and a section re-drawn only when its wait crosses into "lapsed". */
function tickSkillPanels() {
  if (!currentSkillHead()) return;
  root.querySelectorAll('[data-since]').forEach(el => {
    el.textContent = sincePhrase(el.dataset.since, el.dataset.sinceVerb || 'sent');
  });
  root.querySelectorAll('[data-deadline]').forEach(el => {
    if (Date.now() >= Number(el.dataset.deadline)) patchSkillSection(el.id);
  });
}

/* ---------- asking a question about this PR ----------
 *
 * The question goes to a CODING AGENT, not to a Lucidos chat thread.
 *
 * Every question asked from this page is a question about code. A chat thread
 * answering one has no repo, no worktree and no git: it has to locate the clone
 * before it can read a line, and it cannot run anything at all — which rules out
 * the one evidence class that settles arguments here, actually executing the
 * thing. A coding agent starts where the question already lives: a worktree of
 * the registered repo, toolchain present, the head's blobs local.
 *
 * SO THE CLICK IS AN EVENT, NOT A NAVIGATION. An iframe cannot spawn a process,
 * so `askAbout` emits `ReviewQuestionAsked` carrying the composed prompt, and the
 * `Ask about a PR on demand` trigger runs `spawn-thread --cc` against the
 * registered repo. Same emit -> SSE -> scheduler -> exec chain as Rebase and
 * Address comments; this is the third rail on it, and the only read-only one.
 *
 * WHAT THAT COSTS, SAID PLAINLY: the session starts on its own. There is no
 * compose box to read first, which `startThread` did give us. That is the right
 * trade only because this rail cannot write — the prompt forbids commits, pushes
 * and PR conversation, and the session is spawned `--relation top` so it is not
 * in the trigger's privilege tree: it stays interactive and anything reaching
 * outside its worktree raises a permission card. A rail that could push would
 * still need the human beat before Send.
 *
 * THE APP COMPOSES THE PROMPT, the trigger owns the repo routing. The anchor is
 * *content* — one finding with its evidence and my triage — and it lives in an
 * artifact this app has already parsed. Rebuilding that in the trigger would
 * mean a second parser for the findings schema, kept in step by hope.
 *
 * THE ANCHOR RULE — exactly one referent, never a set:
 *
 *   a finding      -> the finding I have open, with its evidence and my triage
 *   nothing        -> the PR as a whole
 *
 * Mutual exclusion is STRUCTURAL, not enforced: the anchor is resolved from the
 * button that was pressed, at the moment it is pressed. There is no "selected"
 * flag living in `view` between renders, so there is no way to press Ask and
 * silently carry a referent chosen five minutes ago — the classic failure of a
 * selection model with several sources. Pressing the button inside an open finding
 * IS selecting that finding; pressing the PR button is selecting nothing.
 *
 * And the PR is the FALLBACK, not a third option: "nothing selected" and "asking
 * about the PR" are the same state, so the anchor can never be empty.
 *
 * The finding anchor exists only on the findings page. The PR anchor — labelled
 * `Discuss` since 2026-10-22 — exists on every PR surface: the findings page,
 * the panels-only page, the comments page, and the ⋯ of every board card, mine
 * and review alike. See discussTarget for how each names its PR. */

/* The registered repo name for `run_coding_agent(folder=…)` / a cd target. Queue
 * rows carry it explicitly; a findings `pr` block doesn't, so the config's
 * `registered_repo` for that repo name decides, and the bare repo name is the
 * last resort. Prefer the explicit field when we have it. */
function repoFolder(pr) {
  if (pr.folder) return pr.folder;
  const name = bareRepo(pr.repo_name || pr.repo).toLowerCase();
  const hit = WORKSPACES.flatMap(w => w.repos).find(r => r.name.toLowerCase() === name);
  return hit?.registered_repo || bareRepo(pr.repo_name || pr.repo);
}

/* Which `gh` config dir and login can see this owner, from the config. A thread
 * that inherits an ambient identity can 404 on a private org, which reads like a
 * deleted repo. Only configured groups get the line; guessing one would be worse
 * than omitting it. */
function ghConfigDir(pr) { return wsMeta(workspaceOf(pr)).ghConfigDir || null; }
function ghLogin(pr) { const w = wsMeta(workspaceOf(pr)); return w.id === 'other' ? null : w.who; }

/* The part of the prompt that is true regardless of what's being asked. It exists
 * so the thread never re-derives the PR's identity, its head, or where the code
 * lives — everything the rail already resolved is handed over rather than
 * rediscovered. */
function prContextBlock(pr) {
  const folder = repoFolder(pr);
  const gh = ghConfigDir(pr);
  const head = pr.head_sha || pr.sha7;
  return [
    `PR: ${pr.repo_name || pr.repo}#${pr.number} — ${pr.title || '(untitled)'}`,
    pr.url ? `URL: ${pr.url}` : '',
    `Head: ${head}${pr.base_ref ? ` onto ${pr.base_ref}` : ''}`
      + (pr.files_changed != null
        ? ` · ${pr.files_changed} files, +${pr.additions}/−${pr.deletions}` : ''),
    pr.author ? `Author: @${pr.author}` : '',
    `Registered repo: ${folder}`,
    gh ? `GitHub identity: ${ghLogin(pr) || 'the configured login'} — export GH_CONFIG_DIR=${gh} `
      + `GH_TOKEN=$(gh auth token --hostname github.com --user ${ghLogin(pr)}) `
      + `(the ambient default may not see this owner)` : '',
  ].filter(Boolean).join('\n');
}

/* The session runs in its own worktree of the registered repo, so reading needs
 * no fetch: the rail already pulled `refs/pull/<n>/head` into that clone and a
 * worktree shares its object database, so `git show` reaches any file at the
 * exact head.
 *
 * DETACHING IS OFFERED, NOT ASSUMED. Running the code is the highest-value
 * evidence class here (a #1612 verifier reproduced a deterministic 2-test
 * failure), and having a real worktree is the whole reason this is a coding
 * agent — but a worktree sitting at the session's default branch answers a
 * reading question just as well, and detaching costs a build cache. So: read at
 * the SHA, detach only to run.
 *
 * AND IT SAYS WHAT NOT TO DO, because instruction is the only thing standing
 * here. The session is interactive, so a reach outside its worktree raises a
 * permission card — but nothing stops an in-worktree `gh pr review`, and the
 * whole app is built on the rule that the user writes to a PR themselves. */
function readInstructions(pr) {
  const head = pr.head_sha || pr.sha7;
  return [
    `## How to reach the code`,
    ``,
    `Your session worktree is a clone of ${pr.repo_name || pr.repo}. To READ any file at`,
    `this PR's head, no checkout is needed:`,
    `  git show ${head}:<path>`,
    `If \`git cat-file -e ${head}^{commit}\` fails, run`,
    `\`git fetch origin refs/pull/${pr.number}/head\` first.`,
    ``,
    `Only if you need to RUN something — compile it, run a test, reproduce the failure —`,
    `detach at the head and say so before you do:`,
    `  git checkout --detach ${head}`,
    `Don't check anything out for a question that reading answers.`,
    ``,
    `## Read-only`,
    ``,
    `No commits, no pushes, no PR comments, no reviews, no approvals, no labels. If the`,
    `answer is that something should change, say what and let me decide — a question must`,
    `not turn into a review. Don't touch any worktree other than your own.`,
  ].join('\n');
}

/* The anchor itself, resolved to text. Each branch hands over the CONTENT, not a
 * pointer to it — naming "finding f07" would make the thread re-open and
 * re-parse the artifact to find out what I'm pointing at, and the point of an
 * anchor is that it arrives already resolved. */
function anchorBlock(t, anchor) {
  const entry = t.entry;
  const doc = entry?.current;

  if (anchor.kind === 'finding') {
    if (!doc) return null;
    const find = l => (l || []).find(x => idKey(x) === anchor.id);
    const f = find(doc.findings) || find(doc.refuted);
    if (!f) return null;
    const d = decisionFor(entry.key, f);
    return [
      `I'm asking about ONE finding from the review — not the PR as a whole:`,
      ``,
      `  ${f.summary}`,
      `  ${f.file}:${f.line}`
        + [f.verdict, f.category, f.is_test ? 'on a test file' : ''].filter(Boolean).join(' · ')
          .replace(/^/, '  —  '),
      f.failure_scenario ? `\n  Failure scenario: ${f.failure_scenario}` : '',
      f.evidence ? `\n  Evidence the verifier gave: ${f.evidence}` : '',
      d?.picked ? `\n  I've picked it for the comment I'm writing${d.note ? ` — my note: "${d.note}"` : ''}.` : '',
    ].filter(Boolean).join('\n');
  }

  /* Nothing selected. Say so explicitly rather than sending the PR context alone —
   * an unstated scope reads as "answer about whatever you find first". What else
   * is known depends on where the discussion started: the rail's counts when a
   * findings doc covers this head, the sweep's own words on one of mine. */
  const c = doc?.run?.counts;
  const p = t.pr;
  return [
    `I'm asking about the PR as a whole — no particular finding.`,
    /* `reason` already names the blocker (conflicts, N unresolved threads, red
     * CI), so it goes over as the sweep wrote it. */
    t.mine ? `\nIt's my own PR. The status sweep says: ${p.reason || 'nothing in particular'}`
      + `${p.ci ? ` (CI ${p.ci})` : ''}.` : '',
    c ? `\nThe rail's review of this head: ${c.total} findings`
      + `${c.confirmed ? `, ${c.confirmed} confirmed` : ''}`
      + `${c.plausible ? `, ${c.plausible} plausible` : ''}`
      + `${c.refuted ? `, ${c.refuted} refuted` : ''}.`
      : t.mine ? '' : `\nThe review rail has no findings for this head.`,
  ].filter(Boolean).join('\n');
}

/* WHERE A DISCUSSION CAN START FROM (2026-10-22). Ask used to live only on the
 * findings page, so a PR with no findings doc — every PR of mine, and a queue PR
 * the rail hasn't reviewed — had no way to be talked about. Every PR surface now
 * carries a `Discuss` control naming a SOURCE, resolved at click time like the
 * other rails' keys, so a render between paint and tap can never send a stale
 * head:
 *
 *   find:<entry key>   the findings page's PR (and the finding-anchored Ask)
 *   mine:<repo>#<n>    one of mine, from the status sweep
 *   rev:<repo>#<n>     someone else's, from the review queue
 *
 * The `mine:` / `rev:` keys ARE the board row ids, so a row's ⋯ item, the
 * comments page and the panels-only page about it all name the same PR — and the
 * busy state below follows it from one surface to the next.
 *
 * `repoFull` is owner/name, never the registered folder: the trigger refuses
 * anything without a slash, and resolves the gh identity and the repo table from
 * it. A findings `pr.repo` is the BARE name (`storefront`) and carries no
 * `repo_name`, so the PR's own URL is the source, with the review-queue row as
 * the fallback. Sweep and queue rows carry owner/name in `repo` already. Null
 * when the PR has gone from its source. */
function discussTarget(src) {
  const s = String(src || '');
  if (s.startsWith('find:')) {
    const entry = PRS.find(x => x.key === s.slice(5));
    if (!entry) return null;
    const pr = entry.current.pr;
    return { src: s, key: entry.key, entry, mine: false, pr, label: `${pr.repo_slug}#${pr.number}`,
      repoFull: [ownerRepo(pr), ownerRepo(queueRowFor(pr) || {})].find(r => r.includes('/')) || '' };
  }
  if (s.startsWith('mine:')) {
    const p = (MINE?.prs || []).find(x => `mine:${x.repo}#${x.number}` === s);
    if (!p) return null;
    /* My login in this PR's workspace, so the context says whose PR it is. */
    const me = wsMeta(workspaceOf(p)).who;
    return { src: s, key: s, entry: null, mine: true, pr: { ...p, author: me !== '—' ? me : '' },
      label: `${shortRepo(p.repo)}#${p.number}`, repoFull: ownerRepo(p) };
  }
  if (s.startsWith('rev:')) {
    const q = (QUEUE?.prs || []).find(x => `rev:${x.repo}#${x.number}` === s);
    if (!q) return null;
    /* A findings doc counts only when it is about this head: counts from an older
     * one would describe code the agent is not looking at. */
    const entry = PRS.find(e => e.current.pr.sha7 === q.sha7 && queueRowFor(e.current.pr) === q) || null;
    return { src: s, key: s, entry, mine: false, pr: q,
      label: `${shortRepo(q.repo_name || q.repo)}#${q.number}`, repoFull: ownerRepo(q) };
  }
  return null;
}

/* Whether a Discuss control should render at all: the trigger refuses a payload
 * without owner/name or a hex head, so offering one would be a button that can
 * only toast. */
function canDiscuss(src) {
  const t = discussTarget(src);
  return !!t && t.repoFull.includes('/') && /^[0-9a-f]{7,40}$/.test(t.pr.sha7 || '');
}

/* How long a Discuss control stays in its `Starting…` state waiting for the
 * Started event. The spawn is usually seconds; past this it has most likely
 * failed in the trigger, which emits nothing back, and a control that stays dead
 * forever is worse than one that lets you try again. */
const ASK_PATIENCE_MS = 2 * 60 * 1000;

function discussBusy(src) {
  return !!ASKING && ASKING.src === src && Date.now() - ASKING.at < ASK_PATIENCE_MS;
}

const DISCUSS_TITLE = 'Start a coding agent you can talk to about this PR — it reads and can run the code at this head, and it can\'t write to the PR.';

/* The inline control, for the pages: the findings page's toolbar, the
 * panels-only page, the comments page. A page is about one PR, so the way to
 * talk about it sits in view rather than behind a ⋯. Disabled while this PR's
 * discussion is starting, from any surface. */
function discussBtnHtml(src, { cls = 'btn-inline', label = 'Discuss' } = {}) {
  if (!canDiscuss(src)) return '';
  const busy = discussBusy(src);
  return `<button type="button" class="${cls} btn-discuss" data-discuss="${esc(src)}"${
    busy ? ' disabled aria-busy="true"' : ''} title="${esc(DISCUSS_TITLE)}">
    ${ICON_ASK}<span>${busy ? 'Starting…' : esc(label)}</span></button>`;
}

/* The ⋯ item, for the board's cards. It spends an agent, so it follows Address
 * and Re-prep into the menu rather than sitting inline at the weight of the read
 * routes. A menu item can't be `disabled` — the menu's arrow keys would stop on
 * a control that can't take focus — so a busy one is aria-disabled and the click
 * handler turns it away. */
function discussMenuItem(src) {
  if (!canDiscuss(src)) return null;
  const busy = discussBusy(src);
  return {
    attrs: `data-discuss="${esc(src)}"${busy ? ' aria-disabled="true"' : ''}`,
    title: esc(DISCUSS_TITLE),
    label: busy ? 'Starting a discussion…' : 'Discuss this PR…',
  };
}

/* Collect the question, compose the handoff, hand it to a coding agent. The
 * question goes FIRST in the prompt: it is the thing being asked, and burying it
 * under forty lines of context makes the session read the scaffolding before it
 * reads the ask. `src` names the PR (see discussTarget); the finding-anchored Ask
 * only ever comes from the findings page. */
async function askAbout(anchor, src = `find:${view.key}`) {
  if (discussBusy(src)) return;
  const t = discussTarget(src);
  if (!t) {
    lucidos.ui.toast('That PR is gone from the board — nothing was sent', 'error');
    return;
  }
  const { pr, repoFull } = t;
  if (!repoFull.includes('/')) {
    lucidos.ui.toast('Can\'t tell which GitHub repo this PR is in — nothing was sent', 'error');
    return;
  }

  const block = anchorBlock(t, anchor);
  if (!block) {
    /* The anchor named something that isn't there any more (a re-render dropped
     * the finding). Failing closed beats spawning a session that asks about
     * nothing. */
    lucidos.ui.toast('That reference is gone — reopen the page and try again', 'error');
    return;
  }

  const q = await lucidos.ui.prompt({
    title: anchor.kind === 'finding' ? 'Ask about this finding'
      : `Discuss ${t.label}`,
    message: 'What do you want to know? A coding agent answers it in a worktree of '
      + `${repoFolder(pr)} — it can read and run the code at this head, and it can't `
      + 'write to the PR. The PR, the head SHA and what you\'re pointing at are '
      + 'attached automatically.',
    multiline: true,
  });
  if (q === null || !q.trim()) return;
  /* A second surface for the same PR may have started one while this prompt
   * was open. */
  if (discussBusy(src)) return;

  const prompt = [
    q.trim(),
    ``,
    `---`,
    ``,
    prContextBlock(pr),
    ``,
    block,
    ``,
    readInstructions(pr),
  ].join('\n');

  /* One id per click, minted here. The spawn is asynchronous and every open tab
   * sees the Started event, so this is how the tab that ASKED recognises its own
   * question and opens the thread, while a second window stays where it is. */
  const ref = `${t.key}:${Date.now()}:${Math.random().toString(36).slice(2, 8)}`;

  /* Busy BEFORE the emit, so a double tap during the round trip can't send two;
   * re-rendered so every control naming this PR shows it. The timer re-renders
   * once patience runs out, which is what re-enables a control whose spawn never
   * reported back. */
  ASKING = { ref, at: Date.now(), anchor: anchor.kind, src };
  render();
  setTimeout(() => { if (ASKING?.ref === ref) render(); }, ASK_PATIENCE_MS + 100);

  try {
    await lucidos.events.emit('ReviewQuestionAsked', {
      summary: `${t.key} — asked about ${anchor.kind === 'finding' ? anchor.id : 'the PR'}`,
      pr: t.key, anchor: anchor.kind, ref: anchor.id || '',
      sha7: pr.sha7, question: q.trim(),
      /* What the trigger needs to spawn: the repo it routes on (owner/name — see
       * repoFull above), the PR the session is about, and the prompt itself —
       * which only this app can build, because the anchor is content out of
       * artifacts it has already parsed. */
      repo: repoFull, number: pr.number,
      head_sha: pr.head_sha || pr.sha7, folder: repoFolder(pr),
      url: pr.url || '', client_ref: ref, prompt,
    });
    lucidos.ui.toast('Starting a coding agent on your question…', 'info',
      { key: 'ask', spinning: true });
  } catch (err) {
    if (ASKING?.ref === ref) { ASKING = null; render(); }
    lucidos.ui.toast('Failed to start the agent', 'error', { key: 'ask' });
  }
}

/* ---------- the ⋯ menu ----------
 *
 * A minimal menu button: the trigger has aria-haspopup / aria-expanded, the popover
 * is role="menu" with role="menuitem" children, and the keys are the WAI-ARIA
 * ones — Enter / Space / ↓ open it onto the first item (↑ onto the last), ↑ ↓
 * Home End move, Escape and Tab close it. It closes on an outside click, on
 * picking an item, and when the window loses focus (a click on the host UI around
 * this iframe never reaches the document). Escape and picking an item hand focus
 * back to the trigger; an outside click leaves it wherever the click put it.
 *
 * ONE MENU OPEN, REMEMBERED BY KEY, NOT BY NODE. render() replaces the whole
 * subtree on every state change — an SSE tick, a sweep landing — so the open
 * menu's node is destroyed under the reader's hand. The key survives it:
 * captureMore() notes where focus was, restoreMore() reopens the new node in the
 * same place without replaying the entrance (`data-still`). If nothing matches
 * the key any more — the review started, the head moved, the page changed — the
 * state is dropped right there, so a menu is never left open around nothing and a
 * stale key never pops open on some later card. */
let OPEN_MORE = null;

const moreWraps = () => [...root.querySelectorAll('.more[data-more]')];
const moreWrap = (key) => moreWraps().find(w => w.dataset.more === key) || null;
const moreBtn = (w) => w.querySelector('[data-more-btn]');
const moreMenu = (w) => w.querySelector('[role="menu"]');
const moreItems = (w) => [...moreMenu(w).querySelectorAll('[role="menuitem"]')];

/* Fixed, not absolute: every band is a box with `overflow: hidden`. Right edges
 * line up with the trigger's — it is the last control, so the menu opens
 * leftwards into the strip — then the menu is pulled back inside the viewport,
 * which is what keeps it on screen on a phone where the trigger can have wrapped
 * onto a line of its own. Under the trigger unless that runs off the bottom and
 * there is room above. */
function placeMore(wrap) {
  const btn = moreBtn(wrap), menu = moreMenu(wrap);
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  const gap = 0.25 * rem, edge = 0.5 * rem;
  /* Measured at the top-left corner so its natural width isn't squeezed by
   * wherever it was last placed. */
  menu.style.left = '0px';
  menu.style.top = '0px';
  const t = btn.getBoundingClientRect(), m = menu.getBoundingClientRect();
  const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
  const left = Math.max(edge, Math.min(t.right - m.width, vw - m.width - edge));
  let top = t.bottom + gap;
  if (top + m.height > vh - edge && t.top - gap - m.height >= edge) top = t.top - gap - m.height;
  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;
}

/* `focus` is the item index to focus, or null to leave focus alone. */
function openMore(wrap, { focus = 0, still = false } = {}) {
  const key = wrap.dataset.more;
  if (OPEN_MORE !== null && OPEN_MORE !== key) closeMore();
  const menu = moreMenu(wrap);
  OPEN_MORE = key;
  moreBtn(wrap).setAttribute('aria-expanded', 'true');
  if (still) menu.dataset.still = ''; else delete menu.dataset.still;
  menu.hidden = false;
  placeMore(wrap);
  if (focus !== null) moreItems(wrap)[focus]?.focus({ preventScroll: true });
}

function closeMore({ refocus = false } = {}) {
  const wrap = OPEN_MORE === null ? null : moreWrap(OPEN_MORE);
  OPEN_MORE = null;
  if (!wrap) return;
  moreMenu(wrap).hidden = true;
  moreBtn(wrap).setAttribute('aria-expanded', 'false');
  if (refocus) moreBtn(wrap).focus({ preventScroll: true });
}

/* Called around render()'s subtree swap. */
function captureMore() {
  if (OPEN_MORE === null) return null;
  const wrap = moreWrap(OPEN_MORE), a = document.activeElement;
  if (!wrap || !a) return null;
  const i = moreItems(wrap).indexOf(a);
  return { focus: i >= 0 ? i : a === moreBtn(wrap) ? 'btn' : null };
}

function restoreMore(keep) {
  if (OPEN_MORE === null) return;
  const wrap = moreWrap(OPEN_MORE);
  if (!wrap) { OPEN_MORE = null; return; }
  openMore(wrap, { focus: typeof keep?.focus === 'number' ? keep.focus : null, still: true });
  if (keep?.focus === 'btn') moreBtn(wrap).focus({ preventScroll: true });
}

/* Per render: the controls are new nodes each time, so they are wired each time. */
function wireMore() {
  moreWraps().forEach(wrap => {
    const btn = moreBtn(wrap), menu = moreMenu(wrap);
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (OPEN_MORE === wrap.dataset.more) closeMore({ refocus: true }); else openMore(wrap);
    });
    btn.addEventListener('keydown', (ev) => {
      if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
      ev.preventDefault();
      openMore(wrap, { focus: ev.key === 'ArrowUp' ? moreItems(wrap).length - 1 : 0 });
    });
    /* CAPTURE, on the menu rather than the item: it has to run before the item's
     * own [data-prep] handler, which opens the confirm dialog. Closing and
     * handing focus to the trigger first means the dialog opens over a settled
     * page, and a cancelled confirm leaves focus on the trigger. */
    menu.addEventListener('click', (ev) => {
      if (ev.target.closest('[role="menuitem"]')) closeMore({ refocus: true });
    }, true);
    menu.addEventListener('keydown', (ev) => {
      const items = moreItems(wrap), at = items.indexOf(document.activeElement);
      const go = (n) => { ev.preventDefault(); items[(n + items.length) % items.length]?.focus(); };
      if (ev.key === 'ArrowDown') go(at + 1);
      else if (ev.key === 'ArrowUp') go(at - 1);
      else if (ev.key === 'Home') go(0);
      else if (ev.key === 'End') go(items.length - 1);
      /* No preventDefault: focus goes to the trigger first, so the browser's Tab
       * then moves on from the trigger, past the closed menu. */
      else if (ev.key === 'Tab') closeMore({ refocus: true });
    });
  });
}

/* Registered ONCE at boot, like wireGitHubLinks — these sit on document/window,
 * so calling them from wire() would stack a copy per render. They look the open
 * menu up by key at event time and never hold a node. CAPTURE for the click and
 * the key: nearly every control in the app calls stopPropagation, so a bubbling
 * listener would never hear an outside click that landed on one of them. */
function wireMoreMenus() {
  document.addEventListener('click', (ev) => {
    if (OPEN_MORE === null) return;
    const wrap = moreWrap(OPEN_MORE);
    if (wrap && wrap.contains(ev.target)) return;
    closeMore();
  }, true);
  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Escape' || OPEN_MORE === null) return;
    ev.preventDefault();
    ev.stopPropagation();
    closeMore({ refocus: true });
  }, true);
  window.addEventListener('blur', () => closeMore());
  const replace = () => {
    const wrap = OPEN_MORE === null ? null : moreWrap(OPEN_MORE);
    if (wrap) placeMore(wrap);
  };
  window.addEventListener('resize', replace);
  window.addEventListener('scroll', replace, true);
}

/* ---------- interaction ---------- */

function wire() {
  wireMore();

  /* NO whole-card click handler, on either lane.
   *
   * Every card now carries its own buttons — Findings, Rebase, Open on
   * GitHub — and a card that carries actions cannot also be one undifferentiated
   * click target. `.card.mine` learned this first (it used to be an <a> to
   * GitHub, so a miss near Rebase navigated away); the queue card had the same
   * defect pointing at the findings page. The buttons are the only way in, and
   * they say where they go.
   *
   * This also retires the clickable/`card-flat` split: a card whose findings
   * hadn't landed yet had to render itself visually inert to avoid opening an
   * empty "Gone." screen, so the same lane shipped two hover behaviours for
   * reasons invisible to the reader. Now no card is clickable, so none has to
   * explain itself. */

  /* The GitHub anchor no longer competes with a card handler, but the strip sits
   * inside the card and a future card-level handler must not see this click. */
  root.querySelectorAll('.card-act .btn-open').forEach(el =>
    el.addEventListener('click', ev => ev.stopPropagation()));

  /* Findings opens the detail page, inside the app (the triage controls live
   * there). The button is only rendered when findings exist, so the lookup is
   * expected to hit; failing closed (do nothing) beats navigating to a dead
   * page. */
  root.querySelectorAll('[data-open]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const key = el.dataset.key;
      if (key && PRS.some(x => x.key === key)) {
        view = { ...view, page: 'detail', key };
        render();
      }
    });
  });

  wireCrumbs(root);

  root.querySelectorAll('[data-ws]').forEach(el => el.addEventListener('click', () => {
    view = { ...view, ws: el.dataset.ws };
    rememberWs(view.ws);
    render();
  }));

  root.querySelectorAll('[data-brief]').forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.brief;
    if (OPEN_BRIEFS.has(k)) OPEN_BRIEFS.delete(k); else OPEN_BRIEFS.add(k);
    render();
  }));

  const rf = root.querySelector('#refresh');
  if (rf) rf.addEventListener('click', requestRefresh);

  /* ---- the board's own controls ---- */

  /* Band collapse. Persisted, so a band you closed this morning is still closed
   * when you come back from a findings page. */
  root.querySelectorAll('[data-band]').forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.band;
    if (COLLAPSED.has(k)) COLLAPSED.delete(k); else COLLAPSED.add(k);
    rememberBands();
    render();
    /* render() swaps the DOM, so put a keyboard user back on the toggle. */
    root.querySelector(`[data-band="${CSS.escape(k)}"]`)?.focus({ preventScroll: true });
  }));

  /* Row disclosure. The title is the control — you open a row by clicking the
   * thing you were already reading. */
  root.querySelectorAll('[data-expand]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const id = el.dataset.expand;
    if (OPEN_ROWS.has(id)) OPEN_ROWS.delete(id); else OPEN_ROWS.add(id);
    render();
    focusRow(id);
  }));

  /* Search across every band. Typed state is kept in `QUERY` rather than in the
   * DOM, because render() rebuilds the input — so the caret is restored here
   * too, or every keystroke would send it to the end of the string. */
  const qi = root.querySelector('#q');
  if (qi) {
    qi.addEventListener('input', () => {
      QUERY = qi.value;
      const at = qi.selectionStart;
      render();
      const next = root.querySelector('#q');
      if (next) { next.focus(); try { next.setSelectionRange(at, at); } catch (e) { /* search inputs on old WebKit */ } }
    });
    if (QUERY) {
      /* Re-rendered mid-typing: put the caret back at the end rather than
       * silently at the start. */
      qi.setAttribute('value', QUERY);
    }
  }
  const qc = root.querySelector('#qclear');
  if (qc) qc.addEventListener('click', () => { QUERY = ''; render(); });

  /* Reconnect a lapsed identity. The app cannot run `gh auth login` itself, so
   * it hands the job to an agent with the config directory already named —
   * which is the part that is easy to get wrong with two accounts on one
   * machine. */
  root.querySelectorAll('[data-reconnect]').forEach(el => el.addEventListener('click', () => {
    const who = el.dataset.reconnect;
    const w = WORKSPACES.find(x => x.who === who || x.id === who || x.org === who);
    lucidos.ui.startThread({
      prompt: `The GitHub authorization for \`${who}\` has lapsed — the PR sweep reported it `
        + `in \`identities_failed\`. ${w?.ghConfigDir
          ? `That identity uses \`GH_CONFIG_DIR=${w.ghConfigDir}\`. `
          : ''}Check \`gh auth status\` for it, tell me what it says, and walk me through `
        + `re-authenticating. Do not re-run the sweep until it is back.`,
    });
  }));

  /* The rail-wiring offer moved out of the old empty review lane (which no
   * longer exists) and onto the identity line, where "no review rail" is
   * already stated. */
  const ww = root.querySelector('#wirews');
  if (ww) ww.addEventListener('click', () => {
    const w = wsMeta(view.ws);
    lucidos.ui.startThread({
      prompt: `Turn on review prep for the ${w.label} group in artifacts/review-cockpit/config.json `
        + `(see knowhow/pulls-config.md), so PRs in ${w.org}/* get findings prepped like the `
        + `other groups. Tell me first which repos it should list, with their registered repo `
        + `names, and whether discovery should be search or list. Every rail gates on a real `
        + `request; never add a "queue every open PR that is not mine" gate, it queues `
        + `40-minute reviews nobody asked for.`,
    });
  });

  /* Rows carry no key handlers. Every action they offered — open the drawer,
   * open on GitHub, prep this head — is a real control inside the row or its
   * drawer, which is where it always had to be anyway. */

  /* Same shape as the resolve/address handlers: the key identifies a PR AT A HEAD,
   * and the row is looked up rather than closed over, so a re-render between paint
   * and click can never fire the action against stale data. Looked up in QUEUE,
   * not MINE — this lane is other people's PRs.
   *
   * `prep` is recomputed here rather than read off the button, and it must match
   * reviewQueue()'s rule exactly: a re-prep of an already-prepped head needs
   * `force` in the payload or the script's findings-exist guard absorbs it. The
   * data-attribute alternative would put the same rule in two places, and the one
   * that drifts is the one that silently stops firing. */
  root.querySelectorAll('[data-prep]').forEach(el => {
    el.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const q = (QUEUE?.prs || []).find(
        x => prepKey(x.repo_name || x.repo, x.number, x.sha7) === el.dataset.prep);
      if (!q) return;
      const row = reviewQueue('all', q.assigned !== false, !!q.reviewed_current)
        .find(r => r.q === q);
      await requestPrep(q, row?.prep);
    });
  });

  /* No preventDefault needed any more — the card stopped being an <a>, so a click
   * here has nothing to navigate. stopPropagation stays: the strip sits inside the
   * card, and a future card-level handler must not also see this. */
  root.querySelectorAll('[data-resolve]').forEach(el => {
    el.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const p = (MINE?.prs || []).find(x => resolveKey(x) === el.dataset.resolve);
      if (p) await requestResolve(p);
    });
    /* No keydown handler: it's a real <button> now, so Enter and Space already
     * fire a click. Keeping the old one would open the confirm dialog twice. */
  });

  /* Merge in place (a workspace with `inAppMerge`). The PR is looked up at
   * click time like the resolve and address buttons, so a render between
   * paint and tap can never merge from stale data; requestMerge itself turns
   * away a second tap. */
  root.querySelectorAll('[data-merge]').forEach(el => {
    el.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const p = (MINE?.prs || []).find(x => resolveKey(x) === el.dataset.merge);
      if (p) await requestMerge(p);
    });
  });

  root.querySelectorAll('[data-address]').forEach(el => {
    el.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const p = (MINE?.prs || []).find(x => resolveKey(x) === el.dataset.address);
      if (p) await requestAddress(p);
    });
  });

  root.querySelectorAll('[data-threads]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const k = el.dataset.threads;
      if (OPEN_THREADS.has(k)) OPEN_THREADS.delete(k); else OPEN_THREADS.add(k);
      render();
    });
  });

  /* Same key the collapsed list toggles on, so the page and the glance can never
   * disagree about which PR is being read. */
  root.querySelectorAll('[data-comments]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      view = { ...view, page: 'comments', cmtKey: el.dataset.comments };
      render();
    });
  });

  root.querySelectorAll('[data-thread]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      ev.preventDefault();
      lucidos.ui.navigate('thread', { id: el.dataset.thread });
    });
  });

  /* Copy, never execute. The app cannot run `git` from an iframe, but more to
   * the point it shouldn't: `reset --hard` on a directory the user may have open
   * in an editor is theirs to press, in their own shell, having read it. The
   * verification is the part worth automating. */
  root.querySelectorAll('[data-strand-copy]').forEach(el => {
    el.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const cmd = el.dataset.strandCopy;
      try {
        await navigator.clipboard.writeText(cmd);
        lucidos.ui.toast('Reset command copied', 'success', { key: 'strand' });
      } catch (err) {
        /* Clipboard is permission-gated and fails silently in some iframe
         * contexts. Falling back to a prompt keeps the command reachable —
         * a copy button that does nothing is worse than no button. */
        await lucidos.ui.prompt({
          title: 'Copy this',
          message: 'Run it in the stranded worktree:',
          defaultValue: cmd, multiline: true,
        });
      }
    });
  });

  root.querySelectorAll('[data-foot]').forEach(el => el.addEventListener('click', () => {
    const flag = el.dataset.foot;
    view = { ...view, [flag]: !view[flag] };
    render();
  }));

  const tt = root.querySelector('#toggletests');
  if (tt) tt.addEventListener('click', () => { view.showTests = !view.showTests; render(); });

  /* Opening a finding re-renders, because the drawer is now conditionally
     EMITTED rather than emitted-and-hidden — there is no `.f-body` to toggle a
     class on any more, and the old `parentElement.parentElement.querySelector`
     walk threw once the row became a two-line `.row`. Re-rendering is also what
     the board's own row drawer does, so the two behave alike; `OPEN` survives it
     because it lives outside `view`. */
  root.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => {
    const loc = el.dataset.toggle;
    if (OPEN.has(loc)) OPEN.delete(loc); else OPEN.add(loc);
    render();
  }));

  /* The folded restatements. A full `render()` would collapse the finding you
     just opened to get here, so this toggles in place like the body above it. */
  root.querySelectorAll('[data-dupes]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const ik = el.dataset.dupes;
    const on = !OPEN_LOC.has(ik);
    if (on) OPEN_LOC.add(ik); else OPEN_LOC.delete(ik);
    el.setAttribute('aria-expanded', on ? 'true' : 'false');
    el.parentElement.querySelector('.dupes-body').classList.toggle('hidden', !on);
  }));

  /* The pick box sits in the row's lead slot beside the toggle target, not
   * inside it — so no stopPropagation is needed to keep a tick from also
   * expanding the finding. It's kept anyway: the row is the obvious place for a
   * future row-level handler, and this is the click that must never reach one. */
  root.querySelectorAll('[data-pick]').forEach(el => el.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    await applyDecision('pick', el.dataset.pick);
  }));

  root.querySelectorAll('[data-note]').forEach(el => el.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    await applyDecision('note', el.dataset.note);
  }));

  /* Bulk pick, scoped to what's on screen. The id list is read out of the DOM
   * rather than recomputed from the model, which is what makes "these" mean
   * exactly what the word says: the test filter has already removed nodes by the
   * time this runs. The `.foot-body` exclusion is the one thing the DOM alone
   * doesn't give — a refutation is rendered as a row too, but it lives in a
   * collapsed section and is not part of "the N shown" the button counts.
   *
   * `.dupes-body` is excluded for a stronger reason than tidiness: a folded
   * restatement is the SAME defect as the primary above it, so sweeping it in
   * would put the identical finding in the comment two to six times.
   *
   * The selector is `.row-f`, not the deleted `.f`: after the row rewrite `.f`
   * matched nothing at all, so this silently picked zero and the button looked
   * broken for no visible reason.
   *
   * `[data-pickall="off"]` is the Nits band: never swept, open or closed, and
   * the button's count leaves it out too (see detailHtml). */
  const pa = root.querySelector('#pickall');
  if (pa) pa.addEventListener('click', async () => {
    const ids = [...root.querySelectorAll('.row-f')]
      .filter(n => !n.closest('.foot-body') && !n.closest('.dupes-body')
        && !n.closest('[data-pickall="off"]'))
      .map(n => n.dataset.loc)
      .filter(Boolean);
    if (!ids.length) return;
    const st = prState(view.key);
    const allOn = ids.every(id => st.findings[id]?.picked);
    await bulkPick(ids, !allOn);
  });

  const cp = root.querySelector('#clearpicks');
  if (cp) cp.addEventListener('click', async () => {
    const st = prState(view.key);
    const ids = Object.keys(st.findings).filter(id => st.findings[id]?.picked);
    if (!ids.length) return;
    const ok = await lucidos.ui.confirm({
      message: `Clear all ${ids.length} pick${ids.length > 1 ? 's' : ''} on this PR?`,
      okLabel: 'Clear', danger: true,
    });
    if (ok) await bulkPick(ids, false);
  });

  const cc = root.querySelector('#compose');
  if (cc) cc.addEventListener('click', composeComment);

  
/* One handler for both anchors, and the anchor is read off the BUTTON —
   * `data-ask` names the kind, `data-ref` the referent. Nothing about the
   * selection survives between renders, which is what makes the two mutually
   * exclusive without any code enforcing it: you cannot press "ask about the PR"
   * and have it quietly mean a finding you opened earlier.
   *
   * stopPropagation because the finding's own Ask sits inside the row drawer,
   * whose title toggles the row — asking a question must not also collapse the
   * thing being asked about. */
  root.querySelectorAll('[data-ask]').forEach(el => el.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    const kind = el.dataset.ask;
    await askAbout(kind === 'finding' ? { kind: 'finding', id: el.dataset.ref }
      : { kind: 'pr' });
  }));

  /* `Discuss` — the PR-as-a-whole anchor, from every surface (see
   * discussTarget). The source rides on the control and is resolved at click
   * time; a busy one (aria-disabled in a ⋯ menu) is turned away here. */
  root.querySelectorAll('[data-discuss]').forEach(el => el.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    if (el.getAttribute('aria-disabled') === 'true') return;
    await askAbout({ kind: 'pr' }, el.dataset.discuss);
  }));

  wireSkillPanels(root);
}

/* ---------- row focus ----------
 *
 * Only one caller left: opening a drawer by click moves focus onto the row that
 * owns it, so the reader's focus follows what they just opened instead of being
 * left on a button that re-rendered out from under them. */
function focusRow(id) {
  try { root.querySelector(`.row[data-row="${CSS.escape(id)}"]`)?.focus(); }
  catch (e) { /* an id with no valid CSS escape — the row is still rendered */ }
}

async function applyDecision(act, id) {
  const st = prState(view.key);
  const e = PRS.find(x => x.key === view.key);
  /* Search the refutations too. They render with the same controls, but they live
   * in a separate array — looking only at `findings` left `f` undefined for every
   * refutation, which stored the pick with an empty `loc` and made it invisible to
   * the carry-over lookup at the next head. */
  const find = l => (l || []).find(x => idKey(x) === id);
  const f = e && (find(e.current.findings) || find(e.current.refuted));

  if (act === 'pick') {
    const cur = st.findings[id];
    if (cur?.picked) {
      /* Unpicking DELETES the entry rather than flipping a flag to false. A
       * `picked: false` record is a dismissal wearing a different hat, and this
       * app deliberately doesn't keep those — the unpicked state is the default
       * state of every finding on the page, so it needs no storage. A note
       * written before unpicking goes with it; keeping an orphan note attached to
       * nothing was the alternative, and it reads as a ghost decision. */
      delete st.findings[id];
    } else {
      st.findings[id] = {
        ...(cur || {}),
        picked: true,
        loc: f ? locKey(f) : (cur?.loc || ''),   // carry-over lookup key across heads
        sha7: currentSha(view.key),
        at: new Date().toISOString(),
      };
    }
  } else if (act === 'note') {
    const cur = st.findings[id];
    const v = await lucidos.ui.prompt({
      title: 'Note for the comment',
      message: 'One line in your own words. It goes under this finding in the comment '
        + 'you post — leave it empty to send the finding as the reviewer wrote it.',
      defaultValue: cur?.note || '',
      multiline: true,
    });
    if (v === null) return;
    const note = v.trim();
    /* A note implies a pick. Writing a comment line for a finding you haven't
     * ticked and then not seeing it in the batch is the obvious trap here. */
    st.findings[id] = {
      ...(cur || {}),
      picked: true, note,
      loc: f ? locKey(f) : (cur?.loc || ''),
      sha7: currentSha(view.key),
      at: new Date().toISOString(),
    };
  }

  await saveTriage();
  await lucidos.events.emit('ReviewFindingPicked', {
    summary: `${view.key} ${f ? locKey(f) : id} → ${st.findings[id] ? 'picked' : 'unpicked'}`,
    pr: view.key, finding_id: id, location: f ? locKey(f) : '',
    picked: !!st.findings[id], note: st.findings[id]?.note || '',
    sha7: currentSha(view.key),
  });
  render();
}

/* Bulk pick over the CURRENTLY VISIBLE findings. `ids` is computed by the caller
 * from the same list the page rendered, so the test filter and the refuted section
 * are honoured by construction rather than by a second copy of the predicate. */
async function bulkPick(ids, on) {
  const st = prState(view.key);
  const e = PRS.find(x => x.key === view.key);
  const byId = new Map();
  for (const f of (e?.current.findings || [])) byId.set(idKey(f), f);
  for (const f of (e?.current.refuted || [])) byId.set(idKey(f), f);

  for (const id of ids) {
    if (on) {
      const f = byId.get(id);
      st.findings[id] = {
        ...(st.findings[id] || {}),
        picked: true,
        loc: f ? locKey(f) : (st.findings[id]?.loc || ''),
        sha7: currentSha(view.key),
        at: new Date().toISOString(),
      };
    } else {
      delete st.findings[id];
    }
  }
  await saveTriage();
  await lucidos.events.emit('ReviewFindingsBulkPicked', {
    summary: `${view.key} — ${on ? 'picked' : 'unpicked'} ${ids.length} findings`,
    pr: view.key, count: ids.length, picked: on, sha7: currentSha(view.key),
  });
  render();
}

/* ---------- composing one comment out of the picks ---------- */

/* GitHub renders `path:line` as plain text, so each finding gets a permalink to
 * the blob at THIS head instead — `…/blob/<sha>/<path>#L<line>` is the only form
 * that survives a later force-push, because it names the commit rather than the
 * branch. A PR url of the ordinary shape gives up the repo root by dropping the
 * last two segments; anything else degrades to a bare `path:line`. */
function blobUrl(pr, f) {
  const m = String(pr.url || '').match(/^(https?:\/\/[^/]+\/[^/]+\/[^/]+)\/pull\/\d+/);
  const head = pr.head_sha || pr.sha7;
  if (!m || !head || !f.file) return null;
  return `${m[1]}/blob/${head}/${f.file}#L${f.line}`;
}

/* The comment body. Deliberately NOT the reviewer's prose verbatim under my name:
 * each line leads with the location, states the finding, and carries my note when
 * I wrote one. The failure scenario is included only for CONFIRMED findings —
 * that's the part an author needs to reproduce it, and pasting a 900-character
 * scenario for every PLAUSIBLE guess is how a review comment becomes unreadable. */
function composeBody(entry, picks) {
  const pr = entry.current.pr;
  const lines = [];
  const n = picks.length;
  lines.push(n === 1
    ? `One thing from my read of \`${pr.sha7}\`:`
    : `${n} things from my read of \`${pr.sha7}\`:`);
  lines.push('');

  picks.forEach((f, i) => {
    const url = blobUrl(pr, f);
    const loc = url ? `[\`${shortFile(f.file)}:${f.line}\`](${url})` : `\`${f.file}:${f.line}\``;
    lines.push(`**${i + 1}. ${loc}**`);
    lines.push('');
    lines.push(f.summary || '');
    if (f.note) { lines.push(''); lines.push(f.note); }
    if (f.verdict === 'CONFIRMED' && f.failure_scenario) {
      lines.push('');
      lines.push('<details><summary>How it fails</summary>');
      lines.push('');
      lines.push(f.failure_scenario);
      lines.push('');
      lines.push('</details>');
    }
    if (i < picks.length - 1) { lines.push(''); lines.push('---'); lines.push(''); }
  });

  return lines.join('\n');
}

/* Copy to clipboard, falling back to a prompt. Same shape as the stranded-worktree
 * copy button and for the same reason: clipboard access is permission-gated and
 * fails silently in some iframe contexts, and a copy button that does nothing is
 * worse than no button. */
async function copyOrShow(text, title) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    await lucidos.ui.prompt({
      title, message: 'Clipboard was blocked — copy it from here:',
      defaultValue: text, multiline: true,
    });
    return false;
  }
}

/* The composer. It builds the comment, shows it, and hands it over — it does NOT
 * post. The rail is read-only end to end (see review-prep-rail knowhow), and a
 * comment posted under my name from an app I can't see the output of is exactly
 * the invariant that exists to protect the author from a bad batch. So: copy it
 * and open the PR, or hand the batch to a thread that can post it after I read it
 * there.
 *
 * IT SUBMITS A REVIEW, NOT A CONVERSATION COMMENT (2026-08-13). Both exits now
 * target `pulls/N/reviews` with `event: COMMENT`. The difference is not cosmetic:
 *
 *   plain comment  ->  `issues/N/comments`. I stay in `requested_reviewers`,
 *                      GitHub keeps saying "review required", and the author gets
 *                      no signal that the request was answered.
 *   COMMENT review ->  GitHub clears me from `requested_reviewers` on submit, the
 *                      body is anchored to the head SHA, and it lands in the
