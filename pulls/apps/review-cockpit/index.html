    </span>`;
  }
  const c = prepControl(row);
  if (!c || c.redo) return '';
  return `<button type="button" class="btn-inline" data-prep="${esc(c.key)}"
    title="${c.title}">
    ${c.label}
  </button>`;
}

/* What the prep control is for this card — label, tooltip, key, and whether it
 * is a redo — or null when there is nothing to offer: a review is already
 * running (its progress line is the control) or the repo has no rail. The inline
 * button and the ⋯ menu item both render from this, so the two can never
 * disagree about what pressing it does. */
function prepControl(row) {
  const { q, prep } = row;
  const repo = q.repo_name || q.repo;
  const key = prepKey(repo, q.number, q.sha7);
  if (PREPPING.has(key)) return null;
  if (!PREPPABLE.has(q.repo || `${q.org}/${q.repo_name}`) || !listens('ReviewPrepManualRequested')) return null;

  const label = prep === 'prepped' ? 'Re-prep'
    : prep === 'stale' ? 'Re-prep at this head'
      : 'Prep for review';
  const title = prep === 'prepped'
    ? `Review ${esc(q.sha7)} again and replace the findings on disk — for a run that`
      + ` read the wrong tree or the wrong base. ~40 minutes, read-only.`
    : `Run the full multi-agent review on ${esc(q.sha7)} now, ahead of the rail's own`
      + ` schedule. ~40 minutes, read-only — it never comments or pushes.`;
  return { key, label, title, redo: prep === 'prepped' || prep === 'stale' };
}

/* THE ⋯ MENU, drawn once. Every card that has rare actions ends its strip with
 * this and nothing else — the controller (wireMore and friends) is keyed on
 * `data-more` and knows nothing about what the items do, so a card adds a menu by
 * calling this, never by building a second one.
 *
 * Rendered closed — `hidden` and aria-expanded="false" — and opened by the
 * controller, so a card is always valid markup whatever state the menu was last
 * in. `key` is the menu's identity across renders (see OPEN_MORE) and must be
 * unique on the page. Each item is `{ attrs, title, label }`: `attrs` is the
 * attribute that carries its existing click wiring (`data-prep`, `data-skills`),
 * so the handler, the confirm and the tooltip stay exactly what the inline
 * button had. `title` and `label` arrive already escaped.
 *
 * No items, no menu: there is never an empty one to open. */
function moreMenuHtml(key, items, { name = 'More actions', dot = false } = {}) {
  if (!items.length) return '';
  const id = `more-${key}`;
  return `<span class="more" data-more="${esc(key)}">
    <button type="button" class="btn-inline btn-more" data-more-btn aria-haspopup="menu"
      aria-expanded="false" aria-controls="${esc(id)}" aria-label="${esc(name)}" title="${esc(name)}">
      ${ICON_MORE}${dot ? '<span class="more-dot" aria-hidden="true"></span>' : ''}
    </button>
    <div class="menu" role="menu" id="${esc(id)}" aria-label="More actions" hidden>
      ${items.map(i => `<button type="button" class="menu-item" role="menuitem" tabindex="-1"
        ${i.attrs} title="${i.title}">${i.label}</button>`).join('')}
    </div>
  </span>`;
}

/* The ⋯ at the end of a queue card's strip, holding the redo and `Discuss this
 * PR…` — both spend an agent. Same `data-prep` the inline button carried: the
 * click wiring, the confirm and the `force` rule in requestPrep are untouched.
 * The redo is absent when there is none to offer (pending, in flight, no rail);
 * Discuss is there whenever the row has a repo and a head, so the menu nearly
 * always is. Keyed on the row id (unique on the board), not the prep key, now
 * that the menu outlives the redo. */
function queueMenuHtml(row) {
  const c = prepControl(row);
  /* The Review / Re-review pill is already the move on this card. Only a stale
   * prep — findings about an old head — earns a second control beside it. */
  const redo = c?.redo && !((row.action === 'review' || row.action === 'rereview') && row.prep !== 'stale')
    ? { attrs: `data-prep="${esc(c.key)}"`, title: c.title, label: c.label } : null;
  return moreMenuHtml(row.id, [redo, discussMenuItem(row.id)].filter(Boolean), {
    name: redo && row.prep === 'stale'
      ? 'More actions — a re-prep at this head is available'
      : 'More actions',
    dot: !!redo && row.prep === 'stale',
  });
}

/* The way INTO someone else's PR — the counterpart to the Rebase action on my
 * own cards. It opens the detail page, where the triage controls and the pr-*
 * skill panels (the understanding checks) live.
 *
 * LABELLED AS A PLACE, NOT AN ACTION (2026-10-19). It used to say `Review`,
 * which reads as "start a review" — and starting one is the other button
 * (`Prep for review`). This one only navigates, so it names what is on the other
 * side, `Findings & checks`, and ends in a chevron the way a link into a page
 * does. The count badge and the checklist glyph stay. (The `Review` band and
 * sub-group headings are lane names and keep their word.)
 *
 * Absent until the rail has findings: rendering a dead button would claim a
 * destination that isn't there, so a card without findings gets no button at
 * all (the strip still keeps its GitHub link). */
function viewBtnsHtml(row) {
  const { entry } = row;
  if (!entry) return '';
  const p = progress(entry);
  /* The badge is the issue count, not the raw total (see isIssue). */
  const t = tallyFor(entry.current);
  const n = t.issues;
  return `<button class="btn-inline btn-go" data-open="findings" data-key="${esc(entry.key)}"
      title="Open the PR page — ${esc(tallyText(t))}, and the understanding checks${p?.picked ? ` (${esc(p.picked)} of ${esc(p.total)} findings picked for a comment)` : ''}">
      ${ICON_FINDINGS}<span>Findings &amp; checks</span>${n ? `<span class="btn-n">${esc(n)}</span>` : ''}${CHEV}</button>`;
}

/* "Hide test-file findings" -> "Product code only (hides N on test files)". The
 * old label assumed you knew that roughly half a review's findings land on the
 * PR's own test files — on #1612, 25 of 56 sat on one spec. Naming the count
 * makes it read as a filter with a size rather than a mystery switch. */
function detailHtml() {
  const e = PRS.find(x => x.key === view.key);
  if (!e) {
    return crumbsHtml([{ label: 'Pulls', go: 'today' }, { label: 'Gone' }])
      + emptyLaneHtml('This PR slipped away.',
        'It was merged, closed, or dropped from the sweep. Head back to the lanes.');
  }
  const doc = e.current, pr = doc.pr, run = doc.run, st = prState(e.key);
  const sh = pr.repo_slug ? skillHead(e) : null;

  const all = allFindings(doc);
  const refuted = sortBySeverity(doc.refuted || []);
  const obs = doc.observations || [];

  const shown = view.showTests ? all : all.filter(f => !f.is_test);
  const hiddenN = all.length - shown.length;
  const testN = all.filter(f => f.is_test).length;

  /* Fold restatements AFTER the test filter, never before: with the filter on, a
   * product-code primary must not keep a spec-file sibling hidden inside it, and
   * a primary that is itself a test row takes its whole cluster away with it.
   * Issues and nits fold apart (see foldFindings). */
  const folded = foldFindings(shown);
  const tally = tallyOf(folded);
  const foldedN = shown.length - folded.issues.length - folded.nits.length;

  /* ---- the findings list is BANDED BY VERDICT ----
   *
   * It was one flat run of 51 rows on #759, every one wearing an identical
   * card with an identical red stripe. The stripe was the only severity channel
   * and it was on every row, so it distinguished nothing; the list had no
   * structure at all between "the runbar" and "row 51".
   *
   * The board already solved this exact problem: a band is a heading and one
   * box, and its count sits beside its name. Verdict is the natural banding
   * here for the same reason `turn` is on the board — it is the field that
   * decides whether you read the row at all. Confirmed is the work; Plausible
   * is a judgement call. So Confirmed's count is red (it blocks) and
   * Plausible's yellow (a caution), by the same rule as every other colour on
   * the page.
   *
   * Collapse is persisted per band in the same `COLLAPSED` set the board uses,
   * so a Plausible band you closed stays closed across navigations.
   *
   * Only ISSUES are banded by verdict now. The confirmed band is titled Issues,
   * not Confirmed, because twelve of #1753's confirmed rows are convention
   * nits and live below it. Nits get one band, closed until you open it, with
   * each row's verdict on its second line since the band no longer says it.
   *
   * The three issue bands also split by category under a group header, when
   * they hold more than one (see categorySections). Nits stay one flat list. */
  const byVerdict = { CONFIRMED: [], PLAUSIBLE: [], OTHER: [] };
  for (const g of folded.issues) {
    const v = g.primary.verdict;
    (byVerdict[v] || byVerdict.OTHER).push(g);
  }
  const bands = [
    { key: 'fconfirmed', title: 'Issues', why: 'Confirmed — the reviewer stands behind these',
      groups: byVerdict.CONFIRMED, verdict: 'CONFIRMED', byCategory: true },
    { key: 'fplausible', title: 'Plausible', why: 'Argued, not proven — your call',
      groups: byVerdict.PLAUSIBLE, verdict: 'PLAUSIBLE', byCategory: true },
    { key: 'fother', title: 'Unranked', why: 'No verdict recorded on these',
      groups: byVerdict.OTHER, verdict: null, byCategory: true },
    { key: 'fnits', title: 'Nits', why: 'Convention, cleanup, test gaps — worth a look, not a block',
      groups: folded.nits, verdict: null, startClosed: true, pickAll: false },
  ];

  const bodyHtml = (shown.length
    ? bands.map(b => findingBandHtml(b, e.key)).join('')
    : (hiddenN
      ? emptyLaneHtml('Only test findings on this one.',
        `All ${hiddenN} land on spec files — flip the filter above to read them.`, true)
      : emptyLaneHtml(rota([
        'Clean review.',
        'Nothing to flag.',
        'The reviewer found nothing.',
      ]), 'Every file the reviewer opened came back clean.')))
    + (hiddenN && shown.length ? `<div class="count">${hiddenN} finding${hiddenN > 1 ? 's' : ''} on test files hidden.</div>` : '')
    /* Say the fold happened. A page that silently showed 32 of 50 rows would be
       the same class of lie as the old Report/Archive split — the reader has to
       know the reviewer said it more than once, and where those rows went. */
    + (foldedN ? `<div class="count">${foldedN} more finding${foldedN > 1 ? 's' : ''}
        restate one of the above at the same line — folded in, open a row to read them.</div>` : '');

  /* Secondary sections, collapsed, below the findings. They were tabs; a tab
   * makes two lists mutually exclusive, which is wrong for things you consult
   * WHILE reading findings rather than instead of them. Each header states its
   * own count so the page answers "were there refutations?" without a click. */
  const foot = [
    refuted.length && ['refuted', 'showRefuted', `Refuted (${refuted.length})`,
      `<div class="rows">${clusterByLoc(refuted).map(g =>
        findingHtml(e.key, g.primary, g.dupes, 'REFUTED')).join('')}</div>`],
    obs.length && ['notes', 'showNotes', `Run notes (${obs.length})`,
      `<div class="markdown-content"><ul>${obs.map(o => `<li>${esc(o)}</li>`).join('')}</ul></div>`],
  ].filter(Boolean).map(([id, flag, label, inner]) => `<div class="foot-sec">
      <button class="foot-head" data-foot="${flag}" aria-expanded="${view[flag] ? 'true' : 'false'}">
        ${CHEV}${esc(label)}
      </button>
      <div class="foot-body${view[flag] ? '' : ' hidden'}">${inner}</div>
    </div>`).join('');

  const picked = all.filter(f => st.findings[idKey(f)]?.picked);
  const pickedRef = refuted.filter(f => st.findings[idKey(f)]?.picked);
  const nPick = picked.length + pickedRef.length;
  /* Select-all acts on what's VISIBLE, not on `all` — with the test filter on,
   * a button labelled "pick all" that silently picked 25 hidden spec findings
   * would put them in the comment you post under your own name. The same rule
   * now covers the fold: it picks the PRIMARIES only, never a restatement that
   * is folded away inside one. Picking six wordings of one defect is exactly the
   * comment this fold exists to stop you posting.
   *
   * And never a nit. A nit goes in a comment only if you ticked it yourself:
   * the Nits band exists so twenty-odd wording and convention rows stop riding
   * along with the race condition. The verdict bands are swept whether open or
   * closed, as before — closing one is a reading preference, not a "skip". */
  const sweep = folded.issues;
  const allShown = sweep.length > 0 && sweep.every(g => st.findings[idKey(g.primary)]?.picked);

  return `<div class="prpage">${crumbsHtml([
      { label: 'Pulls', go: 'today' },
      { label: `${pr.repo_slug}#${pr.number}` },
    ])}
    ${/* The PR is the subject of this page, so its title IS the heading: the
        shared GitHub-style PR header (prHeadHtml). No workspace chip — the
        crumb's repo slug already carries the provenance, and this page shows
        exactly one PR, so there is nothing to disambiguate against. The
        verdict counts stay OUT of the header: the band headers below state
        them, each beside the rows it is actually counting. */''}
    ${prHeadHtml({ pr: { ...pr, base_ref: pr.base_ref || 'main' }, sha7: pr.sha7, author: pr.author,
      files: pr.files_changed, labels: reqLabelHtml(pr) })}

    ${/* The pr-* skill panels frame the findings: Orient before them (and a
        Recall alert above everything, when this PR breaks a stored card),
        Prove and Remember after. Each renders only when its file exists at
        the PR's live head; see skillHead. */
      sh ? recallAlertHtml(sh) : ''}
    ${sectHtml('review', 'Review', `
    <div class="runbar${nPick ? ' armed' : ''}">
      <div class="grow">
        ${nPick
          ? `<strong>${nPick}</strong> picked for one comment`
          : `<span class="note">Tick the findings you'd comment on. They go out as one comment, not ${all.length}.</span>`}
      </div>
      ${sweep.length ? `<button class="btn-inline" id="pickall"${folded.nits.length
        ? ' title="Every issue and plausible finding shown, one per defect. Nits are picked one at a time."' : ''}>${
        allShown ? 'Unpick these'
          : `Pick all ${sweep.length} ${folded.nits.length ? 'but nits' : 'shown'}`}</button>` : ''}
      ${nPick ? '<button class="btn-inline" id="clearpicks">Clear</button>' : ''}
      ${discussBtnHtml(`find:${e.key}`, { cls: 'action-btn action-btn-secondary btn-ic', label: 'Discuss this PR' })}
      <button class="action-btn" id="compose"${nPick ? '' : ' disabled'}
        title="${nPick
          ? `Build one submitted review out of the ${nPick} picked finding${nPick > 1 ? 's' : ''} — clears the review request, unlike a plain comment`
          : 'Pick at least one finding first'}">
        Compose review${nPick ? ` (${nPick})` : ''}
      </button>
    </div>

    ${testN ? `<div class="filters">
      <button class="action-btn action-btn-secondary" id="toggletests"
        title="${view.showTests
          ? 'Show only findings about the product code, hiding the ones about this PR&rsquo;s own tests.'
          : 'Bring back findings that are about this PR&rsquo;s own test files.'}">
        ${view.showTests
          ? `Product code only (hides ${testN} on test files)`
          : `Show ${testN} finding${testN > 1 ? 's' : ''} on test files`}
      </button>
    </div>` : ''}
    ${bodyHtml}
    ${foot}`, tally.issues, tallyText(tally))}
    ${sh ? orientHtml(sh) + proveHtml(sh) + rememberHtml(sh) : ''}</div>`;
}

/* `dupes` are the same defect restated at the same line (see clusterByLoc). They
 * render INSIDE this row, not as siblings of it — but they keep their own pick
 * box, because each has its own id in the ledger and the composer reads that
 * ledger, not the fold. A restatement is occasionally the better-worded one to
 * quote in a review, so picking it has to stay possible.
 *
 * THE SAME ROW ANATOMY AS THE BOARD, and that is the whole point of this pass.
 * A finding used to be a `.card`: a bordered, padded, radiused block with a fat
 * verdict stripe down its left edge and a margin under it — which is exactly the
 * anatomy the board deleted, so the two halves of the app disagreed about what a
 * list item looks like. Fifty-one of them in a run read as a wall.
 *
 * It is now a `.row`: two lines in the band's box, a hairline between rows,
 * the same columns. The verdict stripe is gone because the BAND now carries the
 * verdict — a red edge repeated down forty-seven consecutive rows was colour
 * that distinguished nothing.
 *
 * `bandVerdict` is the verdict of the band this row is being drawn inside. The
 * word is printed on line two only when it DIFFERS (a refuted restatement folded
 * under a confirmed primary), because a row that agrees with its own heading has
 * nothing to add by repeating it. */
function findingHtml(key, f, dupes = [], bandVerdict = null, underCategory = false) {
  const d = decisionFor(key, f);
  const ik = idKey(f);
  const open = OPEN.has(ik);
  const picked = !!d?.picked;
  const did = domId('fb', ik);
  const co = d ? null : carryOverFor(key, f);
  const carry = co
    ? `<div class="carry">${oi('alert')}<span>You picked this spot at
       <code>${esc(shortFile(f.file))}:${esc(f.line)}</code> at <code>${esc(co.sha7)}</code>${co.note ? ` — “${esc(co.note)}”` : ''}.
       That finding is gone; this one is new at the same spot. Same issue, or not?</span></div>` : '';
  /* The harness's severity, when it wrote one, leads: it is what put the row
   * in its band (see isIssue), so a `nit` on a correctness row explains itself.
   * The category drops out under a category sub-header (see categorySections),
   * which already says it. */
  const prep = [f.severity, underCategory ? '' : f.category].filter(Boolean);
  const acc = (dupes.length ? `<span class="badge badge-quiet"
      title="The reviewer reported this same defect ${dupes.length + 1} times at this line — ${dupes.length} restatement${dupes.length > 1 ? 's are' : ' is'} folded in below">+${dupes.length} restated</span>` : '')
    + (prep.length ? `<span class="row-prep">${esc(prep.join(' · '))}</span>` : '');
  /* The pick box sits OUTSIDE the toggle target and leads the row, so the page
   * has a column you can run down while skimming — picking a finding must not
   * require expanding it, because the skim IS the filter. It occupies the slot
   * the board's PR octicon holds, so both pages have the same left edge. */
  return `<div class="row row-f${open ? ' open' : ''}${picked ? ' picked' : ''}" data-loc="${esc(ik)}">
    <div class="row-line">
      <button class="pick${picked ? ' on' : ''}" data-pick="${esc(ik)}"
        role="checkbox" aria-checked="${picked ? 'true' : 'false'}"
        title="${picked ? 'Picked — it goes in the comment' : 'Pick this for the comment'}">
        ${ICON_CHECK}</button>
      <button type="button" class="row-title row-ftitle" data-toggle="${esc(ik)}"
        aria-expanded="${open}" aria-controls="${did}">
        <span class="row-name">${esc(f.summary)}</span>
      </button>
      ${acc ? `<span class="row-acc">${acc}</span>` : ''}
    </div>
    <div class="row-sub row-fsub">
      <code>${esc(shortFile(f.file))}:${esc(f.line)}</code>
      ${f.verdict && f.verdict !== bandVerdict
        ? `<span class="sub-dot">·</span><span class="tone-${verdictTone(f.verdict)}">${esc(f.verdict)}</span>` : ''}
      ${f.is_test ? '<span class="sub-dot">·</span><span>test file</span>' : ''}
      ${d?.note ? `<span class="sub-dot">·</span><span class="f-note">“${esc(d.note)}”</span>` : ''}
    </div>
    ${carry}
    ${open ? `<div class="row-drawer" id="${did}">
      <div class="f-actions">
        <button class="btn-inline" data-note="${esc(ik)}"
          title="A line in your own words, appended under this finding in the comment">
          ${d?.note ? 'Edit note' : 'Add note'}</button>
        <button class="btn-inline btn-ask" data-ask="finding" data-ref="${esc(ik)}"
          title="Ask a coding agent about this finding — it reads (and can run) the code at this head, with the finding, the PR and the SHA attached">
          ${ICON_ASK}<span>Ask</span></button>
      </div>
      ${f.failure_scenario ? `<h4>Failure scenario</h4><p>${esc(f.failure_scenario)}</p>` : ''}
      ${f.evidence ? `<h4>Evidence</h4><p>${esc(f.evidence)}</p>` : ''}
      ${dupesHtml(key, ik, dupes)}
    </div>` : `<div id="${did}" hidden></div>`}
  </div>`;
}

/* A verdict's colour, by the page's one rule: a confirmed defect blocks, a
 * plausible one is a caution, anything else recedes. */
function verdictTone(v) { return v === 'CONFIRMED' ? 'red' : v === 'PLAUSIBLE' ? 'yellow' : 'muted'; }

/* A verdict band on the findings page. Deliberately the SAME header the board's
 * `bandHtml` emits — bandHeadHtml, same collapse key set — so the two pages
 * cannot drift apart the way they had. The only addition is `band-v`, which
 * tints the header's count with the verdict's colour.
 *
 * An empty verdict renders NOTHING, header included: a band header over an
 * absence is an orphan the eye and a screen reader both walk past, and on a
 * clean-ish review two of these three are always empty. */
function findingBandHtml(b, prKey) {
  const { key, title, why, groups, verdict } = b;
  if (!groups.length) return '';
  const open = findingBandOpen(b);
  const vcls = verdict === 'CONFIRMED' ? ' band-v-confirmed'
    : verdict === 'PLAUSIBLE' ? ' band-v-plausible' : '';
  const sections = b.byCategory ? categorySections(groups) : [{ groups }];
  const split = sections.length > 1;
  return `<section class="band band-find${vcls}" aria-labelledby="band-${key}-h"${
    b.pickAll === false ? ' data-pickall="off"' : ''}>
    ${bandHeadHtml({ band: findingBandKey(b), id: key, title, level: 4,
      count: `<span class="band-n ctr">${groups.length}</span>`, why, open })}
    <div class="band-body" id="band-${key}-body"${open ? '' : ' hidden'}>
      <div class="rows">${sections.map(s =>
        (split ? laneGroupHtml('dot', s.label, s.groups.length) : '')
        + s.groups.map(g => findingHtml(prKey, g.primary, g.dupes, verdict, split)).join('')
      ).join('')}</div>
    </div>
  </section>`;
}

/* An issue band's groups, split by the primary's category: correctness,
 * security, performance, then the rest alphabetically, and no category last as
 * "Other". The order inside a section is the band's own (the filter keeps it), so
 * only the header is new. Display only — the groups, counts, picks and the
 * select-all sweep are the unsplit ones. A literal `other` category folds into
 * the same "Other" section as a missing one. */
const CATEGORY_LEAD = ['correctness', 'security', 'performance'];

function categorySections(groups) {
  const by = new Map();
  for (const g of groups) {
    const cat = String(g.primary.category || '').trim().toLowerCase() || 'other';
    if (!by.has(cat)) by.set(cat, []);
    by.get(cat).push(g);
  }
  const rank = c => c === 'other' ? CATEGORY_LEAD.length + 1
    : CATEGORY_LEAD.includes(c) ? CATEGORY_LEAD.indexOf(c) : CATEGORY_LEAD.length;
  return [...by.keys()]
    .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b))
    .map(c => ({ label: c.charAt(0).toUpperCase() + c.slice(1), groups: by.get(c) }));
}

/* `COLLAPSED` records the bands you closed, and a saved set replaces the
 * defaults wholesale (see restoreBands), so a band that should START closed cannot
 * be seeded into it: everyone with a ui-state.json would see it open. Such a
 * band is keyed the other way round instead — `<key>-open` in the set means you
 * opened it. The toggle handler only flips membership, so it needs no change. */
function findingBandKey(b) { return b.startClosed ? `${b.key}-open` : b.key; }
function findingBandOpen(b) {
  return b.startClosed ? COLLAPSED.has(findingBandKey(b)) : !COLLAPSED.has(b.key);
}

/* The folded siblings, at the foot of the primary's body. Summary and pick box
 * only — the full argument of a restatement is by definition mostly the primary's
 * argument again, and reprinting six evidence blocks is what made this page
 * unreadable in the first place. */
function dupesHtml(key, ik, dupes) {
  if (!dupes.length) return '';
  const open = OPEN_LOC.has(ik);
  return `<div class="dupes">
    <button class="dupes-head" data-dupes="${esc(ik)}" aria-expanded="${open ? 'true' : 'false'}">
      ${CHEV}
      ${dupes.length} more finding${dupes.length > 1 ? 's' : ''} on this same line
    </button>
    <div class="dupes-body${open ? '' : ' hidden'}">
      <div class="count">Same defect, argued again by another finder. Kept because the
        wording sometimes differs in a way worth quoting — and each can be picked on its own.</div>
      ${dupes.map(g => {
        const gk = idKey(g);
        const gd = decisionFor(key, g);
        return `<div class="dupe${gd?.picked ? ' picked' : ''}">
          <button class="pick${gd?.picked ? ' on' : ''}" data-pick="${esc(gk)}"
            role="checkbox" aria-checked="${gd?.picked ? 'true' : 'false'}"
            title="${gd?.picked ? 'Picked — it goes in the comment' : 'Pick this wording instead'}">
            ${ICON_CHECK}</button>
          <div class="dupe-main">
            <div>${esc(g.summary)}</div>
            <div class="row-sub row-fsub">${[
              g.verdict ? `<span class="tone-${verdictTone(g.verdict)}">${esc(g.verdict)}</span>` : '',
              g.category ? `<span>${esc(g.category)}</span>` : '',
              gd?.note ? `<span class="f-note">“${esc(gd.note)}”</span>` : '',
            ].filter(Boolean).join(SUB_DOT)}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function shortFile(f) {
  if (!f) return '?';
  const parts = f.split('/');
  return parts.length <= 3 ? f : '…/' + parts.slice(-2).join('/');
}

function currentSha(key) {
  const e = PRS.find(x => x.key === key);
  return e ? e.current.pr.sha7 : null;
}

/* ---------- the pr-* skill panels ----------
 *
 * What replaced the map rail. The pr-* skills (skillz: pr-lanes, pr-intent,
 * pr-story, pr-behaviour, pr-check, pr-recall) run on a PR's head through the
 * rails' triggers and leave JSON beside the findings, one file per skill per
 * head. pr-lanes always runs first; the other four run only when a lane's
 * `next` names them — see each lane box's Why-this-ran callout (laneWhyHtml):
 *
 *   artifacts/review-cockpit/lanes/<slug>-<pr>-<sha7>.json      pr-skills/lanes/v2      recall hits + lanes
 *   artifacts/review-cockpit/intent/<slug>-<pr>-<sha7>.json     pr-skills/intent/v1     the stated why, checked
 *   artifacts/review-cockpit/story/<slug>-<pr>-<sha7>.json      pr-skills/story/v4      up to 3 Mermaid flows
 *   artifacts/review-cockpit/behaviour/<slug>-<pr>-<sha7>.json  pr-skills/behaviour/v2  what a user would notice, shot
 *   artifacts/review-cockpit/check/<slug>-<pr>-<sha7>.json      pr-skills/check/v1      a quiz, no answer key
 *   artifacts/review-cockpit/check/<same>.<depth>.graded.json   the grade of what I sent
 *
 * `<slug>` and `<sha7>` are the findings file's own convention (the rail's
 * repo_slug from the config, e.g. `store`), so one PR at one head has one base name in
 * every directory. `PrPrepSkillsProduced` says a pass finished, and which of
 * the skills it asked for did not produce a file.
 *
 * THE HEAD IS THE LIVE ONE, not the findings'. A findings file can sit a push
 * behind the PR (the `stale prep` state), and a panel about an older head
 * answers a question about code that is no longer there. So the base name
 * takes the newest look at the head — the queue sweep's, or the latest pr-*
 * pass's (see skillHead) — and a panel renders only when its file exists AT
 * that head. An older head's story is not shown with a caveat; it is not
 * shown.
 *
 * THE APP WRITES NO FILE HERE. Grading and the drill are events, like
 * every other rail in Pulls: PrCheckAnswersSubmitted and PrDrillRequested
 * out, PrCheckGraded and PrDrillStarted back. The Re-prep button's rules
 * apply: the click sets an optimistic pending state and says "sent", never
 * "done"; the event log is the truth on reload; a terminal event ends the wait
 * whether it carries a result or an `error`; and a wait nothing answers lapses
 * with a sentence saying so, rather than spinning forever. */

const SKILL_DIR = 'artifacts/review-cockpit';
const RECALL_STORE_PATH = 'artifacts/pr-recall/cards.json';
const PELE_PATH = 'apps/review-cockpit/vendor/pele.min.js';
const SKILL_SCHEMA = {
  lanes: 'pr-skills/lanes/v2', story: 'pr-skills/story/v4', check: 'pr-skills/check/v1',
  quiz: 'pr-skills/check/v1', teachback: 'pr-skills/check/v1',
  intent: 'pr-skills/intent/v1', behaviour: 'pr-skills/behaviour/v2',
};
/* Older ids that still render. lanes/v2 changed only `signals` (its `sensitive`
 * categories and `familiarity` shape), which no panel reads, so a v1 file draws the same.
 * story/v2 adds `flows[].group`, `event`/`launch` kinds, and guarantees `flows` lists
 * every flow; a v1 file has none of that and falls back to sorting the extra flows by
 * `changed_lines` (see storyBandHtml). story/v3 adds `diagram.kind` (sequence | state |
 * flowchart); a v2 file has no kind and is always a sequence. story/v4 adds `diagrams`, up
 * to 3, biggest flow first; its `diagram` is `diagrams[0]`, so an older file draws as a
 * list of one (see storyDiagrams). behaviour/v2 moves the screenshots onto each change
 * (`shots`, or `no_shot_reason`) and drops the top-level `capture`; a v1 file's `capture`
 * still shows, as the shots that were never taken. */
const SKILL_SCHEMA_OLDER = {
  lanes: ['pr-skills/lanes/v1'],
  story: ['pr-skills/story/v3', 'pr-skills/story/v2', 'pr-skills/story/v1'],
  behaviour: ['pr-skills/behaviour/v1'],
};
/* The `mode` each check-schema file must carry: the quiz, then its two graded shapes. */
const SKILL_MODE = { check: 'quiz', quiz: 'grade', teachback: 'teachback' };
/* A grade is one pass over the diff at a pinned head; a drill is one thread
 * spawn. Past these, a wait with no answer says it lapsed. */
const CHECK_TTL_MIN = 20;
const DRILL_TTL_MIN = 10;
/* Timestamps from two clocks meet here: the event store's, and this device's
 * for an optimistic click. A phone's clock can be a minute out. */
const DEVICE_SKEW_MS = 60000;

let SKILL_DOCS = new Map();    // data path -> { doc } | { missing: true } | { error }
let SKILL_LOADING = new Set(); // base names with a read in flight
let RECALL_CARDS = null;       // card id -> card; null until read; empty = no store yet
let PREP_SKILLS = new Map();   // base name -> newest PrPrepSkillsProduced payload
let PREP_LATEST = new Map();   // `${slug}-${pr}` -> { sha7, head_sha, t } of the newest pass
let CHECKING = new Map();      // checkKey -> { at, answers, explanation, done, error, stale }
let DRILLS = new Map();        // headKey -> { at, done, thread_id, error }
let DRILL_SEEN = new Map();    // headKey -> a Started this tab placed live (see the SSE handler)
let DRAFTS = new Map();        // `${base}:quiz:${id}` | `${base}:teachback` -> what I typed
let CHECK_REDO = new Set();    // checkKeys whose grade I chose to answer again
let CHECK_ASKED = new Set();   // checkKeys this tab submitted, for the toast when the grade lands
let CHECK_SENDING = new Set(); // checkKeys with an emit in flight (a double tap lands here)
let DRILL_ASK = null;          // the drill this tab asked for: { key, ref, t, repo, pr, sha7 }

/* One PR at one head, spelled so every event about it matches: the rails take
 * `repo` as owner/name or as the registered folder, so only the bare name is
 * compared. */
function headKey(repo, pr, sha) {
  return `${bareRepo(repo).toLowerCase()}#${pr}@${String(sha || '').slice(0, 7)}`;
}
function checkKey(h, depth) { return `${headKey(h.repo, h.number, h.sha7)}:${depth}`; }
function minsSince(iso) { return Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000)); }

/* The queue row for a findings PR — the same join reviewQueue() makes, from
 * the other side. */
function queueRowFor(pr) {
  return (QUEUE?.prs || []).find(q => String(q.number) === String(pr.number)
    && workspaceOf(q) === workspaceOf(pr)
    && shortRepo(q.repo_name || q.repo || '') === shortRepo(pr.repo || '')) || null;
}

/* owner/name, which is what the rails are sent. A findings `pr.repo` is often
 * the bare name, so the PR's URL is the reliable source. */
function ownerRepo(pr) {
  const m = String(pr.url || '').match(/github\.com\/([^/]+\/[^/]+?)\/pull\//);
  return m ? m[1] : String(pr.repo || '');
}

/* Two kinds of source say what the head is NOW, each with the time it looked:
 * a sweep (the review queue for someone else's PR, my-prs for mine) and the
 * newest pr-* pass for this PR (which resolves the head from GitHub when it
 * starts). The later look wins — otherwise a pass that finishes on a fresh
 * push stays invisible until the next sweep. A findings file's head is only
 * the fallback: its timestamp is when a ~40-minute review ended, not when
 * anyone saw the head. Null when there is no slug to name the files by. */
function headFrom({ slug, number, repo, seen, fallback }) {
  const pass = slug ? PREP_LATEST.get(`${slug}-${number}`) : null;
  const looks = [...seen, pass && { sha7: pass.sha7, sha: pass.head_sha, t: pass.t }]
    .filter(o => o && o.sha7);
  const sha7 = looks.length ? looks.reduce((x, y) => (y.t > x.t ? y : x)).sha7 : fallback?.sha7;
  if (!slug || !sha7) return null;
  const sha = [...looks, fallback].map(o => o?.sha)
    .find(v => v && String(v).length > 7 && String(v).startsWith(sha7)) || sha7;
  return { slug, number, sha7, sha, repo, base: `${slug}-${number}-${sha7}` };
}

const queueLook = q => q?.sha7 && { sha7: q.sha7, sha: q.head_sha, t: Date.parse(QUEUE?.generated_at || '') || 0 };

/* The findings page's PR. */
function skillHead(entry) {
  const p = entry.current.pr;
  const q = queueRowFor(p);
  return headFrom({ slug: p.repo_slug, number: p.number, repo: ownerRepo(q || p),
                    seen: [queueLook(q)], fallback: { sha7: p.sha7, sha: p.head_sha } });
}

/* A board row's PR: someone else's from the queue, or one of mine. */
function rowSkillHead(row) {
  if (row.kind === 'review') {
    const q = row.q;
    return headFrom({ slug: q.repo_slug || slugFor(q.repo_name || q.repo, q.number, q.sha7),
                      number: q.number, repo: ownerRepo(q), seen: [queueLook(q)] });
  }
  const p = row.pr;
  return headFrom({ slug: slugFor(p.repo, p.number, p.sha7), number: p.number, repo: ownerRepo(p),
                    seen: [p.sha7 && { sha7: p.sha7, t: Date.parse(MINE?.generated_at || '') || 0 }] });
}

/* The artifact slug for a repo (`slug` in the config). Its table lives in the
 * config the rails read; here it is learned from whatever already names it — a queue
 * row, a findings file, a pass event — and failing those, read off a skill
 * file on disk for this very PR and head. One of my own PRs carries no slug of
 * its own, which is the case this exists for. */
function slugFor(repo, number, sha7) {
  const name = bareRepo(repo).toLowerCase();
  const named = [
    ...(QUEUE?.prs || []).map(q => [q.repo_name || q.repo, q.repo_slug]),
    ...PRS.map(e => [e.current.pr.repo, e.current.pr.repo_slug]),
    ...[...PREP_SKILLS.values()].map(p => [p.repo, p.repo_slug]),
  ].find(([r, slug]) => slug && bareRepo(r).toLowerCase() === name);
  if (named) return named[1];
  const tail = `-${number}-${String(sha7 || '').slice(0, 7)}`;
  for (const base of SKILL_INDEX.keys()) if (base.endsWith(tail)) return base.slice(0, -tail.length);
  return null;
}

/* The PR the page on screen is about, as a skill head: the findings page's,
 * or the panels-only page's. Null on every other page. */
function currentSkillHead() {
  if (view.page === 'detail') {
    const e = PRS.find(x => x.key === view.key);
    return e?.current?.pr?.repo_slug ? skillHead(e) : null;
  }
  if (view.page === 'skills') {
    const r = skillsPageRow();
    return r ? rowSkillHead(r) : null;
  }
  return null;
}

/* The row the panels-only page is about, looked up fresh on every render, so
 * a sweep that moves the head moves the page with it. */
function skillsPageRow() {
  const id = view.skillKey || '';
  if (id.startsWith('mine:')) {
    const p = (MINE?.prs || []).find(x => `mine:${x.repo}#${x.number}` === id);
    return p ? mineBoardRow(p) : null;
  }
  const q = (QUEUE?.prs || []).find(x => `rev:${x.repo}#${x.number}` === id);
  return q ? { kind: 'review', id, q, pr: q } : null;
}

/* Which bases have which files, from a listing — the board decides from this
 * whether a row without findings gets a way to its panels, without reading a
 * single file per row. Graded files (`<base>.quiz.graded.json`) are not bases. */
let SKILL_INDEX = new Map();   // base -> Set of 'lanes' | 'story' | 'check'

async function loadSkillIndex() {
  const next = new Map();
  for (const kind of ['lanes', 'story', 'check']) {
    let paths;
    try { paths = await lucidos.data.list(`${SKILL_DIR}/${kind}/*.json`); }
    catch (e) { return; }   // keep the last good listing rather than hide every button
    for (const path of paths) {
      const m = String(path).match(/([^/]+)\.json$/);
      if (!m || m[1].includes('.')) continue;
      if (!next.has(m[1])) next.set(m[1], new Set());
      next.get(m[1]).add(kind);
    }
  }
  SKILL_INDEX = next;
}

function skillPaths(h) {
  return {
    lanes: `${SKILL_DIR}/lanes/${h.base}.json`,
    intent: `${SKILL_DIR}/intent/${h.base}.json`,
    story: `${SKILL_DIR}/story/${h.base}.json`,
    behaviour: `${SKILL_DIR}/behaviour/${h.base}.json`,
    check: `${SKILL_DIR}/check/${h.base}.json`,
    quiz: `${SKILL_DIR}/check/${h.base}.quiz.graded.json`,
    teachback: `${SKILL_DIR}/check/${h.base}.teachback.graded.json`,
  };
}

/* Missing is a state, not an error: most heads have no story. A file that is
 * there but is not what its name says (wrong schema, another head's pin) is
 * reported rather than rendered — a panel drawn from it would be confidently
 * about the wrong thing. */
async function readSkillDoc(path, kind, sha7) {
  let raw;
  try { raw = await lucidos.data.read(path); }
  catch (e) { return e?.httpCode === 404 ? { missing: true } : { error: 'could not be read' }; }
  let d;
  try { d = JSON.parse(raw); } catch (e) { return { error: 'is not valid JSON' }; }
  if (d?.schema !== SKILL_SCHEMA[kind] && !(SKILL_SCHEMA_OLDER[kind] || []).includes(d?.schema)) {
    return { error: `is not ${SKILL_SCHEMA[kind]}` };
  }
  if (SKILL_MODE[kind] && d.mode !== SKILL_MODE[kind]) {
    return { error: `has mode "${d.mode || ''}", not "${SKILL_MODE[kind]}"` };
  }
  const pin = String(d.pr?.head_sha || '');
  if (pin && !pin.startsWith(sha7)) return { error: `is pinned to ${pin.slice(0, 7)}, not ${sha7}` };
  return { doc: d };
}

/* The card store is the only place a recall hit's files live — the lanes file
 * names the card, not what it covers. No store yet is "no cards". */
async function loadRecallCards() {
  const m = new Map();
  try {
    const d = JSON.parse(await lucidos.data.read(RECALL_STORE_PATH));
    if (d?.schema === 'pr-recall/cards/v1') for (const c of d.cards || []) if (c?.id) m.set(c.id, c);
  } catch (e) { /* missing or unreadable: no cards to join */ }
  RECALL_CARDS = m;
}

function recallFiles(hit) {
  const own = hit.files || hit.card?.files || hit.via?.files;
  if (Array.isArray(own) && own.length) return own;
  const c = RECALL_CARDS?.get(hit.card_id);
  return Array.isArray(c?.files) ? c.files : [];
}

/* Reads all five files for a head. Resolves true when anything on screen
 * would change, so the caller re-renders only then. */
async function loadSkillDocs(h) {
  if (!h || SKILL_LOADING.has(h.base)) return false;
  SKILL_LOADING.add(h.base);
  try {
    const P = skillPaths(h);
    const kinds = Object.keys(P);
    const got = await Promise.all(kinds.map(k => readSkillDoc(P[k], k, h.sha7)));
    let changed = false;
    kinds.forEach((k, i) => {
      if (JSON.stringify(SKILL_DOCS.get(P[k])) !== JSON.stringify(got[i])) changed = true;
      SKILL_DOCS.set(P[k], got[i]);
    });
    if (got[0].doc) {
      const before = RECALL_CARDS ? JSON.stringify([...RECALL_CARDS.keys()]) : null;
      await loadRecallCards();
      if (JSON.stringify([...RECALL_CARDS.keys()]) !== before) changed = true;
    }
    return changed;
  } finally {
    SKILL_LOADING.delete(h.base);
  }
}

/* Once per visit to a PR's page (and again when its live head moves): the
 * files appear with no event of their own beyond PrPrepSkillsProduced, so
 * opening the page is when they are read. */
let skillVisit = null;
function ensureSkillDocs() {
  const h = currentSkillHead();
  if (!h) { skillVisit = null; return; }
  const stamp = `${view.page}:${view.page === 'detail' ? view.key : view.skillKey}@${h.base}`;
  if (skillVisit === stamp) return;
  skillVisit = stamp;
  loadSkillDocs(h).then(changed => {
    if (changed && currentSkillHead()?.base === h.base) render();
  });
}

/* The event log, replayed: which heads a pass finished for, and the state of
 * every grade and drill I asked for. Newest first throughout, so the first
 * sighting of a key is the current one. An answer only ends an ask it is
 * NEWER than — the Re-prep lesson: a grade from yesterday says nothing about
 * the answers sent a minute ago. */
async function loadSkillEvents() {
  const q = t => lucidos.events.query({ event_type: t, limit: 100 });
  let produced, sent, graded, asked, started;
  try {
    [produced, sent, graded, asked, started] = await Promise.all([
      q('PrPrepSkillsProduced'), q('PrCheckAnswersSubmitted'), q('PrCheckGraded'),
      q('PrDrillRequested'), q('PrDrillStarted')]);
  } catch (err) {
    return;   // an unreadable log is not "nothing asked" — keep what we had
  }
  const pl = e => e.payload || {};
  const at = e => Date.parse(e.created) || 0;

  const prep = new Map();
  const latest = new Map();
  for (const e of produced) {
    const p = pl(e);
    const sha7 = String(p.sha || p.head_sha || '').slice(0, 7);
    if (!p.repo_slug || !sha7) continue;
    const k = `${p.repo_slug}-${p.pr}-${sha7}`;
    if (!prep.has(k)) prep.set(k, { ...p, at: e.created });
    const pk = `${p.repo_slug}-${p.pr}`;
    if (!latest.has(pk)) latest.set(pk, { sha7, head_sha: p.head_sha || p.sha || '', t: at(e) });
  }
  PREP_SKILLS = prep;
  PREP_LATEST = latest;

  const grades = new Map();
  for (const e of graded) {
    const p = pl(e);
    const k = `${headKey(p.repo, p.pr, p.sha)}:${p.depth}`;
    if (!grades.has(k)) grades.set(k, { ...p, t: at(e) });
  }
  const checking = new Map();
  for (const e of sent) {
    const p = pl(e);
    const k = `${headKey(p.repo, p.pr, p.sha)}:${p.depth}`;
    if (checking.has(k)) continue;
    const g = grades.get(k);
    const done = !!g && g.t >= at(e);
    checking.set(k, {
      at: e.created, answers: Array.isArray(p.answers) ? p.answers : null,
      explanation: p.explanation || '', done,
      error: done && g.error ? String(g.error) : null, stale: done && !!g.stale,
    });
  }
  /* A click whose event the query has not caught up with keeps its optimistic
   * state; the moment the log holds that ask (or a later one), the log wins. */
  for (const [k, v] of CHECKING) {
    if (!v.optimistic) continue;
    const logged = checking.get(k);
    if (!logged || Date.parse(logged.at) < Date.parse(v.at) - DEVICE_SKEW_MS) checking.set(k, v);
  }
  CHECKING = checking;

  const starts = new Map();
  for (const e of started) {
    const p = pl(e);
    if (!p.repo || p.pr == null || !p.sha) continue;   // unattributable: only the tab that asked can place it
    const k = headKey(p.repo, p.pr, p.sha);
    if (!starts.has(k)) starts.set(k, { ...p, t: at(e), at: e.created });
  }
  const drills = new Map();
  for (const e of asked) {
    const p = pl(e);
    const k = headKey(p.repo, p.pr, p.sha);
    if (drills.has(k)) continue;
    const s = starts.get(k);
    const done = !!s && s.t >= at(e);
    drills.set(k, { at: e.created, done, thread_id: done ? s.thread_id || null : null,
                 error: done && s.error ? String(s.error) : null });
  }
  for (const [k, s] of starts) {
    if (!drills.has(k)) drills.set(k, { at: s.at, done: true, thread_id: s.thread_id || null,
                                  error: s.error ? String(s.error) : null });
  }
  for (const [k, v] of DRILLS) {
    if (!v.optimistic) continue;
    const logged = drills.get(k);
    if (!logged || Date.parse(logged.at) < Date.parse(v.at) - DEVICE_SKEW_MS) drills.set(k, v);
  }
  /* A Started this tab matched live but the log cannot attribute (no head in
   * its payload) still ends the ask it answered. */
  for (const [k, v] of DRILL_SEEN) {
    const cur = drills.get(k);
    if (cur && !cur.done && Date.parse(v.at) >= Date.parse(cur.at) - DEVICE_SKEW_MS) drills.set(k, { ...cur, ...v, done: true });
  }
  DRILLS = drills;
}

/* Where one depth of the check stands, derived — never stored — so a reload,
 * a second device and a lapsed wait all read the same way. */
function checkState(h, depth) {
  const k = checkKey(h, depth);
  const run = CHECKING.get(k) || null;
  const read = SKILL_DOCS.get(skillPaths(h)[depth]);
  if (run && !run.done) {
    return minsSince(run.at) >= CHECK_TTL_MIN ? { state: 'lapsed', run } : { state: 'pending', run };
  }
  if (run?.error) return { state: 'failed', run };
  if (CHECK_REDO.has(k)) return { state: 'open', run };
  if (read?.doc) return { state: 'graded', run, graded: read.doc };
  if (read?.error) return { state: 'badfile', run, read };
  if (run?.done && read?.missing) return { state: 'nofile', run };
  return { state: 'open', run };
}

function drillState(h) {
  const s = DRILLS.get(headKey(h.repo, h.number, h.sha7));
  if (!s) return { state: 'idle' };
  if (!s.done) return minsSince(s.at) >= DRILL_TTL_MIN ? { state: 'lapsed', s } : { state: 'pending', s };
  if (s.error || !s.thread_id) return { state: 'failed', s };
  return { state: 'started', s };
}

/* ---- rendering ----
 *
 * A PR's page reads in four sections, in this order, each drawn only when it
 * has something in it:
 *
 *   Review    Findings              the prep rail's verdicts (the findings page's own)
 *   Orient    Lanes, Story          what the PR is and how to read it
 *   Prove     Check                 Quiz, Teach-back, Drill
 *   Remember  Recall hits           every stored card this PR touches
 *
 * A Recall hit this PR breaks (or may break) is also an alert at the very top
 * of the page — it is the most expensive thing on it to miss — while Remember
 * holds the full list, the ones that still hold included. */

/* A heading over a group of boxes: the board's group header (Mine / Reviews)
 * at a heading's size — octicon, name, Counter. `inner` empty means no section
 * at all. `count` is what the section lists (lanes, findings, questions,
 * recall hits) and `say` names it for the tooltip and a screen reader; a null
 * count draws no Counter, because a missing number is no answer while a drawn
 * 0 is "checked, clear". */
const SECT_ICON = { orient: 'book', review: 'checklist', prove: 'beaker', remember: 'history' };

/* Every section starts CLOSED and folds like a band: the heading wraps the
 * toggle (see bandHeadHtml for why), and the Counter stays in it, so a closed
 * page still says how many findings and lanes each section holds. The key is
 * inverted, `sect-<id>-open` meaning you opened it, for the reason given at
 * findingBandKey. */
function sectKey(id) { return `sect-${id}-open`; }
function sectOpen(id) { return COLLAPSED.has(sectKey(id)); }

function sectHtml(id, title, inner, count = null, say = '') {
  if (!inner || !inner.trim()) return '';
  const open = sectOpen(id);
  return `<section class="sect" id="sect-${id}" aria-labelledby="sect-${id}-h">
    <h3 class="sect-h" id="sect-${id}-h">
      <button type="button" class="sect-toggle" data-band="${sectKey(id)}"
        aria-expanded="${open}" aria-controls="sect-${id}-body">
        ${CHEV}${oi(SECT_ICON[id] || 'dot')}<span class="sect-title">${esc(title)}</span>${
          count == null ? '' : ctrHtml(count, say)}
      </button>
    </h3>
    <div class="sect-body" id="sect-${id}-body"${open ? '' : ' hidden'}>${inner}</div></section>`;
}

/* A Counter with its noun: the number on screen, the phrase as its tooltip and,
 * for a screen reader, after the number. */
function ctrHtml(n, say, cls = 'ctr') {
  return `<span class="${cls}" title="${esc(say)}">${esc(n)}<span class="sr-only"> ${
    esc(String(say).replace(/^\S+\s*/, ''))}</span></span>`;
}

function plural(n, one, many = `${one}s`) { return `${n} ${n === 1 ? one : many}`; }

function skillRead(h, kind) { return SKILL_DOCS.get(skillPaths(h)[kind]); }

/* Each section is a run of lane boxes, and its Counter is how many. */
function orientHtml(h) {
  const boxes = [
    ...lanesBoxes(h, skillRead(h, 'lanes')),
    intentBandHtml(h, skillRead(h, 'intent')), storyBandHtml(h, skillRead(h, 'story')),
    behaviourBandHtml(h, skillRead(h, 'behaviour')),
    ...laneQueuedBoxes(h, ['intent', 'story', 'behaviour']),
    ...notProducedBoxes(h, ['lanes', 'intent', 'story', 'behaviour']),
  ].filter(Boolean);
  return sectHtml('orient', 'Orient', boxes.join(''), boxes.length, plural(boxes.length, 'lane'));
}

function proveHtml(h) {
  const boxes = [checkBandHtml(h, skillRead(h, 'check')),
    ...laneQueuedBoxes(h, ['check']), ...notProducedBoxes(h, ['check'])].filter(Boolean);
  const n = skillRead(h, 'check')?.doc ? quizQuestions(h).length : null;
  return sectHtml('prove', 'Prove', boxes.join(''), n, n == null ? '' : plural(n, 'quiz question'));
}

/* Recall was checked whenever the lanes file exists, so its absence of hits
 * is an answer and is said as one — inside the box, the way an empty Your
 * turn says it on the board. */
function rememberHtml(h) {
  const lanes = skillRead(h, 'lanes')?.doc;
  if (!lanes) return '';
  const hits = recallHits(h);
  return sectHtml('remember', 'Remember', recallBandHtml(h, hits, RECALL_CARDS && !RECALL_CARDS.size
      ? 'No recall cards are stored yet.'
      : `No stored card matches this PR at <code>${esc(h.sha7)}</code>.`),
    hits.length, plural(hits.length, 'recall hit'));
}

const SKILL_METHOD = { lanes: 'Lanes', intent: 'Intent', story: 'Story', behaviour: 'Behaviour', check: 'Check' };

/* ---- one lane, one box ----
 *
 * Every lane is the board's band: one bordered box, its header bar inside it
 * (chevron · name · Counter · state Label · the muted why-line), its tone as
 * the box's left stripe and the header's wash (see §8c for what each tone
 * means). The whole header bar folds it. A lane with nothing to unfold —
 * queued, not produced, unreadable, trust — is the header bar alone.
 *
 * `count` is how many items the lane lists, `say` names them; `state` is the
 * one Label: fired / not fired, queued, unreadable… `why` is text; a header
 * bar alone may carry `whyHtml` instead, already escaped. */
function laneBoxHtml({ band, cls = '', title, tone, count = null, say = '', state = '',
                       why = '', whyHtml = '', open, body }) {
  const label = state ? `<span class="lbl${tone === 'muted' ? '' : ` lbl-${tone}`}">${esc(state)}</span>` : '';
  const counter = count == null ? '' : ctrHtml(count, say, 'band-n ctr');
  const head = body == null
    ? `<div class="band-head">
        <h4 class="band-h" id="band-${band}-h">
          <span class="chev chev-none" aria-hidden="true"></span>
          <span class="band-title">${esc(title)}</span>${counter}${label}
        </h4>
        ${whyHtml || why ? `<span class="band-why">${whyHtml || esc(why)}</span>` : ''}
      </div>`
    : bandHeadHtml({ band, id: band, title, level: 4, count: counter + label, why, open });
  return `<section class="band band-lane band-tone-${tone}${cls ? ` ${cls}` : ''}" aria-labelledby="band-${band}-h">
    ${head}${body == null ? '' : `
    <div class="band-body" id="band-${band}-body"${open ? '' : ' hidden'}>
      <div class="rows">${body}</div>
    </div>`}
  </section>`;
}

/* A group inside a lane's box (Changes, Mismatches, Other flows…): the
 * board's Mine / Reviews header, one heading level under the lane's. */
function laneGroupHtml(icon, label, n) {
  return `<h5 class="subhead">${oi(icon)}${esc(label)}<span class="subhead-n ctr">${esc(n)}</span></h5>`;
}

/* A file:line, as the board's neutral ref pill. On a phone a long path wraps
 * at its slashes (the <wbr>s), never between a file and its line number. */
function refHtml(evidence) {
  return evidence ? `<code class="ref" title="${esc(evidence)}">${
    esc(evidence).replace(/\//g, '/<wbr>')}</code>` : '';
}

/* Whether pr-lanes fired a lane at this panel — the difference between a
 * panel the triage asked for and one that was run without it. */
function laneFired(h, kind) {
  return laneRows(h).some(l => LANE_NEXT_SKILL[l.next]?.kind === kind);
}

function firedWord(fired) { return fired ? 'Fired' : 'Not fired'; }

/* A file that is there but unreadable — a source that did not answer — is a
 * yellow header bar where its lane would be, the error as its why-line. */
function skillNoteHtml(kind, read, h) {
  return laneBoxHtml({ band: `px-${kind}`, title: SKILL_METHOD[kind], tone: 'yellow', state: 'Unreadable',
    whyHtml: `The ${esc(SKILL_METHOD[kind])} file for <code>${esc(h.sha7)}</code> ${esc(read.error)}, so it isn't shown.` });
}

/* A pass that finished without one of its files says so, in the section the
 * file would have filled — the difference between "not produced" and "not
 * run yet" is the one thing an absent panel cannot tell you. One header bar
 * per missing file. */
function notProducedBoxes(h, kinds) {
  const miss = PREP_SKILLS.get(h.base)?.missing;
  if (!Array.isArray(miss) || !miss.length) return [];
  const gone = kinds.filter(k =>
    miss.some(m => String(m).toLowerCase().includes(k)) && !skillRead(h, k)?.doc);
  return gone.map(k => laneBoxHtml({ band: `pn-${k}`, title: SKILL_METHOD[k], tone: 'yellow',
    state: 'Not produced', whyHtml: `No ${esc(SKILL_METHOD[k])} from the pr-* pass at <code>${esc(h.sha7)}</code>.` }));
}

const RECALL_VERDICT = {
  no:      { word: 'No',      mark: '✗', tone: 'red',    rank: 0 },
  unclear: { word: 'Unclear', mark: '?', tone: 'yellow', rank: 1 },
  yes:     { word: 'Yes',     mark: '✓', tone: 'quiet',  rank: 2 },
};
function recallVerdict(r) { return RECALL_VERDICT[r.still_true] || RECALL_VERDICT.unclear; }

/* The hits, no → unclear → yes: the order pr-lanes writes them in, enforced. */
function recallHits(h) {
  const hits = (skillRead(h, 'lanes')?.doc?.recall || []).filter(r => r && r.fact);
  return [...hits].sort((a, b) => recallVerdict(a).rank - recallVerdict(b).rank);
}

/* The alert at the top of the PR: only the hits that no longer hold, or might
 * not. One that still holds is not news, so it waits in Remember. */
function recallAlertHtml(h) {
  const hits = recallHits(h);
  const hot = hits.filter(r => recallVerdict(r).rank < 2);
  if (!hot.length) return '';
  const broken = hot.filter(r => r.still_true === 'no').length;
  const open = hot.length - broken;
  const plural = n => (n === 1 ? '' : 's');
  const head = broken
    ? `${broken} recall hit${plural(broken)} no longer true${open ? ` · ${open} unclear` : ''}`
    : `${open} recall hit${plural(open)} may no longer be true`;
  return `<div class="recall-alert band-tone-${broken ? 'red' : 'yellow'}" role="group" aria-label="Recall hits">
    <span class="recall-alert-mark tone-${broken ? 'red' : 'yellow'}">${oi('alert')}</span>
    <div class="recall-alert-text">
      <strong>${esc(head)}</strong>
      <ul class="recall-alert-list">${hot.map(r => `<li>
        <span class="tone-${recallVerdict(r).tone}" aria-hidden="true">${recallVerdict(r).mark}</span>
        <span>${esc(r.fact)}${r.pr ? ` <span class="muted">#${esc(r.pr)}</span>` : ''}</span></li>`).join('')}</ul>
      <button type="button" class="linkish" data-jump="sect-remember">Why — ${
        hits.length === 1 ? 'the hit' : `all ${hits.length} hits`} in Remember ↓</button>
    </div>
  </div>`;
}

/* The full list, in Remember. Not collapsible, like Your turn, and like Your
 * turn an empty one is the box with one plain sentence in it (`none`,
 * already escaped). Its tone is the worst verdict in it. */
function recallBandHtml(h, rows, none) {
  const tone = rows.length ? recallVerdict(rows[0]).tone : 'muted';
  return `<section class="band band-recall band-tone-${tone === 'quiet' ? 'muted' : tone}" aria-labelledby="band-recall-h">
    <div class="band-head">
      <h4 class="band-h" id="band-recall-h">
        <span class="chev chev-none" aria-hidden="true"></span>
        <span class="band-title">Recall hits</span>${ctrHtml(rows.length, plural(rows.length, 'recall hit'), 'band-n ctr')}
      </h4>
      <span class="band-why">${esc(`Cards from merged PRs that this PR touches — still true at ${h.sha7}?`)}</span>
    </div>
    ${rows.length ? `<div class="rows">${rows.map(recallRowHtml).join('')}</div>`
      : `<p class="band-clear lrow-quiet">${none}</p>`}
  </section>`;
}

function recallRowHtml(r) {
  const v = recallVerdict(r);
  const files = recallFiles(r);
  const sub = [
    r.kind ? `<span>${esc(r.kind)}</span>` : '',
    r.pr ? `<span>#${esc(r.pr)}</span>` : '',
    files.length ? `<span>${files.slice(0, 3).map(f => `<code>${esc(shortFile(f))}</code>`).join(', ')}${
      files.length > 3 ? esc(` +${files.length - 3}`) : ''}</span>` : '',
  ].filter(Boolean);
  return `<div class="srow">
    <span class="srow-ic tone-${v.tone}" aria-hidden="true">${v.mark}</span>
    <div class="srow-main">
      <p class="srow-title">${esc(r.fact)}</p>
      ${sub.length ? `<div class="row-sub">${sub.join(SUB_DOT)}</div>` : ''}
      ${r.why ? `<p class="srow-note">${esc(r.why)}</p>` : ''}
    </div>
    <span class="badge badge-${v.tone === 'quiet' ? 'quiet' : v.tone}"><span class="sr-only">Still true: </span>${esc(v.word)}</span>
  </div>`;
}

/* ---- the panels-only page ----
 *
 * The findings page exists only once the review rail has written findings,
 * and a pr-* pass usually beats that ~40-minute review — while my own PRs are
 * never reviewed by the rail at all. Without this page their panels would sit
 * on disk with no way in. It is the findings page minus the findings: same
 * header, same sections, the Review section saying why it is empty. */
function skillsPageHtml() {
  const row = skillsPageRow();
  const h = row && rowSkillHead(row);
  if (!h) {
    return crumbsHtml([{ label: 'Pulls', go: 'today' }, { label: 'Gone' }])
      + emptyLaneHtml('This PR slipped away.',
        'It was merged, closed, or dropped from the sweep. Head back to the lanes.');
  }
  const mine = row.kind === 'mine';
  const pr = mine ? row.pr : row.q;
  /* Nothing is claimed about the files before they have been read once. */
  const read = SKILL_DOCS.has(skillPaths(h).lanes);
  /* No findings yet is the Findings box with one plain sentence in it and no
   * Counter: a review that has not run has no number to draw. */
  const body = read ? recallAlertHtml(h)
    + (mine ? '' : sectHtml('review', 'Review', laneBoxHtml({ band: 'pnofind', title: 'Findings',
        tone: 'muted', state: 'Not reviewed', whyHtml: `No findings for
        <code>${esc(h.sha7)}</code> yet — the prep rail hasn't reviewed this head. They open from
        the row's Review button when they land.` })))
    + orientHtml(h) + proveHtml(h) + rememberHtml(h) : '';
  /* My login in this PR's workspace; an unknown workspace knows no login. */
  const me = wsMeta(workspaceOf(pr)).who;
  const head = mine
    ? prHeadHtml({ pr, sha7: h.sha7, author: me !== '—' ? me : '', head: pr.head_ref,
        state: row.live?.merge === 'merged' ? 'merged' : row.draft ? 'draft' : 'open',
        labels: `<span class="lbl">Your PR</span>${reasonLabelHtml(row)}` })
    : prHeadHtml({ pr, sha7: h.sha7, author: pr.author, files: pr.files_changed,
        labels: reqLabelHtml(pr) });
  return `<div class="prpage">
    ${crumbsHtml([{ label: 'Pulls', go: 'today' }, { label: `${shortRepo(pr.repo)}#${pr.number}` }])}
    ${head}
    ${/* The header already carries the way out to GitHub, so the strip holds
        only the way to talk about the PR — this page has no findings toolbar
        for it to sit in. */''}
    ${canDiscuss(row.id) ? `<div class="card-act pr-act">${discussBtnHtml(row.id)}</div>` : ''}
    ${read && !body.trim() ? emptyLaneHtml('Nothing from the pr-* pass at this head.',
      `Its files are for an earlier head than <code>${esc(h.sha7)}</code>, or were removed.`) : body}
  </div>`;
}

/* ---- the PR header ----
 *
 * GitHub's: the title in bold with its #number muted, then one meta line —
 * the state badge, the author's face and handle wanting to merge into the
 * base from the head (both as the board's ref pills), the short sha, the
 * diff size where it is known, why the PR is on you as Labels, and "open on
 * GitHub" at the right end. Shared by both PR pages so they cannot drift. */
const PR_STATE = {
  open:   { label: 'Open',   icon: 'pr' },
  draft:  { label: 'Draft',  icon: 'draft' },
  merged: { label: 'Merged', icon: 'merge' },
};

function prHeadHtml({ pr, sha7, author, head, files = null, state = 'open', labels = '' }) {
  const s = PR_STATE[state] || PR_STATE.open;
  const who = author ? `<span class="pr-author">${avatarHtml(author)}${esc(author)}</span>` : '';
  const into = pr.base_ref ? `<span>${who ? 'wants to merge into' : 'Into'}</span>
      <code class="ref">${esc(pr.base_ref)}</code>${head ? `<span>from</span>${branchHtml(head)}` : ''}` : '';
  const bits = [
    who || into ? `<span class="pr-who">${who}${into}</span>` : '',
    files != null ? `<span class="sub-diff"><span class="add">+${esc(pr.additions || 0)}</span>
      <span class="del">−${esc(pr.deletions || 0)}</span></span>` : '',
  ].filter(Boolean).join('');
  return `<header class="pr-head">
    <h2 class="pr-title">${esc(pr.title || '(untitled)')} <span class="row-num">#${esc(pr.number)}</span></h2>
    <div class="pr-meta">
      <span class="pr-state pr-state-${esc(state)}">${oi(s.icon)}${esc(s.label)}</span>
      ${bits}
      ${labels ? `<span class="pr-labels">${labels}</span>` : ''}
      ${pr.url ? `<a class="linkish go-gh" href="${esc(pr.url)}" target="${LINK_TARGET}"${openAttrs(pr)}>open on GitHub ↗</a>` : ''}
    </div>
  </header>`;
}

/* One of mine: what the board's reason label says, as a plain Label — the
 * control itself stays on the board's row. An agent at work says so instead. */
function reasonLabelHtml(row) {
  if (row.live) {
    return row.live.merge === 'merged' ? ''
      : `<span class="lbl lbl-accent badge-live">${esc(row.live.label)}</span>`;
  }
  const a = row.action && NEXT_ACTIONS[row.action];
  if (!a) return '';
  return `<span class="lbl${a.tone === 'muted' ? '' : ` lbl-${esc(a.tone)}`}">${labelBody(row.action, a.label)}</span>`;
}

/* Someone else's: why it is on me, from `requested_via` (see reqHtml) — quiet
 * when I was asked, the caution colour when the rail reviewed it unasked. */
function reqLabelHtml(pr) {
  const v = String(pr.requested_via || '');
  if (!v) return '';
  const loud = /^unrequested/.test(v) && pr.assigned !== false;
  return `<span class="lbl${loud ? ' lbl-yellow' : ''}">${pr.assigned === false ? '' : oi('eye')}${
    esc(v.charAt(0).toUpperCase() + v.slice(1))}</span>`;
}

/* The way in from a row with no findings to open — someone else's PR the
 * rail has not reviewed yet, or one of mine. Named for what is there, and
 * absent when nothing is: a button to an empty page is a dead end. A row
 * WITH findings needs none, because its Findings page carries the panels. */
function skillsBtnHtml(row) {
  const s = skillsControl(row);
  if (!s) return '';
  return `<button type="button" class="btn-inline" data-skills="${esc(row.id)}"
    title="${s.title}">${s.label}</button>`;
}

/* What the way into the panels is called, or null when there are none. The
 * inline button and the ⋯ menu item both render from this, so the two can never
 * disagree about the label or where it goes — the same split as prepControl.
 * `title` and `label` are escaped. */
function skillsControl(row) {
  const h = rowSkillHead(row);
  const have = h && SKILL_INDEX.get(h.base);
  if (!have?.size) return null;
  const names = ['lanes', 'story', 'check'].filter(k => have.has(k)).map(k => SKILL_METHOD[k]);
  return {
    title: esc(`The pr-* panels for ${h.sha7}: ${names.join(', ')}`),
    label: esc(names.join(' · ')),
  };
}

/* The ⋯ that ends the strip on a card of mine. The panels are reference you open
 * on purpose, not the next move, so on every state of my own PR — conflict,
 * comments, red CI, ready to merge — they sit here instead of beside the primary
 * action, where they read as one more thing to do. Same menu as the queue card's
 * (moreMenuHtml). `Discuss this PR…` lives here too (2026-10-22): it spends an
 * agent, like Address, so it doesn't sit inline beside the primary move — which
 * means nearly every card of mine now has a ⋯. */
function mineMenuHtml(row) {
  const s = skillsControl(row);
  /* `Answer comments` already leads to the threads, and the comments page carries
   * its own Address button — so on that state the ⋯ would only repeat the pill. */
  const a = row.pr && row.action !== 'comments' ? addressMenuItem(row.pr) : null;
  const items = [a, discussMenuItem(row.id),
    s && { attrs: `data-skills="${esc(row.id)}"`, title: s.title, label: s.label }]
    .filter(Boolean);
  const n = row.pr?.threads?.length || 0;
  return moreMenuHtml(row.id, items, {
    name: a ? `More actions — an agent can address ${n} comment${n === 1 ? '' : 's'}` : 'More actions',
    dot: false,
  });
}

/* Which band a lane's `next` lands on, once the pass runs it — the same four
 * kinds skillPaths names, keyed by the skill name pr-lanes writes. pr-recall
 * (the `remember` lane) is never run from lanes — its hits are already in
 * Remember — so it has no entry and gets no chip. */
const LANE_NEXT_SKILL = {
  'pr-intent':    { kind: 'intent',    label: 'Intent' },
  'pr-story':     { kind: 'story',     label: 'Story' },
  'pr-behaviour': { kind: 'behaviour', label: 'Behaviour' },
  'pr-check':     { kind: 'check',     label: 'Check' },
};

/* The Lanes table is gone: its content lives in the panels it points at.
 * Each skill panel opens with the lane reason that got it run; a lane whose
 * skill hasn't produced yet shows as a quiet "queued" line in the section it
 * will fill; the trust lane (nothing to run) stays as one line at the top.
 * Only an unreadable lanes file still says so here. */
function laneRows(h) {
  return (skillRead(h, 'lanes')?.doc?.lanes || []).filter(l => l && l.lane);
}

/* Why this ran: a callout at the top of the lane's body, naming the pr-lanes
 * lane that fired it as a Label. All of a panel's reasons share one strip, so
 * two lanes pointing at one panel never get a hairline between them. */
function laneWhyHtml(h, kind) {
  const rows = laneRows(h).filter(l => LANE_NEXT_SKILL[l.next]?.kind === kind && l.reason);
  if (!rows.length) return '';
  return `<div class="lane-reasons">${rows.map(l => `<p class="lane-reason">${oi('info')}<span class="lane-reason-text">
      <span class="lane-reason-k">Why this ran <span class="lbl">${esc(l.lane)}</span></span>
      <span>${esc(l.reason)}</span></span></p>`).join('')}</div>`;
}

/* A lane that fired and whose panel has not landed yet: its header bar alone,
 * quiet, with the reason as its why-line. */
function laneQueuedBoxes(h, kinds) {
  const rows = laneRows(h).filter(l => {
    const k = LANE_NEXT_SKILL[l.next]?.kind;
    return k && kinds.includes(k) && !skillRead(h, k)?.doc && !skillRead(h, k)?.error;
  });
  return rows.map((l, i) => laneBoxHtml({ band: `pq-${LANE_NEXT_SKILL[l.next].kind}-${i}`,
    title: LANE_NEXT_SKILL[l.next].label, tone: 'muted', state: 'Queued', why: l.reason || '' }));
}

/* The trust lane runs nothing: a quiet header bar saying so, its reason as
 * the why-line. Only an unreadable lanes file says anything else here. */
function lanesBoxes(h, read) {
  if (read?.error) return [skillNoteHtml('lanes', read, h)];
  return laneRows(h).filter(l => l.lane === 'trust' && l.reason).map((l, i) => laneBoxHtml({
    band: `ptrust-${i}`, title: 'Trust', tone: 'muted', state: 'Nothing to run', why: l.reason }));
}

/* ---- intent ---- */

/* pr-intent's stated why, and where the diff and that why disagree. `status:
 * "needs_why"` means my own PR carried no why to check — pr-intent wrote
 * that once rather than guessing one, and the panel says so in its place
 * rather than showing an empty claims list. */
function intentBandHtml(h, read) {
  if (read?.error) return skillNoteHtml('intent', read, h);
  const d = read?.doc;
  if (!d) return '';
  const open = !COLLAPSED.has('pintent');
  const claims = (d.why?.claims || []).filter(c => c && c.text);
  const mismatches = (d.mismatches || []).filter(m => m && m.text);
  const needsWhy = d.status === 'needs_why';
  const fired = laneFired(h, 'intent');
  /* A missing why, or a diff that disagrees with it, is the lane flagging
   * something; one that matches is read and done. */
  const tone = needsWhy || mismatches.length ? 'yellow' : fired ? 'accent' : 'muted';
  const body = needsWhy
    ? '<p class="lrow lrow-quiet">This PR has no stated why — nothing to check the diff against.</p>'
    : [
        laneGroupHtml('comment', 'Stated why', claims.length),
        claims.length ? claims.map(c => `<div class="lrow"><p class="lrow-text">${esc(c.text)}${
            c.guess ? '<span class="lbl lbl-yellow">guess</span>' : ''}</p></div>`).join('')
          : '<p class="lrow lrow-quiet">No stated why to show.</p>',
        laneGroupHtml('alert', 'Mismatches', mismatches.length),
        mismatches.length ? mismatches.map(m => `<div class="lrow"><div class="lrow-head">
            <span class="lbl lbl-yellow">${esc(m.kind || '?')}</span>
            <span class="lrow-text">${esc(m.text)}</span>${refHtml(m.evidence)}</div></div>`).join('')
          : '<p class="lrow lrow-quiet">No mismatches: every change traces to the why, and every claim has code.</p>',
      ].join('');
  return laneBoxHtml({ band: 'pintent', cls: 'band-intent', title: 'Intent', tone,
    count: needsWhy ? null : mismatches.length,
    say: plural(mismatches.length, 'mismatch', 'mismatches') + ' between the why and the diff',
    state: firedWord(fired), open,
    why: `The stated why, checked against the diff — from pr-intent at ${h.sha7}`,
    body: `${laneWhyHtml(h, 'intent')}${body}` });
}

/* ---- story ---- */

function storyBandHtml(h, read) {
  if (read?.error) return skillNoteHtml('story', read, h);
  const d = read?.doc;
  if (!d) return '';
  const path = skillPaths(h).story;
  const flows = (Array.isArray(d.flows) ? d.flows : []).filter(f => f && f.entry);
  const main = flows.find(f => f.diagrammed) || null;
  const figs = storyDiagrams(d);
  /* A v4 diagram names its flow; an older file's one diagram is the main flow's. */
  const figFlow = (g, i) => Array.isArray(d.diagrams)
    ? flows.find(f => f.entry === g.flow) || (g.flow ? { entry: g.flow } : null)
    : i === 0 ? main : null;
  const drawn = new Set(figs.map(figFlow).filter(Boolean).map(f => f.entry));
  const extraUnsorted = flows.filter(f => !f.diagrammed && !drawn.has(f.entry));
  /* v1 files have no `group`, and their `flows` array wasn't guaranteed complete
   * or ordered, so the old sort-by-changed_lines is still the best read of them.
   * v2's `flows` is already in the right order (main, then each group's top
   * flow, then each group's next) — resorting it would break that. */
  const extra = d.schema === 'pr-skills/story/v1'
    ? extraUnsorted.sort((a, b) => (b.changed_lines || 0) - (a.changed_lines || 0))
    : extraUnsorted;
  const n = Number(d.separate_things) || 0;
  const smallFixes = Number.isInteger(d.small_fixes) && d.small_fixes > 0 ? d.small_fixes : 0;
  const open = !COLLAPSED.has('pstory');
  const changedLinesText = f => f.changed_lines === 0 ? 'no lines of its own'
    : f.changed_lines === 1 ? '1 changed line'
    : `${esc(f.changed_lines ?? '?')} changed lines`;
  const why = main
    ? `Main flow: ${main.entry} · ${main.changed_lines ?? '?'} changed lines`
    : `From pr-story at ${h.sha7}`;
  const fired = laneFired(h, 'story');
  /* Several separate things is the lane flagging the PR's shape; a story with
   * nothing to draw and no other flow has nothing to read. */
  const tone = n >= 3 ? 'yellow' : !figs.length && !extra.length ? 'muted' : fired ? 'accent' : 'muted';
  const flowMeta = f => [`<span>${esc(f.kind || 'other')}</span>`, `<span>${changedLinesText(f)}</span>`,
    f.group != null ? `<span>group ${esc(f.group)}</span>` : ''].filter(Boolean).join(SUB_DOT);
  /* One figure per diagram: on a v4 file a heading naming its flow, then its
   * own phone step list, toggle and box. The toggle's state is the figure's
   * own (STORY_FIG_OPEN), so opening one leaves the others as they were. */
  const figHtml = (g, i) => {
    const flow = figFlow(g, i);
    const key = `${path}#${i}`;
    const isOpen = STORY_FIG_OPEN.has(key);
    const what = figs.length > 1 ? `flow ${i + 1} of ${figs.length}` : 'the main flow';
    const steps = storyStepsHtml(g.mermaid, `${what[0].toUpperCase()}${what.slice(1)}, step by step${flow ? `: ${flow.entry}` : ''}`);
    const head = Array.isArray(d.diagrams) && flow ? `<div class="story-fig-h"><p class="lrow-lead">${esc(flow.entry)}</p>${
      flow.changed_lines !== undefined || flow.kind ? `<div class="row-sub">${flowMeta(flow)}</div>` : ''}</div>` : '';
    return `<div class="story-fig" data-fig-key="${esc(key)}"${steps
      ? ` data-steps="1"${isOpen ? ' data-fig-open="1"' : ''}` : ''}>${head}${steps}${steps
      ? `<button type="button" class="btn story-fig-toggle" data-story-fig aria-expanded="${isOpen}">${
          isOpen ? 'Hide the diagram' : 'Show as a diagram'}</button><p class="story-cap story-cap-phone muted"${
          isOpen ? '' : ' hidden'}>Scrolls sideways.</p>` : ''}${diagramHtml(path, i, g, flow, what)}${g.level === 'module'
      ? '<p class="story-cap">Drawn at module level: participants are modules, messages the calls between them.</p>' : ''}</div>`;
  };
  const parts = [
    n >= 3 ? `<p class="story-finding">${oi('alert')}<span>This PR does ${esc(n)} separate things${smallFixes
      ? `, plus ${esc(smallFixes)} small fix${smallFixes === 1 ? '' : 'es'}` : ''} — each thing is a review of its own.</span></p>` : '',
    figs.length ? figs.map(figHtml).join('')
      : '<p class="lrow lrow-quiet">No flow to draw — no entry point reaches the changed code.</p>',
    /* The other flows, as rows under their own group header: the entry
     * point leads, its kind, size and group on the meta line. */
    extra.length ? `${laneGroupHtml('branch', 'Other flows', extra.length)}${extra.slice(0, 5).map(f => `<div class="lrow">
        <p class="lrow-lead">${esc(f.entry)}</p>
        <div class="row-sub">${flowMeta(f)}</div></div>`).join('')}${
      extra.length > 5 ? `<p class="lrow lrow-more">+${esc(extra.length - 5)} more flows</p>` : ''}` : '',
  ].filter(Boolean);
  return laneBoxHtml({ band: 'pstory', cls: 'band-story', title: 'Story', tone,
    count: flows.length,
    say: `${plural(flows.length, 'flow')} ${flows.length === 1 ? 'reaches' : 'reach'} the changed code${
      figs.length > 1 ? ` · ${figs.length} drawn` : ''}`,
    state: firedWord(fired), why, open,
    body: `${laneWhyHtml(h, 'story')}${parts.join('')}` });
}

/* The sequence source as plain steps, for a phone. Only what pr-story writes:
 * `participant X as Name`, `A->>B: text`, with -->> for a reply, -x for a
 * removed call, and a trailing [new] / [changed] / [removed] tag. Anything it
 * does not recognise is skipped; no steps means no list, just the diagram. */
function storySteps(src) {
  const names = {};
  const steps = [];
  for (const raw of String(src || '').split('\n')) {
    const line = raw.trim();
    let m = line.match(/^(?:participant|actor)\s+(\S+)(?:\s+as\s+(.+))?$/);
    if (m) { names[m[1]] = (m[2] || m[1]).replace(/\s*\[[a-z]+\]\s*$/i, ''); continue; }
    m = line.match(/^([^\s:-]+?)\s*(-{1,2})(>>|>|x|\))\s*([+-]?)([^\s:]+)\s*:\s*(.*)$/);
    if (!m) continue;
    let text = m[6];
    let tag = '';
    const t = text.match(/\s*\[(new|changed|removed|unchanged)\]\s*$/i);
    if (t) { tag = t[1].toLowerCase(); text = text.slice(0, t.index); }
    steps.push({ from: m[1], to: m[5], text, tag,
      reply: m[2] === '--', removed: m[3] === 'x' || tag === 'removed' });
  }
  const nm = k => names[k] || k;
  return steps.map(s => ({ ...s, from: nm(s.from), to: nm(s.to) }));
}

/* The figures whose phone toggle is open, by `<story path>#<diagram index>`. */
let STORY_FIG_OPEN = new Set();

/* A story's diagrams, biggest flow first: v4's `diagrams`, or an older file's
 * one `diagram` as a list of one. A box addresses its source by index into
 * this list (data-diagram-i), so every reader goes through here. */
function storyDiagrams(d) {
  const list = Array.isArray(d?.diagrams) && d.diagrams.length ? d.diagrams : d?.diagram ? [d.diagram] : [];
  return list.filter(g => g && g.mermaid).slice(0, 3);
}

function diagramSrc(el) {
  return storyDiagrams(SKILL_DOCS.get(el.dataset.diagram)?.doc)[Number(el.dataset.diagramI) || 0]?.mermaid;
}

function storyStepsHtml(src, label) {
  /* Only a sequence reads as a list; a state diagram or flowchart is drawn as-is. */
  if (!/^\s*sequenceDiagram/.test(String(src || ''))) return '';
  const steps = storySteps(src);
  if (!steps.length) return '';
  return `<ol class="story-steps" aria-label="${esc(label)}">${steps.map(s => `<li class="${
      s.reply ? 'step-reply' : ''}${s.removed ? ' step-removed' : ''}">
      <span class="step-who"><b>${esc(s.from)}</b>${s.from === s.to ? ' (itself)' : ` ${s.reply ? '⇠' : '→'} <b>${esc(s.to)}</b>`}</span>
      <span><span class="step-text">${esc(s.text)}</span>${s.tag && s.tag !== 'unchanged'
        ? `<span class="step-tag step-tag-${esc(s.tag)}">${esc(s.tag)}</span>` : ''}</span></li>`).join('')}</ol>`;
}

/* ---- behaviour ---- */

/* pr-behaviour's before/after lines and the omitted-count it keeps past 5.
 * On v2 each change carries its own screenshots (`shots`), or says why it has
 * none (`no_shot_reason`); a v1 file only listed what a capture tool should
 * shoot (`capture`), which is shown as the shots that were never taken. */
function behaviourBandHtml(h, read) {
  if (read?.error) return skillNoteHtml('behaviour', read, h);
  const d = read?.doc;
  if (!d) return '';
  const open = !COLLAPSED.has('pbehaviour');
  const changes = (d.changes || []).filter(c => c && c.surface);
  const more = Number(d.more) || 0;
  const v1 = d.schema === 'pr-skills/behaviour/v1';
  const capture = v1 ? (d.capture || []).filter(c => c && c.surface) : [];
  const fired = laneFired(h, 'behaviour');
  const total = changes.length + more;
  /* One change, one row: the area leads in bold with its file:line pill at
   * the right end, then before → after drawn as a two-line diff, then its
   * shots — or why it has none. */
  const changeHtml = c => `<div class="lrow">
      <div class="lrow-head"><p class="lrow-lead">${esc(c.surface)}</p>${refHtml(c.evidence)}</div>
      <div class="diff">
        <p class="diff-line diff-del"><span class="diff-sign" aria-hidden="true">−</span><span><span
          class="sr-only">Before: </span>${esc(c.before)}</span></p>
        <p class="diff-line diff-add"><span class="diff-sign" aria-hidden="true">+</span><span><span
          class="sr-only">After: </span>${esc(c.after)}</span></p>
