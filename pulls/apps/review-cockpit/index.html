   * against RAILS to find the gh identity — a bare name matches no rail and the
   * run refuses. The LOCK KEY uses the bare name, because that is what
   * detect.py writes into the ReviewPrepRequested payload and therefore what
   * loadPrepping() reads back. Collapsing them either way breaks one side
   * silently: a bare emit refuses, a qualified lock key never matches. */
  const full = q.repo || `${q.org}/${q.repo_name}`;
  const bare = q.repo_name || shortRepo(q.repo);
  const redo = prep === 'prepped' || prep === 'stale';
  const ok = await lucidos.ui.confirm({
    title: `${redo ? 'Re-review' : 'Review'} ${shortRepo(full)}#${q.number} now?`,
    message: `Starts immediately — the rail reviews this head with the full `
      + `multi-agent pass, about 40 minutes and a few million tokens.\n\n`
      + (prep === 'prepped'
        ? `Findings already exist for this head; the new run replaces them.\n\n`
        : '')
      + `It's read-only: it never comments on the PR, never pushes, and never edits `
      + `the code it reviews. The findings appear on this card when it finishes.`,
    okLabel: redo ? 'Re-review it now' : 'Review it now',
  });
  if (!ok) return;

  try {
    await lucidos.events.emit('ReviewPrepManualRequested', {
      summary: `Prep ${full}#${q.number} for review, asked for from the Pulls app`,
      repo: full, pr: q.number, sha7: q.sha7, url: q.url,
      requested_via: q.requested_via || '',
      force: prep === 'prepped',
    });
    PREPPING.set(prepKey(bare, q.number, q.sha7),
                 { at: new Date().toISOString(), manual: true, pending: true });
    render();
    /* "Asked", not "Started" — the emit reaches the trigger, and the trigger
     * decides. It can refuse (findings already at this head, a review genuinely
     * running), and until ReviewPrepRequested or ReviewPrepRefused comes back
     * nothing here knows which. Claiming a 40-minute review began is a promise
     * this function is not in a position to make: on 2026-08-19 it made that
     * promise six times for #763 while every click was being refused. */
    lucidos.ui.toast('Asked the rail to review this head…', 'info',
      { key: 'prep', durationMs: 4000 });
  } catch (err) {
    lucidos.ui.toast('Failed to reach the prep rail', 'error', { key: 'prep' });
  }
}

/* ---------- manual refresh ----------
 *
 * SCOPE: this re-reads PR *status* only — the mine.py sweep that answers "is it
 * conflicted, are there unanswered comments, is CI red, is it approved". It does
 * NOT re-run the code review. That is a ~40-minute multi-agent job costing
 * millions of tokens, it's keyed on the head SHA, and
 * they already re-fire by themselves when a PR actually moves. A button that could
 * launch one by accident is a button that burns a token budget on a mis-click, so
 * this one is deliberately narrow and says so in its tooltip.
 *
 * WHY AN EVENT AND NOT A DIRECT CALL. Same constraint as the Open PR
 * opener: an iframe can't run `gh`. The sweep is a script trigger, so the app
 * emits and the trigger runs it — the identical mechanism the hourly cron uses,
 * which means manual and scheduled refreshes cannot drift apart.
 *
 * COMPLETION IS AN EVENT, NOT A RETURN VALUE. `emit` resolves when the event is
 * stored, not when the sweep finishes — the real signal is the
 * `MyPrStatusSnapshotted` the script emits at the end, which the SSE subscription
 * below already listens for. Hence the timeout: if that never lands (trigger
 * queued behind other work, gh unreachable, VPN down), the button un-sticks itself
 * and says the check didn't come back, rather than spinning forever. */
async function requestRefresh() {
  if (refreshing) return;
  refreshing = true;
  render();

  /* The click's wall clock, so the timeout below can ask the one question that
   * separates a sweep that never ran from a frame that never arrived. */
  const askedAt = Date.now();

  clearTimeout(refreshTimer);
  clearInterval(refreshPoll);

  /* Did a sweep newer than the click land on disk? Shared by the poll and the
   * timeout, so both answer the question the same way. */
  const sweepLanded = async () => {
    await loadMine();
    await loadShipped();
    await loadQueue();
    const at = [MINE?.generated_at, QUEUE?.generated_at]
      .filter(Boolean).map(t => Date.parse(t)).filter(t => !Number.isNaN(t));
    return !!at.length && Math.max(...at) >= askedAt - CLOCK_SLACK_MS;
  };

  /* Poll the artifact rather than trusting the frame. The SSE handler still
   * clears the spinner the instant the event lands and cancels this interval;
   * this is the path for the tab that will never see one. */
  refreshPoll = setInterval(async () => {
    if (!refreshing) { clearInterval(refreshPoll); return; }
    try {
      if (!(await sweepLanded())) return;
      clearInterval(refreshPoll);
      clearTimeout(refreshTimer);
      refreshing = false;
      render();
      /* Silent, like the SSE path: the rows updating in front of the user is
       * the acknowledgement, and the lost frame is not their problem. */
      lucidos.ui.dismissToast('prrefresh');
    } catch (e) {
      /* Engine unreachable or a half-written file. Keep polling — the timeout
       * below is the backstop, and one bad read says nothing. */
    }
  }, REFRESH_POLL_MS);

  refreshTimer = setTimeout(async () => {
    clearInterval(refreshPoll);
    refreshing = false;
    /* DON'T TRUST THE TIMEOUT ON ITS OWN. It fires when no `MyPrStatusSnapshotted`
     * REACHED THIS TAB, which is not the same fact as "the sweep didn't finish" —
     * and on 2026-09-09 the difference was the whole bug. The sweep ran, wrote
     * both artifacts and emitted at 11:04; this tab had been open since the
     * morning, its SSE stream had lapsed, and the frame was simply never
     * delivered. So the board sat on a stale reading and announced "GitHub
     * unreachable" about a GitHub that had answered fine two minutes earlier.
     *
     * With the poll above this is now the genuine-failure path: reaching it
     * means two minutes passed and no newer sweep ever appeared on disk. Ask
     * once more anyway, since the last poll may have lost a race with the
     * write, and only warn when the answer is still no. */
    try {
      const landed = await sweepLanded();
      render();
      if (landed) {
        lucidos.ui.dismissToast('prrefresh');
        return;
      }
    } catch (e) {
      /* Couldn't read the artifacts either — fall through to the warning, which
       * is now the honest answer rather than a guess. */
      render();
    }
    lucidos.ui.toast('No result came back — the sweep may be queued or GitHub unreachable',
      'warning', { key: 'prrefresh' });
  }, REFRESH_TIMEOUT_MS);

  try {
    await lucidos.events.emit('PrStatusRefreshRequested', {
      summary: 'Manual PR status refresh from the Pulls app',
      source: 'review-cockpit',
    });
    /* No toast for "started" — the button's own spinner already says it, and a
     * banner that repeats what the control under the cursor is showing is noise. */
  } catch (err) {
    clearTimeout(refreshTimer);
    clearInterval(refreshPoll);
    refreshing = false;
    render();
    lucidos.ui.toast('Failed to reach the refresher', 'error', { key: 'prrefresh' });
  }
}

/* ---------- derived ---------- */

function progress(entry) {
  const st = prState(entry.key);
  const all = entry.current.findings;
  const picked = all.filter(f => st.findings[idKey(f)]?.picked).length;
  return { picked, total: all.length };
}

/* ONE list, severity-ordered. The reported/archive split is gone.
 *
 * `reported` is the REVIEWER's 15-item display cut, and on #1612 it left 26
 * CONFIRMED findings sitting in an "Archive" tab behind a click — a cap artifact
 * (see review-prep-rail knowhow: "the return object is capped at 15 too")
 * presented as if it were a judgement about importance. It isn't one. A CONFIRMED
 * finding is a CONFIRMED finding whether the harvester's slice reached it or not,
 * so the flag no longer decides what you see; it survives only as provenance in
 * the artifact.
 *
 * Order: CONFIRMED before PLAUSIBLE before everything else, source before test
 * within each. Verdict outranks is_test now — the old comparator sorted test-ness
 * first, which pushed a CONFIRMED bug on a spec file below every PLAUSIBLE guess
 * about product code.
 *
 * Issues before nits, above all of that (see isIssue): the page draws the Nits
 * band last, and the composer reads this order, so a comment leads with the race
 * condition rather than the wording nit. */
function allFindings(doc) {
  const sorted = sortBySeverity(doc.findings || []);
  return [...sorted.filter(isIssue), ...sorted.filter(f => !isIssue(f))];
}

function sortBySeverity(list) {
  return [...list].sort(severityCmp);
}

function severityCmp(a, b) {
  const rank = v => (v === 'CONFIRMED' ? 0 : v === 'PLAUSIBLE' ? 1 : 2);
  return rank(a.verdict) - rank(b.verdict) ||
    (a.is_test ? 1 : 0) - (b.is_test ? 1 : 0) ||
    (a.file || '').localeCompare(b.file || '');
}

/* ---------- attention: who owns the next move ----------
 *
 * ONE computed field decides everything above the fold: `turn`.
 *
 *   mine    something here wants a decision from me today
 *   theirs  a named human owes the next move
 *   nobody  no one holds it — the failure mode, not a flavour of waiting
 *
 * It is derived once per row and then used three times: to pick the band, to
 * count the tab badge, and to write the empty-state sentence. Eight lanes each
 * re-deciding "is this mine" from a different predicate is what let a PR sit in
 * two lanes on one board and in none on the next.
 *
 * The band is decided by WHO OWNS THE NEXT MOVE, not by who authored the PR —
 * so my conflicted PR and someone else's PR awaiting my review are neighbours,
 * which is the actual shape of a morning.
 *
 * The tiebreak, when the union would otherwise be empty: default to the author.
 * A PR of mine that matches no rule is mine, not nobody's. */

/* Checks, as three values, and SILENCE IS THE DEFAULT.
 *
 * The board surfaces CI only when CI is a problem. Passing checks, skipped
 * checks and no checks at all collapse to one value — `ok` — which renders
 * nothing. That is the inversion: green was the most common thing on the board
 * and it was never once actionable, so it was a column of decoration on every
 * row that competed with the one row where CI actually failed.
 *
 * `ok` is deliberately not `passed`. It does not claim the checks went green;
 * it claims only that nothing is asking for attention, which is the honest
 * reading of an absent status too. Anything that needs stronger evidence than
 * that must read `p.ci` itself rather than this function.
 *
 * `running` survives as its own value because a PR whose checks are still going
 * is genuinely not yet ok — but it is muted rather than coloured, since waiting
 * is not a failure. */
function ciOf(p) {
  const v = String(p?.ci || '').toUpperCase();
  if (!v) return 'ok';
  if (/FAIL|ERROR|TIMED_OUT|CANCELL?ED/.test(v)) return 'failed';
  if (/PENDING|RUNNING|IN_PROGRESS|QUEUED|EXPECTED|WAITING/.test(v)) return 'running';
  return 'ok';
}

/* A null entry renders NOTHING. `rowSubHtml` tests for the entry's existence
 * rather than comparing against a label string — the old `label !== 'No checks'`
 * check was a string comparison standing in for a policy, and it went stale the
 * moment the label was reworded. */
const CI_META = {
  failed:  { label: 'CI failed',  tone: 'red' },
  running: { label: 'CI running', tone: 'muted' },
  ok:      null,
};

/* Three labels, and the fourth case is SILENCE.
 *
 * When an approval no longer covers the head SHA it is not an approval — it is a
 * fact about a commit nobody is looking at any more. `stale_reviewers` is exactly
 * that condition (mine.py records who reviewed which SHA), so an APPROVED
 * decision with stale reviewers renders nothing rather than a green label the
 * next push already invalidated. */
/* GitHub leaves reviewDecision null on repos that don't REQUIRE reviews, even
 * after someone approves. A current approval is then the decision — otherwise an
 * approved PR lands in "Find a reviewer" (ua-knowledge#30, 2026-10-12). mine.py
 * now fills this in too; this covers rows written before that fix. */
function decisionOf(p) {
  const d = String(p?.review_decision || '').toUpperCase();
  if (d) return d;
  return p?.approvals?.length ? 'APPROVED' : '';
}

function reviewLabelOf(p) {
  const d = decisionOf(p);
  if (d === 'APPROVED') {
    if (p.stale_reviewers?.length) return null;
    return { key: 'approved', label: 'Approved', tone: 'green' };
  }
  /* YELLOW, NOT RED. Red is reserved for the two next actions that block on ME
   * — `Fix conflicts` and `Fix CI`. A requested change is a fact about the
   * review, and the row carrying it usually sits in `Waiting on others`, where a
   * red pill has the badge and the band's own subtitle disagreeing about who
   * owes the next move. */
  if (d === 'CHANGES_REQUESTED') {
    return { key: 'changes', label: 'Changes requested', tone: 'yellow' };
  }
  if (d === 'REVIEW_REQUIRED') {
    return { key: 'required', label: 'Review required', tone: 'muted' };
  }
  return null;
}

/* THE CLOSED VOCABULARY. Sixteen status labels across four palettes became this
 * table, and nothing outside it may reach a row.
 *
 * `verb` is what the badge says; the badge IS the button wherever an action
 * exists, so there is never a label naming a thing and a control doing it two
 * inches apart. `tone` is the row's dot as well as the badge, which is why
 * exactly one of these can be true at a time.
 *
 * Conflicts get NO separate badge — they ARE the next action. That fold is the
 * single change that keeps a row at one badge. */
const NEXT_ACTIONS = {
  conflicts:    { label: 'Fix conflicts',     tone: 'red'    },
  ci:           { label: 'Fix CI',            tone: 'red'    },
  comments:     { label: 'Answer comments',   tone: 'yellow' },
  rereview:     { label: 'Re-review',         tone: 'accent' },
  review:       { label: 'Review',            tone: 'accent' },
  merge:        { label: 'Merge',             tone: 'green'  },
  rerequest:    { label: 'Re-request review', tone: 'yellow' },
  findreviewer: { label: 'Find a reviewer',   tone: 'yellow' },
  mergeunreviewed: { label: 'Merge unreviewed', tone: 'yellow' },
  nudge:        { label: 'Nudge',             tone: 'muted'  },
  brief:        { label: 'Read brief',        tone: 'muted'  },
};

/* An agent already working on the row is not a next action — it is the reason
 * there isn't one. It takes the badge slot because the alternative is a red
 * `Fix conflicts` sitting on a PR something is actively rebasing, which is the
 * board contradicting itself with the stale half in the louder colour. */
function liveWorkOn(p) {
  /* A merge from this row (requestMerge). `merge` marks it as an overlay on
   * the row's own Merge action rather than a replacement for it — see
   * mineBoardRow. */
  const m = MERGING.get(resolveKey(p));
  if (m) {
    return m.phase === 'merged' ? { label: 'Merged', tone: 'muted', merge: 'merged' }
      : { label: m.phase === 'merging' ? 'Merging' : 'Checking', tone: 'live', merge: m.phase };
  }
  if (RESOLVING.get(resolveKey(p))) {
    return { label: conflictStyle(p) === 'merge' ? 'Merging' : 'Rebasing', tone: 'live' };
  }
  if (ADDRESSING.get(resolveKey(p))) return { label: 'Answering', tone: 'live' };
  return null;
}

/* Past this, a PR parked on a human stops being "in review" and starts being
 * forgotten — so the row grows the one action a waiting row can carry. Measured
 * against last activity, not against open date: a PR pushed yesterday is not
 * stale because it was opened in July. */
const NUDGE_DAYS = 7;

function lastActivityAt(p) {
  return Date.parse(p?.updated_at || p?.pushed_at || p?.merged_at || p?.created_at || '') || 0;
}

function ageDaysOf(p) {
  const t = lastActivityAt(p);
  return t ? (Date.now() - t) / 86400000 : 0;
}

/* The next action on one of MY PRs, most-blocking first.
 *
 * Precedence is deliberate and is NOT an urgency ranking: it answers "what is
 * the first thing that has to happen", which is a different question. A red-CI
 * dependency bump does not outrank a customer-facing PR — ordering inside a band
 * is by last activity, and blocked-ness never promotes. */
function mineAction(p) {
  if (p.draft || p.state === 'draft') return null;
  if (p.mergeable === 'CONFLICTING' || p.state === 'conflict') return 'conflicts';
  if (ciOf(p) === 'failed') return 'ci';
  if ((p.unresolved_threads || p.threads?.length || 0) > 0) return 'comments';
  if (p.stale_reviewers?.length) return 'rerequest';
  if (decisionOf(p) === 'APPROVED'
      && ciOf(p) !== 'failed' && p.mergeable === 'MERGEABLE') return 'merge';
  /* An unreviewed PR is deliberately NOT a `merge` here: merging with nobody's
   * sign-off is a different act from merging an approved PR, so it stays in
   * Nobody's turn and gets its own action there (see unreviewedAction). */
  return null;
}

/* The action on one of my PRs nobody holds. Nobody was ever asked and nobody
 * has reviewed: either name a reviewer, or merge it without one. Offered only
 * when that merge could go through — green CI and not known to conflict. The
 * sweep usually reads `mergeable: UNKNOWN` here (GitHub computes it lazily), so
 * UNKNOWN is allowed and mergePreflight reads the real value before any PUT;
 * branch protection that requires a review shows up there as `blocked`. */
function unreviewedAction(p) {
  if (isUnreviewed(p) && ciOf(p) === 'ok' && p.mergeable !== 'CONFLICTING') return 'mergeunreviewed';
  return 'findreviewer';
}

function isUnreviewed(p) {
  const d = String(p?.review_decision || '').toUpperCase();
  return !d && !p.waiting_on?.length && !p.approvals?.length && !p.stale_reviewers?.length;
}

/* Who holds one of my PRs. Called with the action already computed, so the two
 * can never disagree about whether there is something to do. */
function mineTurn(p, act) {
  if (act) return 'mine';
  if (p.on_me) return 'mine';                                  // the sweep says so
  if (p.draft || p.state === 'draft') return 'theirs';         // mine to write, nobody blocked
  if (p.waiting_on?.length) return 'theirs';
  return 'nobody';                                             // open, and not one person asked
}

/* The next action on someone ELSE's PR. `Re-review` and `Review` are distinct
 * because the work is: one is re-reading a diff you already know, the other is
 * meeting it cold. */
function reviewAction(row) {
  const q = row.q;
  if (q.assigned === false) return null;         // team request, nobody named — nobody's turn
  if (q.reviewed_current) return null;           // I've had my say on this head
  const seenBefore = !!q.my_review || /earlier head/i.test(q.requested_via || '');
  return seenBefore ? 'rereview' : 'review';
}

function reviewTurn(row, act) {
  if (act) return 'mine';
  if (row.q.assigned === false) return 'nobody'; // nobody has been named on it
  return 'theirs';                               // answered or approved — the author moves next
}

/* Prep is its OWN dimension and its own column, never a second pill. Findings
 * bound to a head that is no longer head render as `Stale prep`, never as a
 * count — a number there would be a current-looking answer about an old commit. */
function prepCell(row) {
  const { q, entry, prep } = row;
  const repo = q.repo_name || q.repo;
  if (!PREPPABLE.has(q.repo || `${q.org}/${q.repo_name}`) || !listens('ReviewPrepManualRequested')) return null;
  if (PREPPING.get(prepKey(repo, q.number, q.sha7))) {
    return { key: 'prepping', label: 'Prepping', live: true };
  }
  /* Issues, not findings: the raw total is mostly nits (see isIssue), and this
   * chip is the only size the board shows before you open the row. */
  if (prep === 'prepped') {
    const t = entry?.current ? tallyFor(entry.current) : { issues: 0, plausible: 0, nits: 0 };
    return { key: 'ready', label: `Issues · ${t.issues}`, n: t.issues, say: tallyText(t) };
  }
  if (prep === 'stale') return { key: 'stale', label: 'Stale prep' };
  return { key: 'none', label: 'Not prepped' };
}

/* One row shape for every band. Two sources with different field names used to
 * mean two row anatomies that disagreed about field order and status position;
 * normalising here is what lets a single renderer draw both, and therefore what
 * lets you scan one column down the whole page. */
function whoFields(p, act) {
  const approved = act === 'merge'
    || decisionOf(p) === 'APPROVED';
  if (approved && p.approvals?.length) {
    return { who: p.approvals, whoLabel: 'approved by' };
  }
  if (p.waiting_on?.length) return { who: p.waiting_on, whoLabel: 'waiting on' };
  if (p.approvals?.length) return { who: p.approvals, whoLabel: 'approved by' };
  return { who: [], whoLabel: '' };
}

function mineBoardRow(p) {
  const live = liveWorkOn(p);
  /* An agent's live work replaces the next action. A merge in flight only
   * overlays it: the row keeps `merge`, so it stays in its band and in the
   * tab count while GitHub is asked, and the slot shows the phase instead. */
  const act = live && !live.merge ? null : mineAction(p);
  let turn = mineTurn(p, act);
  let action = act;
  if (!action && !live) {
    if (turn === 'nobody') action = unreviewedAction(p);
    else if (turn === 'theirs' && p.waiting_on?.length && ageDaysOf(p) >= NUDGE_DAYS) {
      action = 'nudge';
    }
  }
  return {
    kind: 'mine', id: `mine:${p.repo}#${p.number}`, turn, action, live, pr: p,
    title: p.title, number: p.number, repo: p.repo, url: p.url, sha7: p.sha7,
    at: lastActivityAt(p),
    review: reviewLabelOf(p),
    draft: !!(p.draft || p.state === 'draft'),
    /* Approvals win over `waiting_on` once the PR is approved. GitHub leaves a
     * reviewer in the box after they sign off, so a merge-ready row would
     * otherwise read `Merge · waiting on sam-lee` — a badge and a subtitle
     * disagreeing about whether anyone is still holding it. */
    ...whoFields(p, act),
    prep: null,             // the prep rail deliberately never reviews my own PRs
    diff: null,             // mine.py carries no diff size
  };
}

function reviewBoardRow(row) {
  const q = row.q;
  const act = reviewAction(row);
  let turn = reviewTurn(row, act);
  let action = act;
  if (!action && turn === 'theirs' && ageDaysOf(q) >= NUDGE_DAYS) action = 'nudge';
  return {
    kind: 'review', id: `rev:${q.repo}#${q.number}`, turn, action, live: null,
    q, entry: row.entry, prepState: row.prep, pr: q,
    title: q.title || '(untitled)', number: q.number,
    repo: q.repo || `${q.org}/${q.repo_name}`, url: q.url, sha7: q.sha7,
    at: lastActivityAt(q),
    review: null,
    draft: false,
    who: q.author ? [q.author] : [],
    whoLabel: q.author ? 'by' : '',
    prep: prepCell(row),
    diff: q.files_changed != null ? { add: q.additions || 0, del: q.deletions || 0 } : null,
    said: q.reviewed_current ? saidHtml(q) : reqHtml(q),
  };
}

/* Newest activity first, inside every band and every sub-group. One ordering
 * rule for the whole page: "read down, not across — the order is the
 * recommendation", and nothing about being blocked promotes a row. */
function byActivity(a, b) { return b.at - a.at; }

/* The whole board, banded, for one workspace tab. Everything the page renders
 * comes from here, so a row can never appear in two bands or in none. */
function boardBands(wsId) {
  const s = scope(wsId);
  const mine = (MINE?.prs || [])
    .filter(p => wsId === 'all' || workspaceOf(p) === wsId)
    .map(mineBoardRow);
  /* Every queue row, both halves: awaiting my read, already answered, and the
   * unassigned pool. reviewQueue() partitions on `reviewed_current` and
   * `assigned`, and all three partitions band by `turn` here instead. */
  const reviews = [
    ...reviewQueue(wsId, true, false),
    ...reviewQueue(wsId, true, true),
    ...reviewQueue(wsId, false, false),
    ...reviewQueue(wsId, false, true),
  ].map(reviewBoardRow);

  const all = [...mine, ...reviews];
  return {
    mineTurn:    mine.filter(r => r.turn === 'mine').sort(byActivity),
    reviewsTurn: reviews.filter(r => r.turn === 'mine').sort(byActivity),
    waiting:     all.filter(r => r.turn === 'theirs').sort(byActivity),
    nobody:      all.filter(r => r.turn === 'nobody').sort(byActivity),
    briefs:      s.briefs,
    /* Like briefs: a record, not a queue. Absent from wsLoad() for the same
     * reason — nothing here wants a decision, so it must never inflate a badge. */
    shipped:     shippedFor(wsId),
  };
}

/* ---------- restatements of one defect ----------
 *
 * THE LIST LOOKED DUPLICATED BECAUSE IT WAS. Not a render bug — the artifact
 * really carries the same defect as N separate findings. On #756,
 * `MuscleBreakdownSheet.tsx:165` has SIX: five correctness plus one cleanup, all
 * CONFIRMED, all saying `key={entry.slug}` collides after the map was re-keyed
 * from one key to another. `lib/mapping.ts:173` has five more. 18 of that
 * PR's 50 rows are restatements, and across the 14 artifacts on disk it's 163 of
 * 487 — a third of every findings page.
 *
 * WHERE THEY COME FROM. The workflow runs parallel finders over the same diff,
 * pools their candidates, and spawns ONE verifier per distinct `(file,line)`.
 * That verifier confirms every candidate it was handed and writes each as its own
 * row — so the fan-out that raises recall (five angles at one line) also lands
 * five near-identical rows. They say so themselves: 55 of them carry an explicit
 * "Same defect as [0]" or "[same root cause also at: …]" in their own prose.
 *
 * SO FOLD, DON'T DROP. Two reasons this is a display fold and not a filter:
 *
 *  - The restatements are not redundant, they're differently-argued. #756's f02
 *    is the only one that names the second consequence (one aggregated bar split
 *    into several), and f29 is the only one framed as cleanup. Deleting them
 *    loses the argument; hiding them behind a count keeps it one click away.
 *  - Each carries its own id, and `triage.json` keys on the id. Dropping a row
 *    would strand a pick recorded against it.
 *
 * WHAT IS *NOT* A RESTATEMENT: several genuinely distinct defects at one line.
 * #1612 has eight rows at `reports/delivery-effectiveness.json:108` — one
 * line holding an entire multi-hundred-character SQL query, with distinct bugs in
 * different CTEs of it. Folding those would hide seven real findings. #762
 * is the harder middle case: fifteen rows on `forceUpdate.ts:59` that are four or
 * five real defects, each argued three ways.
 *
 * So the fold is two-stage — is this location one defect, and if not, which rows
 * within it argue the same one. See COHESION / SPLIT below for the measurements. */

/* THE SIGNAL IS THE QUOTED CODE, NOT THE PROSE. Measured both ways over the two
 * corpora above. On prose (summary + scenario) #756's six twins score jaccard
 * 0.17–0.43 and #1612's eight distinct SQL defects score 0.03–0.23 — the ranges
 * OVERLAP, so no threshold separates them. That is the same result the knowhow
 * records for content-hashed ids: the reviewer rewrites its prose every run, so
 * prose similarity measures phrasing, not subject. The identifiers quoted in
 * backticks are the exception — they are copied from the code, so two rows about
 * one defect cite the same handful and two rows about different CTEs of one long
 * line do not. */
function symbolsOf(f) {
  const out = new Set();
  const s = `${f.summary || ''} ${f.failure_scenario || ''} ${f.evidence || ''}`;
  for (const m of s.matchAll(/`([^`]{2,80})`/g)) {
    for (const t of m[1].matchAll(/[A-Za-z_][A-Za-z0-9_.]{2,}/g)) out.add(t[0].toLowerCase());
  }
  return out;
}

/* Overlap coefficient, not jaccard: |A∩B| / min(|A|,|B|). A one-line summary and
 * a row with a 2000-character evidence block are the SAME defect described at
 * different lengths, and jaccard punishes that asymmetry — the long row's extra
 * symbols inflate the union and drag a true pair under the threshold. Overlap
 * asks the right question: did the smaller argument's symbols all appear in the
 * bigger one? */
function symOverlap(a, b) {
  if (!a.size || !b.size) return 0;
  let hit = 0;
  for (const x of a) if (b.has(x)) hit++;
  return hit / Math.min(a.size, b.size);
}

/* Two thresholds, because a shared line means two different things.
 *
 * COHESION asks "is this whole location ONE defect?" — the median pairwise
 * overlap across the cluster. #756's six twins sit at 0.30, #756's five at
 * mapping:173 at 0.52; #1612's eight distinct SQL defects at 0.08.
 * That is a clean gap, and the median (not the max) is what makes it clean: one
 * accidentally-similar pair cannot drag a genuinely diverse cluster over.
 *
 * SPLIT is the fallback for a cluster that is NOT cohesive — several defects at
 * one line, each restated several times. #762 has fifteen rows on
 * `forceUpdate.ts:59`, which is four or five real defects (the WORKOUT-only
 * gate, the isLoggedOut short-circuit, the onboarding exemption, the hardcoded
 * route literal) each argued three ways. A single pass would either hide four
 * defects or show fifteen rows; sub-clustering at the higher bar shows seven.
 *
 * Both are set from the measured gap, and both err toward SHOWING a row. */
const COHESION = 0.20;
const SPLIT = 0.45;

function median(xs) {
  if (!xs.length) return 0;
  const s = [...xs].sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/* Greedy sub-clustering, used only inside a non-cohesive location. Each row joins
 * the group it overlaps most, if that beats SPLIT; otherwise it starts its own.
 * The group's symbol set grows as rows join, so a chain of restatements stays
 * together without needing an all-pairs comparison. */
function subCluster(rows) {
  const groups = [];
  for (const f of rows) {
    const sf = symbolsOf(f);
    let best = null, score = 0;
    for (const g of groups) {
      const s = symOverlap(sf, g.syms);
      if (s > score) { score = s; best = g; }
    }
    if (best && score >= SPLIT) { best.dupes.push(f); best.syms = new Set([...best.syms, ...sf]); }
    else groups.push({ primary: f, dupes: [], syms: sf });
  }
  return groups;
}

/* Group a severity-ordered list into `{ primary, dupes[] }` per location.
 *
 * The primary is the FIRST row of its group in the incoming order, and the list
 * arrives severity-sorted — so the primary is always the most severe row in the
 * group and a `cleanup` restatement can never outrank the `correctness` finding
 * it restates. #756's f29 (cleanup) folds under f01 (correctness), never the
 * other way round.
 *
 * Verified over all 14 artifacts on disk (487 findings, 74 multi-row locations):
 * every row survives into exactly one group, no group spans two locations, and no
 * folded row outranks its primary. 487 rows render as 349 — #756's 50 as 33, with
 * the six-way MuscleBreakdownSheet cluster collapsing to one. */
function clusterByLoc(list) {
  const byLoc = new Map();
  const order = [];
  for (const f of list) {
    const k = locKey(f);
    if (!byLoc.has(k)) { byLoc.set(k, []); order.push(k); }
    byLoc.get(k).push(f);
  }
  const out = [];
  for (const k of order) {
    const rows = byLoc.get(k);
    if (rows.length === 1) { out.push({ primary: rows[0], dupes: [] }); continue; }
    const pairs = [];
    const syms = rows.map(symbolsOf);
    for (let i = 0; i < rows.length; i++) {
      for (let j = i + 1; j < rows.length; j++) pairs.push(symOverlap(syms[i], syms[j]));
    }
    if (median(pairs) >= COHESION) out.push({ primary: rows[0], dupes: rows.slice(1) });
    else out.push(...subCluster(rows));
  }
  return out;
}

/* ---------- issues and nits ----------
 *
 * THE HEADLINE WAS THE RAW TOTAL, AND THE TOTAL WAS MOSTLY NITS. #1753 read
 * "28 confirmed": 3 correctness, 12 convention, 7 test-coverage and 6 cleanup,
 * over 25 locations. A comment-wording nit counted the same as a race condition,
 * so the number said nothing about whether the PR was safe to approve.
 *
 * So every surface that sizes a review now states ISSUES — CONFIRMED findings
 * that break something, counted by folded group — with the PLAUSIBLE ones beside
 * it and everything else as nits: "3 issues · 10 plausible · 24 nits". The
 * artifact and `run.counts` are untouched; this is a reading, not a record.
 *
 * WHAT MAKES A ROW AN ISSUE. A per-finding `severity`, when the harness wrote
 * one: `blocking` and `should-fix` are issues, `nit` is a nit. That is the
 * reviewer's own call and outranks any rule here. Without it the category
 * decides: correctness, security and performance are issues; convention,
 * cleanup, test-coverage and anything unrecognised are nits. Security is in the
 * set because #1052's fourteen are auth bypasses, not style.
 *
 * PARTITION, THEN FOLD — never fold the whole list and band the groups after.
 * Folding everything lets a nit at a shared line move that line's cohesion
 * median and split or merge the issues there, so the headline would change when
 * a convention nit was added. It also lets a nit win the primary (the sort is
 * verdict-first) and carry a correctness row down into Nits with it. The posting
 * rail partitions first too: it filters, then folds. The cost is that a cleanup
 * restatement of a bug shows once more, in the collapsed Nits band, which is
 * where a cleanup framing belongs anyway. */
const ISSUE_SEVERITIES = new Set(['blocking', 'should-fix']);
const ISSUE_CATEGORIES = new Set(['correctness', 'security', 'performance']);

function isIssue(f) {
  const sev = String(f.severity || '').trim().toLowerCase();
  if (ISSUE_SEVERITIES.has(sev)) return true;
  if (sev === 'nit') return false;
  return ISSUE_CATEGORIES.has(f.category);
}

/* `{ issues, nits }`, each a list of `{ primary, dupes[] }` in page order:
 * CONFIRMED before PLAUSIBLE, source before test, within each.
 *
 * clusterByLoc emits groups in location order, so a location that sub-clusters
 * can put a PLAUSIBLE primary ahead of later CONFIRMED ones. The verdict bands
 * never saw that, since they re-split by verdict. Nits is one mixed band, so
 * the groups are re-sorted by primary, stably, so ties keep location order. */
function foldFindings(list) {
  const sorted = sortBySeverity(list);
  const fold = rows => clusterByLoc(rows).sort((a, b) => severityCmp(a.primary, b.primary));
  return { issues: fold(sorted.filter(isIssue)), nits: fold(sorted.filter(f => !isIssue(f))) };
}

/* The headline, primaries only — a restatement is the same defect, so it never
 * counts twice. An issue with no verdict recorded counts in none of the three;
 * the Unranked band states its own count. */
function tallyOf(folded) {
  const by = v => folded.issues.filter(g => g.primary.verdict === v).length;
  return { issues: by('CONFIRMED'), plausible: by('PLAUSIBLE'), nits: folded.nits.length };
}

/* The board asks for the same PR's tally three times a render (chip, drawer,
 * Review button), and the doc only changes on reload — so fold it once. */
const TALLIES = new WeakMap();
function tallyFor(doc) {
  let t = TALLIES.get(doc);
  if (!t) TALLIES.set(doc, t = tallyOf(foldFindings(doc.findings || [])));
  return t;
}

/* "3 issues · 10 plausible · 24 nits". Issues always print, since "0 issues" is
 * the answer the headline exists to give; the other two only when non-zero. */
function tallyText(t) {
  return [plural(t.issues, 'issue'),
    t.plausible ? `${t.plausible} plausible` : '',
    t.nits ? plural(t.nits, 'nit') : ''].filter(Boolean).join(' · ');
}


/* ---------- workspaces: THE first layer ----------
 *
 * A workspace is not a filter over one list — it is a different GitHub identity,
 * a different owner, and a different relationship to the code. Everything below
 * (my PRs, PRs to review, whether a rail even exists) is scoped by it, so the
 * switcher sits above the lanes rather than inside one of them.
 *
 * ONE PER CONFIG GROUP. The tabs are the `groups` of
 * artifacts/review-cockpit/config.json (knowhow/pulls-config.md), the same file
 * every rail reads through scripts/pulls/pulls_config.py, so the app can never
 * offer a tab, a Prep or a Resolve the rails don't know about. loadConfig()
 * fills these before the first render; with no config there are no tabs and the
 * board says Pulls isn't set up.
 *
 * ONE REGISTRY, BOTH SOURCES. my-prs.json and findings/*.json disagree about how
 * to spell a repo — findings may carry the bare `storefront` or the qualified
 * `acme-corp/storefront` for the same repo, while my-prs is always
 * owner-qualified. Classifying each source with its own rule is how a PR ends up
 * in one namespace as a reviewer and another as an author. So both are
 * normalised to the same `${repo} ${url}` haystack and matched against the
 * owner and the group's listed repo names.
 *
 * `rail` is per-lane truth, not per-workspace: a group with prep off still has
 * real PRs of mine, so its review lane carries the caveat, not the whole tab.
 *
 * NO BROWSER IDENTITY ON THIS ROW. Open PR goes through the Open PR trigger,
 * which reads `browser` from the same config (see openExternally() below).
 * `ghConfigDir` stays: that's the `gh` CLI identity, a different mechanism with a
 * different failure mode. */
let CONFIG = null;          // the parsed config.json, or null
let CONFIG_ERROR = null;    // why there is no usable config, for the setup banner
let WORKSPACES = [];
let ME = new Set();         // every login that is me, lowercased
let TEAM = new Set();       // teammates' logins, lowercased
/* Event types an unpaused trigger answers. A button whose rail isn't installed
 * (or is paused) is hidden rather than emitting into the void. null = unknown
 * (the list failed), which shows the buttons as before. */
let LISTENED = null;
const OTHER_WS = { id: 'other', label: 'Other', org: '—', who: '—', gate: null,
  rail: false, ghConfigDir: null };

function escapeRe(t) { return String(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function buildWorkspace(g, cfg) {
  const owner = String(g.owner || '');
  const repos = (g.repos || []).map(r => (typeof r === 'string' ? { name: r } : r))
    .filter(r => r && r.name).map(r => ({ ...r, name: String(r.name).split('/').pop() }));
  const ownerRe = new RegExp(`(^|[\\s/])${escapeRe(owner)}/`, 'i');
  const nameRes = repos.map(r => new RegExp(`(^|\\s)${escapeRe(r.name)}(\\s|#|$)`, 'i'));
  const prep = g.prep !== false;
  const proxy = cfg.github?.proxy || null;
  return {
    id: String(g.id || owner).toLowerCase().replace(/[^a-z0-9-]+/g, '-'),
    label: g.label || owner,
    org: owner,
    who: g.login || cfg.me[0],
    gate: prep ? 'named reviewer, mention, or I already reviewed' : null,
    rail: prep && repos.length > 0,
    ghConfigDir: g.gh_config_dir || cfg.github?.gh_config_dir || '~/.config/gh',
    inAppMerge: g.in_app_merge && proxy ? { proxy } : null,
    shippedLane: !!g.shipped_lane,
    appTagged: !!g.app_tagged,
    repos: repos.map(r => ({ ...r, full: `${owner}/${r.name}` })),
    match: t => ownerRe.test(t) || nameRes.some(re => re.test(t)),
  };
}

/* Read config.json and derive every per-repo table from it. Never throws: a
 * missing or broken file leaves the board empty with a banner naming the fix. */
async function loadConfig() {
  try {
    const raw = JSON.parse(await lucidos.data.read(CONFIG_PATH));
    const me = [].concat(raw.me || []).filter(Boolean);
    if (!me.length) throw new Error('it names no GitHub login in `me`');
    if (!(raw.groups || []).length) throw new Error('it watches no repos yet');
    CONFIG = { ...raw, me };
    CONFIG_ERROR = null;
  } catch (e) {
    CONFIG = null;
    CONFIG_ERROR = e?.httpCode === 404 || /not found|404/i.test(String(e?.message || e))
      ? 'missing' : String(e?.message || e);
  }
  WORKSPACES = CONFIG ? CONFIG.groups.map(g => buildWorkspace(g, CONFIG)) : [];
  ME = new Set((CONFIG?.me || []).map(m => String(m).toLowerCase()));
  TEAM = new Set((CONFIG?.team?.reviewers || []).map(m => String(m).toLowerCase()));
  const listed = WORKSPACES.flatMap(w => w.repos);
  /* Mirrors the rails: Prep only where the group preps, Resolve on every listed
   * repo, with its own conflict style. */
  PREPPABLE = new Set(WORKSPACES.filter(w => w.rail).flatMap(w => w.repos.map(r => r.full)));
  RESOLVABLE = new Map(listed.map(r => [r.full, r.conflict_style === 'merge' ? 'merge' : 'rebase']));
  const def = CONFIG?.default_tab;
  DEFAULT_WS = def && (def === 'all' || WORKSPACES.some(w => w.id === def))
    ? def : (WORKSPACES[0]?.id || 'all');
  /* Re-read on every sweep, so a config change shows up without a reload; keep
   * the tab on screen unless it no longer exists. */
  if (view.ws !== 'all' && !WORKSPACES.some(w => w.id === view.ws)) view.ws = DEFAULT_WS;
}

async function loadListeners() {
  try {
    const rows = await lucidos.triggers.list();
    LISTENED = new Set(rows.filter(t => !t.paused)
      .flatMap(t => (t.on || t.subscriptions || []).map(o => o.event_type)).filter(Boolean));
  } catch (e) {
    LISTENED = null;
  }
}

function listens(eventType) { return LISTENED === null || LISTENED.has(eventType); }

function isMe(login) { return !!login && ME.has(String(login).toLowerCase()); }

/* The single classifier. Takes either shape — a findings `pr` block or a my-prs
 * row — because both carry `repo` and `url`. */
function workspaceOf(pr) {
  const hay = `${pr.repo || ''} ${pr.url || ''}`;
  const ws = WORKSPACES.find(w => w.match(hay));
  return ws ? ws.id : 'other';
}

function wsMeta(id) { return WORKSPACES.find(w => w.id === id) || OTHER_WS; }

/* ---------- opening a PR: hand it to the default handler ----------
 *
 * The cockpit has no opinion about browsers. It emits `PrOpenRequested{url}` and
 * the **Open PR** trigger opens it natively, in the browser (and profile) the
 * config's `browser` names, or with a bare `open "<url>"` when it names none,
 * which is macOS for "give this to whatever owns https". A link router that owns
 * https then picks the browser and profile by its own rules.
 *
 * WHY IT IS STILL AN EVENT ROUND TRIP AND NOT `window.open`. An iframe cannot
 * reach LaunchServices, and the SDK's `openExternal` hands the URL to the
 * Lucidos webview's own opener, which lands in whatever browser is showing
 * Lucidos — precisely the behaviour being replaced. Only a native `open(1)` on
 * the host consults the default handler, so the emit stays. Hence the toast:
 * emit → SSE → scheduler → exec takes about a second, and a click that does
 * nothing *yet* reads as a click that did nothing.
 *
 * THE ANCHORS STAY REAL ANCHORS. Every card is still an <a href> to the PR, so
 * ⌘-click, middle-click, right-click → copy link, and drag-to-bookmark all keep
 * working. Only a plain left-click is intercepted. If the rail ever breaks, the
 * link still navigates the ordinary way — in the Lucidos browser rather than
 * through the native opener, but never dead. */
async function openExternally(url, label) {
  lucidos.ui.toast(label ? `Opening ${label}…` : 'Opening…', 'info',
    { key: 'openpr', durationMs: 2500 });
  try {
    await lucidos.events.emit('PrOpenRequested', {
      summary: `Open ${url} in the default browser handler`,
      url,
    });
  } catch (err) {
    /* The emit failed, so nothing native will run — fall back to a normal open
     * rather than leaving the click dead. Wrong browser beats no tab. */
    lucidos.ui.toast('Failed to reach the opener — opening here instead', 'warning',
      { key: 'openpr' });
    window.open(url, '_blank', 'noopener');
  }
}

/* Is this device the Mac that Lucidos itself runs on, or something looking at
 * it over the network?
 *
 * Two mechanisms only make sense on the host, and BOTH are actively wrong from
 * a phone:
 *
 *   1. The Open PR opener above shells out `open`
 *      ON THE HOST. Fired from the phone it opens a tab on a laptop in another
 *      room, so the tap reads as dead.
 *   2. The SDK's own link interceptor round-trips through the engine and ends
 *      in `window.open` from an SSE callback — long after the tap's user
 *      gesture has expired. Mobile Safari blocks that as a popup. THAT is why
 *      "Open on GitHub" does nothing on the phone: not a broken URL, a
 *      navigation that arrives too late to count as user-initiated.
 *
 * The same expiry is why the fix can't be "call window.open ourselves, but
 * sooner". iOS only hands a URL to an installed app as a universal link when
 * the navigation IS the tap — an <a href> the browser follows itself. Anything
 * JS performs afterwards lands in Safari at best. So on a remote device the
 * right move is to do LESS: block the SDK and let the anchor be an anchor.
 *
 * `localhost` is the sharp test, not a pointer/touch media query: only the host
 * machine can reach it (Tauri's webview serves from `tauri.localhost`), and a
 * remote device is always on a LAN IP or a tunnel hostname. Browsing from the
 * Mac via its own LAN IP reads as remote — links then open natively in the
 * current profile, which is correct for the public repos and wrong only for
 * work, i.e. it degrades to the pre-profile behaviour rather than to nothing. */
const ON_HOST = /(^|\.)localhost$|^127\.0\.0\.1$|^\[?::1\]?$/.test(location.hostname);

/* Where an external link points its navigation.
 *
 * On the host, `_blank` — a new tab beside Lucidos, which is what a desktop
 * user wants and what the profile opener effectively does anyway.
 *
 * Everywhere else, `_top`. `_blank` from inside an iframe is silently dropped
 * in an iOS home-screen PWA (no tab bar to open into), and Lucidos ships a
 * manifest + apple-touch-icon, so the phone is very likely running it exactly
 * that way. `_top` navigates the whole frame, which iOS is happy to hand to the
 * GitHub app as a universal link — and when the app catches it, the navigation
 * never happens, so Lucidos is untouched behind it. The lost case is a link
 * GitHub's app declines (a rare non-app URL): then the PWA really does navigate
 * away and comes back via swipe-back. Worth it — the alternative is the button
 * doing nothing at all, which is where we started. */
const LINK_TARGET = ON_HOST ? '_blank' : '_top';

/* One CAPTURE-PHASE listener on `window` for every external link in the app.
 *
 * WHY `window` AND NOT `document`. `sdk.js` installs its own capture-phase
 * handler on `document` (browser.ts) that swallows every `a[href^=http]` in an
 * app iframe. Capture descends window → document → … → target, so a listener
 * here runs BEFORE the SDK's no matter which script loaded first — and a plain
 * `stopPropagation()` keeps the event from ever reaching it. The old version
 * sat on `document` too and relied on same-node registration order, which the
 * SDK wins (it loads first): its handler ran, and a profile link took both
 * paths at once.
 *
 * Delegated rather than per-element because render() replaces the whole subtree
 * on every state change. */
function wireGitHubLinks() {
  window.addEventListener('click', ev => {
    /* Modified clicks are the user deliberately asking the browser for its own
     * behaviour (new tab, new window, download). Hijacking them is the classic
     * way an app breaks ⌘-click, so let those fall through to the SDK. */
    if (ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    const a = ev.target?.closest?.('a[href^="http"]');
    if (!a || !root.contains(a)) return;

    if (!ON_HOST) {
      /* Note the absence of preventDefault: the browser performs the
       * navigation itself, inside the tap's own gesture. That is the only
       * shape iOS will hand to the GitHub app. */
      ev.stopPropagation();
      return;
    }

    /* On the host EVERY external link goes through the native opener, so the
     * configured browser gets it. There is no per-link opt-in any more: the old
     * `data-profile` gate meant only work links were intercepted and everything
     * else fell through to the SDK, which opens in the Lucidos browser. */
    ev.preventDefault();
    ev.stopPropagation();
    openExternally(a.getAttribute('href'), a.dataset.openLabel);
  }, true);
}

/* A human label for the toast, nothing more. The interception itself is
 * unconditional now (see wireGitHubLinks), so this is presentation only and an
 * <a> without it still opens through the native opener. */
function openAttrs(pr) {
  const w = wsMeta(workspaceOf(pr));
  return ` data-open-label="${esc(w.label)} PR"`;
}

/* Everything the active scope contains, from both sources at once. `all` keeps the
 * lanes populated across workspaces; a concrete id narrows both sources with the
 * same predicate, which is what makes the two namespaces agree by construction. */
function scope(wsId) {
  const rows = MINE?.prs || [];
  const inWs = p => wsId === 'all' || workspaceOf(p) === wsId;
  const mine = rows.filter(inWs);
  return {
    onMe: mine.filter(p => p.on_me),
    /* Open, not blocked, and NOT ONE PERSON HAS BEEN ASKED. Its own lane because
     * it is neither of the two things the lanes around it claim: nothing is
     * blocking it (so not `onMe`) and nobody is holding it (so "waiting on
     * others" is false). Assigning a reviewer is the action, and it's mine. */
    stalled: mine.filter(p => !p.on_me && !p.draft && p.state !== 'draft'
                              && !(p.waiting_on?.length)),
    /* Genuinely parked on a named reviewer, plus drafts. Drafts used to be
     * excluded from BOTH lanes, so a draft PR of mine rendered nowhere at all —
     * invisible in an app whose whole claim is "every PR that's on you". */
    waiting: mine.filter(p => !p.on_me
                              && ((p.waiting_on?.length) || p.draft || p.state === 'draft')),
    /* Membership comes from the live queue, NOT from which artifacts happen to
     * exist on disk. See reviewQueue() for why that inversion matters. */
    toReview: reviewQueue(wsId),
    /* Team-only requests: real open work, assigned to nobody. Kept out of
     * `toReview` so the lane's claim ("someone named me") stays true, and out of
     * every count for the same reason. */
    pool: reviewQueue(wsId, false),
    /* PRs I answered on this head WITHOUT signing off. NOT a queue — nothing
     * here wants an action from me — but it must not vanish either. Until now
     * `reviewed_current` simply filtered the row out, so a PR disappeared from
     * the board the moment I commented on it, with no trace of what I'd
     * said. The two facts that leaves you unable to check are exactly the ones
     * you want an hour later: did the comment land, and has the author replied
     * since. It returns to `toReview` by itself when they push.
     *
     * Approvals are subtracted here rather than filtered inside reviewQueue()
     * so the two lanes are partitions of one set by construction — a row can
     * never land in both, or in neither. */
    answered: reviewQueue(wsId, true, true).filter(r => !isApproval(r)),
    /* Signed off on this head. See isApproval() for why this is not "waiting on
     * them": I'm not waiting, I'm done. */
    approved: reviewQueue(wsId, true, true).filter(isApproval),
    /* Not a queue — merges that already happened. Scoped by workspace like
     * everything else, but deliberately absent from wsLoad(): a brief wants
     * reading, not a decision, so it must never inflate a tab badge. */
    briefs: briefsFor(wsId),
  };
}

/* Tab badge = things that want a decision from me right now, which is now
 * exactly `turn === 'mine'`. One field, one definition: the badge and the
 * `Your turn` band can no longer disagree about what counts, which they could
 * when the badge summed two hand-picked lanes and the lanes used other
 * predicates. Waiting, drafts and the unassigned pool still don't count — they
 * want a decision from someone else, or from the team. */
function wsLoad(wsId) {
  const b = boardBands(wsId);
  return b.mineTurn.length + b.reviewsTurn.length;
}

/* ---------- render ---------- */

const root = document.getElementById('root');
const esc = s => lucidos.utils.escapeHtml(String(s ?? ''));

/* Where the viewport should sit after a render.
 *
 * Opening a PR from halfway down a lane used to leave you halfway down the detail
 * page — the browser keeps the scroll offset across an innerHTML swap, so you land
 * mid-findings with the PR's title off-screen above you.
 *
 * Only a PAGE change scrolls. A re-render in place (triage decision, tab switch,
 * a sweep landing over SSE) must NOT, or every click on a finding would yank you
 * back to the top of a list you're reading. `lastPage` is the whole test. */
let lastPage = null;

/* The pages, one table. It used to be a ternary over two, which is why every
 * new surface arrived as something OUTSIDE the app rather than as a page the
 * app can navigate to and back from. */
const PAGES = { today: todayHtml, detail: detailHtml, skills: skillsPageHtml, comments: commentsHtml };

function render() {
  const moved = view.page !== lastPage;
  lastPage = view.page;

  root.className = `wrap page-${view.page}`;
  if (BOOTING) {
    /* Nothing to wire: the skeleton holds no controls, by design. */
    root.innerHTML = bootHtml();
    return;
  }
  const keep = captureFocus();
  const menuKeep = captureMore();
  root.innerHTML = (PAGES[view.page] || todayHtml)();
  wire();
  restoreFocus(keep);
  restoreMore(menuKeep);
  hydrateDiagrams();
  ensureSkillDocs();
  /* Written, not re-rendered: the live region sits outside `#root` precisely
   * because this line replaces the whole subtree, and a `role="status"` element
   * that is destroyed and rebuilt is not reliably announced. */
  if (view.page === 'today') announceBoard();
  /* The app is an iframe: `window.scrollTo` moves the app's own document, and
   * `scrollIntoView` on the root asks the HOST to bring the frame's top into view
   * — needed when the iframe is taller than the viewport and the shell is doing
   * the scrolling. Both are cheap; doing only one leaves a real case broken. */
  if (moved) {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    try { root.scrollIntoView({ block: 'start' }); } catch (e) { /* older engines */ }
  }
}

/* A background render (an SSE tick, a file landing) must not throw away what
 * someone is typing. The drafts themselves live in DRAFTS and are written back
 * by the page; this carries the caret across the innerHTML swap, keyed on the
 * field's id. */
function captureFocus() {
  const a = document.activeElement;
  if (!a || !a.id || !root.contains(a) || !/^(TEXTAREA|INPUT)$/.test(a.tagName)) return null;
  return { id: a.id, start: a.selectionStart, end: a.selectionEnd, scroll: a.scrollTop };
}

function restoreFocus(k) {
  const el = k && document.getElementById(k.id);
  if (!el || el.disabled) return;
  el.focus({ preventScroll: true });
  try { el.setSelectionRange(k.start, k.end); } catch (e) { /* a field type with no selection */ }
  el.scrollTop = k.scroll;
}

/* The switcher. Rendered above everything else on every page, because the
 * workspace is the question you answer before "what's blocking me" — a conflict in
 * one repo and a conflict in another are different mornings.
 *
 * A workspace tab is shown even at zero: the set of workspaces is a fact about the
 * user, not about today's data, and a tab that vanishes when quiet makes "nothing
 * there" and "not configured" look identical. `Other` is the exception — it exists
 * only to catch a repo the registry failed to classify, so it appears only when it
 * has caught one. */
/* Tab order is workspaces first, `All` last. `All` is not a workspace — it's the
 * union across them — so it reads as the widening escape hatch at the end of the
 * row rather than the thing you start from. `Other` sits after it for the same
 * reason, one step further out: it only exists when the classifier misses. */
/* The ids that get a tab, in render order. Shared with restoreWs so a remembered
 * pick can never name a tab the row doesn't draw — two copies of this predicate
 * would drift the moment `other` changes shape. */
/* `Other` no longer gets a tab (removed 2026-09-28 by request). A repo the
 * registry fails to classify still shows up under `All`; it just has no tab of
 * its own. restoreWs drops a remembered `other` pick to DEFAULT_WS. */
function wsTabIds() {
  return [...WORKSPACES.map(w => w.id), 'all'];
}

/* The count is the actionable half of the tab: it says how many things in that
 * workspace want a decision from you, so switching is a judgement rather than a
 * guess. It rides inline after the label — the label names the place, the
 * number is why you'd go there.
 *
 * ZERO IS DRAWN, and that is the whole point of the count. Hiding it at zero
 * made three states collapse into one appearance: "nothing needs you here",
 * "this tab has no count feature", and "the count is broken". On a quiet board
 * — which is most mornings, and was literally every tab when this was written —
 * the strip showed four bare labels and told you nothing. A drawn `0` is a
 * checked-and-clear answer; a missing number is no answer. It's muted rather
 * than accent so a cleared workspace recedes and a loaded one is the only
 * colour in the strip.
 *
 * The count is `turn === 'mine'` (via wsLoad) — not row volume. A tab reading 0
 * beside a board full of `Waiting on others` rows is correct: those want a
 * decision from someone else.
 *
 * Drawn as GitHub's underline nav: the tabs sit on a hairline, the picked one
 * underlined in the accent, each count a Counter pill. `aria-pressed` says which
 * one is picked, since the underline alone is a picture. */
function wsTabsHtml() {
  return `<nav class="ws-nav" aria-label="Workspaces">${wsTabIds().map(id => {
    const label = id === 'all' ? 'All' : wsMeta(id).label;
    const n = id === 'all' ? WORKSPACES.reduce((a, w) => a + wsLoad(w.id), 0) : wsLoad(id);
    /* A tab whose source failed shows `—`, not the number of rows that happened
     * to arrive. A short count here is the most dangerous number on the page:
     * it is the one that makes a broken morning look like a quiet one. */
    const trusted = wsCountTrusted(id);
    /* Tooltip text is built ABOVE the markup on purpose. Inline, this is a
     * ternary nesting four template literals deep inside an HTML attribute, and
     * the first draft of it silently swallowed the rest of the expression when
     * one closing backtick went missing. */
    const where = id === 'all' ? '' : ` in ${label}`;
    const tip = !trusted
      ? 'A source for this workspace failed on the last sweep, so this count would be short.'
      : n
        ? `${n} pull ${n === 1 ? 'request wants' : 'requests want'} a decision from you${where}`
        : `Nothing needs you${id === 'all' ? ' anywhere' : where} right now`;
    const count = !trusted
      ? `<span class="seg-n ctr unknown" data-tooltip="${esc(tip)}">—</span>`
      : `<span class="seg-n ctr${n ? ' hot' : ''}" data-tooltip="${esc(tip)}">${n}</span>`;
    const on = view.ws === id;
    return `<button type="button" class="ws-tab${on ? ' active' : ''}" data-ws="${id}"
      aria-pressed="${on}"
      aria-label="${esc(label)}, ${trusted ? `${n} needing you` : 'count unavailable'}">
      <span class="ws-tab-in"><span class="seg-label">${esc(label)}</span>${count}</span>
    </button>`;
  }).join('')}</nav>`;
}

/* Whether a tab's number can be believed. A lapsed identity does not make rows
 * wrong, it makes them MISSING — so the honest render of the count is not a
 * smaller number, it is no number. */
function wsCountTrusted(id) {
  const failed = MINE?.identities_failed || [];
  const rails = QUEUE?.rails_failed || [];
  if (!MINE || !QUEUE) return false;
  if (!failed.length && !rails.length) return true;
  if (id === 'all' || id === 'other') return false;
  const w = wsMeta(id);
  if (failed.some(f => f === w.who || f === w.id || f === w.org)) return false;
  return !rails.some(r => r === w.id || r === w.org || String(r).includes(w.id));
}

/* Which identity am I, in this scope? Two GitHub accounts on one machine is the
 * thing most likely to make a PR look missing, so the answer is on screen rather
 * than inferable from the org in a URL. */
function wsIdentityHtml() {
  if (view.ws === 'all') {
    return `<p class="ws-ident">Spanning ${WORKSPACES.length} workspaces across
      2 GitHub identities<span class="ws-gate"> — every row names its own <code>owner/repo</code></span>.</p>`;
  }
  const w = wsMeta(view.ws);
  /* The rail-wiring offer used to live in the empty review lane, which no
   * longer exists. It belongs here anyway: this line is already where the app
   * states that a workspace has no review gate.
   *
   * `.ws-gate` marks the explanatory half, which a phone drops so the line
   * stays one line; the `Wire up a rail` offer is an action and always shows. */
  const dot = '<span class="sub-dot" aria-hidden="true">·</span>';
  return `<p class="ws-ident"><code>${esc(w.org)}</code> as <code>${esc(w.who)}</code>${
    w.rail ? `<span class="ws-gate">${dot}review gate: ${esc(w.gate)}</span>`
    : `${dot}no review rail${w.id === 'other' ? '' : `${dot}<button type="button"
        class="linkish" id="wirews">Wire up a rail</button>`}`}</p>`;
}

/* ---------- crumbs: the way back ----------
 *
 * The findings page had no way home: an iframe does not reliably get the
 * browser's back gesture, and there was no in-page control at all, so every
 * trip into a PR was one-way.
 *
 * One crumb bar, at the top of every page except the lanes — the lanes ARE the
 * root, and a bar reading only "Pulls" would be chrome pointing at itself.
 *
 * The crumbs are real <button>s carrying `data-go`, wired by `wireCrumbs`. */
function crumbsHtml(trail, right = '') {
  const items = trail.map((c, i) => {
    if (i === trail.length - 1) {
      return `<span class="crumb crumb-here" aria-current="page">${esc(c.label)}</span>`;
    }
    const attrs = [`data-go="${esc(c.go)}"`];
    if (c.key) attrs.push(`data-key="${esc(c.key)}"`);
    return `<button type="button" class="crumb" ${attrs.join(' ')}>${esc(c.label)}</button>`;
  }).join('<span class="crumb-sep" aria-hidden="true">›</span>');
  return `<nav class="crumbs" id="crumbs" aria-label="Breadcrumb">${items}${
    right ? `<span class="crumb-right">${right}</span>` : ''}</nav>`;
}

/* Scoped to an element rather than assuming `root`. Idempotent per element:
 * each call runs on freshly written HTML, never on nodes that already carry a
 * listener. */
function wireCrumbs(scope) {
  scope.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const go = el.dataset.go;
    if (go === 'today') view = { ...view, page: 'today' };
    else if (go === 'detail' && el.dataset.key) view = { ...view, page: 'detail', key: el.dataset.key };
    else return;
    render();
  }));
}

/* ---------- Today ----------
 *
 * The morning asks three questions, and they are NOT the same question:

 *   1. what's blocking MY work        -> my-prs.json      (conflicts, comments, CI)
 *   2. what's waiting on ME to review -> findings/*.json  (the prep rail)
 *   3. do I understand it yet         -> the pr-* skill panels on a PR's detail page

 * The app used to answer only #2, because its only input was a glob of findings

function oi(name) {
  return `<svg class="oi" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="${OI[name]}"/></svg>`;
}

/* The separator on every meta line. The line is a flex row, so the markup's
 * own whitespace never adds to its spacing. */
const SUB_DOT = '<span class="sub-dot" aria-hidden="true">·</span>';

/* The chevron in front of every disclosure. Drawn by CSS from the control's
 * `aria-expanded`, so the span stays empty (see `.chev`). */
const CHEV = '<span class="chev" aria-hidden="true"></span>';

/* Stroked 24-unit glyphs for the buttons, `aria-hidden` for the same reason as
 * the workspace glyphs: the button carries its own text label right beside the
 * icon. Findings is a checklist — a document with discrete ticked lines, which
 * is literally what triaging the report is. */
function glyph(d) {
  return `<svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true" focusable="false">${d}</svg>`;
}

const ICON_FINDINGS = glyph(
  '<path d="M5 4h14v16H5z"/><path d="M8.4 9l1.4 1.4L12.6 7.6"/>'
  + '<path d="M8.4 15l1.4 1.4 2.8-2.8"/><path d="M15 9.6h1.6M15 15.6h1.6"/>');

/* A speech bubble with a tail — the one shape that reads as "conversation" at
 * 14px without needing a label to disambiguate it. It gets a label anyway. */
const ICON_ASK = glyph(
  '<path d="M20 15.2a2 2 0 0 1-2 2H8.6L5 20.4V6.8a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2z"/>');

/* A bare tick, no box. The box is the button's own border, which changes color
 * when picked — drawing a second square inside it would read as two controls. */
const ICON_CHECK = glyph('<path d="M5 12.5l4.2 4.2L19 7"/>');

/* Three dots, filled — "more actions". Stroke-and-fill on a tiny radius so they
 * stay round at the 14px the other glyphs draw at. */
const ICON_MORE = glyph(
  '<circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/>'
  + '<circle cx="19" cy="12" r="1" fill="currentColor"/>');

/* ---------- the board: three bands and a reading rail ----------
 *
 * Eight lanes became three bands plus a rail, and the band is decided by
 * `turn` — who owns the next move — not by who authored the PR.
 *
 *   Your turn          open, always rendered, two sub-groups (Mine, then Reviews)
 *   Waiting on others   collapsed, count in the header
 *   Nobody's turn       collapsed, count in the header
 *   Shipped without me  collapsed, a reading rail rather than a queue
 *
 * WHY THIS AND NOT LANES. On a quiet morning the eight-lane page was mostly
 * absences: five empty regions each rendering its own illustrated empty state,
 * so a clear day looked like a page that had failed to load. A band with no rows
 * renders NO HEADER AT ALL — no chip, no count, no empty state — and `Your turn`
 * empty is one muted line. Read down, not across: the order is the
 * recommendation, and it is not user-sortable.
 *
 * Ordering inside every band and sub-group is by last activity. Blocked-ness
 * never promotes: a red-CI dependency bump does not outrank a customer-facing
 * PR waiting on a reviewer. */

const BAND_META = {
  turn:    { title: 'Your turn',          why: 'Nothing here moves without you' },
  waiting: { title: 'Waiting on others',  why: 'A named person owes the next move' },
  nobody:  { title: "Nobody's turn",      why: 'Nobody was asked — name a reviewer, or merge without one' },
  briefs:  { title: 'Shipped without me', why: 'Merged in the last 7 days — reading, not a decision' },
  shipped: { title: 'Shipped by me',      why: 'Merged in the last 7 days — done, not a decision' },
};

/* Collapse survives navigation AND reloads, so a band you closed this morning is
 * still closed when you come back. The collapsible bands start closed: the whole
 * point of the split is that `Your turn` is the page and the rest is reference.
 *
 * Stored in a data file, not localStorage: the app runs in an opaque-origin
 * iframe where localStorage throws, so the old version forgot every fold on
 * reload. The file is workspace-wide, so the phone and the laptop share folds —
 * unlike the tab pick above, which stays per-device on purpose.
 *
 * Every data write is a git commit. So a toggle is debounced, and a write that
 * would put back what is already on disk (a band folded and unfolded again) is
 * skipped. */
const UI_STATE_PATH = 'artifacts/review-cockpit/ui-state.json';
const BANDS_WRITE_DELAY_MS = 1500;
/* How long the first paint will wait for the reads (the folds above, and the tab
 * pick in primeWsStore) once the loads are done. Both start before the loads, so
 * they have nearly always landed by then; this cap only matters when the engine
 * is slow, and then the defaults paint. One shared cap, not one each, so a slow
 * start costs this once. */
const UI_READ_WAIT_MS = 300;
let COLLAPSED = new Set(['waiting', 'nobody', 'briefs', 'shipped']);

/* The whole file as last read or written, kept so a write replaces only
 * `collapsedBands` and leaves every other key alone. Stays null when the read
 * failed for a reason other than missing/corrupt, and then nothing is written:
 * a blind write could drop keys we never saw. */
let uiState = null;
/* `collapsedBands` as it stands on disk, in `bandsJson` form, for skipping
 * writes that change nothing. */
let bandsOnDisk = null;
let bandsTimer = null;
let bandsTouched = false;
/* Set by boot just before the first paint. A read that lands after it is too
 * late to use: refolding the board under the user would be worse than the
 * defaults, and the next toggle saves what is on screen. */
let bandsSettled = false;

function bandsJson(keys) { return JSON.stringify([...keys].sort()); }

async function readUiState() {
  try {
    const d = JSON.parse(await lucidos.data.read(UI_STATE_PATH));
    return d && typeof d === 'object' && !Array.isArray(d) ? d : {};
  } catch (e) {
    /* Missing (first run) or corrupt both mean "start from nothing". */
    return e instanceof SyntaxError || e?.httpCode === 404 ? {} : null;
  }
}

/* Kicked off at boot and NOT awaited there. Boot waits on it only briefly,
 * after the loads (see UI_READ_WAIT_MS). */
async function restoreBands() {
  const state = await readUiState();
  if (!state) return;
  uiState = state;
  const saved = Array.isArray(state.collapsedBands)
    ? state.collapsedBands.filter(k => typeof k === 'string') : null;
  bandsOnDisk = saved ? bandsJson(saved) : null;
  if (saved && !bandsSettled) COLLAPSED = new Set(saved);
  /* A toggle made before the read landed could not be written then. */
  if (bandsTouched && !bandsTimer) flushBands();
}

/* The fold assumed "Your turn" carries the page and the rest is reference you
 * open on purpose. That holds only while something IS on you. When nothing is,
 * every row on the board sits inside a collapsed band and the page reads as an
 * empty app — which is exactly how it read on a phone, where the only hint a
 * band opens is a 12px caret. So: the topmost band that HAS rows is never
 * collapsed. Called after the loads and before the first paint, and it only
 * ever opens a band — a fold the user chose on a board that also had work in it
 * survives, because then some earlier band was non-empty and this returns
 * before reaching theirs. */
function openLeadingBand(bands) {
  for (const key of ['waiting', 'nobody', 'briefs', 'shipped']) {
    const rows = key === 'briefs' ? bands.briefs
      : key === 'shipped' ? bands.shipped
        : bands[key];
    if (!rows || !rows.length) continue;
    COLLAPSED.delete(key);
    return;
  }
}

function rememberBands() {
  bandsTouched = true;
  clearTimeout(bandsTimer);
  bandsTimer = setTimeout(flushBands, BANDS_WRITE_DELAY_MS);
}

/* Builds the whole payload synchronously, so it also works from `pagehide`:
 * inside the Lucidos shell the SDK posts the write to the host in the same
 * tick, and the host's request outlives the reloading frame. (Opened in its
 * own browser tab, the page's own fetch can die with the navigation.) Failures
 * are silent, as they were with localStorage. The board still works, it just
 * forgets. */
function flushBands() {
  clearTimeout(bandsTimer);
  bandsTimer = null;
  if (!uiState) return;
  const json = bandsJson(COLLAPSED);
  if (json === bandsOnDisk) return;
  const prev = bandsOnDisk;
  uiState = { ...uiState, collapsedBands: JSON.parse(json) };
  bandsOnDisk = json;
  lucidos.data.write(UI_STATE_PATH, JSON.stringify(uiState, null, 2)).catch(() => {
    /* Let the next toggle try again rather than skip it as "already saved". */
    if (bandsOnDisk === json) bandsOnDisk = prev;
  });
}

/* Which rows are open. Keyed by row id rather than by index, so a sweep landing
 * mid-read cannot slide a drawer onto a different PR. */
let OPEN_ROWS = new Set();

/* Search across every band at once, which is the only reason a collapsed band
 * is acceptable: nothing is unreachable, it's one field away. While a query is
 * active every band renders expanded — a match hidden inside a collapsed band
 * would make the search look broken. */
let QUERY = '';

function matchesQuery(row) {
  if (!QUERY) return true;
  const q = QUERY.toLowerCase();
  return `${row.title} ${row.repo} #${row.number} ${(row.who || []).join(' ')}`
    .toLowerCase().includes(q);
}

function todayHtml() {
  const b = boardBands(view.ws);
  const fail = sourceFailures();
  const trusted = !fail.length;

  const mineRows = b.mineTurn.filter(matchesQuery);
  const revRows = b.reviewsTurn.filter(matchesQuery);
  const waitRows = b.waiting.filter(matchesQuery);
  const nobodyRows = b.nobody.filter(matchesQuery);
  const briefRows = b.briefs.filter(briefMatchesQuery);
  const shipRows = b.shipped.filter(shippedMatchesQuery);
  const shown = mineRows.length + revRows.length + waitRows.length
    + nobodyRows.length + briefRows.length + shipRows.length;
  const total = b.mineTurn.length + b.reviewsTurn.length + b.waiting.length
    + b.nobody.length + b.briefs.length + b.shipped.length;

  /* Filtered to nothing is NOT the cleared state and must not borrow its copy:
   * one says you are done, the other says your filter is too narrow. */
  const zeroFilter = QUERY && !shown && total;

  /* GitHub's filter bar: the workspace tabs as an underline nav, then one
   * toolbar row — search on the left, Refresh and its freshness on the right —
   * then the identity line, quiet. Refresh lives in this row, not in the
   * header, and the row sits well below the top-right corner a phone's host
   * chrome claims (see §2). */
  return `<header class="head">
      <h1>Pulls</h1>
      <p class="head-sub">${headSubHtml(b.mineTurn.length + b.reviewsTurn.length, trusted)}</p>
    </header>

    <div class="filterbar">
      ${wsTabsHtml()}
      <div class="toolbar">
        <label class="search">${oi('search')}<input type="search" id="q" class="filter-input"
          value="${esc(QUERY)}" placeholder="Search every band"
          aria-label="Search pull requests across every band"></label>
        ${QUERY ? `<button type="button" class="btn-inline" id="qclear">Clear filters</button>` : ''}
        <div class="toolbar-end">
          ${freshnessHtml()}
          <button class="action-btn action-btn-secondary btn-ic refresh" id="refresh"
            ${refreshing ? 'disabled' : ''}
            title="Re-read PR status from GitHub — conflicts, comments, CI, approvals. Does not re-run code review.">
            ${refreshing ? '<span class="spin"></span>Checking…' : `${oi('sync')}Refresh`}
          </button>
        </div>
      </div>
      ${wsIdentityHtml()}
    </div>

    ${degradedHtml(fail)}

    <div class="board"${refreshing ? ' aria-busy="true"' : ''}>
      ${zeroFilter ? `<p class="board-none">No pull requests match these filters.</p>` : ''}
      ${turnBandHtml(mineRows, revRows, trusted, zeroFilter)}
      ${bandHtml('waiting', waitRows, trusted)}
      ${bandHtml('nobody', nobodyRows, trusted)}
      ${briefBandHtml(briefRows)}
      ${/* Last on the page. The order is the recommendation, and what I already
           shipped is the least urgent thing on a board about what needs me. */
    shippedBandHtml(shipRows)}
    </div>`;
}

/* The line under the title: the Your-turn count, said plainly. Counts the same
 * rows the band does, unfiltered — a search narrows the board, not the
 * morning. And it never claims a count it could not read: with a source down,
 * zero is "not the whole picture", not "nothing needs you". */
function headSubHtml(n, trusted) {
  const where = view.ws === 'all' ? '' : ` in ${wsMeta(view.ws).label}`;
  const prs = `${n} pull request${n === 1 ? '' : 's'}`;
  if (!trusted) {
    return esc(n
      ? `At least ${prs} need${n === 1 ? 's' : ''} you${where} — a source didn't answer, so there may be more`
      : `A source didn't answer, so this isn't the whole picture${where}`);
  }
  if (!n) return esc(`Nothing needs you${where} right now`);
  return esc(`${prs} need${n === 1 ? 's' : ''} you${where}`);
}

/* ---------- Your turn ----------
 *
 * TWO SUB-GROUPS, NOT TWO BANDS. `Mine` is what I wrote, `Reviews` is what I
 * owes someone else, and the difference is real — one is finishing, the other is
 * reading. But neither is a band: no collapse control, no empty state, just a
 * thin header row inside the band's one box, omitted entirely when its side is
 * empty. A morning with only reviews is one list under one small `Reviews`
 * label, and the structure costs nothing.
 *
 * The band itself always renders, even at zero, because it is the page. At zero
 * it is one plain muted sentence — no box, no count, no celebration. */
function turnBandHtml(mine, reviews, trusted, zeroFilter) {
  const n = mine.length + reviews.length;
  const m = BAND_META.turn;
  if (zeroFilter) return '';
  return `<section class="band band-turn" aria-labelledby="band-turn-h">
    <div class="band-head">
      <h2 class="band-h" id="band-turn-h">
        <span class="chev chev-none" aria-hidden="true"></span>
        <span class="band-title">${esc(m.title)}</span>${bandCountHtml(n, trusted)}
      </h2>
      ${/* The rationale explains what the band COLLECTS, which is only worth
          * saying when it has collected something. On a clear morning it stacked
          * "Nothing here moves without you" directly above "Nothing needs you
          * right now." — two muted sentences making the same point. */
        n ? `<span class="band-why">${esc(m.why)}</span>` : ''}
    </div>
    ${n ? `<div class="band-body"><div class="rows">${
        subGroupHtml('Mine', mine)}${subGroupHtml('Reviews', reviews)}</div></div>`
    /* The cleared state is a CLAIM, and it can only be made about data we
     * actually read. With a source down, "nothing needs you" is the precise
     * sentence this redesign exists to stop the board from saying — so the
     * untrusted case says what it knows and points at the notice instead. */
    : `<p class="band-clear">${QUERY ? 'No matches in this band.'
      : trusted ? 'Nothing needs you right now.'
        : 'Nothing needs you in what could be read — a source above failed, so this is not the whole picture.'}</p>`}
  </section>`;
}

/* A header row and its rows, spliced straight into the band's box. A real
 * heading one level under the band's, so a screen reader's heading list walks
 * Your turn › Mine › Reviews the way the eye does. */
const SUBHEAD_ICON = { Mine: 'pr', Reviews: 'eye' };

/* Sub-groups that fold. Keyed `sub-<label>` in COLLAPSED (absent = open), so
 * the fold persists with the bands. A search unfolds it, as it does every band. */
const SUBGROUP_FOLDS = new Set(['Mine']);

function subGroupHtml(label, rows) {
  if (!rows.length) return '';
  const inner = `${oi(SUBHEAD_ICON[label] || 'pr')}${esc(label)}<span
    class="subhead-n ctr">${rows.length}</span>`;
  if (!SUBGROUP_FOLDS.has(label)) {
    return `<h3 class="subhead">${inner}</h3>${
      railNoticeHtml(label)}${rows.map(rowHtml).join('')}`;
  }
  const key = `sub-${label.toLowerCase()}`;
  const open = !COLLAPSED.has(key) || !!QUERY;
  return `<h3 class="subhead subhead-fold"><button type="button" class="sub-toggle"
    data-band="${key}" aria-expanded="${open}">${CHEV}${inner}</button></h3>${
